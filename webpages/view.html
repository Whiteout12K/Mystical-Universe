<!doctype html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <title>Player Profile</title>
 <link rel="stylesheet" href="/css/mlg.css">
 <link rel="stylesheet" href="/css/mlg-c-viewer.css">
</head>
<body>
 <div id="app">
  <div class="loading">Loading profile...</div>
 </div>

 <script>
 const pathParts=location.pathname.split("/").filter(Boolean);
 let username=new URLSearchParams(location.search).get("username")||
  pathParts[pathParts.length-1];

 let characterDatabase={};
 let accountStyleDatabase={};
 let currentPlayerData={};

 const premiumNames={
  diamond_core:["◈","Diamond Core"],
  sr_star_lv_frag:["✦","SR Star Lv. Fragments"],
  ssr_star_lv_frag:["✦","SSR Star Lv. Fragments"],
  ur_star_lv_frag:["✦","UR Star Lv. Fragments"]
 };

 async function loadCharacterDatabase(){
  try{
   const response=await fetch(
    "/images/mlg-assets/data-character.json",
    {cache:"no-cache"}
   );

   if(!response.ok){
    throw new Error(`Character database HTTP ${response.status}`);
   }

   characterDatabase=await response.json();
  }catch(error){
   console.error("Could not load data-character.json:",error);
   characterDatabase={};
  }
 }

 async function loadAccountStyleDatabase(){
  try{
   const response=await fetch(
    "/images/mlg-assets/account-style.json",
    {cache:"no-cache"}
   );

   if(!response.ok){
    throw new Error(`Account style database HTTP ${response.status}`);
   }

   accountStyleDatabase=await response.json();
  }catch(error){
   console.error("Could not load account-style.json:",error);
   accountStyleDatabase={};
  }
 }

 function getCharacterInfo(id){
  const key=`c${id}`;
  const characters=characterDatabase.characters;

  if(characterDatabase[key]) return characterDatabase[key];
  if(characters?.[key]) return characters[key];
  if(Array.isArray(characters)) return characters[id-1]||{};

  return {};
 }

 function normalizeAssetPath(path){
  if(path===undefined||path===null) return "";

  const value=String(path).trim();

  if(!value) return "";
  if(/^(https?:|data:|blob:)/.test(value)) return value;

  return value.startsWith("/")?value:`/${value}`;
 }

 function getAccountStyleAsset(sectionName,key){
  const section=accountStyleDatabase?.[sectionName];

  if(!section||typeof section!=="object") return "";
  if(!Object.prototype.hasOwnProperty.call(section,key)) return "";

  return normalizeAssetPath(section[key]);
 }

 function getAvatarImage(id){
  return getAccountStyleAsset("avatar",`img_${id}`);
 }

 function getAvatarFrame(id){
  return getAccountStyleAsset("avatar",`frame_${id}`);
 }

 function getBackgroundImage(id){
  return getAccountStyleAsset("background",`img_${id}`);
 }

 async function loadProfile(){
  try{
   if(!username||username==="view.html"){
    return showError("No Player","No username was provided.");
   }

   const response=await fetch(
    `/api/user/${encodeURIComponent(username)}`,
    {cache:"no-cache"}
   );

   if(!response.ok){
    return showError(
     "Player Not Found",
     "This profile does not exist."
    );
   }

   const result=await response.json();

   currentPlayerData=
    result?.data&&typeof result.data==="object"
     ?result.data
     :{};

   renderProfile(
    result?.username||username,
    currentPlayerData
   );
  }catch(error){
   console.error("Profile loading error:",error);
   showError(
    "Connection Error",
    "Could not load this profile."
   );
  }
 }

 function renderProfile(username,data){
  const owned=Array.isArray(data.c_owned)
   ?data.c_owned.filter(Boolean).length
   :0;

  const achievements=Object.values(data.achievements||{})
   .filter(Boolean).length;

  const avatarId=num(data.avatar,1);
  const avatarFrameId=num(data.avatar_frame,1);
  const backgroundId=num(data.bg,1);

  const avatarImage=getAvatarImage(avatarId);
  const avatarFrame=getAvatarFrame(avatarFrameId);
  const backgroundImage=getBackgroundImage(backgroundId);

  const profileClass=backgroundImage
   ?"profile profile-custom-background"
   :"profile";

  const profileStyle=backgroundImage
   ?` style="background-image:url('${escapeAttribute(backgroundImage)}');"`
   :"";

  document.getElementById("app").innerHTML=`
   <main class="page">
    <section class="${profileClass}"${profileStyle}>
     <div class="profile-content">
      <div class="avatar-wrap">
       <div class="avatar">
        ${
         avatarImage
          ?`
           <img
            class="profile-avatar-image"
            src="${escapeAttribute(avatarImage)}"
            alt="${escapeAttribute(username)}"
            onerror="handleAvatarError(this)"
           >
          `
          :`
           <span class="avatar-fallback-letter">
            ${escapeHtml(username.charAt(0).toUpperCase())}
           </span>
          `
        }

        ${
         avatarFrame
          ?`
           <img
            class="profile-avatar-frame"
            src="${escapeAttribute(avatarFrame)}"
            alt=""
            aria-hidden="true"
            onerror="this.style.display='none'"
           >
          `
          :""
        }
       </div>
      </div>

      <div class="profile-heading">
       <h1 class="username">${escapeHtml(username)}</h1>

       <p class="subtitle">Mystical Legends Player Profile</p>

       <div class="rank">
        <span class="rank-symbol">◆</span>
        Adventure Rank ${num(data.ar_level,1)}
       </div>
      </div>
     </div>
    </section>

    <section class="stats">
     ${stat("◆","Silver Coins",num(data.silver_coin))}
     ${stat("✦","Adventure Rank",num(data.ar_level,1))}
     ${stat("ϟ","Energy",num(data.energy))}
     ${stat("♢","Characters",owned)}
     ${stat("✦","Achievements",achievements)}
     ${stat("▰","Season Pass Lv.",num(data.season_pass_level,1))}
    </section>

    ${createAdventure(data)}
    ${createSeasonPass(data)}
    ${createPremium(data)}
    ${createCharacters(data)}
    ${createAchievements(data)}
    ${createSkillTree(data)}
    ${createCharacterSystems(data)}
    ${createFlags(data)}
   </main>
  `;
 }

 function handleAvatarError(image){
  const avatar=image.parentElement;
  image.remove();

  if(avatar&&!avatar.querySelector(".avatar-fallback-letter")){
   const fallback=document.createElement("span");
   fallback.className="avatar-fallback-letter";
   fallback.textContent=username.charAt(0).toUpperCase();
   avatar.prepend(fallback);
  }
 }

 function stat(symbol,label,value){
  return `
   <div class="stat">
    <div class="stat-symbol">${symbol}</div>
    <div class="stat-label">${label}</div>
    <div class="stat-value">${escapeHtml(value)}</div>
   </div>
  `;
 }

 function createAdventure(data){
  const level=num(data.ar_level,1);
  const xp=num(data.ar_xp);

  return `
   <section class="section">
    <h2 class="section-title">
     <span class="section-symbol">◆</span>
     Adventure Progress
    </h2>

    ${progress("Adventure Rank XP",xp,xpForRank(level))}

    ${detailGrid({
     "Adventure Rank":level,
     "Current Energy":num(data.energy),
     "Silver Coins":num(data.silver_coin)
    })}
   </section>
  `;
 }

 function createSeasonPass(data){
  const level=num(data.season_pass_level,1);
  const xp=num(data.season_pass_xp);

  return `
   <section class="section">
    <h2 class="section-title">
     <span class="section-symbol">▰</span>
     Season Pass
    </h2>

    <div class="details">
     ${detail("Status",data.season_pass_owned?"Owned":"Not Owned")}
     ${detail("Level",level)}
     ${detail("XP",xp)}
    </div>

    ${progress("Season Pass XP",xp,xpForRank(level))}
   </section>
  `;
 }

 function createPremium(data){
  const premium=data.premium||{};

  return `
   <section class="section">
    <h2 class="section-title">
     <span class="section-symbol">◈</span>
     Premium Treasury
    </h2>

    <div class="grid">
     ${Object.entries(premiumNames).map(([key,[symbol,name]])=>`
      <div class="item">
       <div class="item-symbol">${symbol}</div>
       <div class="item-name">${name}</div>
       <div class="item-sub">${num(premium[key])} owned</div>
      </div>
     `).join("")}
    </div>
   </section>
  `;
 }

 function createCharacters(data){
  const owned=Array.isArray(data.c_owned)?data.c_owned:[];
  const characters=owned
   .map((value,index)=>value?createCharacterTab(index+1,data):"")
   .filter(Boolean);

  if(!characters.length){
   return `
    <section class="section character-collection">
     <h2 class="section-title">
      <span class="section-symbol">♢</span>
      Character Collection
     </h2>

     <div class="empty">No characters have been obtained yet.</div>
    </section>
   `;
  }

  return `
   <section class="section character-collection">
    <h2 class="section-title">
     <span class="section-symbol">♢</span>
     Character Collection
     <span class="badge">${characters.length} OWNED</span>
    </h2>

    <div id="character-list" class="character-list">
     ${characters.join("")}
    </div>
   </section>
  `;
 }

 function createCharacterTab(id,data){
  const info=getCharacterInfo(id);
  const player=data[`c${id}`]||{};

  const name=info.name||player.name||`Character ${id}`;
  const rarity=info.rarity||player.rarity||"";
  const profileImage=info.profile_image||"";
  const rarityImage=info.rarity_img||"";

  return `
   <button
    type="button"
    class="character-tab"
    data-character-id="${id}"
    onclick="toggleCharacter(${id})"
   >
    <div class="character-icon-wrap">
     ${
      profileImage
       ?`
        <img
         class="character-icon"
         src="${escapeAttribute(profileImage)}"
         alt="${escapeAttribute(name)}"
         onerror="this.style.display='none'"
        >
       `
       :`
        <span class="item-symbol">♢</span>
       `
     }
    </div>

    <div class="character-tab-info">
     <div class="character-id">C${id}</div>
     <div class="character-name">${escapeHtml(name)}</div>

     ${
      rarity
       ?`
        <div class="character-rarity ${getRarityClass(rarity)}">
         ${
          rarityImage
           ?`
            <img
             src="${escapeAttribute(rarityImage)}"
             alt="${escapeAttribute(rarity)}"
            >
           `
           :""
         }
         ${escapeHtml(rarity)}
        </div>
       `
       :""
     }
    </div>
   </button>
  `;
 }

 function toggleCharacter(id){
  const list=document.getElementById("character-list");
  if(!list) return;

  const existing=list.querySelector(".character-details");
  const clicked=list.querySelector(`[data-character-id="${id}"]`);

  if(existing?.dataset.characterId===String(id)){
   existing.remove();
   clicked?.classList.remove("active");
   return;
  }

  existing?.remove();

  list.querySelectorAll(".character-tab.active")
   .forEach(tab=>tab.classList.remove("active"));

  if(!clicked) return;

  const tabs=Array.from(list.querySelectorAll(".character-tab"));
  const clickedIndex=tabs.indexOf(clicked);
  let rowEnd=clicked;

  for(let i=clickedIndex+1;i<tabs.length;i++){
   if(tabs[i].offsetTop!==clicked.offsetTop) break;
   rowEnd=tabs[i];
  }

  rowEnd.insertAdjacentHTML(
   "afterend",
   createCharacterDetails(id,currentPlayerData)
  );

  clicked.classList.add("active");
 }

 function createCharacterDetails(id,data){
  const info=getCharacterInfo(id);
  const player=data[`c${id}`]||{};

  const name=info.name||player.name||`Character ${id}`;
  const rarity=info.rarity||player.rarity||"";
  const rarityImage=info.rarity_img||"";
  const splash=info.splash_image||"";
  const level=getCharacterLevel(player);
  const stats=calculateCharacterStats(info,level);
  const equipment=getCharacterEquipment(player);

  const species=getValues(info.species,player.species);
  const roles=getValues(info.role,player.role);
  const affinities=getValues(info.affinity,player.affinity);

  return `
   <div class="character-details" data-character-id="${id}">
    <div class="character-details-top">
     <div class="character-splash-wrap">
      ${
       splash
        ?`
         <img
          class="character-splash"
          src="${escapeAttribute(splash)}"
          alt="${escapeAttribute(name)}"
          onerror="this.style.display='none'"
         >
        `
        :`
         <span class="item-symbol">◈</span>
        `
      }
     </div>

     <div class="character-info">
      <div class="character-detail-heading">
       <h3 class="character-detail-name">${escapeHtml(name)}</h3>

       ${
        rarity
         ?`
          <div class="character-detail-rarity ${getRarityClass(rarity)}">
           ${
            rarityImage
             ?`
              <img
               src="${escapeAttribute(rarityImage)}"
               alt="${escapeAttribute(rarity)}"
              >
             `
             :""
           }
           ${escapeHtml(rarity)}
          </div>
         `
         :""
       }
      </div>

      <div class="character-detail-level">
       Level <strong>${level}</strong>
      </div>

      ${createCharacterMeta(species,roles,affinities)}
      ${createCharacterStats(stats)}
     </div>
    </div>

    ${createEquipment(equipment)}
   </div>
  `;
 }

 function createCharacterMeta(species,roles,affinities){
  return `
   <div class="character-meta-section">
    ${
     species.length
      ?`
       <div class="character-meta-block character-species-block">
        <div class="character-meta-label">Species</div>
        <div class="character-meta-values">
         ${species.map(createSpeciesTag).join("")}
        </div>
       </div>
      `
      :""
    }

    ${
     roles.length
      ?`
       <div class="character-meta-block">
        <div class="character-meta-label">Role</div>
        <div class="character-meta-values character-role-values">
         ${roles.map(value=>`
          <span class="character-meta-value">
           [${escapeHtml(value)}]
          </span>
         `).join("")}
        </div>
       </div>
      `
      :""
    }

    ${
     affinities.length
      ?`
       <div class="character-meta-block">
        <div class="character-meta-label">Affinity</div>
        <div class="character-meta-values character-affinity-values">
         ${affinities.map(createAffinityTag).join("")}
        </div>
       </div>
      `
      :""
    }
   </div>
  `;
 }

 function createSpeciesTag(value){
  return `
   <span class="species ${getSpeciesClass(value)}">
    ${escapeHtml(value)}
   </span>
  `;
 }

 function createAffinityTag(value){
  return `
   <span class="character-affinity ${getElementClass(value)}">
    [${escapeHtml(value)}]
   </span>
  `;
 }

 function getValues(primary,secondary){
  const source=Array.isArray(primary)
   ?primary
   :primary!==undefined&&primary!==null&&primary!==""
    ?[primary]
    :Array.isArray(secondary)
     ?secondary
     :secondary!==undefined&&secondary!==null&&secondary!==""
      ?[secondary]
      :[];

  return source
   .flat(Infinity)
   .filter(value=>value!==undefined&&value!==null&&String(value).trim())
   .map(String)
   .filter((value,index,array)=>array.indexOf(value)===index);
 }

 function getRarityClass(value){
  const rarity=String(value).toLowerCase().replace(/[^a-z]/g,"");

  return ["c","un","r","sr","ssr","ur","lr"].includes(rarity)
   ?rarity
   :"";
 }

 function getElementClass(value){
  const element=String(value)
   .toLowerCase()
   .replace(/[\s_-]+/g,"");

  const map={
   light:"light",
   dark:"dark",
   fire:"fire",
   water:"water",
   wind:"wind",
   earth:"earth",
   lightning:"lightning",
   plant:"plant"
  };

  return map[element]||"";
 }

 function getSpeciesClass(value){
  const species=String(value)
   .toLowerCase()
   .replace(/[\s_-]+/g,"");

  const map={
   none:"species-none",
   angelor:"species-angelor",
   metalor:"species-metalor",
   naiad:"species-naiad",
   waterspirit:"species-waterspirit",
   icelorian:"species-icelorian",
   gostlynger:"species-gostlynger",
   herbovir:"species-herbovir",
   magnivirigentis:"species-magnivirigentis",
   elf:"species-elf",
   larvan:"species-larvan",
   felior:"species-felior",
   vulpivor:"species-vulpivor"
  };

  return map[species]||"species-none";
 }

 function getCharacterLevel(player){
  for(const value of [
   player.level,
   player.lv,
   player.character_level,
   player.char_level
  ]){
   const level=Number(value);

   if(Number.isFinite(level)&&level>0){
    return Math.floor(level);
   }
  }

  return 1;
 }

 function calculateCharacterStats(info,level){
  const baseStats=info.base_stats||{};
  const formula=info.stat_change_by_level||{};
  const mainStats=Array.isArray(formula.main_stat)
   ?formula.main_stat
   :[];

  const uniqueStat=typeof formula.unique_stat==="string"
   ?formula.unique_stat
   :null;

  const mainWeight=Number(formula.main_stat_weight)||0;
  const uniqueWeight=Number(formula.unique_stat_weight)||0;

  return Object.entries(baseStats)
   .reduce((result,[key,baseValue])=>{
    const base=Number(baseValue);

    if(!Number.isFinite(base)) return result;

    let current=base;

    if(level>1){
     const weight=mainStats.includes(key)
      ?mainWeight
      :uniqueStat===key
       ?uniqueWeight
       :0;

     current=base+base*weight*(level-1);
    }

    result.push({key,base,current});
    return result;
   },[]);
 }

 function createCharacterStats(stats){
  if(!stats.length){
   return `
    <div class="empty">No base stats defined.</div>
   `;
  }

  return `
   <div class="character-stats">
    ${stats.map(stat=>`
     <div class="character-stat">
      <span class="character-stat-name">
       ${escapeHtml(pretty(stat.key))}
      </span>

      <span class="character-stat-values">
       <span class="character-stat-current">
        ${formatStat(stat.current)}
       </span>

       <span class="character-stat-base">
        (${formatStat(stat.base)})
       </span>
      </span>
     </div>
    `).join("")}
   </div>
  `;
 }

 function getCharacterEquipment(player){
  const source=
   player.equip||
   player.equipment||
   player.equipped||
   {};

  return {
   weapon:source.weapon||source.equipped_weapon||null,
   accessory:source.accessory||source.equipped_accessory||null,
   artifacts:getArtifacts(source)
  };
 }

 function getArtifacts(source){
  return Array.isArray(source.artifacts)
   ?source.artifacts.slice(0,4)
   :[
    source.artifact1||null,
    source.artifact2||null,
    source.artifact3||null,
    source.artifact4||null
   ];
 }

 function createEquipment(equipment){
  const primarySlots=[
   ["Weapon",equipment.weapon],
   ["Accessory",equipment.accessory]
  ];

  const artifactSlots=equipment.artifacts.map(
   (value,index)=>[`Artifact ${index+1}`,value]
  );

  return `
   <div class="equipped-section">
    <div class="subsection-title">Equipped</div>

    <div class="equipped-primary-row">
     ${primarySlots.map(([label,value])=>
      createEquipmentItem(label,value)
     ).join("")}
    </div>

    <div class="equipped-artifact-row">
     ${artifactSlots.map(([label,value])=>
      createEquipmentItem(label,value)
     ).join("")}
    </div>
   </div>
  `;
 }

 function createEquipmentItem(label,value){
  const equipped=getItemName(value);
  const empty=equipped==="None Equipped";

  return `
   <div class="equipped-item">
    <span class="equipped-slot">${escapeHtml(label)}</span>
    <span class="equipped-name ${empty?"equipped-none":""}">
     ${escapeHtml(equipped)}
    </span>
   </div>
  `;
 }

 function getItemName(value){
  if(value===undefined||value===null||value===""||value===false||value===0){
   return "None Equipped";
  }

  if(typeof value==="object"){
   return String(
    value.name||
    value.item_name||
    value.id||
    "Equipped Item"
   );
  }

  return String(value);
 }

 function createAchievements(data){
  const entries=Object.entries(data.achievements||{});
  if(!entries.length) return "";

  const unlocked=entries.filter(([,value])=>value).length;

  return `
   <section class="section">
    <h2 class="section-title">
     <span class="section-symbol">✦</span>
     Achievements
     <span class="badge">${unlocked}/${entries.length}</span>
    </h2>

    <div class="grid">
     ${entries.map(([key,value])=>`
      <div class="achievement ${value?"":"locked"}">
       <div class="achievement-symbol">
        ${value?"✦":"◇"}
       </div>

       <div>
        <div class="item-name">${escapeHtml(pretty(key))}</div>
        <div class="item-sub">${value?"Unlocked":"Locked"}</div>
       </div>
      </div>
     `).join("")}
    </div>
   </section>
  `;
 }

 function createSkillTree(data){
  const tree=Array.isArray(data.mc_skill_tree_unlock)
   ?data.mc_skill_tree_unlock
   :[];

  if(!tree.length) return "";

  return `
   <section class="section">
    <h2 class="section-title">
     <span class="section-symbol">◇</span>
     Main Character Skill Tree
    </h2>

    <div class="details">
     ${detail("Nodes / Entries",countNested(tree))}
     ${detail("Unlocked Levels",countNumbers(tree))}
    </div>

    <div class="grid" style="margin-top:10px">
     ${tree.map((group,i)=>`
      <div class="item">
       <div class="item-symbol">◇</div>
       <div class="item-name">Ability Branch ${i+1}</div>
       <div class="item-sub">
        ${countNumbers(group)} unlocked levels
       </div>
      </div>
     `).join("")}
    </div>
   </section>
  `;
 }

 function createCharacterSystems(data){
  const arrays={
   equipped:data.c_equipped_skills,
   skill1:data.c_skill1_owned,
   skill2:data.c_skill2_owned,
   skill3:data.c_skill3_owned,
   skill4:data.c_skill4_owned,
   costumes:data.c_costume_owned
  };

  Object.keys(arrays).forEach(key=>{
   arrays[key]=Array.isArray(arrays[key])?arrays[key]:[];
  });

  const equippedCostumes=Array.isArray(data.c_costume_equipped)
   ?data.c_costume_equipped
   :[];

  const counts={
   equipped:countNested(arrays.equipped),
   skill1:countNumbers(arrays.skill1),
   skill2:countNumbers(arrays.skill2),
   skill3:countNumbers(arrays.skill3),
   skill4:countNumbers(arrays.skill4),
   costumes:countNumbers(arrays.costumes)
  };

  if(!Object.values(counts).some(Boolean)) return "";

  return `
   <section class="section">
    <h2 class="section-title">
     <span class="section-symbol">✦</span>
     Character Progression
    </h2>

    <div class="details">
     ${detail("Equipped Skills",counts.equipped)}
     ${detail("Basic Skills Owned",counts.skill1)}
     ${detail("Special Skills Owned",counts.skill2)}
     ${detail("Ultimate Skills Owned",counts.skill3)}
     ${detail("Technical Skills Owned",counts.skill4)}
     ${detail("Costumes Owned",counts.costumes)}
     ${detail(
      "Equipped Costumes",
      equippedCostumes.filter(value=>value!=null).length
     )}
    </div>
   </section>
  `;
 }

 function createFlags(data){
  const entries=Object.entries(data.flags||{});
  if(!entries.length) return "";

  return `
   <section class="section">
    <h2 class="section-title">
     <span class="section-symbol">◇</span>
     Milestones & Flags
    </h2>

    <div class="details">
     ${entries.map(([key,value])=>
      detail(pretty(key),formatValue(value))
     ).join("")}
    </div>
   </section>
  `;
 }

 function progress(label,value,max){
  value=Number(value)||0;
  max=Math.max(Number(max)||1,1);

  const pct=Math.min(100,Math.max(0,value/max*100));

  return `
   <div class="progress-container">
    <div class="progress-header">
     <span class="progress-label">${escapeHtml(label)}</span>
     <span class="progress-value">${num(value)} / ${num(max)}</span>
    </div>

    <div class="progress">
     <div class="progress-bar" style="width:${pct}%"></div>
    </div>
   </div>
  `;
 }

 function detail(key,value){
  return `
   <div class="detail">
    <span class="detail-key">${escapeHtml(key)}</span>
    <span class="detail-value">${escapeHtml(value)}</span>
   </div>
  `;
 }

 function detailGrid(obj){
  return `
   <div class="details">
    ${Object.entries(obj).map(([key,value])=>
     detail(key,value)
    ).join("")}
   </div>
  `;
 }

 function xpForRank(level){
  return Math.max(100,level*100);
 }

 function countNumbers(value){
  if(Array.isArray(value)){
   return value.reduce(
    (total,item)=>total+countNumbers(item),
    0
   );
  }

  return typeof value==="number"&&value>0?value:0;
 }

 function countNested(value){
  if(!Array.isArray(value)) return 0;

  return value.reduce(
   (total,item)=>
    total+(Array.isArray(item)?countNested(item):1),
   0
  );
 }

 function pretty(value){
  return String(value)
   .replaceAll("_"," ")
   .replace(/\b\w/g,char=>char.toUpperCase());
 }

 function formatValue(value){
  if(value===null) return "None";
  if(typeof value==="object") return JSON.stringify(value);
  return String(value);
 }

 function formatStat(value){
  const number=Number(value);

  if(!Number.isFinite(number)) return String(value);
  if(Number.isInteger(number)) return number.toLocaleString();

  return number.toLocaleString(undefined,{
   maximumFractionDigits:2
  });
 }

 function num(value,fallback=0){
  const number=Number(value);
  return Number.isFinite(number)?number:fallback;
 }

 function escapeHtml(value){
  return String(value)
   .replaceAll("&","&amp;")
   .replaceAll("<","&lt;")
   .replaceAll(">","&gt;")
   .replaceAll('"',"&quot;")
   .replaceAll("'","&#039;");
 }

 const escapeAttribute=escapeHtml;

 function showError(title,message){
  document.getElementById("app").innerHTML=`
   <div class="page">
    <div class="error">
     <h1>${escapeHtml(title)}</h1>
     <p>${escapeHtml(message)}</p>
    </div>
   </div>
  `;
 }

 async function initialize(){
  await Promise.all([
   loadCharacterDatabase(),
   loadAccountStyleDatabase()
  ]);

  await loadProfile();
 }

 initialize();
 </script>
</body>
