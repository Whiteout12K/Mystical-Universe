<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="/images/website/favicon.png" type="image/png">
<link href="/css/bootstrap-min.css" rel="stylesheet">
<link rel="stylesheet" href="/css/home.css">
<link rel="stylesheet" href="/css/news.css">
<link rel="stylesheet" href="/css/mlg.css">
<link rel="stylesheet" href="/css/mlg-c-viewer.css">
<script src="/js/bootstrap-bundle-min.js"></script>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;min-height:100%;margin:0;overflow:hidden;background:#151416;color:#f5ead2;font-family:Arial,sans-serif}
body{overscroll-behavior:none}
button{font-family:Arial,sans-serif}
#app{width:100%;height:100dvh;min-height:100dvh;padding:12px;overflow:hidden}
.character-menu{width:min(1400px,100%);height:100%;margin:auto;display:grid;grid-template-columns:minmax(330px,1fr) minmax(480px,1.1fr);gap:14px;min-height:0}
.panel,.character-content{background:linear-gradient(145deg,#211c1d,#171516);border:1px solid rgba(214,170,69,.2);box-shadow:0 12px 35px rgba(0,0,0,.3);border-radius:10px;overflow:hidden}
.character-panel{min-width:0;min-height:0;height:100%;display:flex;flex-direction:column}
.panel-header{position:relative;flex:0 0 54px;height:54px;padding:0 14px;display:grid;grid-template-columns:42px 1fr 90px;align-items:center;border-bottom:1px solid rgba(255,255,255,.08)}
.panel-title{margin:0;text-align:center;font-size:17px;font-weight:900;letter-spacing:.04em;text-transform:uppercase}
.character-count{color:#d6aa45;font-size:10px;font-weight:900;letter-spacing:.08em;text-align:right;white-space:nowrap}
.exit-button{position:relative;z-index:10;width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:#d8cdbd;text-decoration:none;font-size:22px;font-weight:300;line-height:1;border:1px solid rgba(214,170,69,.3);border-radius:50%;background:rgba(20,18,19,.85);box-shadow:0 3px 10px rgba(0,0,0,.4);transition:.15s}
.exit-button:hover{color:#f0ca69;border-color:#d6aa45;transform:scale(1.04)}
.character-toggle{display:none;appearance:none!important;-webkit-appearance:none!important;width:32px;height:32px;margin-left:auto;padding:0;border:0!important;outline:0!important;background:transparent!important;box-shadow:none!important;color:#d6aa45;cursor:pointer;position:relative}
.character-toggle:before{content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translate(-50%,-65%) rotate(45deg);transition:transform .2s}
.character-panel.open .character-toggle:before{transform:translate(-50%,-25%) rotate(225deg)}
.panel-header-right{display:flex;align-items:center;justify-content:flex-end;gap:5px}
.character-grid{flex:1 1 auto;min-height:0;padding:14px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-content:start;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:rgba(214,170,69,.45) transparent}
.character-grid::-webkit-scrollbar{width:5px}
.character-grid::-webkit-scrollbar-track{background:transparent}
.character-grid::-webkit-scrollbar-thumb{background:rgba(214,170,69,.35);border-radius:10px}
.character-card{position:relative;width:100%;aspect-ratio:11/14;min-width:0;height:auto;padding:0;border:2px solid transparent;border-radius:7px;overflow:hidden;cursor:pointer;background:#222;transition:transform .15s,border-color .15s,filter .15s;isolation:isolate}
.character-card:hover{transform:translateY(-2px);filter:brightness(1.1)}
.character-card.active{border-color:#f0ca69;box-shadow:0 0 0 1px rgba(240,202,105,.35),0 0 18px rgba(240,202,105,.2)}
.rarity-c{color:#eee}.rarity-un{color:#9bd184}.rarity-r{color:#8eb8ff}.rarity-sr{color:#d28cf2}.rarity-ssr{color:#ffc45b}.rarity-ur{color:#ff6969}.rarity-lr{color:#e78db6}
.character-card.rarity-c,.artifact-slot.rarity-c,.equipment-slot.rarity-c{background:linear-gradient(145deg,#555,#202020)}
.character-card.rarity-un,.artifact-slot.rarity-un,.equipment-slot.rarity-un{background:linear-gradient(145deg,#416c38,#172218)}
.character-card.rarity-r,.artifact-slot.rarity-r,.equipment-slot.rarity-r{background:linear-gradient(145deg,#3b6aa8,#182743)}
.character-card.rarity-sr,.artifact-slot.rarity-sr,.equipment-slot.rarity-sr{background:linear-gradient(145deg,#804aa5,#27182f)}
.character-card.rarity-ssr,.artifact-slot.rarity-ssr,.equipment-slot.rarity-ssr{background:linear-gradient(145deg,#a86b28,#342415)}
.character-card.rarity-ur,.artifact-slot.rarity-ur,.equipment-slot.rarity-ur{background:linear-gradient(145deg,#a53c3c,#351919)}
.character-card.rarity-lr,.artifact-slot.rarity-lr,.equipment-slot.rarity-lr{background:linear-gradient(145deg,#8b5b75,#30252b)}
.character-avatar{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center bottom;mix-blend-mode:screen;z-index:1}
.character-card:after{content:"";position:absolute;z-index:2;left:0;right:0;bottom:0;height:38%;background:linear-gradient(to top,rgba(0,0,0,.85),rgba(0,0,0,.2),transparent);pointer-events:none}
.character-stars{position:absolute;z-index:5;left:7%;bottom:5%;width:86%;max-height:16px;object-fit:contain;filter:drop-shadow(0 2px 3px #000);pointer-events:none}
.character-rarity-image{position:absolute;z-index:6;right:6%;bottom:16%;width:auto;height:34%;aspect-ratio:1;object-fit:contain;filter:drop-shadow(0 2px 3px #000);pointer-events:none}
.empty-characters,.loading,.error{padding:50px 20px;text-align:center;color:#9d9487}
.error h1{color:#f5ead2;font-size:20px}

/* CHARACTER DISPLAY */
.character-display{min-width:0;min-height:0;height:100%;display:flex;flex-direction:column;position:relative}
.character-tabs{flex:0 0 42px;height:42px;width:100%;display:flex;align-items:flex-end;justify-content:flex-start;gap:0;margin:0 0 7px;padding:0;overflow-x:auto;overflow-y:hidden;background:transparent;scrollbar-width:none;touch-action:pan-x}
.character-tabs::-webkit-scrollbar{display:none}
.character-tab{position:relative;appearance:none;flex:1 0 105px;width:auto;min-width:105px;height:100%;display:flex;align-items:flex-end;justify-content:center;border:0!important;outline:0;padding:0 14px 9px;margin:0;background:none!important;box-shadow:none!important;border-radius:0!important;color:#827a71;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.09em;cursor:pointer;text-align:center;white-space:nowrap}
.character-tab:hover{color:#b9ab97}
.character-tab.active{color:#f5ead2}
.character-tab.active:after{content:"";position:absolute;left:20%;right:20%;bottom:0;height:2px;background:#d6aa45;box-shadow:0 0 8px rgba(214,170,69,.35)}
.character-content{flex:1 1 auto;min-height:0;width:100%}
.character-view{display:none;width:100%;height:100%;min-height:0}
.character-view.active{display:block}

/* SHARED CHARACTER BACKDROP */
.character-scene{position:relative;width:100%;height:100%;min-height:0;overflow:hidden;background:radial-gradient(ellipse at center 42%,rgba(110,91,80,.4),rgba(54,45,45,.18) 38%,transparent 68%),linear-gradient(to bottom,#292223,#1a1718 75%,#171516)}
.character-scene:before{content:"";position:absolute;z-index:0;inset:0;background:linear-gradient(to bottom,rgba(23,21,22,.25),transparent 35%),radial-gradient(ellipse at center 45%,rgba(110,91,80,.3),transparent 67%);pointer-events:none}
.character-scene:after{content:"";position:absolute;z-index:6;inset:0;background:linear-gradient(to top,#171516 0%,rgba(23,21,22,.16) 17%,transparent 45%);pointer-events:none}
.scene-splash{position:absolute;z-index:2;left:50%;top:50%;width:100%;height:100%;transform:translate(-50%,-50%);object-fit:contain;object-position:center center;mix-blend-mode:screen;pointer-events:none}
.scene-overlay{position:absolute;z-index:5;inset:0;pointer-events:none}

/* OVERVIEW */
.overview{position:relative;width:100%;height:100%;min-height:0;overflow:hidden}
.overview-title{position:absolute;z-index:7;top:0;left:0;right:0;width:100%;padding:14px 18px 20px;text-align:center;background:linear-gradient(to bottom,rgba(18,16,17,.9),rgba(18,16,17,.58) 55%,transparent);pointer-events:none}

.character-meta{display:flex;flex-direction:row;align-items:center;justify-content:center;gap:12px;font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;text-shadow:0 1px 3px #000}
.character-rarity-label{font-weight:900;background:none!important;padding:0!important;border:0!important;box-shadow:none!important}
.character-level{color:#f0ca69;font-size:14px;font-weight:900;letter-spacing:.06em}
.character-basic-info{position:absolute;z-index:8;left:0;right:0;bottom:0;display:flex;justify-content:center;align-items:center;gap:18px;padding:7px 15px 9px;flex-wrap:wrap;background:linear-gradient(to top,#171516 50%,rgba(23,21,22,.8),transparent)}
.character-info-label{color:#756d65;font-size:8px;font-weight:900;text-transform:uppercase;letter-spacing:.08em}
.character-info-value{color:#f5ead2;font-size:11px;font-weight:900}
.character-species,.character-role{display:flex;align-items:center;justify-content:center;gap:7px}
.character-species .character-info-value{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}

/* SKILLS */
.skills-view,.star-view,.artifacts-view,.equipment-view{position:relative;width:100%;height:100%;min-height:0;overflow:hidden}
.skills-stage,.equipment-stage,.artifacts-stage{position:absolute;inset:0}
.skills-character,.star-character,.artifact-character,.equipment-character{position:absolute;z-index:3;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.skills-character img,.star-character img,.artifact-character img,.equipment-character img{width:100%;height:100%;object-fit:contain;object-position:center center;mix-blend-mode:screen;filter:drop-shadow(0 5px 12px rgba(0,0,0,.55))}
.skills-character:before{content:"";position:absolute;z-index:-1;left:50%;top:50%;width:310px;height:310px;max-width:60%;max-height:60%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(214,170,69,.08),transparent 70%);border:1px solid rgba(214,170,69,.1)}
.skill-node{position:absolute;z-index:8;width:74px;height:74px;border-radius:50%;padding:3px;border:1px solid rgba(240,202,105,.45);background:radial-gradient(circle,#3a3030,#181617 72%);box-shadow:0 4px 15px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;cursor:pointer}
.skill-node:hover{border-color:#f0ca69;box-shadow:0 4px 18px rgba(0,0,0,.55),0 0 12px rgba(214,170,69,.18)}
.skill-icon{width:100%;height:100%;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#282324}
.skill-icon img{width:100%;height:100%;object-fit:cover}
.skill-placeholder{color:#777;font-size:18px;font-weight:900}
.skill-label{position:absolute;top:78px;left:50%;transform:translateX(-50%);white-space:nowrap;color:#d8cdbd;font-size:8px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;text-shadow:0 2px 4px #000}
.skill-basic{left:12%;top:13%}.skill-ultimate{right:12%;top:13%}.skill-special-1{left:6%;top:47%}.skill-special-2{right:6%;top:47%}.skill-technical-1{left:24%;bottom:6%}.skill-technical-2{right:24%;bottom:6%}

/* STAR */
.star-level-image{position:absolute;z-index:8;left:50%;bottom:8%;transform:translateX(-50%);width:min(330px,70%);max-height:35px;object-fit:contain;filter:drop-shadow(0 2px 4px #000)}

/* ARTIFACTS */
.artifact-character:before,.equipment-character:before{content:"";position:absolute;left:50%;top:50%;width:75%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(214,170,69,.11),transparent 68%);border:1px solid rgba(214,170,69,.1)}
.artifact-column{position:absolute;z-index:8;top:0;bottom:0;width:124px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.artifact-column.left{left:4%}.artifact-column.right{right:4%}
.artifact-slot{position:relative;width:108px;height:108px;flex:0 0 108px;padding:5px;border:1px solid rgba(214,170,69,.42);border-radius:10px;background:linear-gradient(145deg,#3a3030,#171516);box-shadow:0 6px 18px rgba(0,0,0,.5),inset 0 0 14px rgba(214,170,69,.05);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s;overflow:hidden}
.artifact-slot:hover{transform:scale(1.06);border-color:#f0ca69;box-shadow:0 6px 20px rgba(0,0,0,.55),0 0 15px rgba(214,170,69,.15)}
.artifact-slot.empty{border-style:dashed;opacity:.55}
.artifact-slot img{width:100%;height:100%;object-fit:contain;border-radius:6px}
.artifact-number{position:absolute;right:5px;bottom:4px;min-width:21px;height:21px;padding:0 4px;display:flex;align-items:center;justify-content:center;border-radius:5px;background:rgba(15,13,14,.88);border:1px solid rgba(214,170,69,.3);color:#d6aa45;font-size:9px;font-weight:900}
.artifact-placeholder{color:#756d65;font-size:28px;font-weight:300}
.artifact-title{position:absolute;z-index:9;top:12px;left:0;right:0;text-align:center;pointer-events:none}
.artifact-title span{color:#827a71;font-size:9px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}

/* EQUIPMENT */
.equipment-slot{position:absolute;z-index:8;top:50%;transform:translateY(-50%);width:min(150px,20%);height:min(390px,78%);min-width:105px;border:1px solid rgba(214,170,69,.42);border-radius:9px;background:linear-gradient(145deg,rgba(58,48,48,.96),rgba(23,21,22,.96));box-shadow:0 8px 22px rgba(0,0,0,.5),inset 0 0 18px rgba(214,170,69,.05);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.equipment-slot.weapon{left:5%}.equipment-slot.accessory{right:5%}
.equipment-slot:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at center,rgba(214,170,69,.09),transparent 65%);pointer-events:none}
.equipment-slot.empty{opacity:.6;border-style:dashed}
.equipment-label{position:absolute;top:12px;left:0;right:0;text-align:center;color:#827a71;font-size:9px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;z-index:3;text-shadow:0 2px 4px #000}
.equipment-image{position:relative;z-index:2;width:82%;height:70%;object-fit:contain;filter:drop-shadow(0 5px 12px rgba(0,0,0,.55))}
.equipment-name{position:absolute;z-index:3;bottom:12px;left:6px;right:6px;text-align:center;color:#d8cdbd;font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;text-shadow:0 2px 4px #000}
.equipment-placeholder{color:#756d65;font-size:28px;font-weight:300}

/* AUTH */
.auth-message{height:100%;min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px}
.auth-message h1{margin:0 0 10px;color:#f5ead2;font-size:24px}
.auth-message p{margin:0;color:#9d9487;font-size:13px}

/* TABLET */
@media(max-width:950px){
.character-menu{grid-template-columns:1fr;width:min(700px,100%)}
.character-panel{height:auto;max-height:44%}
.character-display{height:auto;flex:1 1 auto;min-height:0}
.character-grid{max-height:300px}
.character-tab{flex:1 0 100px}
.artifact-column{width:124px}
.artifact-column.left{left:2%}.artifact-column.right{right:2%}
.equipment-slot.weapon{left:3%}.equipment-slot.accessory{right:3%}
.equipment-slot{width:125px;height:min(360px,76%)}
}

/* MOBILE */
@media(max-width:600px){
#app{padding:6px}
.character-menu{width:100%;height:100%;gap:7px;display:flex;flex-direction:column;position:relative}
.character-panel{position:relative;z-index:20;flex:0 0 48px;height:48px;max-height:none;overflow:visible}
.panel-header{flex:0 0 48px;height:48px;padding:0 9px;grid-template-columns:38px 1fr 60px;position:relative;z-index:22;background:linear-gradient(145deg,#211c1d,#171516);border-radius:10px}
.panel-title{font-size:15px}
.panel-header-right{gap:0}
.character-count{display:block;font-size:8px}
.character-toggle{display:block}
.character-grid{position:absolute;z-index:21;top:48px;left:0;right:0;display:grid;max-height:0;height:auto;padding:0 8px;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;overflow-y:auto;overflow-x:hidden;background:linear-gradient(145deg,#211c1d,#171516);border:1px solid rgba(214,170,69,.2);border-top:0;border-radius:0 0 10px 10px;box-shadow:0 18px 35px rgba(0,0,0,.55);opacity:0;visibility:hidden;pointer-events:none;transition:max-height .2s ease,padding .2s ease,opacity .15s ease}
.character-panel.open .character-grid{max-height:36dvh;padding:10px 8px;opacity:1;visibility:visible;pointer-events:auto}
.character-display{position:relative;z-index:1;flex:1 1 auto;width:100%;height:auto;min-height:0}
.character-tabs{flex:0 0 39px;height:39px;margin-bottom:5px;justify-content:flex-start}
.character-tab{flex:0 0 auto;font-size:9px;min-width:94px;padding:0 12px 8px;letter-spacing:.045em}
.character-tab.active:after{left:18%;right:18%}
.character-name{font-size:24px}
.overview-title{padding:13px 10px 17px}
.character-meta{gap:10px}

/* SKILLS */
.skill-node{width:62px;height:62px}
.skill-label{top:66px}
.skill-basic{left:4%;top:12%}.skill-ultimate{right:4%;top:12%}.skill-special-1{left:2%;top:45%}.skill-special-2{right:2%;top:45%}.skill-technical-1{left:21%;bottom:4%}.skill-technical-2{right:21%;bottom:4%}

/* STAR */
.star-level-image{bottom:7%;width:75%;max-height:30px}

/* ARTIFACTS — 50% larger than original mobile */
.artifact-column{width:82px;gap:12px}
.artifact-column.left{left:1%}.artifact-column.right{right:1%}
.artifact-slot{width:75px;height:75px;flex-basis:75px;padding:4px}
.artifact-number{right:3px;bottom:3px;min-width:17px;height:17px;font-size:8px}
.artifact-title{top:9px}
.artifact-title span{font-size:8px}

/* EQUIPMENT */
.equipment-slot{width:95px;height:70%;min-width:0}
.equipment-slot.weapon{left:2%}.equipment-slot.accessory{right:2%}
.equipment-label{top:10px;font-size:8px}
.equipment-name{bottom:9px;font-size:7px}
.equipment-image{width:82%;height:68%}
}

/* SMALL MOBILE */
@media(max-width:370px){
.character-grid{gap:4px;padding-left:3px;padding-right:3px}
.character-tab{font-size:8px;min-width:88px;padding-left:9px;padding-right:9px;letter-spacing:.025em}
.character-tab.active:after{left:12%;right:12%}
.character-count{display:none}
.skill-node{width:56px;height:56px}
.skill-label{top:60px;font-size:7px}

/* 50% larger than original 46px */
.artifact-column{width:74px}
.artifact-slot{width:69px;height:69px;flex-basis:69px}
.artifact-number{right:2px;bottom:2px;min-width:15px;height:15px;font-size:7px}
.equipment-slot{width:88px}
}
</style>
</head>

<body>
<div id="app"><div class="loading">Loading player...</div></div>

<script>
let PLAYER={username:"",password:"",loggedIn:false,data:{},loaded:false,loading:null};
let characterDatabase={},ownedCharacters=[],selectedCharacterId=null;
const own=(o,k)=>Object.prototype.hasOwnProperty.call(o,k);
const validObj=v=>v&&typeof v==="object"&&!Array.isArray(v);
const num=(v,f=0)=>{const n=Number(v);return Number.isFinite(n)?n:f};
const escapeHtml=v=>String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
const escapeAttribute=escapeHtml;

async function loadPlayerData(){
 if(PLAYER.loading)return PLAYER.loading;
 PLAYER.loading=(async()=>{
  const reset=()=>PLAYER={username:"",password:"",loggedIn:false,data:{},loaded:true,loading:null};
  try{
   const r=await fetch("/api/me",{cache:"no-store"});
   if(!r.ok)throw Error(`HTTP ${r.status}`);
   const result=await r.json(),user=result?.user||result;
   if(!(result?.authenticated&&user?.username)){reset();return PLAYER}
   PLAYER.username=String(user.username);
   PLAYER.password=String(user.password??result.password??"");
   PLAYER.loggedIn=true;
   const data=parsePlayerData(user.data??result.data??user.save_data??result.save_data);
   PLAYER.data=validObj(data)?data:{};
   PLAYER.loaded=true;
   PLAYER.loading=null;
   return PLAYER
  }catch(e){
   console.error("Unable to load player data:",e);
   reset();
   return PLAYER
  }
 })();
 return PLAYER.loading
}

async function loadJSON(path){
 try{
  const r=await fetch(path,{cache:"no-cache"});
  if(!r.ok)throw Error(r.status);
  return await r.json()
 }catch(e){
  console.error("JSON load error:",e);
  return{}
 }
}

async function loadCharacterDatabase(){
 characterDatabase=await loadJSON("/images/mlg-assets/data-character.json")
}

function parsePlayerData(data){
 if(data==null)return{};
 if(typeof data==="string"){
  try{
   const v=JSON.parse(data);
   return validObj(v)?v:{}
  }catch{return{}}
 }
 return validObj(data)?data:{}
}

function getCharacterInfo(id){
 const k=`c${id}`,c=characterDatabase.characters;
 return characterDatabase[k]||c?.[k]||(Array.isArray(c)?c[id-1]:{})||{}
}

function getCharacterOwnedData(id){
 return validObj(PLAYER.data[`c${id}`])?PLAYER.data[`c${id}`]:{}
}

function getOwnedCharacterIds(){
 const a=Array.isArray(PLAYER.data.c_owned)?PLAYER.data.c_owned:[];
 const binary=a.every(v=>v===0||v===1||v===true||v===false||v==="0"||v==="1");
 return a.map((v,i)=>{
  if(!v)return null;
  return binary?i+1:typeof v==="object"?num(v.id,0):num(v,0)
 }).filter(id=>id&&Object.keys(getCharacterInfo(id)).length)
}

function normalizeAssetPath(path){
 if(!path)return"";
 const v=String(path).trim();
 return/^(https?:|data:|blob:)/.test(v)?v:v.startsWith("/")?v:`/${v}`
}

function imageAttrs(loading="lazy",priority="low"){
 return`loading="${loading}" decoding="async" fetchpriority="${priority}"`
}

function getRarityClass(v){
 const n=Number(v);
 return Number.isFinite(n)
  ?({1:"c",2:"un",3:"r",4:"sr",5:"ssr",6:"ur",7:"lr"}[n]||"")
  :["c","un","r","sr","ssr","ur","lr"].includes(String(v).toLowerCase())
   ?String(v).toLowerCase():""
}

function getRarityName(v){
 const n=Number(v);
 return Number.isFinite(n)?({1:"C",2:"UN",3:"R",4:"SR",5:"SSR",6:"UR",7:"LR"}[n]||String(v)):String(v||"")
}

function getStarLevel(data,info){
 return num(data.star_level??data.star_lv??data.stars??data.star??info.star_level??info.star_lv??info.stars??1,1)
}

function getStarImage(level){
 return`/images/mlg-assets/Stars/Star__${Math.max(0,Math.min(7,Number(level)||0))}.svg`
}

/* EQUIPMENT / ARTIFACT DATA */
function getEquippedItem(data,type){
 const value=validObj(data.equip)?data.equip[type]:null;
 return Array.isArray(value)?value[0]||null:validObj(value)?value:null
}

function getArtifact(data,index){
 const value=validObj(data.equip)?data.equip[`artifact${index}`]:null;
 return Array.isArray(value)?value[0]||null:validObj(value)?value:null
}

function getItemImage(item,keys){
 if(!item)return"";
 if(typeof item==="string")return normalizeAssetPath(item);
 if(typeof item!=="object")return"";
 return normalizeAssetPath(keys.map(k=>item[k]).find(Boolean)||"")
}

const getArtifactImage=a=>getItemImage(a,["image","img","icon","icon_image","artifact_image","asset"]);
const getEquipmentImage=a=>getItemImage(a,["image","img","icon","icon_image","equipment_image","asset"]);

function getItemName(item,fallback){
 if(!item)return fallback;
 if(typeof item==="string")return item;
 return typeof item==="object"?(item.name||item.title||item.display_name||fallback):fallback
}

function createArtifactSlot(artifact,index){
 const image=getArtifactImage(artifact);
 const rarity=artifact&&typeof artifact==="object"?getRarityClass(artifact.rarity):"";
 return`<div class="artifact-slot ${rarity?`rarity-${rarity}`:""} ${image?"":"empty"}" title="Artifact ${index+1}" aria-label="Artifact ${index+1}">
  ${image?`<img src="${escapeAttribute(image)}" alt="Artifact ${index+1}" ${imageAttrs()} onerror="this.style.display='none'">`:`<span class="artifact-placeholder">+</span>`}
  <span class="artifact-number">${index+1}</span>
 </div>`
}

function createEquipmentSlot(item,label,className){
 const image=getEquipmentImage(item),name=getItemName(item,`No ${label}`);
 const rarity=item&&typeof item==="object"?getRarityClass(item.rarity):"";
 return`<div class="equipment-slot ${className} ${rarity?`rarity-${rarity}`:""} ${image?"":"empty"}" title="${escapeAttribute(name)}">
  <span class="equipment-label">${escapeHtml(label)}</span>
  ${image?`<img class="equipment-image" src="${escapeAttribute(image)}" alt="${escapeAttribute(name)}" ${imageAttrs()} onerror="this.style.display='none'">`:`<span class="equipment-placeholder">+</span>`}
  <span class="equipment-name">${escapeHtml(name)}</span>
 </div>`
}

/* MENU */
function renderCharacterMenu(){
 const app=document.getElementById("app");
 if(!PLAYER.loggedIn){
  app.innerHTML=`<main class="character-menu"><section class="panel"><div class="auth-message"><h1>Login Required</h1><p>You must be logged in to view your characters.</p></div></section></main>`;
  return
 }

 ownedCharacters=getOwnedCharacterIds();

 if(!ownedCharacters.length){
  app.innerHTML=`<main class="character-menu"><section class="panel character-panel">
   <div class="panel-header"><a class="exit-button" href="/" aria-label="Exit">×</a><h1 class="panel-title">Characters</h1><span class="character-count">0 OWNED </span> </div>
   <div class="character-grid"><div class="empty-characters">No characters have been obtained yet.</div></div>
  </section></main>`;
  return
 }

 if(!selectedCharacterId||!ownedCharacters.includes(selectedCharacterId))selectedCharacterId=ownedCharacters[0];

 app.innerHTML=`<main class="character-menu">
 <section class="panel character-panel" id="character-panel">
  <div class="panel-header">
   <a class="exit-button" href="/" aria-label="Exit">×</a>
   <h1 class="panel-title">Characters</h1>
   <div class="panel-header-right">
    <span class="character-count">${ownedCharacters.length} OWNED </span>
    <button type="button" class="character-toggle" aria-label="Open characters" aria-expanded="false" onclick="toggleCharacterGrid()"></button>
   </div>
  </div>
  <div class="character-grid">${ownedCharacters.map(createCharacterCard).join("")}</div>
 </section>

 <section class="character-display">
  <nav class="character-tabs" id="character-tabs">
   ${["overview","skills","star","equipment","artifacts"].map((t,i)=>`<button type="button" class="character-tab${i?"":" active"}" data-tab="${t}" onclick="switchTab('${t}')">${t==="star"?"Star Level":t[0].toUpperCase()+t.slice(1)}</button>`).join("")}
  </nav>
  <div class="panel character-content">
   <div class="character-view active" id="character-overview"></div>
   <div class="character-view" id="character-skills"></div>
   <div class="character-view" id="character-star"></div>
   <div class="character-view" id="character-equipment"></div>
   <div class="character-view" id="character-artifacts"></div>
  </div>
 </section>
 </main>`;

 renderSelectedCharacter()
}

function toggleCharacterGrid(){
 const panel=document.getElementById("character-panel");
 if(!panel)return;
 const open=panel.classList.toggle("open"),button=panel.querySelector(".character-toggle");
 if(button){
  button.setAttribute("aria-expanded",String(open));
  button.setAttribute("aria-label",open?"Close characters":"Open characters")
 }
}

function createCharacterCard(id){
 const info=getCharacterInfo(id),data=getCharacterOwnedData(id);
 const name=info.name||data.name||`Character ${id}`;
 const rarity=data.rarity??info.rarity??1,star=getStarLevel(data,info);
 const avatar=normalizeAssetPath(info.profile_image||info.avatar||info.image||"");
 const rarityImage=normalizeAssetPath(info.rarity_img||data.rarity_img||"");
 return`<button type="button" class="character-card rarity-${getRarityClass(rarity)} ${selectedCharacterId===id?"active":""}" data-character-id="${id}" aria-label="${escapeAttribute(name)}" onclick="selectCharacter(${id})">
  ${avatar?`<img class="character-avatar" src="${escapeAttribute(avatar)}" alt="${escapeAttribute(name)}" ${imageAttrs()} onerror="this.style.display='none'">`:""}
  <img class="character-stars" src="${getStarImage(star)}" alt="${star} stars" ${imageAttrs()} onerror="this.style.display='none'">
  ${rarityImage?`<img class="character-rarity-image" src="${escapeAttribute(rarityImage)}" alt="${getRarityName(rarity)}" ${imageAttrs()} onerror="this.style.display='none'">`:""}
 </button>`
}

function selectCharacter(id){
 if(!ownedCharacters.includes(id))return;
 selectedCharacterId=id;
 document.querySelectorAll(".character-card").forEach(card=>card.classList.toggle("active",Number(card.dataset.characterId)===id));

 if(window.innerWidth<=600){
  const panel=document.getElementById("character-panel");
  if(panel){
   panel.classList.remove("open");
   const button=panel.querySelector(".character-toggle");
   if(button){
    button.setAttribute("aria-expanded","false");
    button.setAttribute("aria-label","Open characters")
   }
  }
 }
 renderSelectedCharacter()
}

/* CHARACTER RENDERING */
function renderSelectedCharacter(){
 const id=selectedCharacterId;
 if(!id)return;
 const info=getCharacterInfo(id),data=getCharacterOwnedData(id);
 renderOverview(info,data,id);
 renderSkills(info,data);
 renderStarLevel(info,data);
 renderEquipment(info,data);
 renderArtifacts(info,data)
}

function getSplash(info){
 return normalizeAssetPath(info.splash_image||info.splash||info.profile_image||"")
}

/* OVERVIEW */
function renderOverview(info,data,id){
 const name=info.name||data.name||`Character ${id}`;
 const rarity=data.rarity??info.rarity??1,level=num(data.level??data.lv??1,1);
 const species=getValues(info.species,data.species),role=getValues(info.role,data.role),splash=getSplash(info);

 document.getElementById("character-overview").innerHTML=`<div class="overview character-scene">
  ${splash?`<img class="scene-splash" src="${escapeAttribute(splash)}" alt="${escapeAttribute(name)}" ${imageAttrs("eager","high")} onerror="this.style.display='none'">`:""}
  <div class="overview-title">
   <h2 class="character-name">${escapeHtml(name)}</h2>
   <div class="character-meta"><span class="character-rarity-label rarity-${getRarityClass(rarity)}">${getRarityName(rarity)}</span><span class="character-level">Level ${level}</span></div>
  </div>
  <div class="character-basic-info">
   <div class="character-species"><span class="character-info-label">Species</span><span class="character-info-value">${createSpeciesTags(species)}</span></div>
   <div class="character-role"><span class="character-info-label">Role</span><span class="character-info-value">${role.length?escapeHtml(role.join(", ")):"Unknown"}</span></div>
  </div>
 </div>`
}

function createSpeciesTags(values){
 return values.length?values.map(v=>{
  const key=String(v).toLowerCase().replace(/[^a-z0-9]+/g,"-");
  return`<span class="species ${key}">${escapeHtml(pretty(v))}</span>`
 }).join(" "):"Unknown"
}

/* SKILLS */
function renderSkills(info,data){
 const splash=getSplash(info),skills=getCharacterSkills(info,data);
 document.getElementById("character-skills").innerHTML=`<div class="skills-view character-scene">
  ${splash?`<div class="skills-character"><img src="${escapeAttribute(splash)}" alt="" ${imageAttrs("eager","high")} onerror="this.style.display='none'"></div>`:""}
  <div class="skills-stage">
   ${createSkillNode(skills.basic,"skill-basic","Basic")}
   ${createSkillNode(skills.ultimate,"skill-ultimate","Ultimate")}
   ${createSkillNode(skills.special1,"skill-special-1","Special 1")}
   ${createSkillNode(skills.special2,"skill-special-2","Special 2")}
   ${createSkillNode(skills.technical1,"skill-technical-1","Technical 1")}
   ${createSkillNode(skills.technical2,"skill-technical-2","Technical 2")}
  </div>
 </div>`
}

function getCharacterSkills(info,data){
 const s=info.skills||data.skills||{};
 if(Array.isArray(s))return{basic:s[0],special1:s[1],special2:s[2],ultimate:s[3],technical1:s[4],technical2:s[5]};
 return{
  basic:s.basic||s.basic_skill||info.basic_skill||data.basic_skill,
  special1:s.special1||s.special_1||s.special_skill_1||info.special_skill_1||data.special_skill_1,
  special2:s.special2||s.special_2||s.special_skill_2||info.special_skill_2||data.special_skill_2,
  ultimate:s.ultimate||s.ultimate_skill||info.ultimate_skill||data.ultimate_skill,
  technical1:s.technical1||s.technical_1||s.technical_skill_1||info.technical_skill_1||data.technical_skill_1,
  technical2:s.technical2||s.technical_2||s.technical_skill_2||info.technical_skill_2||data.technical_skill_2
 }
}

function createSkillNode(skill,className,label){
 const d=skill&&typeof skill==="object"?skill:{},name=d.name||d.title||label;
 const image=normalizeAssetPath(d.image||d.img||d.icon||d.skill_img||"");
 return`<div class="skill-node ${className}" title="${escapeAttribute(name)}">
  <div class="skill-icon">${image?`<img src="${escapeAttribute(image)}" alt="${escapeAttribute(name)}" ${imageAttrs()} onerror="this.style.display='none'">`:`<span class="skill-placeholder">${skill?label[0]:"?"}</span>`}</div>
  <span class="skill-label">${escapeHtml(label)}</span>
 </div>`
}

/* STAR */
function renderStarLevel(info,data){
 const splash=getSplash(info),level=getStarLevel(data,info);
 document.getElementById("character-star").innerHTML=`<div class="star-view character-scene">
  ${splash?`<div class="star-character"><img src="${escapeAttribute(splash)}" alt="" ${imageAttrs("eager","high")} onerror="this.style.display='none'"></div>`:""}
  <img class="star-level-image" src="${getStarImage(level)}" alt="${level} stars" ${imageAttrs()}>
 </div>`
}

/* EQUIPMENT */
function renderEquipment(info,data){
 const splash=getSplash(info),weapon=getEquippedItem(data,"weapon"),accessory=getEquippedItem(data,"accessory");
 document.getElementById("character-equipment").innerHTML=`<div class="equipment-view character-scene">
  ${splash?`<div class="equipment-character"><img src="${escapeAttribute(splash)}" alt="" ${imageAttrs("eager","high")} onerror="this.style.display='none'"></div>`:""}
  <div class="equipment-stage">${createEquipmentSlot(weapon,"Weapon","weapon")}${createEquipmentSlot(accessory,"Accessory","accessory")}</div>
 </div>`
}

/* ARTIFACTS */
function renderArtifacts(info,data){
 const splash=getSplash(info);
 const artifacts=[1,2,3,4].map(i=>getArtifact(data,i));
 document.getElementById("character-artifacts").innerHTML=`<div class="artifacts-view character-scene">
  ${splash?`<div class="artifact-character"><img src="${escapeAttribute(splash)}" alt="" ${imageAttrs("eager","high")} onerror="this.style.display='none'"></div>`:""}
  <div class="artifacts-stage">
   <div class="artifact-column left">${createArtifactSlot(artifacts[0],0)}${createArtifactSlot(artifacts[1],1)}</div>
   <div class="artifact-column right">${createArtifactSlot(artifacts[2],2)}${createArtifactSlot(artifacts[3],3)}</div>
  </div>
 </div>`
}

/* TABS */
function switchTab(tab){
 document.querySelectorAll(".character-tab").forEach(button=>{
  const active=button.dataset.tab===tab;
  button.classList.toggle("active",active);
  if(active)button.scrollIntoView({behavior:"smooth",block:"nearest",inline:"center"})
 });
 document.querySelectorAll(".character-view").forEach(view=>view.classList.remove("active"));
 document.getElementById(`character-${tab}`)?.classList.add("active")
}

/* HELPERS */
function getValues(a,b){
 const s=Array.isArray(a)?a:a!=null&&a!==""?[a]:Array.isArray(b)?b:b!=null&&b!==""?[b]:[];
 return s.flat(Infinity).filter(v=>v!=null&&String(v).trim()).map(String).filter((v,i,a)=>a.indexOf(v)===i)
}

function pretty(v){
 return String(v).replaceAll("_"," ").replace(/\b\w/g,c=>c.toUpperCase())
}

/* START */
(async()=>{
 await Promise.all([loadPlayerData(),loadCharacterDatabase()]);
 renderCharacterMenu()
})();
</script>
</body>
</html>
