<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="A chronological record of the Mystical Legends universe.">
<title>Mystical Legends | Chronicle</title>
<link rel="icon" href="/images/website/favicon.png" type="image/png">
<link rel="stylesheet" href="/css/home.css">
<link rel="stylesheet" href="/css/timeline.css?v=separate-1">
<link rel="canonical" href="https://mysticallegends.org/webpages/timeline.html">
<meta property="og:title" content="Mystical Legends | Chronicle">
<meta property="og:description" content="A chronological record of the Mystical Legends universe.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://mysticallegends.org/webpages/timeline.html">
<meta property="og:image" content="https://mysticallegends.org/images/website/main-bg.png">
<meta name="twitter:card" content="summary_large_image">
</head>
<body>
<main class="chronicle-page" id="top" aria-label="Mystical Legends timeline map">
  <button id="open-jump" class="map-side-tab" type="button" aria-controls="jump-panel" aria-expanded="false"><span aria-hidden="true">☰</span><span>Arcs</span></button>
  <a class="map-back" href="/" aria-label="Back to the main website">← <span>Main website</span></a>
  <div class="tree-toolbar" aria-label="Timeline controls">
    <label for="tree-zoom">Zoom <input id="tree-zoom" type="range" min="60" max="140" value="100" step="10"><output id="zoom-value">100%</output></label>
    <button id="reset-view" class="chronicle-toggle" type="button">Recenter</button>
    <button id="toggleAll" class="chronicle-toggle" type="button" disabled>Expand events</button>
  </div>
  <div class="tree-viewport" id="tree-viewport" tabindex="0" role="region" aria-label="Timeline map. Swipe or scroll to explore; use the Arcs tab to jump.">
    <section id="timeline" class="timeline-tree" aria-label="World timeline" aria-busy="true"><p role="status">Opening the archive…</p></section>
  </div>
  <p class="map-caption">Arcs: left → right <span>Events: top → bottom</span></p>
  <dialog id="jump-panel" aria-labelledby="jump-title">
    <header class="jump-heading"><h2 id="jump-title">Quick jump</h2><button id="close-jump" type="button" autofocus aria-label="Close quick jump">×</button></header>
    <label for="jump-search">Find an arc, event, or character</label>
    <input id="jump-search" type="search" placeholder="Search the timeline…">
    <div class="jump-filters" aria-label="Jump categories">
      <button type="button" data-kind="all" aria-pressed="false">All</button>
      <button type="button" data-kind="arc" aria-pressed="true">Major arcs</button>
      <button type="button" data-kind="event" aria-pressed="false">Events</button>
      <button type="button" data-kind="character" aria-pressed="false">Characters</button>
      <button type="button" data-kind="side" aria-pressed="false">Side stories</button>
    </div>
    <p id="jump-count" role="status"></p>
    <nav id="era-links" aria-label="Timeline destinations"></nav>
  </dialog>
</main>
<script src="/js/timeline.js?v=separate-1" defer></script>
</body>
</html>
