== Overview ==
Ellie is a red-haired subordinate in Pyrus's modern organization, specializing in interrogation and fast Lightning combat. Unlike Tom and Tony, she is introduced through the District 3 captivity plot rather than the historical founding voyage. Her readiness to challenge capable opponents makes her one of the rescue party's major obstacles.

== Personality ==
Ellie is outspoken, cruel in interrogation, and pleased by the prospect of a worthwhile fight. The narration presents her opinions as difficult for Pyrus to manage but too valuable to discard. Her excitement at facing Kaden and impatience with the invading students express a confidence grounded in real combat speed.

That confidence also makes her vulnerable to planning. River and Kaden use attacks that initially appear to miss or expose them, creating a restraint that Ellie does not immediately recognize. Her recovery and continued resistance prevent the fight from becoming a simple reversal of her superiority.

== Mystical Rank & Heritage ==
The notes' '''Tier 6, Level 3–Tier 7, Level 2''' entry concerns Interlude I, not a declared assessment in these two novels. Book 1 identifies her electrical specialty and experienced threat level without giving an exact personal rank. Her precise species is not determined by these combat scenes.

== Tools and Equipment ==
The rescue fight shows electricity around Ellie's boots and claw-like attacks. These descriptions establish how she channels magic through movement and strikes; they do not identify a separate named artifact or weapon that must be added to her equipment.

== Trivia ==
* The character’s animal motif is a lynx cat.

|tab=Synopsis

== Synopsis ==

=== The Rune of the Spellcaster ===

==== Charlotte's Interrogation ====

Ellie approaches Charlotte's cell with Pyrus and questions her about shadow and forbidden magic. She identifies the value of Charlotte's knowledge and participates in the attempt to connect the rune with the missing orb. Her role includes intelligence extraction rather than combat alone.

==== Fight with Kaden and River ====

When the rescue party triggers the base's alarm, Ellie recognizes a potential challenge in Kaden and uses lightning-enhanced movement to approach his blind side. River supports him with a large water sphere, which Kaden freezes into an offensive mass. Ellie emerges injured but keeps fighting.

The pair then constructs a more deliberate trap using the spreading behavior of Kaden's ice and River's water. Ellie trusts the advantage of electrical conduction, but the opponents' arrangement defeats that expectation. Kaden ultimately reinforces her restraint with ice before pursuing Pyrus. The resolution places her in custody with the other subordinates.

=== I.T.E.R. Chronicles — Initialization ===

Ellie is not named in the supplied second volume. Its discussion of the Pyrus crisis follows the consequences of her Book 1 involvement; it does not depict her escaping imprisonment, participating in the historical bonus chapters, or meeting the new IT project team.

=== Sources ===
Book 1: Chapters 12–14, 16.

|tab=Powers & Abilities

== Powers & Abilities ==

== Established Abilities ==

=== Lightning Mobility and Strikes ===

Ellie channels electricity through her boots, closes distance quickly, and creates claw-like Lightning attacks. Her sudden approach behind Kaden establishes the threat of her speed.

=== Conductivity and Resistance ===

She understands that water conducts electricity and initially expects River's technique to favor her. The coordinated freezing and restraining tactics show why an elemental advantage alone cannot guarantee an outcome. She also melts surrounding ice and returns to combat after being struck, though she ultimately remains restrainable.

|tab=Relationships

== Relationships ==

=== Pyrus Bourn ===

[[char/pyrus_bourn|Pyrus]] values Ellie's tactical and interrogation skills despite her outspoken manner. Their relationship is that of leader and subordinate.

=== Charlotte Levy ===

[[char/charlotte_levy|Charlotte]] is the captive Ellie interrogates for information about dangerous magical knowledge.

=== Kaden and River ===

[[char/kaden_icelander|Kaden]] and [[char/river_grantia|River]] combine their affinities against her during the rescue, exposing the limits of her confidence in electrical advantage.
