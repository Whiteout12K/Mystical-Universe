<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Mystical Legends Data Loader</title>
<style>
pre.inline {
  display: inline;
  margin: 0;
  padding: 0;
  font-family: inherit;
  font-size: inherit;
  white-space: pre-wrap;
}
</style>
</head>
<body>

<input type="file" id="fileInput" accept=".txt">

<!-- Sample usages
<pre class="char0Output inline"></pre>
      -- base
<pre class="char0Output inline"></pre>
      -- sublayer
<pre class="characterOrderOutput inline" data-subindex="0"></pre>.  
      -- subindex, list always have to have data-subindex
-->

<br>
<pre class="profileDataOutput inline"></pre> <br>
<pre class="profileDataOutput inline" data-subindex="0"></pre> <br>

<pre class="char0_NameOutput inline"></pre> <br>
<pre class="char0_RarityOutput inline"></pre> <br>
<pre class="char0_Weapon1Output inline"></pre> <br> 
<pre class="characterOrderOutput inline"></pre> <br>
<pre class="characterOrderOutput inline" data-subindex="0"></pre> <br>



<script type="module">
import { DataEngine } from "./dataSorter.js";
const engine = new DataEngine();
window.ENGINE = engine;

document.getElementById("fileInput").addEventListener("change", async e => {
  const file = e.target.files[0];
  if (!file) return;

  await engine.loadFile(file);

  console.log("All Data:", engine.getAllData());
  console.log("Fetched Registry:", engine.getAllFetched());

  // --- GET NESTED DATA ---
  function getNestedData(keyPath) {
    const parts = keyPath.split(".");
    let current = ENGINE.get(parts[0]);
    for (let i = 1; i < parts.length; i++) {
      if (current === undefined || current === null) return null;
      const part = parts[i];
      const isIndex = !isNaN(Number(part));
      if (Array.isArray(current) && isIndex) {
        current = current[Number(part)];
      } else if (typeof current === "object") {
        current = current[part];
      } else {
        return null;
      }
    }
    return current;
  }

  // --- DISPLAY DATA ---
  function displayNested(keyPath, outputClass) {
    const els = document.getElementsByClassName(outputClass);
    if (!els.length) return;

    for (let el of els) {
      // Get base data
      let data = getNestedData(keyPath);

      // Convert stringified arrays into real arrays
      if (typeof data === "string" && data.startsWith("[") && data.endsWith("]")) {
        try {
          data = JSON.parse(data);
        } catch (err) {
          console.warn("Failed to parse array string:", data);
        }
      }

      // Check for secondary sub-index
      const subIndexAttr = el.getAttribute("data-subindex");
      if (subIndexAttr !== null && Array.isArray(data)) {
        const idx = Number(subIndexAttr);
        data = idx < data.length ? data[idx] : null;
      }

      // Format data for display
      let text;
      if (data === null || data === undefined) {
        text = "N/A";
      } else if (Array.isArray(data)) {
        text = `[${data.map(d => (d && typeof d === "object") ? JSON.stringify(d, null, 2) : d).join(", ")}]`;
      } else if (typeof data === "object") {
        text = JSON.stringify(data, null, 2);
      } else {
        text = data;
      }

      el.textContent = text;
    }
  }

  // --- DISPLAY CHARACTERS ---
  const allChars = ENGINE.get("characters") || [];
  allChars.forEach((c, i) => {
    const charBase = `char_${i}`;
    displayNested(charBase, `char${i}Output`);

    Object.keys(c).forEach(prop => {
      const propPath = `${charBase}.${prop}`;
      displayNested(propPath, `char${i}_${prop}Output`);
    });
  });

  // --- DISPLAY MAIN LISTS ---
  const listsToDisplay = [
    "profileData",
    "characterOrder",
    "MCSkillTree",
    "equippedSkills",
    "skill1List",
    "skill2List",
    "skill3List",
    "skill4List",
    "costumeList",
    "inventoryEquipment",
    "inventoryArtifacts",
    "inventoryMaterials",
    "inventoryConsumables",
    "inventoryBuilds",
    "inventorySpecial"
  ];

  listsToDisplay.forEach(listName => {
    displayNested(listName, `${listName}Output`);

    const data = ENGINE.get(listName);
    if (Array.isArray(data)) {
      data.forEach((item, idx) => {
        displayNested(`${listName}.${idx}`, `${listName}_indexOutput`);
      });
    }
  });

});
</script>

</body>
</html>
