<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Local Wiki Editor</title>
  <link rel="stylesheet" href="/wiki/wiki-editor/editor.css?v=16">
  <script src="/wiki/wiki-editor/visual.js?v=16" defer></script>
  <script src="/wiki/wiki-editor/editor.js?v=visual-13" defer></script>
</head>
<body>
  <header><button id="toggle-pages" type="button" aria-controls="pages-panel" aria-expanded="false">Pages</button><div><h1>Wiki Editor</h1><p>Local files · Mystical Legends</p></div><button id="choose-folder" type="button">Open Wiki Folder</button><a class="wiki-home-button" href="/wiki/home">Wiki Home</a><span id="change-state">Choose a page</span></header>
  <aside id="pages-panel" hidden><div class="sidebar-top"><h2>Wiki pages</h2><button id="close-pages" type="button">Close</button></div><label for="page-filter">Find a page</label><input id="page-filter" type="search" placeholder="Page or folder…"><button id="refresh-pages" type="button">Refresh files</button><nav id="page-tree" aria-label="Wiki folder structure"></nav></aside>
  <dialog id="category-dialog" aria-labelledby="category-title">
    <form id="category-form">
      <h2 id="category-title">Add category</h2>
      <label for="category-name">Category name</label><input id="category-name" required autocomplete="off">
      <div class="category-dialog-actions"><button id="category-cancel" type="button">Cancel</button><button type="submit">Add category</button></div>
    </form>
  </dialog>
  <main>
    <div class="page-top"><h2 id="page-title">Choose a wiki page to begin</h2><a id="open-page" target="_blank" rel="noopener" hidden>Open saved page</a></div>
    <p id="status" role="status" aria-live="polite">Finding wiki pages…</p>
    <section id="editor-container" aria-label="Wiki text editor">
      <div id="editor-menu">
        <div class="editor-toolbar" role="tablist" aria-label="Editor view"><button id="visual-mode" type="button" role="tab" aria-selected="true">Visual editor</button><button id="source-mode" type="button" role="tab" aria-selected="false">Source code</button></div>
        <div class="history-row">
          <div class="history-actions"><button id="undo" type="button" disabled>Undo</button><button id="redo" type="button" disabled>Redo</button></div>
          <div class="save-actions"><button id="discard" type="button" disabled>Discard changes</button><button id="save" type="button" disabled>Save changes</button></div>
        </div>
        <div id="format-toolbar" aria-label="Text formatting">
          <button type="button" data-command="bold" aria-label="Bold" title="Bold"><strong>B</strong></button><button type="button" data-command="italic" aria-label="Italic" title="Italic"><em>I</em></button>
          <button type="button" data-command="formatBlock" data-value="p">Text</button><button type="button" data-command="formatBlock" data-value="h2">H2</button><button type="button" data-command="formatBlock" data-value="h3">H3</button><button type="button" data-command="formatBlock" data-value="h4">H4</button>
          <button type="button" data-command="insertUnorderedList">Bullets</button><button type="button" data-command="insertOrderedList">Numbers</button><button type="button" data-command="indent">Indent</button><button type="button" data-command="outdent">Outdent</button><button type="button" data-command="link">Link</button>
          <label class="insert-control"><span class="sr-only">Insert wiki content</span><select id="insert-content" disabled>
            <option value="">Insert wiki content…</option>
            <optgroup label="Page Elements">
              <option value="page">Page information</option>
              <option value="tabs">Navigation tabs</option>
              <option value="tab">Tab section</option>
              <option value="infobox">Infobox</option>
              <option value="characters">Character list</option>
              <option value="randomarticle">Random article</option>
              <option value="categorypages">Category pages</option>
            </optgroup>
            <hr>
            <optgroup label="Paragraph Elements">
              <option value="paragraph">Paragraph</option>
              <option value="category">Category</option>
              <option value="spoiler">Spoiler</option>
              <option value="references">References</option>
              <option value="gallery">Gallery</option>
              <option value="image">Image</option>
              <option value="credits">Credits</option>
            </optgroup>
          </select></label>
        </div>
      </div>
      <div id="visual-editor"><p>Select a page from Pages to begin editing.</p></div>
      <label id="source-label" hidden>Editable wiki source<textarea id="source-text" spellcheck="false"></textarea></label>
    </section>
  </main>
</body>
</html>
