Atlas is Tempest Aquia's centurion, a royal Water Spirit, and the founder of the mainland ATLAS academy. He represents the island's established power structure through both his public reputation and his command of water Compression. The first two books show him defending Lux Urbis while exercising a sharply unequal standard toward those he deems socially inferior.

|tab=Overview

== Overview ==
Atlas is Tempest Aquia's centurion, a royal Water Spirit, and the founder of the mainland ATLAS academy. He represents the island's established power structure through both his public reputation and his command of water Compression. The first two books show him defending Lux Urbis while exercising a sharply unequal standard toward those he deems socially inferior.

== Personality ==
Atlas values discipline, efficiency, and results. He expects subordinates to use the correct formal address and keep their work focused, and he has little tolerance for the other captains' theatrics. His controlled manner makes his authority seem decisive even when the reasoning behind it is not disclosed.

He is also openly prejudiced against demihumans, including his own younger half-sister River. His decision to recruit Avery does not erase this attitude: he treats rare power as an asset to supervise. Nevertheless, he can revise a practical judgment when evidence becomes useful. His willingness to continue the disappearance investigation shows flexibility within an instrumental approach, rather than a completed rejection of the hierarchy.

== Mystical Rank & Heritage ==
Atlas's Water Spirit heritage and royal standing place him within the Aquia family. His Compression makes water behave as exceptionally dense material and permits gravitational manipulation. The books establish his authority as a cohort captain and show other centurions deferring to him; they do not give a precise personal tier in the scenes cited here. His later District 5 succession is a separate development already preserved from the notes.

== Tools and Equipment ==
Atlas commands a white falcon familiar, shown during the founding celebration and after Pyrus's defeat. His estate functions as Tempest Aquia's meeting place. He also founded ATLAS on the mainland to educate Mystical Beings while allowing them to operate discreetly in the human economy; Oceanus helps administer it.

== Synopsis ==

=== The Rune of the Spellcaster ===

==== Public Leader and Family Conflict ====

At Regnum's founding celebration, Atlas addresses the crowd and displays his familiar. Later he pursues a rogue faculty member suspected of leaking confidential information. Avery and River encounter the pursuit at the mall, where Atlas's confrontation exposes his hostility toward River's parentage and the family history behind it. He repels Avery when the boy intervenes, showing the power imbalance between them.

==== Defeat of Pyrus Bourn ====

Atlas arrives with Charlotte after Pyrus defeats Avery and Kaden. Compressed water restrains the inferno-wielding villain while Charlotte's purple flames strip away his magical fire. Their coordination ends the immediate threat, allowing Pyrus's arrest and the orb's secure removal. Atlas later participates in the hospital discussion that identifies Avery's Compression and explains the artifact's importance.

=== I.T.E.R. Chronicles — Initialization ===

==== Recruiting Avery ====

Atlas allows the freshmen's cohort battle to continue, then supports making an exception for the capable group. Avery's rare power attracts his interest, and he selects him for Tempest Aquia. At the estate he explicitly frames the appointment as a use of potential and a means of monitoring it. He permits Alteria's challenge but stops the duel once Avery proves enough and the estate risks damage.

In private, Atlas explains that useful assets matter to his plans even when he disapproves of their origins. His interest in Avery therefore remains bound to wider district security and political ambitions rather than uncomplicated mentorship.

==== Investigating the Disappearances ====

Atlas and Alteria bring Avery on a council-requested investigation outside the inner city. After Avery rescues abducted children, Atlas initially insists on evidence before accusing a noble, explaining the political weight of rank and council connections. He helps return the children and prepares to close the mission. Avery's continued insistence prompts another search, which produces documents concerning the trafficking operation. Atlas recognizes their value and takes responsibility for the remaining case.

=== Sources ===
Book 1: Chapters 7, 9–11, 15–16. Book 2: Chapters 2–3, 6, 14.

|tab=Powers & Abilities

== Powers & Abilities ==

== Established Abilities ==

=== Compressed Water ===

Atlas shapes water into needles, hard barriers, cells, and restraining cuffs. Compression supports both precision attacks and defenses capable of containing Pyrus's destructive flames. His magical restraints can also obstruct the villain's discharge through hands and feet.

=== Compression and Sage Platforms ===

The Elevator of Heaven uses a prepared magical circle and Compression to carry people through the air. Atlas explains that the force changes gravitational behavior rather than simply increasing the density of a visible substance. His instruction gives Avery a clearer understanding of the same fundamental Regnum Spei.

=== Limits of Authority ===

Atlas's strength does not remove the need for evidence, political access, and cooperation. The books connect his effectiveness to a position inside the district's institutions as much as to his exceptional magic.

|tab=Relationships

== Relationships ==

=== Aquia Family ===

[[char/alteria_aquia|Alteria]] is Atlas's sister and vice captain; [[char/river_grantia|River]] is his younger half-sister. Their mother Atalantia's remarriage explains River's place in the family. Oceanus is his uncle and an administrator of ATLAS. Atlas's rejection of River is a central conflict, not proof that the relationship is absent.

=== Avery Obtainia ===

[[char/avery_obtainia|Avery]] first opposes Atlas's treatment of River, then becomes a monitored subordinate. Their relationship develops through disagreement and useful results rather than immediate mutual approval.

=== Charlotte Levy ===

[[char/charlotte_levy|Charlotte]] fights alongside Atlas to subdue Pyrus. Their complementary magic and coordinated restraint accomplish what the students could not finish alone.
