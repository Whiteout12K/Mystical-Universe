|tab=Overview

== Overview ==
Amos is an IT engineer and security-oriented employee who knew Kaden before his newest management role. He is introduced with a muscular build, dark skin, and short frizzled hair. Book 2 establishes him as Engineering Executive Lead and later adds leadership of the IT Agency Task Force to his responsibilities.

== Personality ==
Amos speaks slowly, often seems tired, and is unusually informal with Kaden. His teasing can frustrate the prodigy, but their argument about being serious at work and relaxed as friends makes the distinction between their roles explicit.

He is more comfortable with hardware and practical tasks than with explaining software. His understated manner can obscure responsibility: he reports the robot's progress, manages material difficulties, and helps check Lucy after the unsafe trial. The narrative treats him as an important practical contributor even when his delivery is comic or distracted.

== Mystical Rank & Heritage ==
The existing lore identifies Amos as a Magnivirigentis associated with strength enhancement. The two novels do not supply a personal tier declaration or a detailed magical duel for him. His physical build and assigned work support a strength-oriented role without proving every later ability in the catalogue.

== Tools and Equipment ==
Amos works with IT hardware, engineering infrastructure, and the developing robot. He helps maintain the project's physical components and reports the need for rare exterior and shielding materials. These are team resources, not personal enchanted weapons.

== Trivia ==
* His inspirations include Xibalonque and Carrion.
* His animal motif is a grizzly bear; his fruit motif is blackberries.

== Synopsis ==

=== The Rune of the Spellcaster ===

Kaden mentions Amos as being away on a mission with Lucy. This establishes an existing role within his circle, but the first book does not depict Amos completing that mission or fighting on the page.

=== I.T.E.R. Chronicles — Initialization ===

==== Engineering and Avery's Onboarding ====

Amos appears at the Christmas gathering with Lucy and later becomes Avery's trainer after Lucy fails to complete parts of the onboarding. He explains that he specializes in hardware and tasks and directs Avery toward the employee manual. His limitations as a software tutor do not imply absence of technical expertise.

Kaden visits him at the new robot facility, where Amos reports completed mechanical parts and joints alongside a shortage of specialized plating. Their argument shifts between employment and friendship, revealing the degree of familiarity beneath the hierarchy.

==== Task Force Appointment ====

After becoming Acting CEO, Kaden appoints Amos to lead the Task Force while retaining his EEL position. Amos takes the recognition seriously. During I.T.E.R.'s combat demonstration he questions being left out, but Kaden selects Lucy and Avery for the initial trials. Amos assists with Lucy's condition after the robot overwhelms her. James later stands in for his Task Force role during recruitment while Amos attends to the robot's vocal training.

=== Sources ===
Book 1: Chapter 5. Book 2: Chapters 6, 11–13, 15–16.

|tab=Powers & Abilities

== Powers & Abilities ==

== Established Abilities ==

=== Engineering Management ===

Amos coordinates physical development and supply requirements for I.T.E.R., reporting what is complete and what still prevents progress. His work connects the inventor's ambition to actual materials and assembly.

=== Physical and Security Work ===

The book describes him as capable of managing the physical well-being of employees and assets. His remarks about punching I.T.E.R. express confidence, but the trial does not show the hypothetical fight taking place, so it should not be counted as a demonstrated victory or feat.

|tab=Relationships

== Relationships ==

=== Kaden Icelander ===

[[char/kaden_icelander|Kaden]] is both a longtime friend and Amos's superior. Their work disagreements do not end the friendship; Kaden expressly distinguishes arguing with the employee from inviting the friend to his home.

=== Lucy Terner ===

[[char/lucy_terner|Lucy]] shares administrative and agency work with Amos, and their banter includes competing over who must guide the new intern.

=== Avery Obtainia ===

Amos introduces [[char/avery_obtainia|Avery]] to IT's working systems and becomes one of the familiar faces on the robot project.
