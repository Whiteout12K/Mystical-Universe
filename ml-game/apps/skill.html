<!doctype html>
<html lang="en">
<head>
  <link rel="icon" type="image/vnd.microsoft.icon" href="/favicon.ico">
  <link rel="icon" type="image/svg+xml" sizes="any" href="/images/website/icons/torch.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="120x120" href="/apple-touch-icon-120x120.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/images/website/icons/torch-apple-152.png">
  <link rel="apple-touch-icon" sizes="167x167" href="/images/website/icons/torch-apple-167.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/website/icons/torch-apple-180.png">




<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skill Info</title>
<link rel="stylesheet" href="/ml-game/css/mlg-skill.css">
<link rel="stylesheet" href="/css/mlg.css">

<style>
.dupe-level{padding-top:10px}
.dupe-level.dimmed{opacity:.6;filter:grayscale(30%) brightness(70%)}
.dupe-star{display:block;height:27px}
.dupe-star img{height:17px;padding-top:10px}
.dupe-text,.dupe-line{display:block}
</style>
</head>

<body>

<div id="skill-content"></div>
<div id="effects"></div>

<div id="level-display" class="level-display">
&lt; Skill Level: <span id="level">1</span> &gt;
</div>

<script>
document.addEventListener("DOMContentLoaded",async()=>{
  const CHAR_PATH="/images/mlg-assets/Characters/";
  const EFFECT_PATH="/images/mlg-assets/data-effects.json";
  const params=new URLSearchParams(location.search);

  const character=(params.get("char")||params.get("character")||"c1").toLowerCase();
  const skillParam=params.get("skill")||"B1";
  const skill=skillParam.toLowerCase()==="dupes"?"Dupes":skillParam.toUpperCase();
  const isTechnical=/^T\d+$/i.test(skill);
  const isDupe=/^Dupes\d*$/i.test(skill);

  let level=parseInt(params.get("id"),10);
  level=Number.isFinite(level)?level:(isDupe?5:1);

  let effectsGlossaryEnabled=false;
  try{
    try{const settings=await fetch("/data/site-features.json");effectsGlossaryEnabled=settings.ok&&(await settings.json()).effectsGlossary===true;}catch{}
    const rosterResponse=await fetch("/images/mlg-assets/data-character.json");
    if(!rosterResponse.ok)throw new Error("Unable to load character nicknames");
    const roster=await rosterResponse.json();
    const selectedId=(params.get("form")||character).toLowerCase();
    const selected=roster[selectedId]||roster[character];
    const source=roster[character]?.base_character||character;
    const variantIndex=Number(params.get("variant")??(character==="c11"?Number(skill.match(/-(\d+)$/)?.[1]||1)-1:0));
    const variant=selected?.skill_variants?.[variantIndex];
    const escapeHTML=value=>String(value).replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
    const nickname=(id,index)=>{
      const entry=roster[id];
      const person=index===undefined?null:entry?.skill_variants?.[index];
      return person?.nickname||person?.name?.split(" ")[0]||entry?.nickname||entry?.name||"Character";
    };
    const currentNickname=variant?.nickname||variant?.name?.split(" ")[0]||selected?.nickname||selected?.name||"Character";
    function fillNicknames(value){
      if(typeof value==="string"){
        const personFor=(id,index)=>id?(index===undefined?roster[id]:roster[id]?.skill_variants?.[index]):(variant||selected);
        const pronounsFor=person=>{
          const gender=String(person?.gender||"neutral").toLowerCase();
          if(gender==="male")return {subject:"he",object:"him",possessive:"his",possessive_pronoun:"his",reflexive:"himself"};
          if(gender==="female")return {subject:"she",object:"her",possessive:"her",possessive_pronoun:"hers",reflexive:"herself"};
          return {subject:"they",object:"them",possessive:"their",possessive_pronoun:"theirs",reflexive:"themself"};
        };
        // Singular they takes plural verb forms; preserve the original forms for he/she.
        const verbs={is:"are",has:"have",does:"do",gains:"gain",loses:"lose",controls:"control",launches:"launch",strikes:"strike",applies:"apply",hurls:"hurl",surfs:"surf",reveals:"reveal",shoots:"shoot",lets:"let",gets:"get",uses:"use"};
        value=value.replace(/(\{\{[Ss]ubject(?::(c\d+[a-z]?)(?::(\d+))?)?\}\}\s+(?:(?:also|instead|additionally|only|periodically)\s+)?)([a-z]+)\b/g,(match,prefix,id,index,verb)=>pronounsFor(personFor(id,index)).subject==="they"&&verbs[verb]?prefix+verbs[verb]:match);
        return value.replace(/\{\{(nickname|[Ss]ubject|[Oo]bject|[Pp]ossessive_pronoun|[Pp]ossessive|[Rr]eflexive)(?::(c\d+[a-z]?)(?::(\d+))?)?\}\}/g,(_,kind,id,index)=>{
          if(kind==="nickname")return escapeHTML(id?nickname(id,index):currentNickname);
          let text=pronounsFor(personFor(id,index))[kind.toLowerCase()];
          if(kind[0]===kind[0].toUpperCase())text=text[0].toUpperCase()+text.slice(1);
          return escapeHTML(text);
        });
      }
      if(Array.isArray(value))return value.map(fillNicknames);
      if(value&&typeof value==="object")return Object.fromEntries(Object.entries(value).map(([key,item])=>[key,fillNicknames(item)]));
      return value;
    }
    const [charResponse,effectResponse]=await Promise.all([
      fetch(`${CHAR_PATH}${source.toUpperCase()}/${source}.json`),
      fetch(EFFECT_PATH)
    ]);

    if(!charResponse.ok)throw new Error(`Unable to load ${character}.json`);
    if(!effectResponse.ok)throw new Error("Unable to load data-effects.json");

    const charData=fillNicknames(await charResponse.json());
    const effects=await effectResponse.json();
    const key=Object.keys(charData).find(key=>key.toLowerCase()===skill.toLowerCase());
    const data=charData[key]||(character==="c11"?charData?.[`${skill}-1`]:null);

    if(!data)throw new Error(`"${skill}" was not found in ${character}.json.`);

    if(isTechnical||isDupe)
      document.getElementById("level-display").style.display="none";

    if(isDupe){
      level=Math.min(5,Math.max(1,level));
      renderDupe(data,level,effects);
      return;
    }

    const maxLevel=data.max_level||10;
    level=Math.min(maxLevel,Math.max(1,level));
    renderSkill(data,level,effects);

  }catch(error){
    console.error(error);
    document.getElementById("skill-content").innerHTML=
      "<div>Unable to load skill information.</div>";
  }

  function renderSkill(data,level,effects){
    let html=renderTitle(data);

    if(data.description)
      html+=renderContent(
        data.description,
        effects,
        {
          paddingTop:7,
          ...(data.description_style||{})
        }
      );

    if(Array.isArray(data.stages))
      data.stages.forEach(stage=>{
        html+=renderContent({
          text:`<u>${stage.name}</u>: ${stage.text||""}`,
          style:{
            paddingLeft:15,
            paddingTop:7,
            ...(stage.style||{})
          }
        },effects);
      });

    if(Array.isArray(data.additional))
      data.additional.forEach(item=>{
        html+=renderContent(item,effects,{paddingTop:7});
      });

    document.getElementById("skill-content").innerHTML=html;
    updateDamageValues(data,level);
    document.getElementById("level").textContent=level;
  }

  function renderDupe(data,level,effects){
    let html="";

    if(data.description)
      html+=renderContent(
        data.description,
        effects,
        {
          paddingTop:7,
          ...(data.description_style||{})
        }
      );

    if(Array.isArray(data.additional))
      html+=renderDupeAdditional(data.additional,level,effects);

    // Some characters also document Red/Rainbow progression beyond Gold Stars.
    for(const tier of data.star_tiers||[]){
      html+=renderContent(`<b>${tier.name}</b>`,effects,{paddingTop:15});
      for(const star of tier.stars||[])
        html+=renderContent(`<b>${star.label}:</b> ${star.text}`,effects,{paddingTop:7});
    }
    document.getElementById("skill-content").innerHTML=html;
    updateDamageValues(data,level);
  }

  function renderDupeAdditional(items,selectedLevel,effects){
    let html="",currentLevel=null,currentGroup=null;

    items.forEach(item=>{
      if(!item)return;

      const hasLevel=typeof item==="object"&&Number.isFinite(Number(item.level));

      if(hasLevel){
        const itemLevel=Number(item.level);
        if(itemLevel<1||itemLevel>5)return;

        if(currentGroup&&currentLevel!==itemLevel){
          html+=renderDupeGroup(currentGroup,currentLevel,selectedLevel,effects);
          currentGroup=[];
        }

        if(!currentGroup)currentGroup=[];
        currentLevel=itemLevel;
        currentGroup.push(item);
      }else if(currentGroup){
        currentGroup.push(item);
      }else{
        html+=renderContent(item,effects,{paddingTop:7});
      }
    });

    if(currentGroup?.length)
      html+=renderDupeGroup(currentGroup,currentLevel,selectedLevel,effects);

    return html;
  }

  function renderDupeGroup(items,starLevel,selectedLevel,effects){
    const dimmed=starLevel>selectedLevel?" dimmed":"";

    return `
      <div class="dupe-level${dimmed}">
        <div class="dupe-star">
          <img src="/images/mlg-assets/Stars/Star-${starLevel}.svg" alt="Star ${starLevel}">
        </div>
        <div class="dupe-text">
          ${items.map(item=>renderDupeLine(item,effects)).join("")}
        </div>
      </div>
    `;
  }

  function renderDupeLine(item,effects){
    if(!item)return"";

    const text=typeof item==="string"?item:item.text||item.description||"";
    if(!text)return"";

    const style=typeof item==="object"
      ?{
          ...(item.style||{}),
          ...getDirectStyle(item)
        }
      :{};

    return `
      <div class="dupe-line" style="${buildStyle(style)}">
        ${renderEmbeddedContent(text,effects)}
      </div>
    `;
  }

  function renderTitle(data){
    return `
      <div>
        <b class="skill-title" style="font-size:14px">
          <span class="skill-type">${data.type||"Skill"}</span><span class="skill-title-separator">: </span><span class="skill-name">${data.name||""}</span>
        </b>
      </div>
    `;
  }

  function renderContent(item,effects,defaults={}){
    if(!item)return"";

    const content=typeof item==="string"
      ?{text:item,style:{}}
      :item;

    const text=content.text||content.description||"";
    if(!text)return"";

    const style={
      ...defaults,
      ...(content.style||{}),
      ...getDirectStyle(content)
    };

    return `
      <div class="${style.fontSize!==undefined&&parseFloat(style.fontSize)<=9?'skill-meta':''}" style="${buildStyle(style)}">
        ${renderEmbeddedContent(text,effects)}
      </div>
    `;
  }

  function getDirectStyle(item){
    const style={};

    [
      "paddingTop","paddingRight","paddingBottom","paddingLeft",
      "marginTop","marginRight","marginBottom","marginLeft",
      "textAlign","width","fontSize","lineHeight"
    ].forEach(field=>{
      if(item[field]!==undefined)
        style[field]=item[field];
    });

    return style;
  }

  function buildStyle(style={}){
    const properties={
      paddingTop:"padding-top",
      paddingRight:"padding-right",
      paddingBottom:"padding-bottom",
      paddingLeft:"padding-left",
      marginTop:"margin-top",
      marginRight:"margin-right",
      marginBottom:"margin-bottom",
      marginLeft:"margin-left",
      textAlign:"text-align",
      width:"width",
      fontSize:"font-size",
      lineHeight:"line-height"
    };

    return Object.entries(properties)
      .filter(([key])=>style[key]!==undefined&&style[key]!==null&&style[key]!=="")
      .map(([key,property])=>{
        let value=style[key];

        if(key==="fontSize"){
          value=typeof value==="number"
            ?`${value}px`
            :String(value);
        }else if(
          typeof value==="number" &&
          [
            "paddingTop","paddingRight","paddingBottom","paddingLeft",
            "marginTop","marginRight","marginBottom","marginLeft",
            "width","lineHeight"
          ].includes(key)
        ){
          value=`${value}px`;
        }

        return `${property}:${value}`;
      })
      .join(";");
  }

  function renderEmbeddedContent(text,effects){
    if(!text)return"";

    return text.replace(
      /\{\{effect:([^}]+)\}\}/g,
      (_,id)=>renderEffect(id.trim(),effects)
    );
  }

  function renderEffect(effectId,effects){
    const effect=effects?.[effectId];

    if(!effect){
      console.warn(`Effect "${effectId}" was not found in data-effects.json.`);
      return"";
    }

    const type=String(effect.type||"").toLowerCase();
    const typeClass=type==="buff"?"buff":"debuff";

    let descriptions="";

    /*
      Supports:
      description
      description2
      description3
      description4
      ...

      And corresponding styles:
      description_style
      description2_style
      description3_style
      description4_style
      ...
    */
    Object.keys(effect)
      .filter(key=>/^description\d*$/.test(key))
      .sort((a,b)=>{
        const getNum=key=>key==="description"?1:parseInt(key.replace("description",""),10);
        return getNum(a)-getNum(b);
      })
      .forEach((key,index)=>{
        const text=effect[key];
        if(!text)return;

        const styleKey=`${key}_style`;
        let style=effect[styleKey]||{};

        if(key==="description2"&&!Object.keys(style).length)
          style=effect.descrption2_style||style;

        descriptions+=`
          <div style="${buildStyle(style)}">
            ${index===0?`
              <span class="${typeClass}">
                ${effect.type||""}
              </span>:
            `:""}
            ${renderEmbeddedContent(text,effects)}
          </div>
        `;
      });

    return `
      <div class="icon-container" style="padding-left:15px;padding-top:10px">
        <div class="effect-icon hidden">
          <img
            src="${effect.icon||""}"
            alt="${effect.name||effectId} Icon"
            style="width:20px;height:20px"
          >
        </div>

        <div class="effect-text">
          ${effectsGlossaryEnabled?`<a href="/webpages/game-codex.html#${encodeURIComponent(effectId)}" target="_top" style="color:inherit;text-decoration:underline;text-decoration-color:rgba(228,197,121,.15);text-decoration-thickness:1px;text-underline-offset:3px" aria-label="${String(effect.name||effectId).replace(/&/g,"&amp;").replace(/"/g,"&quot;")} effect details">`:""}
          <b class="${effect.class||""}">
            [${effect.name||effectId}]
          </b>
          ${effectsGlossaryEnabled?"</a>":""}

          ${descriptions}
        </div>
      </div>
    `;
  }

  function updateDamageValues(data,level){
    const multiplier=
      1+(data.level_multiplier||0.1)*(level-1);

    document.querySelectorAll("[data-dmg]").forEach(element=>{
      const damageId=element.dataset.dmg;
      const baseDamage=data.base_damage?.[damageId];

      if(baseDamage===undefined)return;

      element.textContent=
        (baseDamage*multiplier).toFixed(1);
    });
  }
});
</script>

</body>
</html>
