name: Automatically adjust EPUBs
on:
  push:
    branches: [main, master]
    paths:
      - 'books/epub/**'
      - 'books/fonts/**'
      - 'books/epub/prepare-epub.py'
      - '.github/workflows/prepare-epubs.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prepare-epubs-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Adjust new and replaced EPUBs
        run: python3 books/epub/prepare-epub.py --scan
      - name: Save adjusted EPUBs
        run: |
          git add books/epub
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Adjust EPUBs for the website reader'
          git push origin HEAD:${{ github.ref_name }}
