<!doctype html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="The groovy music and OST of the Mystical Legends Series and Game.">
<meta name="keywords" content="Mystical Legends, Mystical, Legends, mystical universe, magical characters, angelor, elves, modern fantasy, mystical creatures">

<title>Mystical Legends Music</title>

<link rel="icon" href="../images/website/favicon.png" type="image/png">

<link href="../css/bootstrap-min.css" rel="stylesheet">
<link rel="stylesheet" href="../css/home.css">
<link rel="stylesheet" href="../css/news.css">
<link rel="stylesheet" href="../css/mlg.css">

<script src="../js/bootstrap-bundle-min.js"></script>

</head>


<body>

<div id="subheader-placeholder"></div>

<h2 style="color:rgb(19,19,19);padding:10px;">Mystical Legends</h2>

<br><br>


<section id="jukebox">

<h1 class="title">Mystical Legends Official Soundtrack</h1>

<div class="player">

<div class="album-area">
<img id="cover" src="" alt="cover">
</div>

<div class="song-info">
<div id="song-title">Song</div>
</div>

<audio id="audio"></audio>

<div class="progress-container" id="progress-container">
<div class="progress" id="progress"></div>
</div>

<div class="time">
<span id="current-time">0:00</span>
<span id="duration">0:00</span>
</div>

<div class="controls">

<button id="shuffle">⇄</button>
<button id="prev">◁</button>
<button id="play">▶︎</button>
<button id="next">▷</button>
<button id="repeat">↺</button>

</div>

</div>


<div class="playlist" id="playlist"></div>



<style>

#jukebox{
max-width:900px;
margin:auto;
padding:15px;
font-family:Arial;
text-align:center;
}

.title{
font-size:2rem;
margin-bottom:20px;
}

.player{
background:#111;
color:white;
padding:25px;
border-radius:15px;
}

.album-area{
display:flex;
justify-content:center;
}

#cover{
width:220px;
height:220px;
object-fit:cover;
border-radius:10px;
margin-bottom:15px;
}

.song-info{
font-size:1.3rem;
margin-bottom:10px;
}

.progress-container{
width:100%;
height:8px;
background:#444;
border-radius:5px;
cursor:pointer;
margin-top:10px;
}

.progress{
height:100%;
width:0%;
background:#af4343;
border-radius:5px;
}

.time{
display:flex;
justify-content:space-between;
font-size:.9rem;
margin-top:4px;
}

.controls{
margin-top:15px;
display:flex;
justify-content:center;
gap:15px;
}

.controls button{
border:none;
padding:10px 14px;
font-size:20px;
border-radius:8px;
background:#dd4149;
color:white;
cursor:pointer;
}

.controls button.active{
background:#ffcc00;
}

.controls button:hover{
transform:scale(1.1);
}

.playlist{
margin-top:25px;
background:#222;
border-radius:10px;
overflow:hidden;
}

.song{
border-bottom:1px solid #333;
color:white;
cursor:pointer;
transition:.3s;
}

.song-header{
padding:12px;
display:flex;
justify-content:space-between;
}

.song.active{
background:#df4d4d;
}

.song-details{
max-height:0;
overflow:hidden;
transition:max-height .4s ease;
background:#181818;
padding:0 15px;
}

.song.active .song-details{
max-height:200px;
padding:10px 15px;
}

.song-meta{
display:flex;
align-items:center;
gap:10px;
}

.song-meta img{
width:70px;
height:70px;
object-fit:cover;
border-radius:6px;
}

.song-text{
text-align:left;
font-size:.9rem;
}

</style>



<script>

/* SONG DATABASE LOADED FROM JSON */

let songs=[];



const audio=document.getElementById("audio");
const play=document.getElementById("play");
const prev=document.getElementById("prev");
const next=document.getElementById("next");
const shuffleBtn=document.getElementById("shuffle");
const repeatBtn=document.getElementById("repeat");

const progress=document.getElementById("progress");
const progressContainer=document.getElementById("progress-container");

const title=document.getElementById("song-title");
const cover=document.getElementById("cover");

const playlist=document.getElementById("playlist");

const currentTimeEl=document.getElementById("current-time");
const durationEl=document.getElementById("duration");



let index=0;
let playing=false;
let shuffle=false;
let repeat=false;



/* LOAD SONG */

function loadSong(i){

index=i;

audio.src=songs[i].file;
title.textContent=songs[i].title;
cover.src=songs[i].cover;

document.querySelectorAll(".song").forEach((s,j)=>{

if(j===i){
s.classList.add("active");
}else{
s.classList.remove("active");
}

});

}



/* PLAY / PAUSE */

play.onclick=()=>{

if(!playing){
audio.play();
play.textContent="||";
}else{
audio.pause();
play.textContent="▶︎";
}

playing=!playing;

};



/* NEXT SONG */

function nextSong(){

if(shuffle){
index=Math.floor(Math.random()*songs.length);
}else{
index=(index+1)%songs.length;
}

loadSong(index);
audio.play();
play.textContent="||";
playing=true;

}



/* PREVIOUS SONG */

function prevSong(){

index=(index-1+songs.length)%songs.length;
loadSong(index);
audio.play();

}

next.onclick=nextSong;
prev.onclick=prevSong;



/* SHUFFLE */

shuffleBtn.onclick=()=>{
shuffle=!shuffle;
shuffleBtn.classList.toggle("active");
};



/* REPEAT */

repeatBtn.onclick=()=>{
repeat=!repeat;
repeatBtn.classList.toggle("active");
};



/* PROGRESS BAR */

audio.addEventListener("timeupdate",()=>{

const {duration,currentTime}=audio;

const percent=(currentTime/duration)*100;
progress.style.width=percent+"%";

const format=t=>{
const m=Math.floor(t/60);
const s=Math.floor(t%60).toString().padStart(2,"0");
return m+":"+s;
}

currentTimeEl.textContent=format(currentTime);

if(duration) durationEl.textContent=format(duration);

});



/* SEEK */

progressContainer.onclick=e=>{

const width=progressContainer.clientWidth;
const click=e.offsetX;
const duration=audio.duration;

audio.currentTime=(click/width)*duration;

};



/* SONG END */

audio.addEventListener("ended",()=>{

if(repeat){
audio.currentTime=0;
audio.play();
}else{
nextSong();
}

});



/* BUILD PLAYLIST */

function buildPlaylist(){

playlist.innerHTML="";

songs.forEach((s,i)=>{

const div=document.createElement("div");

div.className="song";

div.innerHTML=`

<div class="song-header">
<span>${s.title}</span>
</div>

<div class="song-details">

<div class="song-meta">

<img src="${s.cover}">

<div class="song-text">

Artist: ${s.artist}<br>
Album: ${s.album}<br>
<small style="color: #c8c8c8a8">${s.description}</small>

</div>

</div>

</div>

`;

div.onclick=()=>{
loadSong(i);
audio.play();
play.textContent="⏸";
playing=true;
};

playlist.appendChild(div);

});

}



/* LOAD JSON */

fetch("/index/songs.json")
.then(res=>res.json())
.then(data=>{

songs=data;

buildPlaylist();
loadSong(0);

})
.catch(err=>console.error("Song JSON failed to load",err));


</script>

</section>


<br><br>


<script src="../js/include.js"></script>

<div id="subfooter-placeholder"></div>

</body>
</html>
