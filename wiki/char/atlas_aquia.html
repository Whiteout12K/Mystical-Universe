Atlas Aquia is a Water Spirit and the centurion of Tempest Aquia. A member of the Aquia royal family, he specializes in water compression and is the brother of River Grant and Alteria Aquia.

|tab=Overview

== Background ==
Atlas leads Tempest Aquia as its centurion. His royal connections and water compression distinguish his position within the Aquia family and Regnum Academy.

{{Spoiler|After Aqua Revolution, Atlas succeeds Atalantia as the Magni of District 5.}}
