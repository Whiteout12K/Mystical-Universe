Explore the history of the Mystical Legends Universe through its major arcs and connected events. The chronology is organized by story arc. Expand an arc’s events to read its history, character involvement, and related side stories, or use the contents to jump to a section.

Summarized from the author’s supplied series outline. Dates are relative unless specified. Empty arc headings are not expanded into invented events. Book XIII is absent from the source; Books XIX–XXI are tentative continuations. Historical time-travel events are grouped by narrative journey rather than presented as fixed calendar dates.

== Journey of the Mystical Beings ==

Zenith Luces — Before the Main Series — Past eras; includes travel across fractured time

Zenith’s journey revolves around an artifact ring, the founding of the Mystical Island, and repeated confrontations with Lordius Doomolo across fractured realities.

{{Collapse
|title=Events and side stories
|content=
=== The Original Banishment ===

'''Event type:''' Magic

Hundreds of years before the Journey; exact date unknown · Side story · Earlier history

An Angelor uses an artifact ring to banish Lordius Doomolo and Tomolock into a fractured reality between the spirit and shadow realms. They escape weakened hundreds of years later, during the Journey of the Mystical Beings.

'''Characters involved:''' Lordius Doomolo, Tomolock

'''Related events:''' [[#tomolock-s-artifact-search|Tomolock’s Artifact Search — Escape from the earlier banishment]]

=== The Sustination Orb ===

'''Event type:''' Conflict

After the island’s founding, the weakened Doomolo obtains the Sustination Orb and threatens the island. He is defeated and flees.

'''Characters involved:''' Lordius Doomolo

'''Location:''' Mystical Island

=== Tomolock’s Artifact Search ===

'''Event type:''' Discovery

Tomolock escapes the fractured reality, obtains William’s map, and travels to another island in search of the ring that imprisoned him.

'''Characters involved:''' Tomolock, William

=== The Battle Across Time ===

'''Event type:''' Conflict

Roughly sixteen years before Book I

A struggle over the artifact sends Zenith, Caela, Pyrus, Doomolo, and Tomolock into fractured reality. They emerge more than ninety years later, roughly sixteen years before the main story, and continue their battle.

'''Characters involved:''' Zenith Luces, Caela Obtainia, Pyrus Bourn, Lordius Doomolo, Tomolock

'''Related events:''' [[#the-cabin-and-the-ancient-rune|The Cabin and the Ancient Rune — The ring and sealing history are discovered]]

=== Zenith’s Return to the Past ===

'''Event type:''' Magic

Returns to a time before the Journey · Time travel

Zenith takes Doomolo back into fractured reality and learns to regress his enemy’s powers. Both are displaced to a time before the Journey and separated. Zenith discovers that his presence helps inspire Caela to begin that very journey.

'''Characters involved:''' Zenith Luces, Lordius Doomolo, Caela Obtainia

=== The Ring’s Protector ===

'''Event type:''' Discovery

Earlier moment reached through fractured time · Time travel

Zenith defeats Doomolo in a final battle and prepares a new district to protect the ring. The return to this earlier moment is made possible by outside intervention from the past: ancestors create fractures into their future, rather than into their past.

'''Characters involved:''' Zenith Luces, Lordius Doomolo

}}

== The Fall of District 1 ==

Nuntios — Before the Main Series — Before Kaden’s life in New York

Ioward Icelander’s attempt to revive his wife destroys District 1, while Kaden’s first IT Agency fights Malum and leaves behind the Nuntios’ mission to protect others.

{{Collapse
|title=Events and side stories
|content=
=== Ioward’s Pact ===

'''Event type:''' Magic

District 1’s progenitor, Ioward Icelander, becomes the vessel of a powerful member of the twelve Demon Gods to revive his late wife. Soul harvesting raises him from Ultimus Deus to Celestius Deus and grants immortality.

'''Characters involved:''' Ioward Icelander

'''Location:''' District 1

=== Malum and the First IT Agency ===

'''Event type:''' Conflict

Master Malum undermines the IT model established by Ioward and Kaden. Kaden gathers the Nuntios into the first IT Agency to resist the company, unaware that Ioward secretly hired Malum to destroy both his legacy and District 1.

'''Characters involved:''' Ioward Icelander, Kaden Icelander, Master Malum

'''Location:''' District 1

=== The Failed Revival ===

'''Event type:''' Conflict

Despite Kaden and the Nuntios’ intervention, the bomb destroys District 1 and leaves few survivors. The revival ritual fails; the Demon God gains an independent body and abandons Ioward. Ioward and Kaden leave for New York.

'''Characters involved:''' Ioward Icelander, Kaden Icelander

'''Location:''' District 1

'''Related events:''' [[#kaden-s-past-and-the-cohort-selections|Kaden’s Past and the Cohort Selections — One year later: Kaden at fourteen]]; [[#district-1-rekindling|District 1 Rekindling — Later: District 1 is reclaimed]]

=== The Nuntios’ New Purpose ===

'''Event type:''' Alliance

Kaden releases the Nuntios from his service and asks them to prevent similar tragedies. Josh Picard, Jay Neomo, Lux Luces, and Marin Kne train at Regnum Academy until the four can undertake S+ missions together.

'''Characters involved:''' Josh Picard, Jay Neomo, Lux Luces, Marin Kne

'''Location:''' Regnum Academy

'''Related events:''' [[#nuntios-return-and-winter-s-dance|Nuntios’ Return and Winter’s Dance — The Nuntios later return as teachers]]

}}

== Rune of the Spellcaster ==

Book I — Beginning of the main series

Avery discovers his Angelor identity, enters mystical schooling, and faces Pyrus Bourn’s invasion as the Rune of the Spellcaster and Orb of Destruction reshape his future.

{{Collapse
|title=Events and side stories
|content=
=== OSNYC Admission ===

'''Event type:''' Discovery

Former street boy Avery Obtainia learns about Mystical Beings and his Angelor heritage at the mainland school OSNYC. He meets Teddric Tech and River Grant during admission, while magical species, basic magic, and rankings are introduced.

'''Characters involved:''' Avery Obtainia, Teddric Tech, River Grant

'''Location:''' New York / OSNYC

=== The Cabin and the Ancient Rune ===

'''Event type:''' Magic

Avery discovers a cabin holding the Rune of the Spellcaster. A fragment of Doomolo’s power reveals a vision of Caela Obtainia, Zenith Luces, and the sealing of the Orb of Destruction. Avery first uses healing magic.

'''Characters involved:''' Avery Obtainia, Caela Obtainia, Zenith Luces

=== Kaden and the Shadow Cult ===

'''Event type:''' Discovery

IT manager Kaden Icelander demonstrates ice magic and Ice Travel. A shadow cult encounter leads to an ATLAS meeting about the incident and student placement, involving Jim Jaedin and Marx Sumaho.

'''Characters involved:''' Kaden Icelander, Jim Jaedin, Marx Sumaho

'''Location:''' ATLAS

=== Regnum Academy Start ===

'''Event type:''' Discovery

The students travel to District 7, Lux Urbis, and begin at Regnum Academy. Elmor Locks, Jane Tee, Ken and Kirk Masumi, and Charlotte Levy enter the story; cohorts, the Three Symbols, and magical discharge are introduced.

'''Characters involved:''' Elmor Locks, Jane Tee, Ken Masumi, Kirk Masumi, Charlotte Levy

'''Location:''' Regnum Academy / District 7

=== Invasion by Fire ===

'''Event type:''' Conflict

Pyrus crashes into District 7’s town hall and awakens as a Larvan wielding inferno magic. Contact with the Orb reveals Avery’s wings and strengthens his magic, while Kaden shows the Icelorian Blade and other defenders reveal further affinities.

'''Characters involved:''' Pyrus Bourn, Avery Obtainia, Kaden Icelander, Elmor Locks, Charlotte Levy

'''Location:''' Lux Urbis

=== The Mystical Legends’ Promise ===

'''Event type:''' Alliance

Oceanus Aquia appears in the aftermath. Regnum Spei and Avery’s Compression are revealed, and the concept of the Mystical Legends takes shape. Avery and River vow to pursue equality between commoners and nobles.

'''Characters involved:''' Avery Obtainia, River Grant, Oceanus Aquia

}}

== The I.T.E.R. Chronicles — Initialization ==

Book II — Following Book I

Cohort competition and an IT internship establish the next stage of the students’ training and their ties to Kaden’s work.

{{Collapse
|title=Events and side stories
|content=
=== Cohort Clash ===

'''Event type:''' Discovery

Additional cohort captains, including Cedric Paine, Len Hiyama, and Carla Storm, are introduced.

'''Characters involved:''' Cedric Paine, Len Hiyama, Carla Storm

=== Flag Game and IT Internship ===

'''Event type:''' Discovery

The outline names the Flag Game and IT Internship arcs. Later notes establish that Avery and Teddric earn prize money from the flag game; further details of these arcs are not yet supplied.

'''Characters involved:''' Avery Obtainia, Teddric Tech

}}

== The I.T.E.R. Chronicles — Rectification ==

Book III — Following Initialization; includes Kaden’s earlier life

Stolen robot blueprints, demihuman kidnappings, and political manipulation force Kaden and his allies into hiding as Lux Urbis approaches a three-faction conflict.

{{Collapse
|title=Events and side stories
|content=
=== Kaden’s Past and the Cohort Selections ===

'''Event type:''' Discovery

Kaden at fourteen, one year after District 1’s fall; later cohort selections · Side story · Earlier history

At fourteen, one year after District 1’s fall, Kaden is withdrawn in New York until new friends inspire him to act. Later, the group of seven undergoes cohort selection; sixteen-year-old Kaden remains a second-year Blue Legion student and Avery joins Tempest Aquia.

'''Characters involved:''' Kaden Icelander, Avery Obtainia, Ken Masumi, Kirk Masumi

=== Kidnappings and Council Schemes ===

'''Event type:''' Conflict

River is captured for forced labor producing illicit I.T.E.R. parts. Noble Thelio denies the evidence with Hayman’s backing, while Hayman secretly supports the kidnappings and manipulates the council against Kaden. Council discussions also foreshadow an army gathering in the north, District 6, and Imperium.

'''Characters involved:''' River Grant, Thelio, Hayman, Kaden Icelander

'''Location:''' Lux Urbis

=== The Robot Outbreak ===

'''Event type:''' Conflict

A longtime IT employee steals the I.T.E.R. blueprints and unleashes duplicate robots to frame the company. The heroes’ auction trip is interrupted by the outbreak; police and council officials converge on IT, and Martin identifies Kaden as the project’s creator.

'''Characters involved:''' Kaden Icelander, Martin, Avery Obtainia, Teddric Tech

'''Location:''' IT Tower / Lux Urbis

=== Fugitives and the Dark Market ===

'''Event type:''' Conflict

Kaden, Lucy, Avery, and their allies escape IT Tower and are declared S-ranked fugitives. Pursued through nomadic forest land, they reach District 13’s black market to trace a captured robot’s network and identify its source.

'''Characters involved:''' Kaden Icelander, Lucy Terner, Avery Obtainia

'''Location:''' Forests between districts / District 13

=== The Slum Factory and Three Factions ===

'''Event type:''' Conflict

Anger over demihuman exploitation escalates into fighting at Lux Urbis’s gates as robots defend the city they previously attacked. The heroes uncover a forced-labor factory; a defeated deputy identifies Morphius as its boss.

'''Characters involved:''' Avery Obtainia, Morphius

'''Location:''' Lux Urbis / factory district

=== After the I.T.E.R. Conflict ===

'''Event type:''' Discovery

The seven pursue intensive training to reach the next tier before school resumes, while the Masumi brothers disappear elsewhere. River encounters Josh Picard, who rescues her from trouble.

'''Characters involved:''' River Grant, Josh Picard, Ken Masumi, Kirk Masumi

}}

== Aqua Revolution ==

Book IV — The next semester and preparations for the festival

The Nuntios return, the Aquia family’s history emerges, and a water-kingdom conflict leads into reforms at Regnum and preparations for the school festival.

{{Collapse
|title=Events and side stories
|content=
=== Nuntios’ Return and Winter’s Dance ===

'''Event type:''' Discovery

Josh, Jay, Lux, and Marin take teaching roles at Regnum. Kiara Katzol and Imo Lordius transfer in. At the mandatory Winter’s Dance, River stays out of the festivities and Atlas confronts her.

'''Characters involved:''' Josh Picard, Jay Neomo, Lux Luces, Marin Kne, Kiara Katzol, Imo Lordius, River Grant, Atlas Aquia

'''Location:''' Regnum Academy

=== The Atalantia Investigation ===

'''Event type:''' Discovery

Avery discovers he can breathe underwater. Atlas, Alteria, and Avery are commissioned to address an urgent issue in the water kingdom, where investigations connect Atalantia, Malum, and Mas Rellim to District 1’s destruction and later conflicts.

'''Characters involved:''' Avery Obtainia, Atlas Aquia, Alteria Aquia, Atalantia Aquia, Mas Rellim

=== River’s Family History ===

'''Event type:''' Discovery

Before River’s admission to OSNYC; exact date unknown · Side story · Earlier history

Atalantia adopted River alongside her biological children, Atlas and Alteria. River fled after her adoptive father was captured and killed during a failed secret arrangement involving citizen trafficking and a demanded marriage alliance. Atlas’s investigation exposes the family’s concealed dealings, though both siblings continue to blame River before confronting their own wrongs.

'''Characters involved:''' River Grant, Atalantia Aquia, Atlas Aquia, Alteria Aquia

'''Related events:''' [[#osnyc-admission|OSNYC Admission — River later meets Avery and Teddric]]; [[#the-atalantia-investigation|The Atalantia Investigation — Her family history comes to light]]

=== The Attack on the Water Kingdom ===

'''Event type:''' Conflict

Atalantia diverts Mas Rellim’s water weapons to defend her kingdom. Hidden interference, including the Whale Lord’s influence, is suspected. Atlas and Alteria acknowledge their failings, advance in rank, and fight together against Mas Rellim.

'''Characters involved:''' Atalantia Aquia, Atlas Aquia, Alteria Aquia, Mas Rellim, Whale Lord

'''Location:''' Water kingdom

=== Homerooms, Familiars, and the Pre-Festival ===

'''Event type:''' Magic

Regnum introduces homeroom groups to curb noble influence and formally teaches familiars and spiritual bonds. Second-years perform a lifelong familiar ritual. Cohort missions and a pre-festival tournament test the students, with resources and rank-enhancing alchemy pills among the prizes. Billy Bones Acitas is fully introduced as Red Shred’s captain.

'''Characters involved:''' Billy Bones Acitas

'''Location:''' Regnum Academy

}}

== Festival Saga ==

Book V — Festival season, followed by summer

Regnum’s celebrations and competitions are interrupted by the Hands of Doom, Imo’s defection, and renewed struggles over magical orbs.

{{Collapse
|title=Events and side stories
|content=
=== The Regnum Festival ===

'''Event type:''' Discovery

A large tournament, alchemy and runecrafting contests, entertainment, and elective competitions bring the cohorts and elite students together. The outline also names Beast Hunt and Advancements arcs without further details.

'''Location:''' Regnum Academy

=== The Festival Raid and Imo’s Choice ===

'''Event type:''' Conflict

The first two Hands of Doom appear to sow chaos and conduct a search. Alienated from his classmates and persuaded by his family’s ambitions, Imo Lordius joins the Hands of Doom and leaves Regnum.

'''Characters involved:''' Imo Lordius

'''Related events:''' [[#red-shred-s-response|Red Shred’s Response — Response to the festival attack]]

=== The Earth Orb and Pyrus’s Escape ===

'''Event type:''' Conflict

A battle over the earth orb begins during the festival. Pyrus accepts aid from shadow cultists to escape prison while pursuing his own aims, and the Magni Mage personally confronts an invader.

'''Characters involved:''' Pyrus Bourn, Magni Mage

=== The Aquia Estate ===

'''Event type:''' Discovery

With no home for summer, Avery reluctantly accepts work at the Aquia Estate as Alteria’s servant, revealing the estate more fully.

'''Characters involved:''' Avery Obtainia, Alteria Aquia

'''Location:''' Aquia Estate

}}

== Red Showdown ==

Book VI — After the festival attack

District unrest, Pyrus’s return, and rising shadow threats shape school rivalries, mainland internships, and Red Shred’s efforts to restore stability.

{{Collapse
|title=Events and side stories
|content=
=== District 3 Recapture ===

'''Event type:''' Conflict

Pyrus retakes District 3 without openly opposing District 7. A truce redirects attention toward the shadow cult, whose attempt to seize the orb unsettles the districts’ balance of power.

'''Characters involved:''' Pyrus Bourn

'''Location:''' District 3

=== Trading Town and New York Internship ===

'''Event type:''' Discovery

Diplomatic transfers intensify competition among incoming students. Avery and others return to OSNYC as IT Agency interns supporting Mystical Surveillance Units.

'''Characters involved:''' Avery Obtainia

'''Location:''' Trading town / New York

=== Red Shred’s Response ===

'''Event type:''' Alliance

Billy Bones Acitas and the cohorts suppress rising danger after the festival attack. His cohort band performs around Lux Urbis to lift morale, with Avery’s group assisting despite continuing distrust and tension.

'''Characters involved:''' Billy Bones Acitas, Avery Obtainia

'''Location:''' Lux Urbis

=== School Selection and Council Quarantine ===

'''Event type:''' Discovery

The biannual competition among Regnum, Magis, and Imperium brings the rival schools into focus. Avery and Teddric are assigned to work directly under council members.

'''Characters involved:''' Avery Obtainia, Teddric Tech

'''Location:''' Regnum / Magis / Imperium

}}

== The Rogue God ==

Book VII — Before the main group’s graduation

A surviving deity targets those blessed by the gods, while Kaden restores District 1 and the graduating Mystical Legends choose their separate paths.

{{Collapse
|title=Events and side stories
|content=
=== Deity Encirclement ===

'''Event type:''' Conflict

A millennia-old Rogue God, sustained by a secondary mana catalyst, directs followers to find deities and seize their power. Avery, who holds Lynnhera, becomes a target as the twelve deities are introduced.

'''Characters involved:''' Avery Obtainia, Lynnhera, Rogue God

=== Avery and Kiara’s Capture ===

'''Event type:''' Magic

The group captures Avery and Kiara and attempts to extract their deities. Lynnhera’s integration with Avery prevents ordinary extraction, so his captors instead seek his catalyst.

'''Characters involved:''' Avery Obtainia, Kiara Katzol, Lynnhera

=== District 1 Rekindling ===

'''Event type:''' Alliance

The deity followers seek shadow energy in District 1 to continue their ritual. Kaden uses the opportunity to retake the district; Avery and their allies help cleanse it. Citizens return and Kaden becomes the new Magni Sage.

'''Characters involved:''' Kaden Icelander, Avery Obtainia

'''Location:''' District 1

=== Graduation and Separate Paths ===

'''Event type:''' Discovery

The students complete their final graduation test with high marks. Kaden joins Avery and the others as they leave school and pursue individual paths to grow stronger against the shadows.

'''Characters involved:''' Kaden Icelander, Avery Obtainia

'''Location:''' Regnum Academy

'''Related events:''' [[#the-unmarked-island|The Unmarked Island — A few weeks after separation]]

}}

== The Faraway Paladin ==

Interlude — A few weeks after the group separates

A shadowy island leads Avery’s companions into the history of the deities and their war against Demon Lord Bathybius Dion.

{{Collapse
|title=Events and side stories
|content=
=== The Unmarked Island ===

'''Event type:''' Discovery

Some of the separated Mystical Legends arrive on a shadowy island rumored to have been discovered by Zenith Luces. Trisdain Leonard and the rulers’ black knights enter the story.

'''Characters involved:''' Zenith Luces, Trisdain Leonard

=== The Lady of the Lake ===

'''Event type:''' Discovery

Lynnhera awakens and guides Avery and his companions to Artiana, the Lady of the Lake. The deities’ war against Bathybius Dion is explained, along with their continuing influence on history. The Leaf Series arc remains undeveloped in these notes.

'''Characters involved:''' Lynnhera, Avery Obtainia, Artiana, Bathybius Dion

}}

== Shadow Dwelling ==

Book VIII — Avery is nineteen

Avery’s reunion with his allies coincides with marriage-alliance tensions and Doomolo’s full revival as shadow-realm experiments threaten the world.

{{Collapse
|title=Events and side stories
|content=
=== District 12 and the Wedding Alliance ===

'''Event type:''' Conflict

Avery meets Lumen and helps repel two Hands of Doom attacking District 12. Lumen proposes an alliance with District 10 through marriage, but Lux refuses; Kiara and Prince Aether are involved, and Avery later protects Lux.

'''Characters involved:''' Avery Obtainia, Lumen, Lux Luces, Kiara Katzol, Prince Aether

'''Location:''' District 12 / District 10

=== Reunion and the Mainland Laboratory ===

'''Event type:''' Discovery

The outline names Reunion and Mainland Laboratory arcs as part of the renewed struggle against the shadow cult, without supplying their full events.

=== Doomolo’s Revival ===

'''Event type:''' Magic

Lordius Doomolo revives using Luo Ye’s immortal blood and escapes fractured reality. Venjolo’s shadow-realm experiments support his plan to expose magic, raise ambient magical density through rifts, and unleash shadow soldiers and spiritless entities such as a revived Mas Rellim.

'''Characters involved:''' Lordius Doomolo, Luo Ye, Venjolo, Mas Rellim

'''Related events:''' [[#the-first-district-union|The First District Union — The districts begin a united response]]

}}

== Districts’ Unition ==

Book IX — Before the Mystic War

The heroes work to unite the districts against Doomolo, resolving local conflicts to win the trust of their Magni.

{{Collapse
|title=Events and side stories
|content=
=== The First District Union ===

'''Event type:''' Alliance

Districts 1, 5, 7, and 12 begin discussing a united response to Doomolo and his army.

'''Location:''' Districts 1, 5, 7, and 12

=== Winning the Other Districts ===

'''Event type:''' Alliance

The heroes journey through the other districts to resolve disputes and gain each Magni’s support. Named arcs include Throneless Silvastra, District 3’s Silence, District 6 Split, District 8 Capture, and Pre-War Confrontation; their detailed outcomes are not supplied.

}}

== Mystic War ==

Book X — The war against Doomolo

The outlined war brings Doomolo’s assault, the districts’ rally, mounting casualties, and a climactic confrontation leading into world revelation.

{{Collapse
|title=Events and side stories
|content=
=== From Confrontation to War ===

'''Event type:''' Conflict

Pre-War Confrontation continues into Doom’s Assault and Districts Rally, bringing the unified districts into the central conflict. Detailed battles are not yet described.

'''Characters involved:''' Lordius Doomolo

=== The War’s Climax ===

'''Event type:''' Conflict

Mystic War Peak, War Casualty, Battle Against Doom, and War Climax are listed as major stages. World Revelation begins at the end of this book; specific outcomes remain unspecified.

'''Related events:''' [[#mystical-convergence-and-global-revelation|Mystical Convergence and Global Revelation — World Revelation continues after the war]]

}}

== World Revelation ==

Book XI — After the Mystic War

Magic becomes widespread, society faces new dangers, and Avery’s relationship with Lynnhera develops into a struggle over his body and identity.

{{Collapse
|title=Events and side stories
|content=
=== Mystical Convergence and Global Revelation ===

'''Event type:''' Magic

The revelation of magic continues. Increased magical density brings more creatures and greater magical capabilities, while a current Magni’s death signals a turning point. Beasts become sources of cultivation and rare materials, and rising crime creates a need for a national response.

=== Rising of the Saints ===

'''Event type:''' Discovery

Side story

Lynnhera’s past and the lives of the deities are explored. Avery accepts her account and follows her advice as her influence on his life deepens.

'''Characters involved:''' Avery Obtainia, Lynnhera

'''Related events:''' [[#against-the-gods|Against the Gods — Lynnhera’s influence leads into the confrontation]]

=== Against the Gods ===

'''Event type:''' Conflict

Lynnhera manifests as a living deity through Avery, transforms him into mana, and absorbs him, using the Spellcaster Seal Ring to reform her crown. His friends defeat her before greater harm occurs, but Avery does not fully awaken; she remains in control under the concealed identity Morgen.

'''Characters involved:''' Avery Obtainia, Lynnhera, Morgen

'''Related events:''' [[#avery-awakens|Avery Awakens — Avery later regains consciousness]]

=== The Angelor Betrayal and Holy War Prelude ===

'''Event type:''' Conflict

An Angelor girl who had become close to Avery betrays him, contributing to the Angelors’ later return. Lynnhera’s ulterior motives partly align with those of the foreign Angelors as the Holy War approaches.

'''Characters involved:''' Avery Obtainia, Lynnhera

}}

== Angelos’ Retribution ==

Book XII — The Holy War

The return of the exiled Angelors brings a campaign to restrict magic to the worthy while Avery struggles to regain consciousness.

{{Collapse
|title=Events and side stories
|content=
=== The Angelors’ Exile ===

'''Event type:''' Discovery

Before the Holy War; exact era unknown · Side story · Earlier history

In the past, Doomolo devastated the Angelor clan and forced its survivors to retreat from Earth. They remained trapped at the sun because travel required abundant magic at both ends of the route.

'''Characters involved:''' Lordius Doomolo

'''Related events:''' [[#the-holy-war|The Holy War — Rising magic enables the Angelors’ return]]

=== The Holy War ===

'''Event type:''' Conflict

Rising magic on Earth enables the Angelors to break their seal and open a portal back. They seek to fulfill the first Demon Lord’s wish to remove magic from those deemed unworthy and establish a world guided by chosen Mystical Beings.

=== Avery Awakens ===

'''Event type:''' Magic

Lynnhera controls Avery through much of this period. By the book’s end, Avery regains consciousness but remains in Hera’s body.

'''Characters involved:''' Avery Obtainia, Lynnhera

}}

== The Reign of Magni ==

Book XIV — After Angelos’ Retribution; Book XIII is not specified in the notes

Important marriages and succession trials establish the next generation of district leaders.

{{Collapse
|title=Events and side stories
|content=
=== The Marriage Arc ===

'''Event type:''' Alliance

Planned weddings include Avery and Lux, and Teddric and Jane. Kaden’s partner and other pairings are left unspecified.

'''Characters involved:''' Avery Obtainia, Lux Luces, Teddric Tech, Jane Tee, Kaden Icelander

=== The Magni Trials ===

'''Event type:''' Discovery

Ultimus Deus candidates compete to succeed the current Magni, and the districts’ new leaders are declared.

'''Related events:''' [[#new-regnum|New Regnum — Next generation: twelve years later]]

}}

== Inheritance ==

Book XV — Twelve years later

Robin Obtainia and Ava Icelander become the focus as a new generation begins its journey at Regnum.

{{Collapse
|title=Events and side stories
|content=
=== New Regnum ===

'''Event type:''' Discovery

Robin and Ava enroll in Regnum Academy’s middle school with new friends. Games, competition, and the start of cultivation give way to unexplained trouble.

'''Characters involved:''' Robin Obtainia, Ava Icelander

'''Location:''' Regnum Academy

}}

== Regnum Legends ==

Book XVI — The next generation’s academy years

A major Regnum competition seeks the seven students who will represent the school’s future.

{{Collapse
|title=Events and side stories
|content=
=== The Next Mystical Legends ===

'''Event type:''' Discovery

Regnum Academy holds a grand competition to choose its next seven bright stars.

'''Location:''' Regnum Academy

}}

== Fractured Reality ==

Book XVII — As global magic continues to increase

Shadow gates and immortal demons force the heroes to seek Seal Rings capable of altering space and reality.

{{Collapse
|title=Events and side stories
|content=
=== Chaos Emergence ===

'''Event type:''' Discovery

The balance between creation and destruction comes into focus, alongside the Demon Lord’s past and the mysterious scepter known as the Judger.

=== The Shadow Gates ===

'''Event type:''' Magic

Rising magic allows the shadow and physical realms to connect through gates. Magical defenders are tasked with containing beasts whose strength depends on each gate’s intensity.

'''Location:''' Earth / shadow realm

=== The Demon Threat ===

'''Event type:''' Conflict

High-ranking immortal demonic beings in the shadow realm seek entry into Earth, with strength described as rank ten or higher.

=== Seal Hunt and Activation ===

'''Event type:''' Magic

The heroes seek Seal Rings and their wielders to bend space and reality against the demons. The Augment Ring is identified as particularly important.

'''Related events:''' [[#the-heirs-of-gods|The Heirs of Gods — Seal Activation continues]]

}}

== From That Day ==

Book XVIII — The final outlined demon war

Despite the Seal Rings, twelve demons emerge on Earth, prompting the Mystical Legends and their allies to pursue Celestius Deus and prepare for a final war.

{{Collapse
|title=Events and side stories
|content=
=== The Heirs of Gods ===

'''Event type:''' Magic

Seal Activation continues, and the truth of the zodiac pagoda array is revealed and put to use.

=== The Twelve Demons Emerge ===

'''Event type:''' Conflict

The group’s defense ultimately fails and all twelve demons establish themselves on Earth. Avery and his allies continue cultivating toward Celestius Deus, a previously unknown tier rumored to grant immortality.

'''Characters involved:''' Avery Obtainia

'''Location:''' Earth

=== Demon War Finale ===

'''Event type:''' Conflict

The demons’ pursuit of immortality and its cost are unveiled. Deities, the Mystical Legends, and their allies join a final offensive into demon-held territory with the world’s survival at stake. The notes do not specify the final outcome.

'''Related events:''' [[#the-immortal-hunts|The Immortal Hunts — Tentative continuation: a few months later]]

}}

== Immortal Hunts ==

Book XIX — Tentative Continuation — Possible future; a few months after the demon war

Tentative: normalized gates become resources while public fear of the heroes’ immortal power fractures their lives and shifts the focus to Robin and Ava.

{{Collapse
|title=Events and side stories
|content=
=== The Immortal Hunts ===

'''Event type:''' Conflict

Gates serve as sources of cultivation, materials, and training. News of the group’s immortal ascension raises fears of their world-shaking power, beginning the immortal hunts; some companions are corrupted by power.

=== The Families Left Behind ===

'''Event type:''' Alliance

Avery leaves to protect his family, and the story turns to Robin and Ava after their parents depart. The immortals ultimately pledge to defend the world independently of any single group, with Avery and Kaden retaining their Magni titles beyond District 7.

'''Characters involved:''' Avery Obtainia, Kaden Icelander, Robin Obtainia, Ava Icelander

}}

== Subzero ==

Book XX — Tentative Continuation — Possible future; Robin and Ava’s teenage years

Tentative: stronger shadow creatures and a catastrophic sea threat draw Robin and Ava into expeditions to the world’s coldest regions.

{{Collapse
|title=Events and side stories
|content=
=== The Sea Creature Threat ===

'''Event type:''' Conflict

Shadow monsters become stronger and influence other creatures beyond Tier 8. A massive sea creature rises to threaten catastrophic destruction, prompting a task force.

'''Characters involved:''' Robin Obtainia, Ava Icelander

=== The Subzero Expedition ===

'''Event type:''' Discovery

With magic commonplace and peace fragile, exploration reaches remote frozen regions. Teenage Robin and Ava sneak into an exclusive expedition team in search of adventure.

'''Characters involved:''' Robin Obtainia, Ava Icelander

}}

== Deep Space ==

Book XXI — Tentative Continuation — Possible future; decades later

Tentative: an era of magical technology and international peace opens the way to interstellar exploration and settlement.

{{Collapse
|title=Events and side stories
|content=
=== Magic Beyond Earth ===

'''Event type:''' Magic

Countries and districts retain their governments under an aligned peace agreement. Advances led by IT use magic to overcome gravity, mass, and the limits of space travel, developing faster-than-light devices and wormholes.

=== Galactic Settlement ===

'''Event type:''' Discovery

Humanity spreads across hundreds of celestial bodies. Advanced cultivation and magic support life beyond Earth, including survival in space.
