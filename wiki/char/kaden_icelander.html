Kaden Icelander is one of the main characters in the series Mystical Legends. He is an [[fandom:Icelorian]] who was born into a rich family. His father, Ioward, founded IT, where Kaden leads research projects before becoming Acting CEO during Initialization. Though he is powerful and influential, Kaden was really pushed to do better when he met an equal competitor.

|tab=Overview

== Overview ==
Kaden is a tall handsome guy who is loved by all who know of his great deeds and works, especially girls. He has dark intimidating blue eyes with extreme power. He usually walks about wearing a suit because he himself believes that it is professional. He also has a golden IT badge that he wears on his chest that signifies his importance and position in the IT workforce. Kaden has messy white hair that he often lets run wild as it is his personal Asian look.
== Personality ==
Kaden combines quick deduction with showmanship. He presents himself as relaxed, but controls the information he shares and often turns a conversation into a test of other people's thinking. His confidence can become arrogance: he assumes he can manage opponents and dismisses practical objections when they interfere with his plans.

His friendship with Avery gives him both a competitor and a recruit. He values people who adapt and reason independently, and he can acknowledge collective success after losing the flag competition. His treatment of Lucy and Avery during I.T.E.R.'s combat trials also exposes the danger of prioritizing a project's performance over the safety of his friends. His ambition is productive, but the books repeatedly give others reasons to challenge his methods.

== Mystical Rank and Heritage ==
Born as a royal, Kaden Icelander was the prince of District 1 long before he became a powerful business owner. With strong inheritance, Kaden obtained powers beyond what is typically known of Mystical Beings, the main part being from his ancestor [[fandom:Ion Mustard]].

Later, when he decides to recapture District 1, he becomes the leader of the war effort, and later, the [[fandom:Ultimus Rex|Magni]] of the district.

=== Magic Rank Progression ===
Kaden is recorded as '''Tier 4, Level 1''' in his I.T.E.R. Chronicles, Initialization backstory, and '''Tier 4, Level 2''' during Rune of the Spellcaster.

{{Spoiler|His rank reaches '''Tier 5, Level 1''' in I.T.E.R. Chronicles, Liberation. The notes identify him as the '''True Demon King''' and '''God of Space''', associated with Shadow among the Gods of the Prime Elements.}}
== Tools and Equipment ==

=== Icelorian Rune ===

The Icelorian Rune, a ring, can alter into a long, bladed, bluish sword called the Goblin Sword. It is one of the legendary weapons of Icelorian heritage, said to have killed millions. It has no power on its own; however, when an Icelorian wields it, they can imbue their own powers into it. Kaden has imbued his own powers into the sword and trained to become the strongest swordsman of Mystical society. The sword becomes icier and brighter when Icelorian magic is flowed into it, thus giving the sword the properties of ice.

=== IT ===

Being a rich royal who earned his money through his intelligence, Kaden Icelander has the entire arsenal of IT equipment, weaponry, vehicles, and locations which he can utilize for his use. Rockets? He's got a satellite he can call. Car? He's got a garage full of custom auto-driving vehicles at his disposal. His IT facilities scattered around the globe also do intensive research to create the best and updated technologies.



== Early History ==
Kaden is an Icelorian prodigy whose academy life and corporate responsibilities overlap. Book 1 introduces him as a powerful IT representative rather than its CEO. Initialization develops his role from influential project leader to Acting CEO, while his desire to recover what he and his father lost supplies a more personal motive beneath his public achievements.

== Early Magic Rank & Heritage ==
Book 2 opens with Kaden identifying himself as '''Tier 4, Magnus, Level 2'''. During the flag competition his displayed rank has advanced to '''Tier 4, Magnus, Level 3'''. These assessments precede the later Tier 5 progression recorded in the notes. His Icelorian inheritance supports strong ice magic, while the hereditary blade permits exceptional output at a substantial mana cost.

== Early Equipment ==
Kaden's Icelorian Sword, also called the Goblin Sword, is a hereditary artifact that can be concealed in ring form. Its release strengthens his ice attacks but strains his reserves. His ITA devices, vehicles, security systems, and tower AI extend his practical reach beyond personal combat. I.T.E.R. is the product of a team he directs, rather than a conventional familiar or a skill he casts.

|tab=Synopsis

== Synopsis ==

=== The Rune of the Spellcaster ===

==== The Mainland Investigation ====

Kaden meets Avery and River outside IT Tower and recognizes their Mystical nature. He warns them of danger and later intervenes against a Hand of Doom, showing that his casual manner conceals substantial intelligence and combat ability. At the ATLAS meeting, he participates in the investigation of the incidents while retaining information for his own purposes. Lucy assists his work with transport records and intelligence.

==== Charlotte's Rescue and Pyrus Bourn ====

Kaden organizes a party to rescue Charlotte from District 3 despite the political risks of a direct invasion. He assigns a diversion and an infiltration team, uses IT equipment to coordinate the effort, and fights Ellie with River's assistance. Once Pyrus escapes with Avery, he tracks the pursuit and confronts the newly awakened villain.

Using the Goblin Sword allows Kaden to suppress powerful inferno attacks, including with Absolute Zero, but its consumption and physical toll leave him unable to finish the battle. Pyrus overcomes him before Atlas and Charlotte intervene. The encounter demonstrates that Kaden's prodigy status does not place him above experienced or newly transformed threats.

=== I.T.E.R. Chronicles — Initialization ===

==== Competition and Public Recruitment ====

Kaden joins the freshmen's cohort challenge and fights alongside Avery against Elmor. He subsequently competes for Team 20 in the flag game, facing Avery while the wider field changes around them. River and Jane's flag captures give Team 44 the victory despite his strength, and Kaden acknowledges that he cannot accomplish everything alone.

At the awards ceremony he announces an expanded IT Agency recruitment effort and uses the memory of the Pyrus incident to frame its need. His deliberately theatrical presentation emphasizes both genuine security concerns and his skill at managing public attention.

==== Acting CEO and I.T.E.R. ====

Kaden recruits Avery after a practical interview, exposes him to the robot project, and then petitions IT's board for authority to remove the company's leadership bottleneck during his father's absence. He secures a six-month probationary appointment as Acting CEO and reorganizes the company around cooperation between departments. Lucy remains his secretary and leads Intelligence, while Amos adds Task Force leadership to his engineering duties.

The robot's trials injure Lucy and Avery, prompting staff objections over safety. Kaden nevertheless sees its adaptive combat as proof of the project's success. Installing its central system produces a speaking I.T.E.R. capable of reasoning, assisting with work, and expressing loyalty. At the volume's end, Kaden views it as another important asset in his plan to reclaim his lost district; that campaign has not yet been completed.

|tab=Powers & Abilities

== Powers & Abilities ==

== Established Abilities ==

=== Ice Constructs and Mobility ===

Kaden produces blades, barriers, chains, projectiles, and large ice formations. Ice Travel lets him reposition and transport equipment. In the flag contest he forms a frozen falcon, using height and ranged attacks to pressure Avery. These are magical constructs and techniques; the falcon in that scene should not be confused with Atlas's familiar.

=== Icelorian Sword and Absolute Zero ===

The hereditary blade's cold can arrest Pyrus's inferno attacks and damage his weapon. It also consumes Kaden's mana rapidly. His defeat in Book 1 and exhaustion during the flag contest show that using it has an operational limit.

=== Technical and Strategic Abilities ===

Kaden builds on IT's existing infrastructure to direct research, recruit personnel, and develop I.T.E.R. He argues for a phased corporate transition and incentives to win the board's vote. These achievements depend on engineering staff, materials, testing, and organizational authority as well as his own intellect.

|tab=Relationships

== Relationships ==

=== Avery Obtainia ===

[[char/avery_obtainia|Avery]] interests Kaden because he has unusual potential and can respond independently under pressure. Their bond develops through rescue, rivalry, recruitment, and mutual exposure to danger. Kaden grants Avery opportunities while making it clear that IT will continue monitoring him.

=== Lucy Terner and Amos Black ===

[[char/lucy_terner|Lucy]] and [[char/amos_black|Amos]] are friends from before his latest promotion as well as employees. Lucy challenges his decisions and handles his schedules; Amos manages engineering and practical security. Amos jokes that Lucy is Kaden's girlfriend, but Kaden explicitly denies that claim. The exchange should not be treated as confirmation of a relationship.

=== Ioward Icelander ===

Kaden's father founded IT and is absent from its active leadership during Book 2. Kaden invokes their shared vision when seeking the CEO position. His desire to recover their lost district gives the corporate and technological developments a personal direction.

=== Charlotte Levy ===

[[char/charlotte_levy|Charlotte]] is a mentor whose abduction prompts Kaden's rescue effort. Their established acquaintance also connects him to Blue Legion, although she still imposes cohort responsibilities rather than exempting him from work.
