'''Avery M. Obtainia-Reeyn''', commonly known as '''Avery Obtainia''', is the main protagonist of '''Mystical Legends''' and a member of the [[mystical_legends|Mystical Legends]]. An [[fandom:Angelor|Angelor]] raised in New York without knowledge of his origins, he enters the Mystical world with little magical strength and no understanding of the society to which he belongs. His discovery of the '''Rune of the Spellcaster''' connects him to his mother, [[char/caela_obtainia|Caela Obtainia]], and to the history of the [[fandom:Mystical Island|Mystical Island]].

Avery becomes a student at [[fandom:Regnum Academy|Regnum Academy]], a member of the [[fandom:Tempest Aquia|Tempest Aquia]] Cohort, and an intern at the [[IT|IT Agency]]. His fighting style combines agility learned through years of survival with Light magic, healing, and the Regnum Spei of '''Compression'''. Although his unusual inheritance gives him considerable potential, his progress depends on training, experimentation, and the help of companions who are often much stronger than he is.

His experiences of poverty and discrimination shape his desire to protect others and challenge the divisions between nobles, commoners, and demihumans. Together with his friends, he pursues the ideal of becoming a Mystical Legend through actions that improve the lives of others.

|tab=Overview

== Background and Heritage ==

Avery is the son of [[char/caela_obtainia|Caela Obtainia]], an Angelor connected to the founding history of the Mystical Island and the office of District 7’s Magni Mage. The family history recorded in the author’s notes places him with Caela before the age of seven, when his magic has not yet developed. Attacks by the shadow cult make it unsafe for him to remain with her. The cult’s pursuit is connected to the destruction orb, and Caela is not yet powerful enough to dismiss the danger. During this period, Avery’s proximity allows her briefly to draw on the Rune of the Spellcaster, despite her inability to resonate with it normally. She eventually takes him to an orphanage in New York to conceal his identity and seals his early memories, leaving him with the impression that he has always lived there.

The history Avery remembers at the opening of the series is consequently incomplete. He knows an orphanage, escape into poverty, and several years spent stealing food and begging, but has no useful understanding of his parents or the circumstances that separated them. Basic instruction from the orphanage is followed by self-education through libraries and public resources. His survival depends on observing other people, finding food, and evading pursuit, rather than on an adult who consistently provides for him. He eventually obtains shelter with the Alexanders in exchange for manual work, although their arrangement leaves education, food, and entertainment largely his own responsibility and excludes him from their family’s affairs.

Entering OSNYC gives Avery the first explanation for abilities and characteristics he did not know he possessed. His assessment identifies him as an Angelor with Light affinity, but his low magical output and lack of visible wings initially make the designation difficult to understand. The rune, the Sky House, and visions associated with the orb gradually connect his new life with Caela’s past. The notes describe fragments of his sealed memories returning during later moments at Regnum. His subsequent discovery that he can breathe underwater further complicates the identity he has only recently learned to accept, introducing his Water Spirit nature and the spiritual development connected with Lynnhera. Family, species, and the artifact’s response remain overlapping questions rather than a single revelation that immediately explains his life.

== Personality ==

=== Independence and Curiosity ===

Avery is cautious, observant, and accustomed to solving problems without dependable adult support. His early life teaches him to look for exits, judge the intentions of strangers, and conceal information when he believes it may be used against him. Even after finding a more secure home, he remains attentive to the possibility that an apparent opportunity may carry obligations he does not yet understand. This caution coexists with persistent curiosity. Rather than accepting magic as self-explanatory, Avery asks how it works, what its limits are, and why one technique succeeds where another fails. He repeatedly relates magical phenomena to physics, bodily movement, and the behavior of materials. His questions can make him appear inexperienced beside students raised in Mystical households, but they also lead him to experiment with applications that others take for granted.

He is capable of acknowledging his ignorance. At the beginning of his education, he relies on Ted to explain matters as basic as the existence of Mystical Beings. Later, he asks Lux for direct tutoring and accepts that his command of magic remains incomplete despite his rapid growth. His technical interests extend to science, computing, website development, and some game development. His independence is also expressed through thrift and practical ingenuity. Before entering school, he builds a makeshift home from a refrigerator box and salvaged furnishings, powers a light with a small garden-light solar panel, and keeps a discarded phone charged through public facilities. These arrangements are modest and unreliable, but they allow him to maintain a routine and obtain information without a household supporting him. Libraries and other free resources become substitutes for an education he cannot afford. He is therefore quick to appreciate the usefulness of a device or a new application of magic, even while remaining skeptical of the status and wealth surrounding it.

Avery’s resourcefulness does not make formal study effortless. At Regnum, he discovers that recognizing an answer when a teacher explains it is different from producing a complete solution himself. Mathematics, language exercises, scientific reports, and prescribed combat footwork expose gaps that self-education has not filled. His response gradually becomes more deliberate: he compares methods, borrows supplementary material, asks classmates for explanations, and pays attention to consultation hours. He comes to accept help as part of learning rather than proof that he does not deserve his place at the academy.

=== Compassion and Sense of Justice ===

Avery is strongly protective of people he sees being mistreated. He helps River against bullies before he possesses enough magic to defend himself reliably, and his willingness to protect her continues when the danger becomes far greater than an ordinary school dispute. At Regnum, the contempt directed at demihumans turns his private concern for friends into opposition to the social hierarchy around them. His compassion frequently overrides convenience and personal safety. When he discovers kidnapped children during a cohort assignment, he refuses to leave them behind merely because their rescue is outside the task he was given. He also presses the Aquias to investigate when they initially doubt his account. He values evidence and practical intervention, but is unwilling to let authority alone determine whether a victim deserves help. Avery's ambitions are closely connected to this outlook. Becoming stronger is a means to protect others, uncover the truth about his family, and create a place where origin and species do not determine a person's opportunities. His conversations with River help give the idea of the Mystical Legends a shared purpose beyond personal fame.

Avery’s treatment of the kidnapped children is particularly personal. He heals an injured boy before questioning the survivors, uses the rune to cut their bindings, and reveals his concealed wings so they will recognize him as another demihuman. He discourages their formal gratitude and explains that he helped because he wanted to. When asking about their abduction, he recognizes that recalling it may be painful and tries to obtain useful information without treating their fear as an inconvenience. He also acknowledges that he has not saved everyone: the girl already taken away by Morphius remains missing, and freeing the others does not erase that failure.

His view of fairness develops through ordinary experiences as well as emergencies. The differences between students with private tutors, prepared school materials, and years of instruction become apparent when he, Ted, and River struggle with assignments their classmates find familiar. Avery does not respond by dismissing every well-prepared student as an enemy. He accepts Dorian’s and Celia’s assistance and Jane’s practical support, finding individual generosity within the same society whose hierarchy he resists. His opposition is directed toward mistreatment and exclusion, rather than a refusal to form friendships across differences in birth or wealth.

=== Insecurity and Responsibility ===

Avery is not consistently confident in his decisions. His desire to help can lead him into situations beyond his strength, and the consequences of the orb crisis leave him feeling responsible for damage he could not control. Ted's reassurance is important because it reminds him that rescuing Charlotte still mattered, even when the rescue also exposed the group to further danger. He often measures himself against companions such as Kaden and Atlas, whose experience makes the gap between potential and mastery impossible to ignore. Defeats, injuries, and failed techniques do not immediately erase his determination, but they force him to reconsider his approach. His improvement comes through adapting to these setbacks rather than winning every encounter. Avery is also reserved in matters of affection. He values close friendships and responds to kindness, yet can hesitate to interpret romantic attention directly. With Lux, his admiration for her ability and status initially makes him cautious about assuming that her closeness means more than friendship.

His humor often softens feelings he would rather not state directly. With Ted and the rest of Quad 44, he can trade teasing remarks, complain about work, and express skepticism without the guardedness of his earliest encounters. He enjoys rest and familiar routines, and the prospect of another urgent commission is not automatically exciting to him. Nevertheless, the notes describe a tendency to push himself for his friends even when his own instincts tell him a task is too difficult. Belonging gives him reasons to act, but it also makes it harder to withdraw when others are depending on him. With Lux, this insecurity becomes especially visible around money, status, and the meaning of her attention. He can analyze a magical problem more readily than decide whether he should send her a personal message. By the end of their Winter’s Dance outing, he begins making small choices that would previously have embarrassed him: telling her when he is leaving on a commission, responding warmly to her messages, and looking forward to choosing a place for lunch. His confidence grows through being welcomed rather than through suddenly losing his reserved nature.

== Appearance ==

Avery is a relatively short young man with shoulder-length golden hair, usually parted in the middle, and bright sapphire-pink eyes. His frame is lean but physically conditioned by years of running, climbing, and evading pursuers in New York. His ordinary appearance initially gives little indication of his Angelor heritage, since his wings have not yet emerged when he first learns of his species. He commonly wears a plain white polo with a loose collar, a dark red jacket, and dark gray trousers. After moving to the Mystical Island, he carries a backpack containing school supplies and his most valued belongings. At Regnum Academy, he wears the standard maroon sweater and gray trousers, while cohort assignments and his work at IT require their own uniforms and formal clothing.

After his awakening, Avery develops white wings. He usually conceals them with the rune, particularly when revealing his demihuman identity would draw unwanted attention. The golden Rune of the Spellcaster often hovers behind him like a halo, though he can move it to other positions or place it above his head. White markings around one eye become another distinguishing feature associated with his unusual power. His later transformations can turn his hair white and alter the nature of his body. His development as a true Angelor also includes a metamorphosis associated with butterfly-like wings.

His earliest clothing reflects the practical limits of life on the streets rather than a deliberate uniform. In New York, his once-white polo has turned gray, his jacket is worn, and his trousers have a hole at the knee from repeated scraping and climbing. Dirt and sweat obscure the striking features he notices when he examines himself in a discarded mirror. He washes his clothes in Central Park when he can, sometimes uses free-admission days at local gyms to bathe, and avoids drawing attention when washing outdoors at night. Clean clothes and the academy uniform consequently represent a substantial change in his circumstances: he has access to ordinary care and possessions that were once uncertain from day to day.

For the Winter’s Dance, Avery wears a white suit, a conspicuous departure from his everyday school and cohort clothing. The outfit remains a reminder of the evening afterwards, when his thoughts return to Lux and the plans they have begun making together. Across these appearances, the most recognizable features remain his golden hair, unusually colored eyes, white wings, and the floating rune. The different outfits accompany changes in where he belongs and what is expected of him, while the wings and artifact publicly distinguish him from an ordinary student.

== Magic Rank Progression ==

Avery begins at '''Tier 1: Commonus''', with magical output judged below average even though his physical strength is comparatively good. Contact with the Terracustodis leads to an awakening and advancement to '''Tier 2: Bonus, Level 3'''. By the period of early cohort selection, he is '''Tier 3: Altus, Level 1'''. Following his training and the I.T.E.R. trials, he reaches '''Tier 3: Altus, Level 3''', close to the threshold of Magnus. His increased mana strengthens his resonance with the rune and allows a wider sensory projection around his room. * '''Tier 4, Level 1''' — Aqua Revolution
* '''Tier 4, Level 3''' — Festival Saga
* '''Tier 5, Level 2''' — Red Showdown
* '''Tier 5, Level 3''' — Rogue God
* '''Tier 5, Level 3 – Tier 6, Level 1–Level 2''' — Interlude I
* '''Tier 7, Level 2''' — Shadow Dwelling

His rank does not give a complete account of his fighting ability. Mobility, magical control, the rune, and the suitability of a technique can help him challenge stronger opponents, but large differences in experience or power remain dangerous.

The stages of his early advancement occur under markedly different conditions. The Commonus assessment measures a boy who has only just learned that magic exists. Contact with the Terracustodis then produces a sudden awakening, while the later Altus stages follow repeated training, competitive combat, and the punishing assessment against I.T.E.R. The distinction matters because a surge in mana does not supply the same experience as mastering its use. Avery continues to encounter basic control problems after surviving battles that would seem impressive from outside, including the difficulty of keeping a laboratory apparatus at a steady magical output. The later ranks above are recorded in the author’s arc outline, rather than all being demonstrated in the currently available volume drafts. In that progression, his rise to Tier 7 places him within the ranking associated with eligibility for a Magni candidacy; it does not itself mean that he has already completed the later succession trial. The notes separately place his eventual appointment as District 7’s Magni Mage in the future storyline.

== Affiliations ==

=== Regnum Academy and Quad 44 ===

Avery's first stable community on the Mystical Island is Quad 44, shared with [[char/teddric_tech|Teddric Tech]], [[char/river_grantia|River]], and [[char/jane_tee|Jane Tee]]. The quad gives him both companions and a practical introduction to academy life. Their cooperation later extends to Team 44 during the flag competition. The quad’s common room becomes a setting for the kind of daily companionship Avery has lacked: shared meals, conversations about homework, arguments over plans, and friends noticing when he is worried or unusually happy. Its members do not all approach their work or the academy’s hierarchy in the same way. Jane’s preparation and familiarity with the institution can make her explanations frustratingly brief, while Ted’s confidence often exceeds his readiness. River offers quieter company and shares several of Avery’s educational disadvantages. Living and competing together requires them to turn these differences into cooperation.

Beyond Quad 44, Regnum supplies formal instruction and access to classmates whose upbringing has prepared them for the academy. Avery’s growing willingness to study with Dorian and Celia broadens his circle without replacing his closest friends. He remains a student with reports, course materials, deadlines, and incomplete foundations, even when outside incidents draw him into affairs of district importance.

=== Tempest Aquia ===

Atlas recruits Avery into Tempest Aquia after observing his unusual power during the confrontation with Elmor. Membership provides access to training, commissions, and the Aquia estate, but also places him under scrutiny. Atlas's interest in Avery's potential does not immediately overcome his prejudice against demihumans. His membership is initially uncomfortable because being chosen by Atlas does not secure acceptance from the rest of the cohort. During the gathering before the District 5 assignment, Avery is conscious of being the commoner among nobles and is regarded by some members as a stand-in with unusual powers rather than an equal colleague. Antaro and Flustra recognize him from the earlier mall confrontation, leaving that humiliating meeting attached to his new position. The shared uniform offers little protection against their assumptions about demihumans.

Assignments nevertheless give him opportunities to observe practices beyond classroom demonstrations. Alteria’s precision challenges his understanding of Compression, and Atlas’s command of water provides clues to his own unrecognized inheritance. The later journey below the sea begins as another task whose purpose is barely explained to him, but becomes the point at which he learns that his body has aquatic characteristics he never thought to test.

=== IT Agency ===

Kaden brings Avery into IT as an intern and gradually involves him in work surrounding I.T.E.R. His silver badge and ITA-Pad grant access and responsibilities beyond those expected of a new employee. The position gives him opportunities to learn, though his advancement also allows IT to supervise his unusual abilities closely. Avery enters the agency as both an eager learner and a subject of exceptional interest. He understands that badges and access reflect decisions made by the people overseeing him, not simply his own accomplishments. His work exposes him to the management of a major technological organization and to I.T.E.R. as a research project whose consequences extend into public security. The experience puts his scientific curiosity alongside the practical problem of what happens when a powerful invention leaves its intended use.

When the copied machines bring accusations against IT, his relationship with Kaden ceases to be only that of intern and superior. Remaining beside him exposes Avery to pursuit and allegations that official authority is willing to enforce. His decision to stay therefore gives his institutional affiliation a personal cost: the access that once promised opportunity also places him inside a crisis involving the council, stolen designs, and people willing to use that crisis for their own ends.

== Tools and Equipment ==

=== Rune of the Spellcaster ===

The '''Rune of the Spellcaster''' is Avery's principal artifact. Discovered in the Sky House in Weeping Woods, Central Park, the golden ring responds to him and can be controlled telepathically. He can make it hover, turn, move beside him, or fly toward a target. Standing on it gives him a means of aerial travel distinct from using his wings. The rune absorbs and releases Avery's magic, supporting more precise attacks and techniques that would otherwise be difficult to control. Its pocket space conceals his wings and initially holds the sealed earth orb. Its connection with that orb makes it a target for Pyrus and others seeking destructive power. Its response is selective. Lux recognizes the artifact's historical importance but cannot activate it with her own magic. Avery's resonance grows alongside his mana, and placing it above his head helps extend his awareness beyond the limits of ordinary sight.

Avery uses the rune as a tool for tasks that do not always call for a named spell. In the warehouse rescue, he sends it around the room to sever the hostages’ ropes while he attends to an injured child. Its ability to reveal or conceal his wings also lets him choose when to expose a stigmatized part of his identity. He conceals them while moving through hostile social settings, but deliberately shows them to the captives when doing so can reassure them. The artifact’s value is therefore practical, defensive, and social, in addition to the offensive power that makes it attractive to enemies. The notes identify the Rune of the Spellcaster with the '''Coronation Ring of Magnitude''' among the legendary Seal Rings. This later classification places it within the larger history of artifacts capable of affecting the conflict between realms. In his earliest use, however, Avery does not understand that wider role. Its response to his mana, its unusual storage space, and its developing sensory effects are discoveries made individually rather than functions he receives as a complete explanation upon finding it.

=== ITA-Pad and Silver Badge ===

IT provides Avery with an ITA-Pad for assignments, communications, and access to information relevant to his work. His silver badge marks his unusually rapid advancement within the agency. Avery initially questions whether skipping the ordinary bronze stage is a mistake, only to learn that the promotion is deliberate. These items represent institutional access rather than an inherent increase in magical rank. His employment duties and the expectations attached to the badge continue alongside his academy and cohort commitments. Access to IT technology adds to an existing habit of using whatever communication tools are available. His salvaged phone in New York is first useful for finding opportunities and public information; later devices connect him to cohort work, employment, and friends. These tools remain imperfect supports. During the warehouse rescue, he messages Atlas but receives no immediate reassurance or assistance, leaving him to protect the children while waiting. Possessing institutional equipment does not ensure that an institution will respond at the moment he needs it.

== Creation and Conception ==

In the author’s introduction to ''Beginning'', Avery is included among the central characters whose earliest concepts preceded the written Mystical Legends story. Kenneth Calhoun describes imagining the figures that became Avery, Ted, River, and Pyrus around the age of ten, drawing their adventures and making illustrated books before assigning them their eventual roles. The initial idea of superheroes confronting evil developed into a modern fantasy setting concerned with how a concealed magical population relates to the wider human world. Avery’s entry into that population provides the opening through which the reader discovers its schools, institutions, divisions, and history.

The 2019 short story ''Zenith Luces and the Journey of the Mystical Beings'' established an earlier cast and the historical basis for the later series, while Avery’s main story was rewritten through several versions before its current opening took shape. The author’s notes identify Nicole and Nahida from ''Genshin Impact'' and Luminous Valentine from ''That Time I Got Reincarnated as a Slime'' as reference points for his character. His associated imagery includes the dove, pomegranate, September’s theme of wisdom, Virgo, and sapphire. These are conception and design associations; they are separate from the in-story explanations for his species, magic, and spiritual bond.

== Synopsis ==

The early chronology follows the current Series drafts of ''Beginning'', ''Awakening'', ''Ascension in Rivalry'', ''Initialization'', ''Rectification'', and ''The Messengers’ Return''. Events beyond those drafts are identified as continuations from the author’s notes, which also record the later arc and rank progression.

=== New York ===

Avery survives as a young thief in New York, using speed and familiarity with the streets to obtain food and escape pursuit. After stealing an exceptionally valuable object, he is captured and confronted by the man connected with Oceanus Aquia. The encounter redirects his life toward education and an arrangement with the Alexanders. Three years later, Avery enters OSNYC, where he meets Ted. What he assumes is an ordinary school becomes his introduction to the existence of Mystical Beings. Ted explains the nature of magic and helps him negotiate his first encounters with a world for which he has no preparation. The school's assessment identifies Avery as an Angelor with Light affinity and Tier 1 magic. His physical strength exceeds his magical output, but the discovery raises more questions than it answers. He knows little about his parents and has none of the visible wings associated with his species.

Before this change, Avery’s daily routine revolves around obtaining enough food and avoiding the people who might take away his freedom. He times thefts around distracted vendors, uses alleys and intersections to lose pursuers, and keeps provisions in a refrigerator-box shelter fitted with discarded furniture and improvised lighting. He is capable of enjoying the challenge and savoring a particularly good loaf of bread, but those moments do not remove the insecurity beneath his resourcefulness. The charity event at ATLAS initially attracts him for the same practical reasons: he hopes to find clothes, food, or something useful, only to encounter contempt from a man unwilling to help the people the event supposedly serves.

Life with the Alexanders improves the reliability of his shelter without making him part of an affectionate household. His labor is the condition of the arrangement, and he is expected to manage food, education, and entertainment himself while staying out of their family’s affairs. By the time he approaches OSNYC, he wants a future beyond that narrow bargain. The entrance process consequently matters as more than a discovery of magical aptitude: it offers admission to an institution whose prestige and expense would ordinarily place it beyond his reach.

=== River and the Sky House ===

Avery intervenes when River is bullied and begins forming a friendship with her. His first attempts at healing reveal that his light can do more than illuminate an area or strike an opponent. The two seek refuge in Weeping Woods and discover the Sky House, a cabin tied to Caela Obtainia. Within this setting, Avery obtains the golden rune and experiences a vision of the past involving the sealing of an earth orb. The artifact is not merely a useful possession: it links him to people and events whose significance he cannot yet explain. Pyrus's search for the orb and a subsequent attack by a Hand of Doom place Avery and River in immediate danger. Avery continues trying to protect her despite being outmatched. Kaden intervenes, and the investigation brings the students to the attention of Oceanus and other authorities concerned with the cult and the missing orb.

The friendship develops in circumstances where neither child has much power to insist on fair treatment. Avery’s intervention on River’s behalf does not come from confidence that he can defeat everyone threatening her; it precedes any reliable command of his own magic. Their encounters in and around the woods place the practical need for shelter beside the larger mystery of the cabin. In finding the rune and glimpsing figures from an earlier period, Avery encounters evidence that his apparently isolated life is connected to the origins and conflicts of the Mystical community. The pursuit also forces him to depend on someone with abilities he cannot yet approach. Kaden’s intervention exposes the difference between Avery’s determination and an experienced young fighter’s command of magic. Once the authorities become involved, the incident can no longer be treated as an ordinary dispute between children. The missing orb, the cult’s attention, and the possibility of further attacks bring the students’ safety and future schooling into a wider discussion.

=== Arrival on the Mystical Island ===

Avery, Ted, and River travel to the Mystical Island and begin attending Regnum Academy in District 7, Lux Urbis. They join Jane Tee in Quad 44 and encounter a society whose magical achievements coexist with rigid class divisions. Avery's unfamiliarity extends to ordinary student life: dormitory customs, uniforms, school supplies, cohorts, and the responsibilities of living at the academy all require explanation. The annual lights celebration introduces him to the public authority of figures such as Atlas Aquia and Charlotte Levy. Their displays of power reinforce his desire to improve while making clear how far he remains from their level. When Atlas treats River with contempt, Avery tries to defend her. The confrontation exposes the gulf between his resolve and his strength, as well as the prejudice he will face once his own demihuman identity becomes visible.

During the voyage, Captain Levi’s accounts introduce the island’s heroes and history before Avery has seen the society they helped establish. His first view of the island combines wonder with questions about its mechanisms. He asks how the surrounding mist conceals the land and learns that the Sustination Orb regulates the protected region, making an Arctic location habitable and allowing non-Mystical travelers to pass without finding it. The harbor’s shops, technology, creatures, and crowds reveal an organized civilization rather than the hidden refuge he might have imagined. At the academy, Jane becomes part of his introduction to shared student life, and his growing circle gives him a place within that unfamiliar setting. Yet the first conveniences of arrival are followed by practical anxieties. Unlike classmates who have obtained supplies in advance, Avery must find books and clothing after enrollment and worries about falling behind. When he later attends ordinary lessons, the gap extends beyond materials to years of preparation he has not received.

=== Charlotte's Capture ===

Pyrus invades Regnum and abducts Charlotte, seeking information connected with the destruction orb. Avery joins an unauthorized rescue party led by Kaden rather than waiting for the situation to resolve through official channels. The group enters District 3 and attempts to recover the captive cohort captain. Avery helps open Charlotte's cell, but the rescue does not become a straightforward victory. Tom Nado's intervention forces him to retreat, and the threats surrounding the rune continue to draw Pyrus toward him. The episode strengthens Avery's willingness to risk himself for others while also showing that courage alone cannot compensate for limited preparation. His role in the rescue is significant without making him the equal of the much stronger people involved.

For Avery, the decision is difficult because abstaining would not necessarily keep his friends safe: several are already determined to go. The choice combines concern for Charlotte with the fear of abandoning people whose help he has needed himself. Entering another district also removes the reassurance that Regnum’s faculty will immediately intervene. The rescuers must navigate danger with the resources and information they can carry, while facing opponents who have already demonstrated that the school’s defenses can be breached. The successful release of a captive therefore remains entangled with consequences the students did not anticipate. Avery’s connection to the rune makes him a target in his own right, and the rescue becomes part of the sequence that brings the orb into Pyrus’s reach. Afterwards, the academy’s officials acknowledge the students’ courage while criticizing their recklessness. Avery is left to reconcile the conviction that Charlotte could not be abandoned with the realization that doing the right thing without sufficient preparation can expose many more people to danger.

=== The Orb Crisis and Awakening ===

Pyrus captures Avery and seizes the rune aboard a helicopter. The release of the orb leads to a disaster near the town hall, placing the surrounding city in danger. Avery's contact with the Terracustodis brings him into a vision in which an unidentified woman warns him about the cost of the power before him. His awakening increases the density and force of his light and brings forth his wings. Even with these changes, he cannot overcome Pyrus alone. Kaden also struggles against the villain's increased power before Atlas and Charlotte bring the confrontation under control. Afterwards, Avery is troubled by his part in the chain of events. Ted helps him confront that guilt without dismissing the danger or the value of rescuing Charlotte. His conversations with River turn their wish for a better future into a commitment to oppose injustice through their own actions.

Within the vision, the promise of power is presented alongside its cost, linking the immediate struggle to the larger uncertainty around Avery’s identity. When he returns to the crisis, his stronger light and newly emerged wings provide options he did not possess at the beginning of the rescue. They also make his status as a demihuman visible. The transformation is therefore a personal revelation as well as a combat advancement, and it changes how others classify him even while the emergency demands his attention. His recovery includes a discussion with Principal Taskah, Elmor, and Atlas about the artifact and the Terracustodis. Avery explains how he found the rune and describes his unusual experience of the orb. Demonstrating the condensation of a light sword helps the officials identify Compression as one of the Eight Forces, comparable to an aspect of Atlas’s own power. Taskah permits him to retain the user-restricted rune, and Avery discovers that channeling magic through it can hide his wings. The aftermath gives him a framework for several new abilities, but leaves both the woman in the vision and the full meaning of the rune unresolved.

=== Academic Adjustment ===

After the orb crisis, Avery hopes to experience a more ordinary period as a student, but everyday lessons reveal difficulties that surviving a major attack has not solved. Mathematics requires methods he does not recognize, and the language course expects knowledge of formal constructions that some classmates learned at home. He can understand a worked example without being able to reproduce the reasoning when the next arrangement changes. Science initially seems more promising because of his interest in practical problems and Ted’s enthusiasm for the equipment, yet their experiment comparing ordinary and magical heating becomes another lesson in precision. Avery’s attempts to regulate the conductive plate move from too little output to enough that the water starts steaming, and the group has to repeat the trial with smaller adjustments and closer attention to the readings.

Combat practice also challenges the assumption that his experience on the streets will translate directly into the academy’s requirements. Avery knows how to run, balance, and escape, but the instructor corrects his stance and the timing of his turn in a prescribed sequence. Watching classmates with less obvious speed move correctly makes the difference between improvisational survival and formal technique difficult to ignore. Meanwhile, the written work accumulates: calculations, language exercises, laboratory notes, and reports all demand sustained organization outside class.

Jane lends a supplementary booklet Avery did not realize he needed, while Dorian and Celia explain how they arrange mathematical work and mark sentences before translating them. Avery, Ted, and River begin studying with them rather than hiding how much they do not understand. In the library, mistakes are corrected through discussion, repeated examples, and explaining the reasoning aloud. They also discover the posted consultation hours they had not been using. Improvement remains gradual, but asking for help changes the experience from struggling privately against apparently obvious expectations to learning methods they can practice together.

=== Cohort Selection ===

Avery and his friends seek an early opportunity to join the academy's cohorts. Their encounter with second-year candidates and Elmor Locks becomes a test of whether their abilities can justify that ambition. Avery uses Compression to exploit an opening in Elmor's defense, drawing attention to a power that is unusual for a student at his level. Atlas recruits him into Tempest Aquia. The invitation offers training and recognition, but it is also motivated by the need to observe and understand his abilities. Avery enters the cohort knowing that talent has not removed the inequalities surrounding him. At the Aquia estate, Alteria tests his control. Her water penetrates his compressed Light barrier at a level of precision he cannot yet counter. Avery responds by adapting his offense with a concentrated Light attack, but Atlas ends the exchange before it escalates further. The encounter teaches Avery that density alone does not make a barrier flawless.

The selection draws him and his friends into competition with students who expect seniority to determine access. Their participation challenges the idea that first-year students should wait for an accepted opening, and the encounter with Elmor demands more than a declaration of ambition. Avery’s unusual manipulation of Light and Compression becomes a reason for established figures to watch him, although the attention does not amount to unconditional trust. Being exceptional can bring opportunity while also making him someone others wish to assess and control. Training at the estate quickly corrects any assumption that recruitment means his magic is already polished. Alteria explains that her water can move with a precision his apparently solid barrier does not match. The exchange exposes gaps in a construct he had judged by density and visible strength. Avery’s attempt to answer with a concentrated attack shows his readiness to improvise, but Atlas’s intervention also makes clear that the older siblings still control the terms and limits of the encounter.

=== The Flag Competition ===

Avery competes with Ted, River, and Jane as Team 44. Their success depends on combining their strengths and reading the wider field rather than treating the competition as a sequence of isolated duels. Avery faces Kaden directly and tests his growing command of Light and Compression against the prodigy's ice. Their rivalry does not result in Avery simply overpowering him. While their confrontation absorbs attention, Jane distracts the flag defenders and River secures the remaining flags. The team's victory reinforces the value of coordination over an individual's reputation. Team 44’s victory earns a prize pool of one thousand silver coins and the Tier 5 '''Mistywood Armor''', an artifact made from a durable, long-lived predatory plant. Avery immediately recognizes that the armor is better suited to Jane’s abilities than to his own and encourages her to keep it. The others agree to divide the money in a way that lets them obtain equipment for themselves. His response to a rare prize emphasizes usefulness to the team rather than possession for its own sake.

The competition also brings the group into public attention, a prospect Avery does not particularly seek. At the awards ceremony, Kaden announces the agency initiative through which he hopes to recruit capable people for threats beyond ordinary policing. The transition from a school contest to that announcement links the students’ achievements with opportunities outside the classroom. Avery’s later recruitment grows from this setting of rivalry, demonstrated potential, and Kaden’s expanding ambitions.

=== IT Internship ===

After passing Kaden's recruitment challenge, Avery begins working at IT. He gains access to the I.T.E.R. project and receives a silver badge, an advancement so rapid that he initially assumes an error has been made. Kaden confirms that the arrangement is intentional and supplies him with an ITA-Pad. The internship brings Avery into contact with a different kind of power: technology, research, institutional influence, and the ambitions of the people directing them. He benefits from the opportunity but must also negotiate the agency's interest in his unusual magic. His academy studies, cohort duties, and IT work begin to overlap. Rather than replacing one part of his life, the position adds another set of obligations and introduces him to problems whose consequences extend beyond the school.

The move into IT gives Avery a chance to see how research is organized by people whose influence extends beyond Regnum. His own interest in devices and scientific explanations makes the setting attractive, but his initial unfamiliarity remains evident. Badge levels, internal procedures, and the difference between a public company and the particular projects Kaden is directing must all be learned. Rapidly receiving access does not make him certain that he understands why it has been granted. The responsibilities also compete with the schedule of a student who is still catching up. Employment, cohort commissions, practical training, and written work do not conveniently arrive in separate phases. Avery’s experience of advancement is often an accumulation of tasks and expectations, followed by the need to rest, rather than an uninterrupted rise in confidence.

=== The Disappearances ===

During a Tempest Aquia assignment, Avery discovers imprisoned demihuman children and overhears evidence of a noble's dealings with Malum. He refuses to ignore what he has found, confronts a mist-wielding guard, and frees the captives. His response places the children's safety above the convenience of completing his commission without interference. He then presses Atlas and Alteria to investigate, despite their initial unwillingness to accept the full implications of his account. Recovered documents give the group evidence of an organized operation rather than an isolated incident. The discovery deepens Avery's understanding of the relationship between prejudice and exploitation. The treatment of demihumans is no longer only a matter of insults or unequal standing at school; it is connected to trafficking, forced labor, and political interests.

The warehouse reveals the violence behind the operation. Avery witnesses children being held for transfer, a noble abusing a captive, and Morphius removing a girl through mist. His confrontation does not end in the captor’s arrest: Morphius recognizes the possibility of stronger allies arriving and withdraws. Avery then turns from pursuit to the survivors, healing the injured boy and using the rune to free the others. With the noble gone and the removed girl still missing, the rescue remains incomplete even before he begins asking how long the trafficking has continued. The children describe raids on their homes, masked abductors, cages, and repeated transfers. Their account indicates an organized chain rather than a single hiding place. Avery promises to get them out and seeks backup while keeping close enough to protect them. The subsequent investigation recovers a ledger bearing the House of Thelio’s seal, recording payments that connect the operation with the elite. Those records give him and the Aquias a basis for challenging people who might otherwise dismiss a commoner’s accusation.

=== I.T.E.R. Trials ===

Avery participates in the assessment of I.T.E.R. by combining Light attacks, Compression, reinforced movement, and telekinesis. Rather than facing a stationary target, he must respond to a machine that adapts to the techniques used against it. Condensing a large quantity of mana into an Intense Light Searching Sphere produces a violent burst and blinding light on impact, but does not end the test. The robot continues pressing him, breaks defenses that would be useful against weaker attacks, and denies him the time needed to rely on another large release. Avery’s Light sword and barriers become parts of an increasingly improvised effort to remain in the fight.

When his position becomes untenable, he creates a field that lifts him and allows him to slide away with reduced friction. The maneuver gives him room and elevation, but I.T.E.R. follows with wall-assisted movement instead of leaving him safe above it. Avery suffers a serious injury before Kaden ends the encounter. Healing assists his recovery without changing the fact that his defenses, stamina, and judgment have been pushed beyond their reliable limits. The assessment demonstrates the force he can produce while exposing how much control and experience are still missing.

Back in his dorm, Avery notices a substantial increase in his mana reserves and a stronger flow through his body. He reaches Altus, Level 3, near the threshold of Magnus, releases his wings, and gathers magic into his hand to examine the change. The rune responds by drawing in the concentrated mana. When he places it above his head and closes his eyes, an aura extends his awareness through the room with unusual precision. Further concentration lets him faintly perceive Ted and Jane playing a board game and River reading beyond his own room. The experiment gives his advancement a sensory application distinct from the greater attack strength displayed during the test.

=== The I.T.E.R. Crisis ===

After the project’s successful awakening and the agency meeting, Avery’s internship work becomes more flexible, allowing him some welcome rest. He and Ted also consider how to use their flag-game winnings, with Jane recommending an auction as a way to obtain equipment beyond ordinary shop stock. The outing places them in a setting where artifacts are evaluated and traded for considerable sums, offering another view of the resources available to wealthier Mystical Beings. Their attempt to use a school reward for practical advancement is soon overshadowed by attacks involving copied I.T.E.R. machines.

The outbreak places Kaden and IT under suspicion, and the authorities’ response brings the conflict into IT Tower. Avery remains with Kaden as the accusation turns into pursuit, joining Lucy and Amos in the escape. Association with the accused now carries consequences even for people who previously knew them as friends or colleagues. For Avery, the internship’s access and opportunities become inseparable from a decision about trust: abandoning the situation would leave both his friend and the origin of the machines unresolved.

The continuation in the author’s notes takes the fugitives through forest between the districts and toward District 13’s black market. They must avoid former allies sent to capture them while tracing the copied machines to their source. In the planned factory investigation, Avery’s concern for missing demihumans converges with the attempt to clear Kaden: captives are being traded and forced to manufacture robot parts without understanding the full purpose of their work. The theft of the designs is therefore connected with exploitation and an effort to aggravate conflict between nobles and demihumans, rather than being an isolated act of industrial theft.

=== The Nuntios and Lux Luces ===

When the Nuntios return to Regnum as substitute teachers, Avery first meets Lux Luces during a late-night encounter near the kitchen. Her later role as his Magic 101 teacher places them in regular contact and gives her a chance to examine his unusual mana. The lesson emphasizes shaping and sustaining affinity-less mana as a foundation for elemental techniques, rather than judging ability solely by the size or brightness of a release. Avery’s rainbow-white manifestation draws her attention because ordinary affinity-less mana is white. She interprets the difference as a sign of an exceptional blessing, although Avery himself has no explanation for it.

Their private discussion turns toward his ancestry when Lux examines the Rune of the Spellcaster. She recognizes its historical association with Caela Obtainia and concludes that Avery’s ability to wield it connects him with the earlier Angelor. Avery can confirm that Caela is his mother, but admits how much of her history and his own circumstances remains unknown. Lux cannot activate the rune herself, reinforcing that their shared species does not make its response interchangeable. Avery asks for direct tutoring, and she agrees, creating an opportunity for instruction from someone whose knowledge reaches beyond the lessons he has received from classmates.

An accident during the Nuntios’ fishing outing places him in the lake and injures his wings. Lux retrieves him, treats the damage, and later visits him in the infirmary. His recovery is unusually fast, but she still warns him against flying before the injury has properly healed. The encounter makes their relationship practical as well as intellectual: she is someone who cares for him when a mistake has consequences, while Avery has to accept that developing stronger magic does not make his body free from harm.

=== The Duel and Kiara's Abduction ===

After Kiara Katzol and Imo Lordius arrive at Regnum, Avery helps welcome them into the group. Hostile nobles challenge the right of demihumans to attend the academy, and Avery accepts a duel to defend Kiara and River's standing. His opponent's greater experience forces him to improvise with Light constructs, mobility, and localized gravitational effects. During the match, Ted discovers that Kiara has been abducted outside the arena. Her escape and their testimony expose the conspiracy surrounding the confrontation. Professor Taskah intervenes and addresses the academy's treatment of commoners and demihumans. Avery's effort does not make the underlying prejudice disappear, but it gives his companions a public example of resistance and helps reinforce their place at Regnum.

The public contest becomes a distraction from violence occurring elsewhere. Avery’s concentration is occupied by an opponent whose stronger attacks demand careful timing, while the abductors exploit the surrounding activity to move against Kiara. Ted’s discovery and the effort to expose the kidnapping prevent the arena’s apparent rules from concealing the wider scheme. The danger to Kiara also makes the argument over demihumans’ place at school immediate: hostility voiced as a matter of entitlement can become organized physical coercion. Avery’s part in the duel continues the pattern of using an incomplete repertoire under pressure. Localized gravity and changes in position help create openings that raw force cannot provide, but injury and exhaustion remain real. Taskah’s subsequent intervention places responsibility on the academy as well as on the students who resisted. The planned changes to homeroom arrangements and the school’s relationship with noble influence grow out of that wider failure to protect its students.

=== Winter’s Dance ===

At Regnum’s Winter’s Dance, Lux chooses Avery as her partner and helps him follow the steps. Their conversation allows them to discuss his experiences and ambitions in a less formal setting than lessons about mana or the rune. Avery appreciates her attention, but remains cautious about interpreting the intimacy of dancing together, particularly given the difference between his uncertain background and her status. The evening begins to develop a personal relationship out of the earlier combination of shared ancestry, magical instruction, and concern after his injury.

Their interaction continues the following day rather than ending when the event is over. Avery and Lux spend time together, dance again, and begin making plans for another outing. Lux later keeps a small, unevenly made wooden bird beside her bed, supporting it with a folded handkerchief when it will not stand on its own. Their messages after returning home are similarly modest but meaningful: she thanks him for the day, he says he is glad they went, and she welcomes the prospect of seeing where he will take her next. Avery begins looking forward to having something personal to offer her rather than assuming her interest must be explained by his magic.

Back at Quad 44, Ted and Jane notice his happiness and tease him about it. Avery protests, but also checks on River, who did not attend the dance, and offers to listen when she is ready to talk. The next morning brings an urgent Tempest Aquia commission. Before leaving, he tells Lux he has been called away, a message he recognizes that he would previously have erased for lack of a reason to send it. Her concern and reminder of their plans leave him smiling as he prepares to follow Atlas into another uncertain assignment. The white suit hanging in his room becomes a reminder that he has something to return to besides the next task or threat.

=== Aqua Revolution ===

The closing chapter of ''The Messengers’ Return'' takes Avery on a special District 5 commission with Atlas and Alteria. The rest of Tempest Aquia is allowed to select assignments from a range of requests, but Atlas specifically chooses Avery for the task without immediately explaining why. The gathering also reminds Avery how precarious his standing remains within the cohort. Other members know him as a commoner and demihuman, and his unusual powers have not earned their unqualified trust. He follows the siblings despite expecting little information about what will be required of him.

Atlas brings the trio to the coast, where he and Alteria walk across the surface of the water. Avery follows on the rune, then watches them sink below the sea. Before he has decided how he could accompany them, Atlas’s telekinesis forces him underwater. Avery holds his breath until the involuntary need to inhale overcomes him, only to discover that drawing water into his lungs does not drown him. His vision steadies, he can breathe, and he joins the siblings on the sea floor. Atlas confirms that he expected Avery’s developing characteristics to allow this. The discovery gives Avery an immediate reason to reconsider his inheritance and the composite affinities associated with Compression.

The continuation in the author’s outline develops the commission into the Aqua Revolution conflict around Atalantia Aquia, District 5, and Mas Rellim. River’s estrangement and the Aquia family’s hidden dealings become part of the crisis, challenging the judgments Avery has heard directed at her. Atlas and Alteria must confront their own errors as they defend their kingdom. Avery’s aquatic characteristics permit him to enter that setting and participate, while the investigation broadens his understanding of the family to which both his friend and his cohort leadership belong.

=== Festival Saga and Red Showdown ===

The author’s continuation places Avery in a more demanding academy environment as the cohorts prepare for a festival of combat, runecrafting, alchemy, sports, and other competitions. This stage broadens the range of skills given public recognition and introduces stronger students who have passed earlier advancement challenges. Avery’s rank is outlined as Tier 4, Level 3 during the Festival Saga, but his practical situation remains less secure than that of many competitors. With no place of his own to stay during the summer, he reluctantly accepts work as a servant at the Aquia estate, where Alteria becomes the immediate focus of his duties.

The festival’s planned attack by the Hands of Doom turns a period of school rivalry into renewed evidence that the cult is active. Pyrus escapes imprisonment with outside assistance, and the struggle over the earth orb continues behind the public celebrations. The subsequent ''Red Showdown'' outline returns Avery and other students to New York as IT Agency interns supporting the Mystical Surveillance Units. It also places him and Ted under council assignments and involves the group in Billy’s efforts to lift morale through performances by Red Shred. These responsibilities take him beyond the original aim of simply learning enough magic to keep up with his classmates, while conflict among the districts makes even public cooperation difficult.

=== Divine Capture and Graduation ===

A group seeking to harness the deities captures Avery and Kiara. While its ritual can draw out powers connected with divine blessings, Avery presents a different problem: Lynnhera has become integrated with him. His captors turn their attention to his catalyst rather than treating him as an ordinary contractor. The conflict extends to District 1, where Kaden seeks to reclaim the ruined district. Avery's cleansing magic contributes to the effort with support from his companions. After the academy's final trials, the friends graduate and pursue separate paths to become stronger against the shadows. In the planned conflict, the effort to extract divine power treats the people connected to the deities as resources to be used. Avery’s integration with Lynnhera makes the attempted ritual especially dangerous because separating the power is no longer a matter of removing an external blessing. His captors’ interest in his catalyst connects their religious ambitions directly to his bodily survival. Kiara faces the same organization through a different kind of divine connection, placing the two friends within a shared danger without making their circumstances identical.

The later reclamation of District 1 gives Avery’s cleansing abilities a communal purpose. Kaden’s return is supported by the group rather than accomplished through Avery’s magic alone, and purification is part of making the ruined district inhabitable again. Graduation follows as a change in the friends’ roles: they leave the academy with high marks and decide to pursue separate opportunities for growth, while keeping the larger threat from the shadows as a common concern.

=== Shadow Dwelling ===

Lumen's proposed marriage alliance between Lux and Prince Aether places Avery in conflict with his own growing feelings. Alongside Kiara and Raymond, he investigates Aether's dealings and discovers evidence of an attempted seizure of District 12. The group defeats the men sent to stop them and rushes to the wedding. Aether's attack, intended for Lumen, kills Lux's mother. Avery joins Lux, Kiara, and Raymond in pursuing him, but even their combined strength is nearly overwhelmed. Lumen ultimately defeats Aether. In the aftermath, Avery and Lux recognize their mutual feelings, while Lumen acknowledges Avery as worthy of her. The two withdraw from the commotion for a quiet walk together.

The expanded notes give Aether’s plan a specific political aim: marriage to Lux would provide legitimacy within District 12, after which he intends to kill Lumen and retain Lux as a hostage. Avery’s suspicion must therefore develop into evidence rather than remain a reaction to a romantic rival. He, Kiara, and Raymond investigate meetings and covert activity, then encounter hired attackers who reveal the impending takeover. Their ability to defeat those men does not mean they can easily defeat the person directing them.

Aether is described in the expanded outline as a peak Tier 8 opponent, and the pursuit after the wedding ends with Avery, Lux, Kiara, and Raymond close to defeat despite fighting together. Lumen’s arrival is decisive. Aether is captured and imprisoned rather than killed, while Lux’s mother’s death leaves a cost the successful intervention cannot undo. Lumen’s gratitude and acknowledgment of Avery’s worth deepen the personal aftermath, but the notes retain hesitation between Avery and Lux about an open confession while the cult remains a threat. The quieter ending, in which they withdraw from the Nuntios’ questions for a walk, gives their mutual recognition room beside the political consequences.

=== Later Spiritual Development ===

Avery's bond with Lynnhera becomes both a source of strength and a danger to his independence. When she takes control and uses his power to manifest herself, his companions must intervene. Her subsequent identity as Morgen conceals her nature while Avery's own consciousness remains suppressed for a time. His eventual development includes True Transformation, further divine blessings, and Omnifusion's evolution into Time Manipulation. His later identity is associated with the God of Time. He also becomes Lux's familiar after her summoning ritual unexpectedly calls him through his pure magical body. These developments belong to the author’s later outline. Lynnhera’s guidance initially offers a way into histories and abilities Avery cannot reach on his own, including the journey toward Artiana, the Lady of the Lake, in ''The Faraway Paladin''. The same intimate connection later enables a profound loss of control. Lynnhera forces Avery into pure mana, absorbs it into her manifestation, and uses the spellcaster ring to reform her crown. His companions stop her, but that victory does not immediately restore him: she continues under the name Morgen and accepts supervision by those who defeated her.

The continuation has Avery regain consciousness only later, while still in Hera’s body. It separately plans his marriage to Lux and his eventual succession as District 7’s Magni Mage. His long-term identity as the God of Time and the evolution of Omnifusion belong to the broader culmination of this development. These endpoints should not be read backward as abilities or offices he already possesses during his first years at Regnum.
