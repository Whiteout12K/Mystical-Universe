Teddric Tech is a Metalor and one of the Mystical Legends. A member of the Dai-Battalion cohort, he works with machinery and metal, combining technical expertise with defensive magic.

|tab=Overview

== Background ==
Teddric belongs to Regnum Academy’s 1A homeroom and the Dai-Battalion cohort. His work with Tech Co. and IT connects his mechanical knowledge with his use of metal magic.

== Family ==
* [[Timothy Tech]] (father)
* [[Sarah Tech]] (mother)
* [[Miona Tech]] (sister)

== Trivia ==
* His inspirations include Itto and Ramiris.
* His animal motif is a groundhog; his fruit motif is an apple.
