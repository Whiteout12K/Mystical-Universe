<!doctype html>
<html lang="en">
<head>
  <link rel="icon" type="image/vnd.microsoft.icon" href="/favicon.ico">
  <link rel="icon" type="image/svg+xml" sizes="any" href="/images/website/icons/torch.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="120x120" href="/apple-touch-icon-120x120.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/images/website/icons/torch-apple-152.png">
  <link rel="apple-touch-icon" sizes="167x167" href="/images/website/icons/torch-apple-167.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/website/icons/torch-apple-180.png">



<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<link href="/css/bootstrap-min.css" rel="stylesheet">
<link rel="stylesheet" href="/css/home.css">
<link rel="stylesheet" href="/css/news.css">
<link rel="stylesheet" href="/css/mlg.css">
<script src="/js/bootstrap-bundle-min.js"></script>
<link rel="stylesheet" href="/css/mlg-c-viewer.css">

</head>

<body>
<div id="homeheader-placeholder"></div>
<div id="app"><div class="loading">Loading profile...</div></div>

<script>
const pathParts=location.pathname.split("/").filter(Boolean),params=new URLSearchParams(location.search);
let username=params.get("username")||pathParts.at(-1);
let characterDatabase={},accountStyleDatabase={},weaponDatabase={},accessoryDatabase={},artifactDatabase={},currentPlayerData={},cStatModule,equipmentStatModule,equipmentRules={};
const premiumNames={diamond_core:"Diamond Core",sr_star_lv_frag:"SR Star Lv. Fragments",ssr_star_lv_frag:"SSR Star Lv. Fragments",ur_star_lv_frag:"UR Star Lv. Fragments"};
const rarityClasses=["","c","un","r","sr","ssr","ur","lr"];
const rarityNames=["","C","UN","R","SR","SSR","UR","LR"];
const additionalStats=new Set(["gauge_gain","cooldown_red"]);
const percentStats=new Set(["crit_rate","crit_dmg","healing_rate","gauge_gain","cooldown_red"]);
const statOrder=["health","attack","defense","mana","mana_regen","stamina","stamina_regen","crit_rate","crit_dmg","speed","piercing","healing_rate","luck","gauge_gain","cooldown_red"];

async function loadJSON(path){
 try{const r=await fetch(path,{cache:"no-cache"});return r.ok?await r.json():{}}
 catch(e){console.error("JSON load failed:",path,e);return{}}
}
async function loadDatabases(){
 [characterDatabase,accountStyleDatabase,weaponDatabase,accessoryDatabase,artifactDatabase,equipmentRules,equipmentStatModule]=await Promise.all([
  loadJSON("/images/mlg-assets/data-character.json"),
  loadJSON("/images/mlg-assets/account-styles.json"),
  loadJSON("/images/mlg-assets/data-weapon.json"),
  loadJSON("/images/mlg-assets/data-accessory.json"),
  loadJSON("/images/mlg-assets/data-artifact.json"),
  loadJSON("/images/mlg-assets/equipment-rules.json"),
  import("/ml-game/apps/c-stat/equipment-stats.js")
 ])
}
async function loadCStat(){return cStatModule||(cStatModule=import("/ml-game/apps/c-stat/c-stat.js"))}
async function getCStats(key,views=["total","base","equipment","artifact"]){
 const m=await loadCStat(),r=await Promise.all(views.map(v=>m.getCharacterStats(username,key,v).catch(e=>({error:e?.message||"Could not calculate stats."}))));
 return Object.fromEntries(views.map((v,i)=>[v,r[i]]))
}

function getCharacterInfo(id){
 const k=`c${id}`,c=characterDatabase.characters;
 return characterDatabase[k]||c?.[k]||(Array.isArray(c)?c[id-1]:{})||{}
}
function getDatabaseItem(db,id,prefix){
 const k=`${prefix}${id}`;
 return db?.[k]||db?.items?.[k]||(Array.isArray(db)?db.find(x=>Number(x?.id??x?.artifact_id)===Number(id)):{})||{}
}
function normalizeAssetPath(path){
 if(path==null)return"";
 const v=String(path).trim();
 if(!v)return"";
 if(/^(https?:|data:|blob:)/.test(v))return v;
 return v.replace("/images/character_art/","/images/character-art/").startsWith("/")?v:`/${v}`
}
function getAccountStyleAsset(section,key){
 const s=accountStyleDatabase?.[section];
 return s&&Object.prototype.hasOwnProperty.call(s,key)?normalizeAssetPath(s[key]):""
}
const getAvatarImage=id=>getAccountStyleAsset("avatar",`img_${id}`);
const getAvatarFrame=id=>getAccountStyleAsset("avatar",`frame_${id}`);
const getBackgroundImage=id=>getAccountStyleAsset("background",`img_${id}`);
const imageAttrs=(loading="lazy",priority="low")=>` loading="${loading}" decoding="async" fetchpriority="${priority}"`;

async function loadProfile(){
 try{
  if(!username||username==="view.html")return showError("No Player","No username was provided.");
  const r=await fetch(`/api/user/${encodeURIComponent(username)}`,{cache:"no-cache"});
  if(!r.ok)return showError("Player Not Found","This profile does not exist.");
  const result=await r.json();
  currentPlayerData=result?.data&&typeof result.data==="object"?result.data:{};
  renderProfile(result?.username||username,currentPlayerData)
 }catch(e){console.error("Profile loading error:",e);showError("Connection Error","Could not load this profile.")}
}

function renderProfile(name,data){
 const owned=Array.isArray(data.c_owned)?data.c_owned.filter(Boolean).length:0;
 const achievements=Object.values(data.achievements||{}).filter(Boolean).length;
 const avatar=getAvatarImage(num(data.avatar,1)),frame=getAvatarFrame(num(data.avatar_frame,1)),bg=getBackgroundImage(num(data.bg,1));
 document.getElementById("app").innerHTML=`
 <main class="page">
  <section class="profile${bg?" profile-custom-background":""}"${bg?` style="background-image:url('${escapeAttribute(bg)}')"`:""}><div class="profile-content">
   <div class="avatar-wrap"><div class="avatar">
    ${avatar?`<img class="profile-avatar-image" src="${escapeAttribute(avatar)}" alt="${escapeAttribute(name)}"${imageAttrs("eager","high")} width="160" height="160" onerror="handleAvatarError(this)">`:`<span class="avatar-fallback-letter">${escapeHtml(name[0]?.toUpperCase())}</span>`}
    ${frame?`<img class="profile-avatar-frame" src="${escapeAttribute(frame)}" alt="" aria-hidden="true"${imageAttrs("eager","high")} width="160" height="160" onerror="this.style.display='none'">`:""}
   </div></div>
   <div class="profile-heading"><h1 class="username">${escapeHtml(name)}</h1><p class="subtitle">Mystical Legends Player Profile</p><div class="rank">Adventure Rank ${num(data.ar_level,1)}</div></div>
  </div></section>
  <section class="stats">${stat("Silver Coins",num(data.silver_coin))}${stat("Adventure Rank",num(data.ar_level,1))}${stat("Energy",num(data.energy))}${stat("Characters",owned)}${stat("Achievements",achievements)}${stat("Season Pass Lv.",num(data.season_pass_level,1))}</section>
  <div class="progress-panels">${createAdventure(data)}${createSeasonPass(data)}</div>
  ${createPremium(data)}${createCharacters(data)}${createAchievements(data)}${createSkillTree(data)}${createCharacterSystems(data)}${createFlags(data)}
 </main>`
}
function handleAvatarError(img){
 const a=img.parentElement;img.remove();
 if(a&&!a.querySelector(".avatar-fallback-letter")){
  const f=document.createElement("span");f.className="avatar-fallback-letter";f.textContent=username[0]?.toUpperCase()||"";a.prepend(f)
 }
}
const stat=(label,value)=>`<div class="stat"><div class="stat-label">${label}</div><div class="stat-value">${escapeHtml(value)}</div></div>`;

function createAdventure(data){
 const l=num(data.ar_level,1),x=num(data.ar_xp);
 return`<section class="section"><h2 class="section-title">Adventure Progress</h2>${progress("Adventure Rank XP",x,xpForRank(l))}${detail("Adventure Rank",l)}</section>`
}
function createSeasonPass(data){
 const l=num(data.season_pass_level,1),x=num(data.season_pass_xp);
 return`<section class="section"><h2 class="section-title">Season Pass</h2>${progress("Season Pass XP",x,xpForRank(l))}${detailGrid({Status:data.season_pass_owned?"Owned":"Not Owned",Level:l})}</section>`
}
function createPremium(data){
 const p=data.premium||{};
 return`<section class="section"><h2 class="section-title">Premium Treasury</h2><div class="grid">${Object.entries(premiumNames).map(([k,n])=>`<div class="item"><div class="item-name">${n}</div><div class="item-sub">${num(p[k])} owned</div></div>`).join("")}</div></section>`
}
function createCharacters(data){
 const owned=Array.isArray(data.c_owned)?data.c_owned:[],chars=owned.map((v,i)=>v?createCharacterTab(i+1,data):"").filter(Boolean);
 return`<section class="section character-collection"><h2 class="section-title">Character Collection ${chars.length?`<span class="badge">${chars.length} OWNED</span>`:""}</h2>${chars.length?`<div id="character-list" class="character-list">${chars.join("")}</div>`:`<div class="empty">No characters have been obtained yet.</div>`}</section>`
}
function createCharacterTab(id,data){
 const i=getCharacterInfo(id),p=data[`c${id}`]||{},name=i.name||p.name||`Character ${id}`,rarity=p.rarity??"",star=Math.max(0,Math.min(16,num(p.star_level))),ri=i.rarity_img||"",img=i.profile_image||"";
 return`<button type="button" class="character-tab" data-character-id="${id}" onclick="toggleCharacter(${id})"><div class="character-icon-wrap">${img?`<img class="character-icon" src="${escapeAttribute(img)}" alt="${escapeAttribute(name)}"${imageAttrs()} width="96" height="96" onerror="this.style.display='none'">`:`<span class="item-symbol"></span>`}</div><div class="character-tab-info"><div class="character-id character-star-level"><img class="character-star-image" src="/images/mlg-assets/Stars/Star-${star}.svg" alt="${star} Star Level" width="90" height="18" loading="lazy" decoding="async" onerror="this.style.display='none'"></div><div class="character-name">${escapeHtml(name)}</div>${rarity!==""?rarityHTML(rarity,ri):""}</div></button>`
}
function rarityHTML(rarity,img=""){
 const c=getRarityClass(rarity),n=getRarityName(rarity);
 return`<div class="character-rarity ${c}">${img?`<img src="${escapeAttribute(img)}" alt="${escapeAttribute(n)}"${imageAttrs()} onerror="this.style.display='none'">`:""}${escapeHtml(n)}</div>`
}

async function toggleCharacter(id){
 const list=document.getElementById("character-list");if(!list)return;
 const existing=list.querySelector(".character-details"),clicked=list.querySelector(`[data-character-id="${id}"]`);
 if(existing?.dataset.characterId==id){existing.remove();clicked?.classList.remove("active");return}
 existing?.remove();list.querySelectorAll(".character-tab.active").forEach(x=>x.classList.remove("active"));
 if(!clicked)return;
 const tabs=[...list.querySelectorAll(".character-tab")],idx=tabs.indexOf(clicked),top=clicked.offsetTop;
 let end=clicked;
 for(let i=idx+1;i<tabs.length&&tabs[i].offsetTop===top;i++)end=tabs[i];
 clicked.classList.add("active");
 end.insertAdjacentHTML("afterend",`<div class="character-details character-details-loading" data-character-id="${id}"><div class="loading">Loading character stats...</div></div>`);
 const placeholder=list.querySelector(`.character-details[data-character-id="${id}"]`);
 try{if(placeholder)placeholder.outerHTML=await createCharacterDetails(id,currentPlayerData,await getCStats(`c${id}`))}
 catch(e){console.error("Character stat loading error:",e);if(placeholder)placeholder.outerHTML=`<div class="character-details" data-character-id="${id}"><div class="error"><p>${escapeHtml(e?.message||"Could not load character stats.")}</p></div></div>`}
}

async function createCharacterDetails(id,data,cstats){
 const i=getCharacterInfo(id),p=data[`c${id}`]||{},name=i.name||p.name||`Character ${id}`,rarity=p.rarity??"",splash=i.splash_image||"",ri=i.rarity_img||"";
 const level=cstats?.total?.character?.level||p.level||1;
 return`<div class="character-details" data-character-id="${id}"><div class="character-details-top"><div class="character-splash-wrap">${splash?`<img class="character-splash" src="${escapeAttribute(splash)}" alt="${escapeAttribute(name)}"${imageAttrs()} width="320" height="320" onerror="this.style.display='none'">`:`<span class="item-symbol"></span>`}</div><div class="character-info"><div class="character-detail-heading"><h3 class="character-detail-name">${escapeHtml(name)}</h3>${rarity!==""?`<div class="character-detail-rarity ${getRarityClass(rarity)}">${ri?`<img src="${escapeAttribute(ri)}" alt="${escapeAttribute(getRarityName(rarity))}"${imageAttrs()} onerror="this.style.display='none'">`:""}${escapeHtml(getRarityName(rarity))}</div>`:""}</div><div class="character-detail-level">Level <strong>${level}</strong></div>${createCharacterMeta(getValues(i.species,p.species),getValues(i.role,p.role),getValues(i.affinity,p.affinity))}${createCharacterStats(cstats)}</div></div>${createEquipment(getCharacterEquipment(p))}</div>`
}
function createCharacterMeta(species,roles,affinities){
 const row=(label,items,type)=>items.length?`<div class="character-meta-block"><div class="character-meta-label">${label}</div><div class="character-meta-values">${createCharacterListItems(items,type)}</div></div>`:"";
 return`<div class="character-meta-section">${row("Species",species,"species")}${row("Role",roles,"role")}${row("Affinity",affinities,"affinity")}</div>`
}
function createCharacterListItems(items,type="normal"){
 if(!Array.isArray(items))return"";
 return items.map(v=>{
  const c=type==="species"?`species ${speciesClassName(v)}`:type==="affinity"?`affinity ${affinityClassName(v)}`:type==="element"?`element ${elementClassName(v)}`:"";
  const tag=type==="affinity"?"b":"span";
  return`<${tag} class="${c} character-list-item">${escapeHtml(v)}</${tag}>`
 }).join(" ")
}
const speciesClassName=v=>`species-${cleanClass(v)}`;
const elementClassName=v=>`element-${cleanClass(v)}`;
const affinityClassName=v=>cleanClass(v);
const cleanClass=v=>String(v).toLowerCase().replace(/[^a-z0-9]+/g,"");
function getValues(a,b){
 const v=Array.isArray(a)?a:a!=null&&a!==""?[a]:Array.isArray(b)?b:b!=null&&b!==""?[b]:[];
 return[...new Set(v.flat(Infinity).filter(x=>x!=null&&String(x).trim()).map(String))]
}
function getRarityClass(v){
 const n=Number(v);
 return Number.isFinite(n)?rarityClasses[n]||"":rarityClasses.includes(String(v).toLowerCase())?String(v).toLowerCase():""
}
function getRarityName(v){
 const n=Number(v);return Number.isFinite(n)?rarityNames[n]||String(v):String(v||"")
}
const getRarityBoxClass=v=>{const r=getRarityClass(v);return r?`rarity-${r}`:""};

function createCharacterStats(cstats){
 const groups=["total","base","equipment","artifact"].map(k=>cstats?.[k]?.character?.stats||{});
 const keys=[...new Set(groups.flatMap(Object.keys))];
 keys.sort((a,b)=>{
  const ai=statOrder.indexOf(a),bi=statOrder.indexOf(b);
  return ai<0&&bi<0?a.localeCompare(b):ai<0?1:bi<0?-1:ai-bi
 });
 if(!keys.length)return`<div class="empty">No character stats defined.</div>`;
 const normal=keys.filter(k=>!additionalStats.has(normalizeStatKey(k))),extra=keys.filter(k=>additionalStats.has(normalizeStatKey(k)));
 const [total,base,equipment,artifact]=groups;
 return`<div class="character-stats-heading"><span class="character-stats-heading-title">Stats</span><div class="character-stats-heading-legend"><span class="character-stats-legend-total">Total</span><span class="character-stats-legend-equipment">Main Equipment</span><span class="character-stats-legend-artifact">Artifact</span><span class="character-stats-legend-base">Base</span></div></div><div class="character-stats">${normal.map(k=>createStatRow(k,total,base,equipment,artifact)).join("")}</div>${extra.length?createAdditionalStats(extra,total,base,equipment,artifact):""}`
}
function createStatRow(key,total,base,equipment,artifact){
 return`<div class="character-stat"><span class="character-stat-name">${escapeHtml(getCharacterStatDisplayName(key))}</span><span class="character-stat-values"><span class="character-stat-current">${formatCharacterStat(key,total[key])}</span><span class="character-stat-equipment">${equipment[key]?`+${formatCharacterStat(key,equipment[key])}`:""}</span><span class="character-stat-artifact">${artifact[key]?`+${formatCharacterStat(key,artifact[key])}`:""}</span><span class="character-stat-base">(${formatCharacterStat(key,base[key])})</span></span></div>`
}
function createAdditionalStats(keys,total,base,equipment,artifact){
 return`<div class="character-additional-stats"><button type="button" class="character-additional-stats-button" onclick="toggleAdditionalStats(this)"><span>Additional Stats</span><span class="character-additional-stats-arrow">+</span></button><div class="character-additional-stats-content">${keys.map(k=>createStatRow(k,total,base,equipment,artifact)).join("")}</div></div>`
}
function toggleAdditionalStats(button){
 const box=button.parentElement,open=box.classList.toggle("open"),arrow=button.querySelector(".character-additional-stats-arrow");
 if(arrow)arrow.textContent=open?"−":"+"
}
const normalizeStatKey=v=>String(v||"").toLowerCase().trim().replace(/\s+/g,"_").replace(/-/g,"_");
function getCharacterStatDisplayName(name){
 const key=normalizeStatKey(name);
 return{
  mana_regen:"Mana Regen (MP/s)",mana_regeneration:"Mana Regen (MP/s)",mp_regen:"Mana Regen (MP/s)",
  mp_regeneration:"Mana Regen (MP/s)",stamina_regen:"Stamina Regen (p/s)",stamina_regeneration:"Stamina Regen (p/s)",
  stamina_recovery:"Stamina Regen (p/s)",gauge_gain:"EG Gain",cooldown_red:"CD Red"
 }[key]||pretty(name)
}
function formatCharacterStat(name,value){
 const key=normalizeStatKey(name);
 return`${formatStat(value)}${percentStats.has(key)?"%":""}`
}

function getCharacterEquipment(p){
 const s=p.equip||p.equipment||p.equipped||{};
 return{
  weapon:getEquipmentArray(s.weapon),accessory:getEquipmentArray(s.accessory),
  artifacts:[1,2,3,4].map(n=>getEquipmentArray(s[`artifact${n}`]))
 }
}
const getEquipmentArray=v=>Array.isArray(v)?v[0]||null:v&&typeof v==="object"?v:null;
function createEquipment(e){
 return`<div class="equipped-section"><div class="subsection-title">Equipped</div><div class="equipped-primary-row">${createEquipmentItem(e.weapon,"weapon")}${createEquipmentItem(e.accessory,"accessory")}</div><div class="equipped-artifact-row">${e.artifacts.map(v=>createEquipmentItem(v,"artifact")).join("")}</div></div>`
}
function createEquipmentItem(v,type){
 if(!v)return`<div class="equipped-item equipped-empty"><span class="equipped-name equipped-none">None Equipped</span></div>`;
 return type==="weapon"?createWeaponItem(v):type==="accessory"?createAccessoryItem(v):createArtifactItem(v)
}
function createEquipmentCard(p,type,db,prefix,imageKey,label){
 const id=p.id,i=getDatabaseItem(db,id,prefix),name=i.name||p.name||`Unknown ${label}`,rarity=p.rarity??i.rarity;
 const rc=getRarityClass(rarity),level=num(p.level,i.level||1),image=normalizeAssetPath(i[imageKey]||p[imageKey]||"");
 return`<div class="equipped-item equipped-display ${getRarityBoxClass(rarity)}"><div class="equipment-card"><div class="equipment-image-wrap">${image?`<img class="equipment-image" src="${escapeAttribute(image)}" alt="${escapeAttribute(name)}"${imageAttrs()} width="96" height="96" onerror="handleEquipmentImageError(this)">`:`<span class="item-symbol"></span>`}</div><div class="equipment-info"><div class="equipment-rarity-line"><span class="equipment-rarity ${rc}">${escapeHtml(getRarityName(rarity))}</span><span class="equipment-type ${rc}">${label}</span></div><div class="equipment-name">${escapeHtml(name)}</div><div class="equipment-level">Level <span>${level}</span></div>${createEquipmentMainStats(calculateEquipmentMainStats(i,level))}</div></div></div>`
}
function createWeaponItem(p){return createEquipmentCard(p,"weapon",weaponDatabase,"w","weapon_img","Weapon")}
function createAccessoryItem(p){return createEquipmentCard(p,"accessory",accessoryDatabase,"a","accessory_img","Accessory")}

function getArtifactPieceData(info,p,n){
 n=Number(n)||1;
 return{
  name:info?.[`piece_num_${n}_name`]||p?.[`piece_num_${n}_name`]||"",
  image:normalizeAssetPath(info?.[`piece_num_${n}_img`]||p?.[`piece_num_${n}_img`]||"")
 }
}
function createArtifactItem(p){
 const id=p.id,i=getDatabaseItem(artifactDatabase,id,"o"),name=i.name||p.name||"Unknown Artifact",rarity=p.rarity??i.rarity;
 const rc=getRarityClass(rarity),level=num(p.level,i.level||1),pieceNum=num(p.piece_num,1),piece=getArtifactPieceData(i,p,pieceNum);
 const pieceName=getArtifactPieceName(pieceNum),display=piece.name?`${pieceName}: ${piece.name}`:pieceName;
 const main=calculateArtifactMainStat(i,p,level),subs=calculateArtifactSubStats(p);
 return`<div class="equipped-item equipped-display artifact-display ${getRarityBoxClass(rarity)}"><div class="artifact-heading"><div class="artifact-image-wrap">${piece.image?`<img class="artifact-image" src="${escapeAttribute(piece.image)}" alt="${escapeAttribute(display)}"${imageAttrs()} width="64" height="64" onerror="handleEquipmentImageError(this)">`:`<span class="item-symbol"></span>`}</div><div class="artifact-heading-info"><div class="equipment-rarity-line"><span class="equipment-rarity ${rc}">${escapeHtml(getRarityName(rarity))}</span><span class="equipment-type ${rc}">Artifact</span></div><div class="artifact-name">${escapeHtml(name)}</div><div class="artifact-level">Level <span>${level}</span></div></div></div><div class="artifact-piece"><strong>${escapeHtml(display)}</strong></div>${main?`<div class="artifact-main-stat"><span class="artifact-stat-label">Main Stat</span><span class="artifact-stat-value"><span class="artifact-stat-name">${escapeHtml(getCharacterStatDisplayName(main.name))}</span>: ${formatGearStat(main.name,main.value,main.type)}</span></div>`:""}${subs.length?`<div class="artifact-sub-stats">${subs.map(s=>`<div class="artifact-sub-stat"><span>${escapeHtml(getCharacterStatDisplayName(s.name))}${createRollDots(s.rolls)}</span><strong>${formatGearStat(s.name,s.value,s.type)}</strong></div>`).join("")}</div>`:""}</div>`
}
function createRollDots(rolls){
 const n=Math.min(5,Math.max(0,Number(rolls)||0));return n?` <span class="artifact-roll-dots" aria-label="${n} rolls">${"• ".repeat(n).trim()}</span>`:""
}
function handleEquipmentImageError(img){
 img.style.display="none";const w=img.parentElement;
 if(w&&!w.querySelector(".item-symbol")){const f=document.createElement("span");f.className="item-symbol";w.appendChild(f)}
}
function calculateEquipmentMainStats(info,level){return equipmentStatModule.getEquipmentStatEntries(info,level)}
function createEquipmentMainStats(stats){
 return stats.length?`<div class="equipment-main-stats">${stats.map(s=>`<div class="equipment-main-stat"><span class="equipment-stat-name">${escapeHtml(pretty(s.name))}</span><span class="equipment-stat-value">: ${formatGearStat(s.name,s.value,s.type)}</span></div>`).join("")}</div>`:""
}
function calculateArtifactMainStat(info,p,level){return equipmentStatModule.getArtifactMainStat(info,p,level,equipmentRules.artifacts?.stat_scaling)}
function calculateArtifactSubStats(p){return equipmentStatModule.getArtifactSubStats(p,equipmentRules.artifacts?.stat_scaling)}
const getArtifactPieceName=n=>({1:"Headgear",2:"Chestplate",3:"Leggings",4:"Boots"})[Number(n)]||`Piece ${n}`;
function formatGearStat(name,value,type=""){
 const s=normalizeStatKey(name);return`+${formatStat(value)}${percentStats.has(s)||String(type).trim()==="%"?"%":""}`
}

function createAchievements(data){
 const e=Object.entries(data.achievements||{});if(!e.length)return"";
 const u=e.filter(([,v])=>v).length;
 return`<section class="section"><h2 class="section-title">Achievements <span class="badge">${u}/${e.length}</span></h2><div class="grid">${e.map(([k,v])=>`<div class="achievement ${v?"":"locked"}"><div class="achievement-symbol"></div><div><div class="item-name">${escapeHtml(pretty(k))}</div><div class="item-sub">${v?"Unlocked":"Locked"}</div></div></div>`).join("")}</div></section>`
}
function createSkillTree(data){
 const tree=Array.isArray(data.mc_skill_tree_unlock)?data.mc_skill_tree_unlock:[];if(!tree.length)return"";
 return`<section class="section"><h2 class="section-title">Main Character Skill Tree</h2><div class="details">${detail("Nodes / Entries",countNested(tree))}${detail("Unlocked Levels",countNumbers(tree))}</div><div class="grid" style="margin-top:10px">${tree.map((g,i)=>`<div class="item"><div class="item-symbol"></div><div class="item-name">Ability Branch ${i+1}</div><div class="item-sub">${countNumbers(g)} unlocked levels</div></div>`).join("")}</div></section>`
}
function createCharacterSystems(data){
 const keys={equipped:"c_equipped_skills",skill1:"c_skill1_owned",skill2:"c_skill2_owned",skill3:"c_skill3_owned",skill4:"c_skill4_owned",costumes:"c_costume_owned"};
 const c=Object.fromEntries(Object.entries(keys).map(([k,v])=>[k,Array.isArray(data[v])?data[v]:[]]));
 const values={
  equipped:countNested(c.equipped),skill1:countNumbers(c.skill1),skill2:countNumbers(c.skill2),
  skill3:countNumbers(c.skill3),skill4:countNumbers(c.skill4),costumes:countNumbers(c.costumes)
 };
 const ec=Array.isArray(data.c_costume_equipped)?data.c_costume_equipped.filter(v=>v!=null).length:0;
 if(!Object.values(values).some(Boolean))return"";
 return`<section class="section"><h2 class="section-title">Character Progression</h2><div class="details">${detail("Equipped Skills",values.equipped)}${detail("Basic Skills Owned",values.skill1)}${detail("Special Skills Owned",values.skill2)}${detail("Ultimate Skills Owned",values.skill3)}${detail("Technical Skills Owned",values.skill4)}${detail("Costumes Owned",values.costumes)}${detail("Equipped Costumes",ec)}</div></section>`
}
function createFlags(data){
 const e=Object.entries(data.flags||{});if(!e.length)return"";
 return`<section class="section"><h2 class="section-title">Milestones & Flags</h2><div class="details">${e.map(([k,v])=>detail(pretty(k),formatValue(v))).join("")}</div></section>`
}

const progress=(label,value,max)=>{
 value=Number(value)||0;max=Math.max(Number(max)||1,1);
 return`<div class="progress-container"><div class="progress-header"><span class="progress-label">${escapeHtml(label)}</span><span class="progress-value">${num(value)} / ${num(max)}</span></div><div class="progress"><div class="progress-bar" style="width:${Math.min(100,Math.max(0,value/max*100))}%"></div></div></div>`
};
const detail=(k,v)=>`<div class="detail"><span class="detail-key">${escapeHtml(k)}</span><span class="detail-value">${escapeHtml(v)}</span></div>`;
const detailGrid=o=>`<div class="details">${Object.entries(o).map(([k,v])=>detail(k,v)).join("")}</div>`;
const xpForRank=l=>Math.max(100,l*100);
function countNumbers(v){return Array.isArray(v)?v.reduce((t,x)=>t+countNumbers(x),0):typeof v==="number"&&v>0?v:0}
function countNested(v){return Array.isArray(v)?v.reduce((t,x)=>t+(Array.isArray(x)?countNested(x):1),0):0}
const pretty=v=>String(v).replaceAll("_"," ").replace(/\b\w/g,c=>c.toUpperCase());
function formatValue(v){return v===null?"None":typeof v==="object"?JSON.stringify(v):String(v)}
function formatStat(v){
 const n=Number(v);return Number.isFinite(n)?Number.isInteger(n)?n.toLocaleString():n.toLocaleString(undefined,{maximumFractionDigits:2}):String(v)
}
const num=(v,f=0)=>{const n=Number(v);return Number.isFinite(n)?n:f};
const escapeHtml=v=>String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
const escapeAttribute=escapeHtml;
const showError=(t,m)=>document.getElementById("app").innerHTML=`<div class="page"><div class="error"><h1>${escapeHtml(t)}</h1><p>${escapeHtml(m)}</p></div></div>`;

loadDatabases().then(loadProfile);
</script>
