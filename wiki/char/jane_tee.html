Jane Tee is a Regnum Academy student in the 1A homeroom and a member of Black Rampart. The current game roster identifies her as a Herbovir with an Earth affinity and an Agent role.

|tab=Overview

== Background ==
Jane attends the same 1A homeroom as Avery, Teddric, River, and Raymond. Her recorded magic rank is Tier 3, Level 1.

The notes identify Jane as a Herbovir in Black Rampart, matching the current game roster. An earlier 1A homeroom entry calls her a Nymph.
