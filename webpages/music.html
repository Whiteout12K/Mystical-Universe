<!doctype html>

<html lang="en">
<head>
  <link rel="apple-touch-icon" type="image/png" sizes="152x152" href="/images/website/icons/torch-apple-152.png">
  <link rel="apple-touch-icon" type="image/png" sizes="167x167" href="/images/website/icons/torch-apple-167.png">
  <link rel="apple-touch-icon" type="image/png" sizes="180x180" href="/images/website/icons/torch-apple-180.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="The groovy music and OST of the Mystical Legends Series and Game.">
  <meta name="keywords" content="Mystical Legends, Mystical, Legends, mystical universe, magical characters, angelor, elves, modern fantasy, mystical creatures">
  <title>Mystical Legends Music</title>
  <link rel="icon" href="../images/website/favicon.png" type="image/png">
  <link href="../css/bootstrap-min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/home.css">
  <link rel="stylesheet" href="../css/news.css">
  <link rel="stylesheet" href="../css/mlg.css">
  <link rel="stylesheet" href="../css/music.css">
  <script src="../js/bootstrap-bundle-min.js"></script>

  <style>
    /* =====================================================
       PLAY / PAUSE ICON
       ===================================================== */

    #play {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    #play img {
      width: 22px;
      height: 22px;
      object-fit: contain;
      display: block;
    }
    
  </style>

<link rel="canonical" href="https://mysticallegends.org/webpages/music.html">
<meta property="og:title" content="Mystical Legends Music">
<meta property="og:description" content="The groovy music and OST of the Mystical Legends Series and Game.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://mysticallegends.org/webpages/music.html">
<meta property="og:image" content="https://mysticallegends.org/images/website/main-bg.png">
<meta name="twitter:card" content="summary_large_image">
</head>

<body>

  <div id="subheader-placeholder"></div>
  <main class="music-page">

<section id="jukebox">

  <header class="music-header">
    <span class="music-header-line"></span>
    <p class="music-eyebrow">THE MYSTICAL LEGENDS ARCHIVES</p>
    <h1 class="title">Official Soundtrack</h1>
    <p class="music-subtitle">By Various Artists</p>
  </header>

  <div class="player">
    <span class="player-ornament-corner player-ornament-top-left" aria-hidden="true"></span>
    <span class="player-ornament-corner player-ornament-top-right" aria-hidden="true"></span>
    <span class="player-ornament-corner player-ornament-bottom-left" aria-hidden="true"></span>
    <span class="player-ornament-corner player-ornament-bottom-right" aria-hidden="true"></span>

    <div class="album-area">
      <div class="album-frame">
        <div class="album-inner">
          <img id="cover" src="../images/website/main-bg.png" alt="Mystical Legends soundtrack cover" width="1524" height="952" decoding="async">
        </div>
      </div>
    </div>

    <div class="song-info">
      <div id="song-title">Loading soundtrack…</div>
      <p id="song-artist"></p>
    </div>

    <audio id="audio" preload="metadata"></audio>

    <input type="range" id="progress-container" class="progress-container" min="0" max="100" step="0.1" value="0" aria-label="Song progress" disabled>

    <div class="time">
      <span id="current-time">0:00</span>
      <span id="duration">0:00</span>
    </div>

    <div class="controls">

      <button
        id="shuffle"
        type="button"
        aria-label="Shuffle" aria-pressed="false"
      >⇄</button>

      <button
        id="prev"
        type="button"
        aria-label="Previous song"
      >◁</button>

      <button
        id="play"
        type="button"
        aria-label="Play"
      >
        <img
          id="play-icon"
          src="/images/website/icons/play.png"
          alt=""
         width="63" height="84" decoding="async">
      </button>

      <button
        id="next"
        type="button"
        aria-label="Next song"
      >▷</button>

      <button
        id="repeat"
        type="button"
        aria-label="Repeat: off"
      >↺</button>

    </div>
    <p id="player-status" role="status" aria-live="polite">Loading soundtrack…</p>
    <button id="retry" type="button" hidden>Retry loading</button>

  </div>

  <div class="playlist-tools">
    <label for="playlist-search">Find a track</label>
    <input type="search" id="playlist-search" placeholder="Search title, artist, or album">
    <p id="playlist-count"></p>
  </div>
  <div class="playlist" id="playlist" aria-label="Soundtrack playlist"></div>

</section>

  </main>

  <script src="../js/music.js" defer></script>

  <script src="../js/include.js"></script>
  <script src="/js/home.js"></script>

  <div id="subfooter-placeholder"></div>

</body>
</html>
