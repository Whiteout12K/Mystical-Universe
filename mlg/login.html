<!DOCTYPE html>

<html>

<head>

    <meta charset="UTF-8">

    <title>Login</title>

</head>

<body>

    <h1>Login</h1>

    <form id="loginForm">

        <input
            id="username"
            placeholder="Username"
            required
        >

        <input
            id="password"
            placeholder="4 digit password"
            maxlength="4"
            inputmode="numeric"
            type="password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <p id="message"></p>


<script>

document
    .getElementById("loginForm")
    .addEventListener("submit", async event => {

        event.preventDefault();

        const username =
            document.getElementById("username").value;

        const password =
            document.getElementById("password").value;


        const response = await fetch(
            "/api/login",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    username,
                    password
                })
            }
        );


        const result =
            await response.json();


        if (response.ok) {

            window.location.href =
                "/dashboard";

        } else {

            document.getElementById(
                "message"
            ).textContent =
                result.error;

        }

    });

</script>

</body>

</html>
