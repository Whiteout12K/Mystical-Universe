<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="icon" href="/images/website/favicon.png" type="image/png">
<title>MLG Profile Card Collection</title>
<link href="/css/bootstrap-min.css" rel="stylesheet">
<link rel="stylesheet" href="/css/home.css">
<link rel="stylesheet" href="/css/news.css">
<link rel="stylesheet" href="/css/mlg.css">
<script src="/js/bootstrap-bundle-min.js"></script>

<style>
*{box-sizing:border-box}
:root{--gold:#d6aa45;--text:#f7edd9;--muted:#9e9488;--line:#d6aa453d;background:#190707}
html{margin:0;min-height:100%;scroll-behavior:auto;-webkit-text-size-adjust:100%;text-size-adjust:100%;background:radial-gradient(circle at 55% 0,#402026,#1a1316 31%,#0b0a0c 75%,#080809)}
body{margin:0;min-height:100vh;overflow-x:hidden;color:var(--text);font-family:Inter,Arial,sans-serif;background:transparent}
button,input{font:inherit}

/* APP */
.app{position:relative;width:100%;min-height:calc(100vh - var(--header-h,0px));display:grid;grid-template-columns:290px minmax(0,1fr)}
.sidebar{position:sticky;top:0;height:100vh;min-width:0;display:flex;flex-direction:column;overflow:hidden;z-index:50;background:linear-gradient(#261a1dfb,#0e0d0ffe);border-right:1px solid var(--line);box-shadow:14px 0 38px #0007}
.side-head{flex:none;padding:21px 17px 15px;border-bottom:1px solid var(--line)}
.brand{color:#f2d18a;font:900 1.22rem Georgia,serif;letter-spacing:.025em}
.brand small{display:block;margin-top:5px;color:var(--muted);font:700 .63rem Inter,Arial,sans-serif;letter-spacing:.15em;text-transform:uppercase}
.search-wrap{position:relative;margin-top:15px}
.search-wrap:before{content:"⌕";position:absolute;left:11px;top:50%;transform:translateY(-53%);color:#a98c59;font-size:1.3rem}
#card-search{width:100%;padding:10px 11px 10px 34px;outline:0;border:1px solid var(--line);border-radius:7px;background:#100e10;color:#eee;font-size:16px}
#card-search:focus{border-color:#b89049;box-shadow:0 0 0 2px #d6aa451f}
.library-meta{display:flex;justify-content:space-between;margin-top:10px;color:#968c80;font-size:.65rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase}

/* LIBRARY */
.card-list{--h:54px;flex:1;min-height:0;display:flex;flex-direction:column;gap:5px;padding:9px;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:#594438 transparent}
.card-list::-webkit-scrollbar{width:6px}.card-list::-webkit-scrollbar-thumb{background:#594438;border-radius:20px}.card-list::-webkit-scrollbar-thumb:hover{background:#806248}
.card-item{flex:0 0 var(--h);width:100%;min-width:0;height:var(--h);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 9px 8px 11px;border:1px solid transparent;border-radius:6px;background:#ffffff05;color:#e8dfd4;text-align:left;cursor:pointer;transition:.16s}
.card-item:hover{background:#211b1d;border-color:#d6aa452e;transform:translateX(2px)}
.card-item.active{background:linear-gradient(90deg,#70322d6b,#382a242b);border-color:#d6aa457a;box-shadow:inset 3px 0 var(--gold)}
.list-info{flex:1;min-width:0}
.list-name,.list-meta{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-name{color:#eee5d9;font:700 .8rem Georgia,serif}
.list-meta{margin-top:4px;color:#91877a;font-size:.57rem;font-weight:600}
.list-rarity{flex:none;min-width:32px;padding:3px 5px;border:1px solid #44392a;border-radius:3px;background:#0b0a0c;font-size:.55rem;font-weight:1000;text-align:center}
.no-results{padding:30px 10px;color:#81786e;text-align:center;font-size:.76rem}

/* RARITY COLORS */
.c{color:#bbb;border-color:#777}
.un{color:#8bd56c;border-color:#579b48}
.r{color:#78aaff;border-color:#477be2}
.sr{color:#c77cff;border-color:#9849d8}
.ssr{color:#ffd166;border-color:#d9972f}
.ur{color:#ff7575;border-color:#e93c48;text-shadow:0 0 7px #ff394c}
.lr{color:#fff0b8;border-color:#f5d879;text-shadow:0 0 5px #fff,0 0 10px #db8cff}

/* MAIN */
.main{position:relative;min-width:0;min-height:100vh}
.main:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.025;background:linear-gradient(45deg,#fff 1px,transparent 1px),linear-gradient(-45deg,#fff 1px,transparent 1px);background-size:20px 20px}
.stage{position:relative;width:100%;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:22px 24px 28px}

/* CONTROLS */
.topbar{position:relative;z-index:100;flex:none;width:min(500px,100%);height:38px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;color:#aaa095;font-size:.69rem}
#current-position{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-weight:700;letter-spacing:.04em;white-space:nowrap;text-align:center}
.mobile-menu{display:none;position:absolute;left:0;top:50%;transform:translateY(-50%)}
.nav-controls{position:absolute;right:0;top:50%;display:flex;gap:6px;transform:translateY(-50%)}
.icon-btn{width:34px;height:34px;padding:0;border:1px solid var(--line);border-radius:7px;background:#171316e8;color:#d9bd82;cursor:pointer;transition:.15s}
.icon-btn:hover{background:#292023;border-color:#a98849}
.icon-btn:disabled{opacity:.25;cursor:default}

/* CARD */
.card-area{position:relative;width:100%;height:min(650px,calc(100vh - 120px));min-height:620px;overflow:hidden;touch-action:pan-y}
.card-area.zoomed{cursor:grab;touch-action:none}.card-area.dragging{cursor:grabbing}
.card-shell{--view-scale:1;--pan-x:0px;--pan-y:0px;--b1:#65615e;--b2:#a7894c;--b3:#595450;--glow:#d2a54a21;position:absolute;left:50%;top:50%;width:430px;height:602px;transform:translate(-50%,-50%) translate(var(--pan-x),var(--pan-y)) scale(var(--view-scale));transform-origin:center;will-change:transform;filter:drop-shadow(0 20px 26px #0009)}
.card-shell:before,.card-shell:after{content:"";position:absolute;pointer-events:none}
.card-shell:before{inset:-8px;z-index:-2;border-radius:28px;background:linear-gradient(145deg,var(--b1),#181617 24%,var(--b2) 48%,#191718 73%,var(--b3));box-shadow:0 0 0 2px #060607,0 0 30px var(--glow)}
.card-shell:after{inset:-4px;z-index:-1;border:1px solid color-mix(in srgb,var(--b2) 65%,#fff);border-radius:25px;box-shadow:inset 0 0 7px var(--glow)}

.card-shell.rarity-c{--b1:#858585;--b2:#a8a8a8;--b3:#4b4b4b;--glow:#aaa3}
.card-shell.rarity-un{--b1:#6e9e61;--b2:#92ce7e;--b3:#365d36;--glow:#68d85b3d}
.card-shell.rarity-r{--b1:#4774bd;--b2:#76aaff;--b3:#253e79;--glow:#4388ff4d}
.card-shell.rarity-sr{--b1:#7939a9;--b2:#c36eff;--b3:#42205e;--glow:#a52aff59}
.card-shell.rarity-ssr{--b1:#b86b20;--b2:#ffd466;--b3:#744317;--glow:#ffae305e}
.card-shell.rarity-ur{--b1:#8e1421;--b2:#ff5b67;--b3:#52060e;--glow:#ff263b70}
.card-shell.rarity-lr{--b1:#8a4cff;--b2:#ffe77a;--b3:#48d5ff;--glow:#d57cff80}

.card-shell.rarity-ur:before{background:linear-gradient(145deg,#66101a,#1a0c0e 20%,#ff4453 43%,#ffd0d3 50%,#e5283a 57%,#1c0b0e 78%,#750e19);box-shadow:0 0 0 2px #190204,0 0 20px #ff334e75,0 0 38px #ff1f3840}
.card-shell.rarity-lr:before{background:linear-gradient(135deg,#ff6f91,#ffda70 15%,#8dffcf 31%,#72cfff 47%,#c384ff 63%,#ff83c7 79%,#ffe981);box-shadow:0 0 0 2px #151018,0 0 18px #fff7,0 0 36px #c572ff5c}
.card-shell.rarity-lr:after{border-color:#fff9;box-shadow:inset 0 0 8px #fff8,0 0 8px #d690ff80}

.tcg-card{--edge:#ffffff29;position:relative;width:430px;height:602px;overflow:hidden;isolation:isolate;border:2px solid var(--edge);border-radius:21px;background:#111;box-shadow:inset 0 0 0 2px #0008,inset 0 0 30px #0006}
.card-art{position:absolute;inset:0;z-index:-8;width:100%;height:100%;object-fit:cover}
.art-shade{position:absolute;inset:0;z-index:-7;pointer-events:none;background:linear-gradient(#0003,transparent 23% 59%,#0000001a 72%,#040304a6),linear-gradient(90deg,#0003,transparent 13% 77%,#0008)}
.card-pattern{position:absolute;inset:0;z-index:-6;opacity:.09;pointer-events:none;background:repeating-linear-gradient(127deg,transparent 0 36px,#fff3 37px,transparent 38px 74px)}
.inner-frame{position:absolute;opacity:40%;inset:9px;z-index:20;border:1px solid var(--edge);border-radius:14px;box-shadow:inset 0 0 7px color-mix(in srgb,var(--edge) 45%,transparent);pointer-events:none}
.corner{position:absolute;z-index:21;width:45px;height:45px;pointer-events:none}
.corner.tl{left:9px;top:9px;border-left:2px solid var(--edge);border-top:2px solid var(--edge);border-radius:12px 0 0}
.corner.br{right:9px;bottom:9px;border-right:2px solid var(--edge);border-bottom:2px solid var(--edge);border-radius:0 0 12px}

/* CARD RARITY */
.tcg-card.card-c{--edge:#aaa9;border-color:#888;box-shadow:inset 0 0 23px #49494966}
.tcg-card.card-un{--edge:#8fda7db5;border-color:#65a957;box-shadow:inset 0 0 23px #6aa84f66}
.tcg-card.card-r{--edge:#7ba8ffbd;border-color:#4779db;box-shadow:inset 0 0 23px #286eff66}
.tcg-card.card-sr{--edge:#cf82ffc7;border-color:#a14bdb;box-shadow:inset 0 0 25px #9900ff66}
.tcg-card.card-ssr{--edge:#ffd76ed4;border-color:#e4a138;box-shadow:inset 0 0 27px #ff99006b}
.tcg-card.card-ur{--edge:#ff6672e3;border-color:#ff3f4f;box-shadow:inset 0 0 0 1px #ffb2b77d,inset 0 0 29px #ff001d80,0 0 7px #ff20345c}
.tcg-card.card-lr{--edge:#fff2b9e8;border-color:#f5dd86;box-shadow:inset 0 0 0 1px #fff9,inset 0 0 28px #b568ff7a,0 0 8px #fff7}

/* ROLE */
.card-role{position:absolute;top:16px;left:17px;z-index:18;width:57px;height:57px;object-fit:contain;filter:drop-shadow(0 3px 4px #0004) drop-shadow(0 0 5px #0005);pointer-events:none}
.card-role[src=""]{display:none}

/* STATS */
.stats{position:absolute;right:3px;top:15px;z-index:18;width:61px;display:flex;flex-direction:column;gap:3px;pointer-events:none;z-index:99}
.stat{--c:#fff;--c2:#fff;--c3:#fff;--c4:#fff;position:relative;width:60px;height:92px;display:grid;grid-template-columns:1fr 13px;grid-template-rows:1fr auto;column-gap:3px;align-items:center}
.stat.hp{--c:#39873e;--c2:#72d65e;--c3:#bdff86;--c4:#efffd6}
.stat.attack{--c:#a12636;--c2:#ef4e5e;--c3:#ff9a73;--c4:#ffe1bd}
.stat.intelligence{--c:#276c9e;--c2:#4cb6eb;--c3:#9ee6ff;--c4:#e3f9ff}
.stat-meter{--fill1:0%;--fill2:0%;--fill3:0%;--fill4:0%;position:relative;grid-column:2;grid-row:1/3;width:13px;height:78px;overflow:hidden;border:1px solid #cc8b8b;border-radius:3px;background:#0d0c0d;box-shadow:0 2px 5px #000b,0 0 0 1px #0009,inset 0 0 3px #000}
.meter-fill{position:absolute;left:2px;right:2px;bottom:2px;max-height:calc(100% - 4px);border-radius:1px;transition:height .25s}
.meter-fill.base{z-index:1;height:var(--fill1);background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 70%,#fff))}
.meter-fill.layer2{z-index:2;height:var(--fill2);background:linear-gradient(90deg,var(--c2),color-mix(in srgb,var(--c2) 72%,#fff))}
.meter-fill.layer3{z-index:3;height:var(--fill3);background:linear-gradient(90deg,var(--c3),color-mix(in srgb,var(--c3) 72%,#fff))}
.meter-fill.layer4{z-index:4;height:var(--fill4);background:linear-gradient(90deg,var(--c4),#fff)}
.stat-meter:before{content:"";position:absolute;left:3px;top:2px;bottom:2px;width:2px;z-index:6;background:#ffffff38}
.stat-meter:after{content:"";position:absolute;inset:0;z-index:8;border-top:2px solid #f0d5878c;border-bottom:2px solid #8f7139a8;box-shadow:inset 1px 0 #fff1,inset -1px 0 #0005}
.meter-lines{position:absolute;inset:2px;z-index:7;background:repeating-linear-gradient(to top,transparent 0,transparent calc(10% - 1px),#090809b8 calc(10% - 1px),#090809b8 10%)}
.stat[data-layer="2"] .stat-meter{box-shadow:0 2px 5px #000b,0 0 4px var(--c2)}
.stat[data-layer="3"] .stat-meter{box-shadow:0 2px 5px #000b,0 0 5px var(--c3)}
.stat[data-layer="4"] .stat-meter{box-shadow:0 2px 5px #000b,0 0 6px var(--c4)}
.stat-text{grid-column:1;grid-row:1/3;align-self:center;display:flex;flex-direction:column;align-items:flex-end;padding:5px 0 5px 4px;text-align:right}
.stat-label{margin-bottom:2px;color:#f5e9d1;font:900 .4rem/1 Georgia,serif;letter-spacing:.11em;text-transform:uppercase}
.stat-value{color:#fff;font:1000 1.42rem/1 Arial Black,Impact,Inter,sans-serif;letter-spacing:-.07em;-webkit-text-stroke:.25px #fff;text-shadow:0 0 5px var(--c)}
.stat-level{margin-top:2px;color:#d9c69f;font-size:.3rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
.stat[data-layer="2"] .stat-value{text-shadow:0 0 5px var(--c2)}
.stat[data-layer="3"] .stat-value{text-shadow:0 0 6px var(--c3)}
.stat[data-layer="4"] .stat-value{text-shadow:0 0 7px var(--c4)}

/* BOTTOM */
.bottom-panel{position:absolute;left:0;right:0;bottom:0;z-index:6;height:72px;clip-path:polygon(0 13%,100% 0,100% 100%,0 100%)}
.bottom-panel:before{content:"";position:absolute;inset:0;opacity:.12;background:repeating-linear-gradient(140deg,transparent 0 28px,#ffffff8c 29px,transparent 30px 58px)}
.bottom-panel:after{content:"";position:absolute;left:0;right:0;top:9px;height:1px;background:#ffffff59}
.card-category{position:absolute;right:15px;bottom:53px;z-index:12;padding:2px 11px 2px 14px;clip-path:polygon(8% 0,100% 0,92% 100%,0 100%);background:#473131;color:#fff;font-size:.7rem;font-style:italic;font-weight:1000;letter-spacing:.06em}
.card-name{position:absolute;left:19px;bottom:27px;z-index:10;max-width:73%;overflow:hidden;color:#fff;font:900 1.48rem/1 Georgia,serif;letter-spacing:.005em;text-overflow:ellipsis;text-shadow:0 2px 3px #0006,0 0 7px #0006;white-space:nowrap}
.card-subtype{position:absolute;left:20px;bottom:14px;z-index:10;max-width:67%;overflow:hidden;color:#eeeeeea3;font-size:.6rem;font-weight:800;line-height:1.1;text-overflow:ellipsis;text-shadow:0 1px 3px #0007;white-space:nowrap}
.card-subtype .box{margin:0 1px;padding:1px 3px;font-size:.43rem;vertical-align:middle}
.card-id{position:absolute;right:55px;bottom:35px;z-index:10;color:#eee;font-size:.48rem;font-weight:900;text-shadow:0 1px 2px #000}
.card-rarity{position:absolute;right:12px;bottom:31px;z-index:12;min-width:40px;height:22px;display:grid;place-items:center;padding:0 5px;font-size:.7rem;font-weight:1000;text-shadow:0 1px 2px #584242}

/* LEGAL */
.card-legal{position:absolute;left:1px;top:50%;z-index:22;transform:translateY(-50%) rotate(180deg);writing-mode:vertical-rl;color:#ffffff57;font-size:.31rem;font-weight:700;letter-spacing:.07em;text-shadow:0 1px 2px #0005;white-space:nowrap;pointer-events:none}
.sample{position:absolute;inset:0;z-index:40;display:none;place-items:center;pointer-events:none;color:#ffffff6b;font-size:4rem;font-weight:300;letter-spacing:.08em;text-shadow:0 2px 5px #0005;transform:rotate(-4deg)}
.tcg-card[data-sample="true"] .sample{display:grid}
.card-caption{flex:none;width:min(500px,100%);margin-top:13px;color:#81786f;font-size:.67rem;text-align:center}
.card-caption strong{color:#bda370}
.error{margin:auto;padding:25px;border:1px solid #834249;border-radius:9px;background:#32191d;text-align:center}
.overlay{display:none}

/* MOBILE */
@media(max-width:800px){
 .app{display:block;min-height:100vh}
 .main,.stage{min-height:100vh}
 .sidebar{position:fixed!important;left:0!important;top:0!important;bottom:0!important;width:min(310px,86vw);height:100dvh;z-index:2147483647!important;transform:translateX(-105%);transition:transform .24s;box-shadow:18px 0 40px #000c}
 .sidebar.open{transform:none!important}
 .overlay{position:fixed!important;inset:0!important;z-index:2147483646!important;display:block;pointer-events:none;background:#000a;opacity:0;transition:.2s}
 .overlay.show{pointer-events:auto;opacity:1}
 .stage{padding:14px}
 .topbar{width:100%;margin-bottom:8px}
 .mobile-menu{display:block}
 .card-area{height:620px;min-height:620px}
 .card-caption{margin-top:10px}
}
@media(max-width:480px){
 .stage{padding:12px 8px 24px}
 .topbar{padding:0 4px}
 .card-area{height:590px;min-height:590px}
}
</style>
</head>

<body>
<div id="homeheader-placeholder"></div>

<div class="app">
 <aside class="sidebar" id="sidebar">
  <div class="side-head">
   <div class="brand">Mystical Legends<small>Trading Card Archive</small></div>
   <div class="search-wrap"><input id="card-search" type="search" placeholder="Search cards..." autocomplete="off"></div>
   <div class="library-meta"><span>Card Library</span><span id="card-count">0 cards</span></div>
  </div>
  <div class="card-list" id="card-list"></div>
 </aside>

 <div class="overlay" id="overlay"></div>

 <main class="main">
  <div class="stage">
   <div class="topbar">
    <button class="icon-btn mobile-menu" id="menu-btn" aria-label="Open card library">☰</button>
    <span id="current-position">Card 1 / 1</span>
    <div class="nav-controls">
     <button class="icon-btn" id="prev-btn" aria-label="Previous card">‹</button>
     <button class="icon-btn" id="next-btn" aria-label="Next card">›</button>
    </div>
   </div>

   <div class="card-area" id="card-area">
    <div class="card-shell" id="card-shell">
     <article class="tcg-card" id="card">
      <img class="card-art" id="card-art" alt="">
      <div class="art-shade"></div><div class="card-pattern"></div>
      <div class="inner-frame"></div><div class="corner tl"></div><div class="corner br"></div>

      <img class="card-role" id="card-role" alt="Role">

      <div class="stats">
       <div class="stat hp" id="hp-stat">
        <div class="stat-text"><span class="stat-label" id="hp-label">HP</span><span class="stat-value" id="hp">0</span><span class="stat-level" id="hp-level"></span></div>
        <div class="stat-meter" id="hp-meter"><i class="meter-fill base"></i><i class="meter-fill layer2"></i><i class="meter-fill layer3"></i><i class="meter-fill layer4"></i><i class="meter-lines"></i></div>
       </div>
       <div class="stat attack" id="attack-stat">
        <div class="stat-text"><span class="stat-label" id="attack-label">ATK</span><span class="stat-value" id="attack">0</span><span class="stat-level" id="attack-level"></span></div>
        <div class="stat-meter" id="attack-meter"><i class="meter-fill base"></i><i class="meter-fill layer2"></i><i class="meter-fill layer3"></i><i class="meter-fill layer4"></i><i class="meter-lines"></i></div>
       </div>
       <div class="stat intelligence" id="intelligence-stat">
        <div class="stat-text"><span class="stat-label" id="intelligence-label">INT</span><span class="stat-value" id="intelligence">0</span><span class="stat-level" id="intelligence-level"></span></div>
        <div class="stat-meter" id="intelligence-meter"><i class="meter-fill base"></i><i class="meter-fill layer2"></i><i class="meter-fill layer3"></i><i class="meter-fill layer4"></i><i class="meter-lines"></i></div>
       </div>
      </div>

      <div class="card-info" id="card-info"></div>
      <div class="bottom-panel" id="bottom-panel"></div>
      <div class="card-category" id="category"></div>
      <div class="card-name" id="name"></div>
      <div class="card-subtype" id="subtype"></div>
      <div class="card-id" id="card-id"></div>
      <div class="card-rarity" id="rarity"></div>
      <div class="card-legal">Mystical Legends © <span id="copyright-year"></span> · All Rights Reserved</div>
      <div class="sample">SAMPLE</div>
     </article>
    </div>
   </div>

   <div class="card-caption"><strong id="caption-name"></strong><span id="caption-detail"></span></div>
  </div>
 </main>
</div>

<script>
const FILE="tcg-cards.json",$=id=>document.getElementById(id),W=430,H=602,MAX=4,STEP=.2;
const area=$("card-area"),shell=$("card-shell");
let db={},ids=[],filtered=[],active="",fit=1,zoom=1,x=0,y=0;

/* VIEW */
function fitCard(reset=false){
 const r=area.getBoundingClientRect();if(!r.width||!r.height)return;
 fit=Math.min(1,(r.width-20)/W,(r.height-20)/H);
 if(reset)zoom=1,x=y=0;clamp();apply();
}
function apply(){
 shell.style.setProperty("--view-scale",fit*zoom);
 shell.style.setProperty("--pan-x",`${x}px`);
 shell.style.setProperty("--pan-y",`${y}px`);
 area.classList.toggle("zoomed",zoom>1.001);
}
function clamp(){
 if(zoom<=1)return void(x=y=0);
 const r=area.getBoundingClientRect(),w=W*fit*zoom,h=H*fit*zoom;
 const mx=Math.max(0,(w-r.width)/2)+r.width*.35,my=Math.max(0,(h-r.height)/2)+r.height*.35;
 x=Math.max(-mx,Math.min(mx,x));y=Math.max(-my,Math.min(my,y));
}
function setZoom(n,cx,cy){
 const r=area.getBoundingClientRect(),old=fit*zoom;
 n=Math.max(1,Math.min(MAX,n));cx??=r.left+r.width/2;cy??=r.top+r.height/2;
 const ratio=fit*n/old,px=cx-r.left-r.width/2-x,py=cy-r.top-r.height/2-y;
 x-=px*(ratio-1);y-=py*(ratio-1);zoom=n;
 if(zoom<=1.001)zoom=1,x=y=0;clamp();apply();
}
const zoomBy=(n,x,y)=>setZoom(zoom+n,x,y),resetZoom=()=>{zoom=1;x=y=0;apply()};

/* DATA */
async function loadCards(){
 try{
  const r=await fetch(FILE);if(!r.ok)throw Error(`Could not load ${FILE} (${r.status})`);
  db=await r.json();ids=Object.keys(db.cards||{});
  if(!ids.length)throw Error("No cards found.");
  const q=new URLSearchParams(location.search).get("id");
  active=db.cards[q]?q:db.cards[db.default_card]?db.default_card:ids[0];
  renderLibrary();selectCard(active,false);requestAnimationFrame(()=>fitCard(true));
 }catch(e){
  console.error(e);
  document.querySelector(".app").innerHTML=`<div class="error"><h2>Unable to load cards</h2><div>${esc(e.message)}</div></div>`;
 }
}
function renderLibrary(){
 const q=$("card-search").value.trim().toLowerCase();
 filtered=ids.filter(id=>{
  const c=db.cards[id];
  return[id,c.name,c.card_number,c.rarity,c.category,strip(c.subtype),c.role].join(" ").toLowerCase().includes(q);
 });
 $("card-count").textContent=`${filtered.length} card${filtered.length===1?"":"s"}`;
 $("card-list").innerHTML=filtered.length?filtered.map(id=>{
  const c=db.cards[id],r=rarity(c.rarity);
  return `<button class="card-item ${id===active?"active":""}" data-id="${esc(id)}"><span class="list-info"><span class="list-name">${esc(strip(c.name||id))}</span><span class="list-meta">${esc(c.card_number||id)} · ${esc(strip(c.category||"Card"))}</span></span><span class="list-rarity ${r}">${esc(c.rarity||"")}</span></button>`;
 }).join(""):'<div class="no-results">No matching cards found.</div>';
 document.querySelectorAll(".card-item").forEach(b=>b.onclick=()=>selectCard(b.dataset.id));
}
function selectCard(id,url=true){
 const c=db.cards?.[id];if(!c)return;
 active=id;renderCard(c);renderLibrary();updateNav();resetZoom();closeSidebar();
 document.querySelector(".card-item.active")?.scrollIntoView({block:"nearest"});
 if(url){const u=new URL(location.href);u.searchParams.set("id",id);history.replaceState(null,"",u)}
}
function renderCard(c){
 const r=rarity(c.rarity),card=$("card"),role=$("card-role"),bottom=$("bottom-panel"),art=$("card-art");

 /* Apply rarity to both card and physical border */
 card.className=`tcg-card card-${r}`;
 shell.className=`card-shell rarity-${r}`;
 card.dataset.sample=String(c.sample??false);

 art.src=c.art||"";art.alt=strip(c.name||"Card");
 art.style.objectPosition=c.design?.art_position||"center";

 setStat("hp",c.stats?.hp,c.labels?.hp||"HP");
 setStat("attack",c.stats?.attack??c.stats?.damage,c.labels?.attack||c.labels?.damage||"ATK");
 setStat("intelligence",c.stats?.intelligence,c.labels?.intelligence||"INT");

 role.src=c.role||"";role.style.display=c.role?"block":"none";

 [...bottom.classList].forEach(v=>v.startsWith("name-")&&bottom.classList.remove(v));
 if(["c","un","r","sr","ssr","ur","lr"].includes(r))bottom.classList.add(`name-${r}`);

 [["name",c.name],["subtype",c.subtype],["category",c.category]].forEach(([id,v])=>$(id).innerHTML=normalize(v||""));
 $("card-id").textContent=c.card_number||"";
 $("rarity").className=`card-rarity ${r}`;
 $("rarity").textContent=c.rarity||"";

 renderAdditional(c.additional||[]);
 $("caption-name").textContent=strip(c.name);
 $("caption-detail").textContent=` — ${c.card_number||""} · ${c.rarity||""}`;
 document.title=`${strip(c.name||"Card")} | Mystical Legends TCG`;
}
function setStat(k,v=0,label){
 v=Math.max(0,+v||0);$(k).textContent=v;$(`${k}-label`).textContent=label;
 const m=$(`${k}-meter`),fill=n=>`${Math.min(10,Math.max(0,v-n))*9.5}%`;
 [0,10,20,30].forEach((n,i)=>m.style.setProperty(`--fill${i+1}`,fill(n)));
 $(`${k}-stat`).dataset.layer=v>30?4:v>20?3:v>10?2:1;
}

/* HELPERS */
function normalize(h=""){return String(h).replace(/class=(["'])(.*?)\1/gi,(_,q,c)=>`class=${q}${c.trim().split(/[;\s]+/).filter(Boolean).join(" ")}${q}`)}
function strip(h=""){const e=document.createElement("div");e.innerHTML=normalize(h);return e.textContent||""}
function esc(v=""){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function rarity(v=""){v=String(v).trim().toLowerCase();return["c","un","r","sr","ssr","ur","lr"].includes(v)?v:"c"}
function cssStyle(s={}){
 const unitless=new Set(["fontWeight","lineHeight","opacity","zIndex","order","flexGrow","flexShrink"]);
 return Object.entries(s).filter(([,v])=>v!==""&&v!=null).map(([k,v])=>{
  const css=k.replace(/[A-Z]/g,m=>"-"+m.toLowerCase());
  return `${css}:${typeof v==="number"&&!unitless.has(k)?v+"px":v}`;
 }).join(";");
}
function renderAdditional(a){
 $("card-info").innerHTML=a.map(v=>{
  const s=cssStyle(v.style);
  return `<div class="additional"${s?` style="${s}"`:""}>${normalize(v.text||"")}</div>`;
 }).join("");
}
function updateNav(){
 const i=ids.indexOf(active);
 $("current-position").textContent=`Card ${i+1} / ${ids.length}`;
 $("prev-btn").disabled=i<=0;$("next-btn").disabled=i>=ids.length-1;
}
function navigate(d){const id=ids[ids.indexOf(active)+d];if(id)selectCard(id)}
function openSidebar(){$("sidebar").classList.add("open");$("overlay").classList.add("show")}
function closeSidebar(){$("sidebar").classList.remove("open");$("overlay").classList.remove("show")}

/* MOUSE */
let dragging=false,mx=0,my=0;
area.onmousedown=e=>{
 if(e.button||zoom<=1)return;
 dragging=true;mx=e.clientX;my=e.clientY;area.classList.add("dragging");e.preventDefault();
};
addEventListener("mousemove",e=>{
 if(!dragging)return;
 x+=e.clientX-mx;y+=e.clientY-my;mx=e.clientX;my=e.clientY;clamp();apply();
});
addEventListener("mouseup",()=>{dragging=false;area.classList.remove("dragging")});

/* ZOOM */
addEventListener("wheel",e=>{
 if(!(e.ctrlKey||e.metaKey))return;
 e.preventDefault();zoomBy(e.deltaY<0?STEP:-STEP,e.clientX,e.clientY);
},{passive:false});

addEventListener("keydown",e=>{
 const mod=e.ctrlKey||e.metaKey;
 if(mod&&["=","+"].includes(e.key)){e.preventDefault();return zoomBy(STEP)}
 if(mod&&["-","_"].includes(e.key)){e.preventDefault();return zoomBy(-STEP)}
 if(mod&&e.key==="0"){e.preventDefault();return resetZoom()}
 if(document.activeElement===$("card-search"))return;
 if(e.key==="ArrowLeft")navigate(-1);
 if(e.key==="ArrowRight")navigate(1);
 if(e.key==="Escape")closeSidebar();
},{passive:false});

/* TOUCH */
let mode="",tx=0,ty=0,pd=0,pz=1,pcx=0,pcy=0;
const distance=(a,b)=>Math.hypot(b.clientX-a.clientX,b.clientY-a.clientY);
const midpoint=(a,b)=>({x:(a.clientX+b.clientX)/2,y:(a.clientY+b.clientY)/2});

area.addEventListener("touchstart",e=>{
 if(e.touches.length===2){
  e.preventDefault();mode="pinch";
  const [a,b]=e.touches,c=midpoint(a,b);
  pd=distance(a,b);pz=zoom;pcx=c.x;pcy=c.y;
 }else if(e.touches.length===1&&zoom>1){
  mode="drag";tx=e.touches[0].clientX;ty=e.touches[0].clientY;
 }else mode="";
},{passive:false});

area.addEventListener("touchmove",e=>{
 if(e.touches.length===2){
  e.preventDefault();
  const [a,b]=e.touches,c=midpoint(a,b),d=distance(a,b);
  if(mode!=="pinch"){mode="pinch";pd=d;pz=zoom;pcx=c.x;pcy=c.y;return}
  x+=c.x-pcx;y+=c.y-pcy;pcx=c.x;pcy=c.y;
  setZoom(pz*d/Math.max(1,pd),c.x,c.y);
 }else if(e.touches.length===1&&zoom>1){
  e.preventDefault();
  const t=e.touches[0];
  if(mode!=="drag"){mode="drag";tx=t.clientX;ty=t.clientY;return}
  x+=t.clientX-tx;y+=t.clientY-ty;tx=t.clientX;ty=t.clientY;clamp();apply();
 }
},{passive:false});

area.addEventListener("touchend",e=>{
 if(e.touches.length===1&&zoom>1){mode="drag";tx=e.touches[0].clientX;ty=e.touches[0].clientY}
 else mode="";
},{passive:false});

["gesturestart","gesturechange","gestureend"].forEach(v=>addEventListener(v,e=>e.preventDefault(),{passive:false}));

/* UI */
$("copyright-year").textContent=new Date().getFullYear();
$("card-search").oninput=renderLibrary;
$("prev-btn").onclick=()=>navigate(-1);
$("next-btn").onclick=()=>navigate(1);
$("menu-btn").onclick=openSidebar;
$("overlay").onclick=closeSidebar;
addEventListener("resize",fitCard,{passive:true});
visualViewport?.addEventListener("resize",fitCard,{passive:true});
loadCards();
</script>
