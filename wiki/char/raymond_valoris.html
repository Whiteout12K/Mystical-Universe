== Overview ==
Raymond is an Elf recorded in the wider notes as a Regnum Academy 1A student and Black Rampart member. His established connections include Kiara and District 10. He is not named in either supplied volume, so this page distinguishes those recorded details from an on-page early-book history.

== Personality ==
The first two novels do not provide named dialogue or actions from Raymond. His personality cannot be analyzed from those books without attributing another student's behavior to him, so no unsupported early-story temperament is assigned here.

== Mystical Rank & Heritage ==
The established profile identifies Raymond as an Elf and a member of Class 1A. Neither supplied volume gives a personal tier assessment, a new heritage revelation, or a confirmed change to his status.

== Tools and Equipment ==
The existing notes record a Gorgan Snake familiar. The first two novels do not depict Raymond summoning it or using a personal named weapon, so no new equipment event is inferred.

== Synopsis ==

=== The Rune of the Spellcaster ===

Raymond is not named in Rune of the Spellcaster. Regnum Academy and its student structure are established there, but the book does not depict his personal involvement in the orb crisis.

=== I.T.E.R. Chronicles — Initialization ===

Raymond is not named in Initialization. Carla's recruitment of Jane establishes Black Rampart's early activity, without demonstrating that Raymond participates in the cohort challenge or the flag contest. His connection to Kiara and their later District 10 development remain wider-series information rather than new events from this volume.

=== Sources ===
No named appearance in the supplied Book 1 or Book 2 main narrative.

== Relationships ==

=== Kiara Katzol ===

The wider notes connect Raymond with [[char/kiara_katzol|Kiara]] and list them in Black Rampart. These volumes do not depict their personal relationship developing, so the existing love-interest entry is not expanded into a confirmed reciprocal or formal partnership.

=== Black Rampart ===
