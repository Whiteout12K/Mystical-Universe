<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mystical Legends World Map</title>
<link rel="icon" href="/images/website/favicon.png" type="image/png">
<link href="/css/bootstrap-min.css" rel="stylesheet">
<link rel="stylesheet" href="/css/home.css">
<link rel="stylesheet" href="/css/mlg.css">
<script src="/js/bootstrap-bundle-min.js"></script>

<style>
*{box-sizing:border-box}
:root{--gold:#cfa64b;--gold2:#f1d17b;--text:#f5ead4;--muted:#a99a87;--glass:#151113b8;--glass2:#09080acc;--hover:#ffffff0d;--red:#5c2028}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050405;color:var(--text);font-family:Arial,sans-serif;overscroll-behavior:none}
button,select{font:inherit}

.map-viewport{
 position:fixed;inset:0;overflow:hidden;cursor:grab;touch-action:none;
 background:
 radial-gradient(circle at 50% 42%,#1a1518 0,transparent 34%),
 radial-gradient(circle at 18% 25%,#180c0f 0,transparent 28%),
 radial-gradient(circle at 82% 70%,#100b10 0,transparent 28%),
 radial-gradient(circle at 50% 50%,#0d0b0d 0,#060506 58%,#020202 100%)
}
.map-viewport:before{
 content:"";position:absolute;inset:0;pointer-events:none;opacity:.11;
 background:
 radial-gradient(circle at 15% 20%,#a52a3224 0,transparent 22%),
 radial-gradient(circle at 82% 72%,#5c202820 0,transparent 20%),
 radial-gradient(circle at 50% 50%,transparent 40%,#000b 100%)
}
.map-viewport:after{
 content:"";position:absolute;inset:0;pointer-events:none;opacity:.17;
 background-image:
 repeating-linear-gradient(22deg,transparent 0 64px,#ffffff05 65px 66px),
 repeating-linear-gradient(-31deg,transparent 0 78px,#000 79px 80px)
}
.map-viewport.dragging{cursor:grabbing}
.map-world{position:absolute;left:50%;top:50%;width:1px;height:1px;transform-origin:0 0;overflow:visible}

/* TITLE */
.map-title{position:fixed;top:20px;right:22px;z-index:450;pointer-events:none;text-align:right;text-shadow:0 2px 10px #000}
.map-title h1{margin:0;font-family:Georgia,serif;color:var(--gold2);font-size:22px;letter-spacing:3px;text-transform:uppercase}
.map-title div{margin-top:3px;font-size:9px;color:var(--muted);letter-spacing:1.8px;text-transform:uppercase}

/* TOOLBAR */
.map-toolbar,.map-zoom{
 position:fixed;z-index:500;display:flex;align-items:center;gap:5px;
 background:linear-gradient(180deg,#1a1619c9,#0b090bb8);
 box-shadow:0 10px 35px #0009,0 1px 0 #ffffff0a inset;
 backdrop-filter:blur(18px) saturate(1.25);-webkit-backdrop-filter:blur(18px) saturate(1.25);
 border-radius:18px
}
.map-toolbar{top:16px;left:16px;padding:6px;max-width:calc(100% - 32px)}
.map-zoom{right:16px;bottom:16px;padding:5px}

.map-toolbar button,.map-toolbar select,.map-zoom button{
 border:0;outline:0;background:#ffffff08;color:var(--text);cursor:pointer;
 min-height:36px;padding:7px 12px;border-radius:12px;transition:.16s
}
.map-toolbar button:hover,.map-toolbar select:hover,.map-zoom button:hover{background:#ffffff12;color:#fff}
.map-toolbar button:active,.map-zoom button:active{transform:scale(.95)}
.map-toolbar select{min-width:145px;padding-right:30px}
.map-toolbar option{background:#121012;color:var(--text)}

.map-zoom button{width:38px;height:38px;padding:0;font-size:19px;border-radius:13px}
.zoom-value{min-width:48px;text-align:center;color:var(--gold2);font-size:11px;user-select:none}

/* REGIONS */
.region{position:absolute;cursor:pointer;transition:filter .2s,opacity .2s,transform .2s;transform-origin:center}
.region:hover{filter:brightness(1.18) drop-shadow(0 0 12px #d6aa4545);z-index:5}
.region img{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none;user-select:none}
.region.placeholder{
 border:2px solid #d6aa4555;
 background:radial-gradient(circle at 50% 45%,#71313a77,#311a1faa 55%,#171114cc);
 border-radius:42% 58% 45% 55%/55% 45% 58% 42%;
 box-shadow:inset 0 0 45px #0009,0 0 25px #0007
}
.region.placeholder:after{content:"";position:absolute;inset:8px;border:1px solid #f1d17b22;border-radius:inherit;pointer-events:none}
.region.selected{filter:brightness(1.2) drop-shadow(0 0 18px #f1d17b88);z-index:6}

/* LABELS */
.map-label{
 position:absolute;transform:translate(-50%,-50%);text-align:center;
 text-shadow:0 2px 4px #000,0 0 10px #000;font-family:Georgia,serif;white-space:nowrap;z-index:10
}
.map-label.region-name{font-size:28px;color:#f1d17b;font-weight:bold;letter-spacing:3px;text-transform:uppercase}
.map-label.subregion-name{font-size:17px;color:#efe1be;letter-spacing:2px}
.map-label.district-name{font-size:13px;color:#d3c4a5;letter-spacing:1.5px}
.map-label.hidden{display:none}

/* MARKERS */
.map-marker{
 position:absolute;transform:translate(-50%,-50%);z-index:20;cursor:pointer;
 display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;
 border:2px solid #d6aa45;background:#171114;color:#f1d17b;
 box-shadow:0 2px 8px #000,0 0 0 4px #0006;transition:.15s
}
.map-marker:hover{transform:translate(-50%,-50%) scale(1.18);background:#332024;box-shadow:0 0 15px #d6aa4570}
.map-marker.selected{background:#6b2933;border-color:#ffe29a;transform:translate(-50%,-50%) scale(1.2)}
.map-marker span{font-size:11px;font-weight:bold;pointer-events:none}
.map-marker-label{
 position:absolute;left:50%;top:34px;transform:translateX(-50%);white-space:nowrap;
 font-size:11px;color:#f6ead3;background:#090709cc;border:0;border-radius:7px;
 padding:4px 7px;pointer-events:none;text-shadow:0 1px 3px #000;box-shadow:0 4px 12px #0008
}
.map-point{
 position:absolute;transform:translate(-50%,-50%);z-index:15;width:8px;height:8px;border-radius:50%;
 background:#e1bc62;box-shadow:0 0 0 3px #0008,0 0 8px #e1bc6290
}

/* PANEL */
.map-panel{
 position:fixed;right:16px;top:78px;width:310px;max-height:calc(100vh - 160px);overflow:auto;
 background:linear-gradient(180deg,#191417e8,#090709e8);border:0;border-radius:18px;
 box-shadow:0 18px 55px #000c,0 1px 0 #ffffff0b inset;
 backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
 z-index:600;display:none;scrollbar-width:thin;scrollbar-color:#72562b transparent
}
.map-panel.open{display:block}
.panel-image{height:130px;background:#110d0f center/cover no-repeat}
.panel-content{padding:17px}
.panel-type{font-size:10px;letter-spacing:2px;color:var(--gold);text-transform:uppercase;margin-bottom:5px}
.panel-title{font-family:Georgia,serif;font-size:24px;color:var(--gold2);margin:0 32px 5px 0}
.panel-subtitle{color:var(--muted);font-size:12px;margin-bottom:13px}
.panel-description{font-size:13px;line-height:1.55;color:#ddd0ba}
.panel-stats{margin-top:14px;border-top:1px solid #ffffff0b}
.panel-stat{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #ffffff09;font-size:12px}
.panel-stat span:first-child{color:var(--muted)}
.panel-stat span:last-child{color:#f1d17b;text-align:right}
.panel-actions{display:flex;gap:7px;margin-top:15px;flex-wrap:wrap}
.panel-actions a{
 flex:1;min-width:90px;text-align:center;text-decoration:none;color:#f5ead4;padding:9px;
 border:0;border-radius:10px;background:#ffffff0b;font-size:12px;transition:.15s
}
.panel-actions a:hover{background:#ffffff15;color:#fff}
.panel-close{
 position:absolute;right:10px;top:10px;width:30px;height:30px;border:0;border-radius:50%;
 background:#ffffff0b;color:#f1d17b;cursor:pointer;z-index:2;transition:.15s
}
.panel-close:hover{background:#ffffff18}

/* TABLET */
@media(max-width:900px){
 .map-title{right:14px}
 .map-toolbar{left:12px;top:12px}
 .map-panel{right:12px}
}

/* MOBILE */
@media(max-width:700px){
 .map-title{
  display:block;top:calc(env(safe-area-inset-top) + 9px);left:10px;right:10px;
  text-align:center;z-index:520
 }
 .map-title h1{font-size:20px;line-height:1.05;letter-spacing:2.4px}
 .map-title div{margin-top:4px;font-size:8px;letter-spacing:2px}

 .map-toolbar{
  top:calc(env(safe-area-inset-top) + 56px);left:10px;right:10px;
  width:auto;max-width:none;display:grid;grid-template-columns:auto minmax(0,1fr) auto;
  gap:4px;padding:5px;border-radius:17px
 }
 .map-toolbar button,.map-toolbar select{
  width:100%;min-width:0;min-height:38px;padding:6px 8px;
  font-size:12px;border-radius:12px;background:#ffffff09
 }
 .map-toolbar select{text-overflow:ellipsis}
 .map-zoom{
  right:10px;bottom:calc(env(safe-area-inset-bottom) + 10px);
  gap:3px;padding:4px;border-radius:16px
 }
 .map-zoom button{width:36px;min-width:36px;height:36px;border-radius:12px;font-size:17px}
 .zoom-value{min-width:42px;font-size:10px}

 .map-panel{
  left:10px;right:10px;top:auto;bottom:calc(env(safe-area-inset-bottom) + 60px);
  width:auto;max-height:min(52vh,440px);border-radius:18px
 }
 .panel-image{height:100px}
 .panel-content{padding:14px}
 .panel-title{font-size:21px;margin-right:35px}
 .panel-description{font-size:12px;line-height:1.5}
 .panel-stat{font-size:11px;padding:7px 0}
 .panel-actions a{padding:9px 7px;font-size:11px;border-radius:9px}
 .panel-close{width:32px;height:32px}

 .map-label.region-name{font-size:21px;letter-spacing:2px}
 .map-label.subregion-name{font-size:14px;letter-spacing:1.5px}
 .map-label.district-name{font-size:11px;letter-spacing:1px}
 .map-marker{width:30px;height:30px}
 .map-marker-label{top:36px;font-size:10px}
}

/* SMALL PHONES */
@media(max-width:420px){
 .map-title{top:calc(env(safe-area-inset-top) + 8px)}
 .map-title h1{font-size:18px;letter-spacing:2px}
 .map-title div{font-size:7px;letter-spacing:1.6px}

 .map-toolbar{top:calc(env(safe-area-inset-top) + 51px);left:8px;right:8px}
 .map-toolbar button,.map-toolbar select{font-size:11px;padding:5px 6px}
 .map-zoom{right:8px;bottom:calc(env(safe-area-inset-bottom) + 8px)}
 .map-zoom button{width:34px;min-width:34px;height:34px}
 .zoom-value{min-width:38px}

 .map-panel{left:8px;right:8px;max-height:50vh}
 .panel-image{height:82px}
 .panel-content{padding:11px}
 .panel-type{font-size:9px}
 .panel-title{font-size:19px}
 .panel-subtitle{font-size:11px}
 .panel-description{font-size:11px}

 .map-label.region-name{font-size:18px}
 .map-label.subregion-name{font-size:13px}
 .map-label.district-name{font-size:10px}
}

@media(max-width:340px){
 .map-toolbar{grid-template-columns:1fr 1fr}
 #map-filter{grid-column:1/3;grid-row:2}
 .map-title h1{font-size:16px}
 .map-title div{font-size:7px}
}
</style>
</head>

<body>

<div class="map-title">
<h1>World Map</h1>
<div>Mystical Legends</div>
</div>

<div class="map-toolbar">
<button id="reset-map" type="button">Reset</button>

<select id="map-filter">
<option value="all">All Markers</option>
<option value="city">Cities</option>
<option value="academy">Academies</option>
<option value="dungeon">Dungeons</option>
<option value="boss">Bosses</option>
<option value="quest">Quests</option>
<option value="landmark">Landmarks</option>
</select>

<button id="toggle-labels" type="button">Labels</button>
</div>

<div class="map-zoom">
<button id="zoom-out" type="button" aria-label="Zoom out">−</button>
<span id="zoom-value" class="zoom-value">100%</span>
<button id="zoom-in" type="button" aria-label="Zoom in">+</button>
</div>

<div id="map-viewport" class="map-viewport">
<div id="map-world" class="map-world"></div>
</div>

<aside id="map-panel" class="map-panel">
<button id="panel-close" class="panel-close" type="button">×</button>
<div id="panel-image" class="panel-image"></div>

<div class="panel-content">
<div id="panel-type" class="panel-type"></div>
<h2 id="panel-title" class="panel-title"></h2>
<div id="panel-subtitle" class="panel-subtitle"></div>
<div id="panel-description" class="panel-description"></div>
<div id="panel-stats" class="panel-stats"></div>
<div id="panel-actions" class="panel-actions"></div>
</div>
</aside>

<script>
const MAP={
 start:{x:960,y:540,zoom:1},

 regions:[
  {
   id:"district1",name:"District 1",type:"region",
   x:330,y:160,w:520,h:410,image:"",
   label:{x:340,y:210},color:"#5f2c34",
   subtitle:"Northern Territory",
   description:"A northern region known for ancient settlements, forests and old magical ruins.",
   stats:{"Recommended Rank":"AR 10","Region Completion":"42%","Authority":"District Council"},
   actions:[
    {name:"Explore",url:"/ml-game/adventure/stages.html?region=district1"},
    {name:"Lore",url:"/ml-game/world/codex.html?region=district1"}
   ]
  },

  {
   id:"district2",name:"District 2",type:"region",
   x:760,y:440,w:540,h:420,image:"",
   label:{x:820,y:490},color:"#544020",
   subtitle:"Central Territory",
   description:"A large central district connecting several major cities and trade routes.",
   stats:{"Recommended Rank":"AR 20","Region Completion":"68%","Authority":"Central Administration"}
  },

  {
   id:"district3",name:"District 3",type:"region",
   x:1300,y:180,w:470,h:440,image:"",
   label:{x:1430,y:230},color:"#67232b",
   subtitle:"Eastern Territory",
   description:"A dangerous district currently associated with the flame master Pyrus Bourn.",
   stats:{"Recommended Rank":"AR 35","Region Completion":"73%","Authority":"Pyrus Bourn"},
   actions:[
    {name:"Stages",url:"/ml-game/adventure/stages.html?region=district3"},
    {name:"Bosses",url:"/ml-game/adventure/bosses.html?region=district3"}
   ]
  },

  {
   id:"district4",name:"District 4",type:"region",
   x:390,y:680,w:530,h:330,image:"",
   label:{x:510,y:740},color:"#313d48",
   subtitle:"Southern Territory",
   description:"A colder southern district surrounded by mountains and old settlements.",
   stats:{"Recommended Rank":"AR 30","Region Completion":"31%"}
  }
 ],

 subregions:[
  {
   id:"regnum-region",parent:"district2",name:"Regnum Province",type:"subregion",
   label:{x:1010,y:610},
   description:"The province surrounding Regnum Academy.",
   stats:{"Region":"District 2"}
  },
  {
   id:"ember-fields",parent:"district3",name:"Ember Fields",type:"subregion",
   label:{x:1515,y:440},
   description:"Burned plains shaped by powerful flame magic."
  }
 ],

 districts:[
  {
   id:"regnum-capital",parent:"regnum-region",name:"Regnum City",type:"district",
   label:{x:1050,y:680},
   description:"A major city located near Regnum Academy."
  },
  {
   id:"north-quarter",parent:"district1",name:"Northern Quarter",type:"district",
   label:{x:420,y:350}
  }
 ],

 markers:[
  {
   id:"regnum-academy",name:"Regnum Academy",type:"academy",
   x:1090,y:620,icon:"RA",image:"",
   subtitle:"Mystical Academy",
   description:"One of the most important academies in the Mystical Legends world.",
   stats:{
    "Location":"Regnum Province",
    "Students":"Mystical Beings and Demihumans",
    "Status":"Active"
   },
   actions:[
    {name:"Characters",url:"/ml-game/characters/index.html?affiliation=regnum"},
    {name:"Lore",url:"/ml-game/world/codex.html?id=regnum-academy"}
   ]
  },

  {
   id:"central-city",name:"Central City",type:"city",
   x:890,y:640,icon:"C",
   description:"A major settlement in the center of District 2.",
   stats:{"Region":"District 2"}
  },

  {
   id:"pyrus-fortress",name:"Bourn Fortress",type:"boss",
   x:1520,y:330,icon:"B",
   description:"A heavily fortified location controlled by Pyrus Bourn.",
   stats:{"Boss":"Pyrus Bourn","Recommended Rank":"AR 40","Element":"Fire"}
  },

  {
   id:"frozen-cavern",name:"Frozen Cavern",type:"dungeon",
   x:620,y:820,icon:"D",
   description:"An ancient cavern hidden beneath the southern mountains.",
   stats:{"Region":"District 4","Recommended Rank":"AR 32"}
  },

  {
   id:"ancient-ruins",name:"Ancient Ruins",type:"landmark",
   x:390,y:280,icon:"L",
   description:"Ruins believed to predate modern district boundaries."
  },

  {
   id:"quest-example",name:"Lost Relic",type:"quest",
   x:1250,y:575,icon:"Q",
   description:"A quest involving a missing mystical artifact.",
   stats:{"Quest Type":"World Quest","Recommended Rank":"AR 25"}
  }
 ],

 points:[
  {id:"point1",x:950,y:520},
  {id:"point2",x:1180,y:530}
 ]
};

const $=s=>document.querySelector(s),
world=$("#map-world"),
viewport=$("#map-viewport"),
panel=$("#map-panel");

let zoom=1,panX=0,panY=0,drag=false,startX=0,startY=0,startPanX=0,startPanY=0,labelsVisible=true;

const div=c=>Object.assign(document.createElement("div"),{className:c}),
px=v=>`${v}px`,
esc=v=>String(v??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
}[c]));

function createRegion(r){
 const e=div("region"+(!r.image?" placeholder":""));
 e.dataset.id=r.id;
 Object.assign(e.style,{left:px(r.x),top:px(r.y),width:px(r.w),height:px(r.h)});

 if(r.color&&!r.image)e.style.backgroundColor=r.color;
 if(r.image)e.innerHTML=`<img src="${esc(r.image)}" alt="${esc(r.name)}" draggable="false">`;

 e.onclick=ev=>{
  ev.stopPropagation();
  selectObject(r,e)
 };

 world.appendChild(e);

 if(r.label)createLabel(r.name,r.label.x,r.label.y,"region-name",r)
}

function createLabel(name,x,y,cls,o){
 const e=div(`map-label ${cls}`);
 e.textContent=name;
 Object.assign(e.style,{left:px(x),top:px(y),pointerEvents:"auto",cursor:"pointer"});

 e.onclick=ev=>{
  ev.stopPropagation();
  selectObject(o,e)
 };

 world.appendChild(e)
}

function createMarker(m){
 const e=div("map-marker");

 e.dataset.id=m.id;
 e.dataset.type=m.type;
 e.style.left=px(m.x);
 e.style.top=px(m.y);

 e.innerHTML=`<span>${esc(m.icon||"")}</span><div class="map-marker-label">${esc(m.name)}</div>`;

 e.onclick=ev=>{
  ev.stopPropagation();
  selectObject(m,e)
 };

 world.appendChild(e)
}

function createPoint(p){
 const e=div("map-point");
 e.dataset.id=p.id;
 e.style.left=px(p.x);
 e.style.top=px(p.y);
 world.appendChild(e)
}

function renderMap(){
 MAP.regions.forEach(createRegion);
 MAP.subregions.forEach(r=>r.label&&createLabel(r.name,r.label.x,r.label.y,"subregion-name",r));
 MAP.districts.forEach(r=>r.label&&createLabel(r.name,r.label.x,r.label.y,"district-name",r));
 MAP.markers.forEach(createMarker);
 MAP.points.forEach(createPoint);
 resetMap()
}

function selectObject(o,e){
 document.querySelectorAll(".selected").forEach(x=>x.classList.remove("selected"));
 e?.classList.add("selected");
 showPanel(o)
}

function showPanel(o){
 $("#panel-type").textContent=o.type||"Location";
 $("#panel-title").textContent=o.name||"Unknown";
 $("#panel-subtitle").textContent=o.subtitle||"";
 $("#panel-description").textContent=o.description||"No description available.";

 const img=$("#panel-image");
 img.style.display=o.image?"block":"none";
 img.style.backgroundImage=o.image?`url("${o.image}")`:"";

 $("#panel-stats").innerHTML=Object.entries(o.stats||{}).map(([k,v])=>
  `<div class="panel-stat"><span>${esc(k)}</span><span>${esc(v)}</span></div>`
 ).join("");

 $("#panel-actions").innerHTML=(o.actions||[]).map(a=>
  `<a href="${esc(a.url||"#")}">${esc(a.name||"Open")}</a>`
 ).join("");

 panel.classList.add("open")
}

function closePanel(){
 panel.classList.remove("open");
 document.querySelectorAll(".selected").forEach(x=>x.classList.remove("selected"))
}

function updateTransform(){
 world.style.transform=`translate(${panX}px,${panY}px) scale(${zoom})`;
 $("#zoom-value").textContent=`${Math.round(zoom*100)}%`
}

function resetMap(){
 zoom=MAP.start.zoom||1;
 panX=-(MAP.start.x||0)*zoom;
 panY=-(MAP.start.y||0)*zoom;
 updateTransform()
}

function setZoom(next,cx=viewport.clientWidth/2,cy=viewport.clientHeight/2){
 next=Math.max(.15,Math.min(4,next));

 const ox=cx-viewport.clientWidth/2-panX,
 oy=cy-viewport.clientHeight/2-panY,
 wx=ox/zoom,
 wy=oy/zoom;

 zoom=next;
 panX=cx-viewport.clientWidth/2-wx*zoom;
 panY=cy-viewport.clientHeight/2-wy*zoom;

 updateTransform()
}

viewport.addEventListener("pointerdown",e=>{
 if(e.target.closest(".map-marker,.region,.map-label,.map-panel,.map-toolbar,.map-zoom"))return;

 drag=true;
 viewport.classList.add("dragging");

 startX=e.clientX;
 startY=e.clientY;
 startPanX=panX;
 startPanY=panY;

 viewport.setPointerCapture(e.pointerId)
});

viewport.addEventListener("pointermove",e=>{
 if(!drag)return;

 panX=startPanX+e.clientX-startX;
 panY=startPanY+e.clientY-startY;

 updateTransform()
});

["pointerup","pointercancel"].forEach(t=>
 viewport.addEventListener(t,()=>{
  drag=false;
  viewport.classList.remove("dragging")
 })
);

viewport.addEventListener("wheel",e=>{
 e.preventDefault();

 const r=viewport.getBoundingClientRect();

 setZoom(
  zoom*(e.deltaY<0?1.12:.89),
  e.clientX-r.left,
  e.clientY-r.top
 )
},{passive:false});

$("#zoom-in").onclick=()=>setZoom(zoom*1.15);
$("#zoom-out").onclick=()=>setZoom(zoom/1.15);
$("#reset-map").onclick=resetMap;
$("#panel-close").onclick=closePanel;

$("#toggle-labels").onclick=()=>{
 labelsVisible=!labelsVisible;
 document.querySelectorAll(".map-label").forEach(e=>e.classList.toggle("hidden",!labelsVisible))
};

$("#map-filter").onchange=e=>{
 const type=e.target.value;

 document.querySelectorAll(".map-marker").forEach(m=>
  m.style.display=type==="all"||m.dataset.type===type?"flex":"none"
 )
};

viewport.onclick=e=>{
 if(!e.target.closest(".region,.map-marker,.map-label"))closePanel()
};

renderMap();
</script>
</body>
</html>
