Kiara Clio Katzol, commonly known as Kiara Katzol, is a [[fandom:Felior]] and one of the [[fandom:Mystical Legends]]. A student of [[fandom:Regnum Academy]] and member of the [[fandom:Black Rampart]] Cohort, she has a deity contract with [[fandom:Zekron]]. Her abilities combine Lightning Magic, Sage Magic, Regnum Spei, alchemy, and ki, with later powers associated with the Goddess of Death.

|tab=Overview

== Overview ==
Kiara is a Felior student in Regnum Academy’s 1A Homeroom, taught by Pecunia Hish. Other students listed in the same homeroom include Avery Obtainia, Teddric Tech, River Grantia, and Raymond Valoris.

She belongs to the Black Rampart Cohort, led by Centurion Carla Storm. The cohort also includes Jane Tee and Raymond Valoris. Kiara’s familiar is a Derpy Tiger.

== Mystical Rank and Divine Connections ==
Kiara’s recorded magic rank is '''Tier 3, Level 2''' during I.T.E.R. Chronicles.

{{Spoiler|By Interlude I, Kiara is listed at '''Tier 6, Level 1–Level 2'''. The world notes associate her with Wind among the Gods of the Prime Elements and identify her as the '''Goddess of Death'''. They also list her and Raymond Valoris in District 10’s future Magni succession, following King Aedalus and Prince Aether.}}

Kiara’s deity contract is with [[fandom:Zekron]], the Skylander, Storm Mage, and Lightcrown God. Her other divine connections include the blessings described in her Regnum Spei.

== Divine Blessings ==
{{Spoiler|Kiara’s Shadow Clones are associated with Artiana’s Blessing; Space Phasing with Mercemes’ Blessing; Severance with Hadestias’ Blessing; and Energy Condensation with Son Adoli’s Blessing. Her Soul Magic is absorbed from Hadestias’ Catalyst.}}


== Personality ==
The two supplied novels do not include a named Kiara scene, so they do not support a new personality analysis based on dialogue or decisions. Her Felior background, divine connections, and later development remain the established wider-series information on this page.

== Early History ==
Kiara's established profile belongs to the later I.T.E.R. Chronicles storyline and the wider notes. The supplied Book 2 is '''Initialization'''; it does not yet depict her named introduction in '''Rectification'''. This distinction prevents events from the later part of the arc from being placed in the wrong volume.

== Early Magic Rank & Heritage ==
Kiara's '''Tier 3, Level 2''' I.T.E.R. entry and later Interlude progression come from the notes already used by this page. Book 1 and Initialization do not provide a new rank measurement for her. The unnamed Felior children Avery rescues are not identified as Kiara and should not be substituted for an appearance.

== Early Equipment ==
The Gathering Sickle and later abilities remain part of Kiara's broader catalogue. Neither supplied volume depicts her obtaining or wielding the weapon, so no early-book acquisition event is added.

== Synopsis ==

=== The Rune of the Spellcaster ===

Kiara is not named in Rune of the Spellcaster. Its introduction of Mystical species and social prejudice supplies setting context but does not establish her participation in the rescue, academy arrival, or orb confrontation.

=== I.T.E.R. Chronicles — Initialization ===

Kiara is not named in the supplied Initialization manuscript. Her recorded debut in Rectification follows this volume, and her existing Black Rampart and 1A connections are preserved as wider-series information. Avery's rescue of unnamed Felior children establishes the dangers facing demihumans generally, not a documented connection to Kiara personally.

=== Sources ===
No named appearance in the supplied Book 1 or Book 2 main narrative.

== Powers & Abilities ==

== Established Abilities ==

=== Early-Book Scope ===

These volumes do not show Kiara performing Lightning, Sage, or divine techniques. The abilities below retain their existing distinctions between creator notes, later lore, and gameplay, without assigning them new Book 1 or 2 feats.

== Wider-Series Ability Catalogue ==
== Powers & Abilities ==
Kiara’s powers combine Lightning Magic and Sage Magic with Regnum Spei, alchemy, ki, and her Felior characteristics.

== Lightning Magic / Electrokinesis ==
Kiara possesses [[fandom:Lightning|Lightning Magic]], also described as Electrokinesis. Her lightning techniques include close-range claw attacks, lightning-infused strikes, and wide-area pulses.

=== Lightning God Mode ===
In Mystical Legends: Game, Lightning God Mode infuses Kiara’s attacks with yellow lightning, increases attack speed, and releases shockwaves as its power meter is consumed. The skill applies Electrocute.

=== Lightning Discharge ===
The game’s Lightning Discharge converts qualifying lightning-based attacks into Lightning Element damage. These attacks weaken barriers and reduce an opponent’s defense, while applying Charged counters. Lightning and Water interactions trigger additional damage and reactive explosions.

=== Electrostasis Pulse ===
Kiara gathers lightning into her palm and releases it around herself. In the game, Electrostasis Pulse is a wide-area Ultimate Skill that interacts with her active power meter.

=== Wind Affinity in the Game ===
The game design lists Kiara’s unit affinity as Wind and uses Wind damage for several lightning-themed skills. Lightning Discharge can convert qualifying attacks into the separate Lightning Element. Her listed game affinity does not replace the Lightning Magic described here.

== Sage Magic ==
[[fandom:Sage|Sage Magic]] is among Kiara’s magical disciplines.

== Regnum Spei ==

=== Contamination ===
[[fandom:Contamination]] is one of the Eight Forces wielded by Kiara. In Mystical Legends: Game, it allows two unlocked elemental infusions to apply simultaneously through an infusion Special Skill, so her Basic Skill can apply both elements at once.

=== Electro-charged ===
[[fandom:Electro-charged]] is one of Kiara’s Regnum Spei.

=== Dark Lightning ===
Kiara’s Regnum Spei includes [[fandom:Dark Lightning]].

=== Shadow Clones ===
{{Spoiler|Kiara’s [[fandom:Shadow Clones]] are granted through [[fandom:Artiana]]’s Blessing.}}

=== Space Phasing ===
{{Spoiler|Kiara’s [[fandom:Space Phasing]] is granted through [[fandom:Mercemes]]’ Blessing.}}

=== Severance ===
{{Spoiler|[[fandom:Severance]] is a space-tearing ability associated with [[fandom:Hadestias]]’ Blessing.}}

=== Soul Magic ===
{{Spoiler|Kiara gains [[fandom:Soul Magic]] by absorbing it from Hadestias’ Catalyst.}}

=== Soul Corridor ===
[[fandom:Soul Corridor]] is included among Kiara’s Regnum Spei.

=== Energy Condensation ===
{{Spoiler|Kiara’s [[fandom:Energy Condensation]] is associated with [[fandom:Son Adoli]]’s Blessing.}}

== Alchemy ==
[[fandom:Alchemy]] is one of Kiara’s disciplines.

== Gathering Sickle ==
The [[fandom:Gathering Sickle]] is listed in the game design as an SSR weapon with the seal ring '''Funeral Ring of Death'''. Its Weapon Skill, '''Night’s Bitter Edge''', creates a cut in space when attacking the air.

{{Spoiler|In the game design, its seal-ring effect is unlocked through the Seal Ritual and can inflict Severance. Severance is described as a space-tearing debuff that disables defense and makes the soul vulnerable.}}

== Awareness and Empowerment Ki ==
Kiara uses both [[fandom:Awareness Ki]] and [[fandom:Empowerment Ki]].

== Felior Characteristics ==
[[fandom:Felior|Feliors]], also called Catsikan in the notes, are demihuman Mystical Beings with feline features such as cat ears, a tail, and cat-like postures and gestures. They are known for agility, maneuverability, elasticity, and speed-enhancing magic alongside their elemental affinities.

=== Feline Fury ===
Kiara’s Basic Skill in Mystical Legends: Game uses rapid close-range swipes, lightning claws, a pouncing strike, and a spinning claw attack.

=== Lynx Prowl ===
The game’s Lynx Prowl enters a Golden Flash state that increases movement speed and skill damage. Her Basic Skill phases her forward before striking. These benefits come with reductions to health and defense.

== God Slayer Transformation ==
{{Spoiler|[[fandom:God Slayer Transformation]] is one of Kiara’s transformations.}}

|tab=Relationships

== Relationships ==

=== Early-Book Scope ===

Her recorded ties to Zekron, Raymond, and Black Rampart are not individually dramatized in the supplied volumes. Their existing entries remain available below, without a fabricated meeting or relationship progression.

== Wider-Series Relationships ==
== Relationships ==

== Zekron ==
Kiara has a deity contract with [[fandom:Zekron]], who is described in the notes as the Skylander, Storm Mage, and Lightcrown God. His affinity is Power Magic.

== Regnum Academy and Black Rampart ==
Kiara shares 1A Homeroom with [[char/avery_obtainia|Avery Obtainia]], [[fandom:Teddric Tech]], [[fandom:River Grantia]], and [[fandom:Raymond Valoris]], among other students.

Within Black Rampart, [[fandom:Carla Storm]] serves as Centurion. [[fandom:Jane Tee]] and Raymond Valoris are also listed as cohort members.

== Raymond Valoris ==
Raymond is listed alongside Kiara in both her homeroom and Black Rampart Cohort.

{{Spoiler|The notes also name Kiara and Raymond in District 10’s future Magni succession.}}

== Divine Blessings ==
{{Spoiler|Artiana, Mercemes, Hadestias, and Son Adoli are associated with Kiara’s Shadow Clones, Space Phasing, Severance, and Energy Condensation respectively. Her Soul Magic is absorbed from Hadestias’ Catalyst.}}
