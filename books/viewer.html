<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Document Viewer</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    color:#eee;
    font-family:Arial,sans-serif;
    user-select:none;
}

#app{
    position:relative;
    width:100%;
    height:100%;
    display:flex;
}

/* Sidebar */
#sidebar{
    position:absolute;
    z-index:20;
    top:0;
    left:0;
    width:320px;
    max-width:85vw;
    height:100%;
    overflow:hidden;
    background:#181818;
    border-right:1px solid #333;
    box-shadow:4px 0 18px rgba(0,0,0,.45);
    transform:translateX(-100%);
    transition:transform .25s ease;
}

#sidebar.open{
    transform:translateX(0);
}

.sidebar-header{
    height:58px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 16px;
    background:#202020;
    border-bottom:1px solid #333;
}

.sidebar-header h2{
    margin:0;
    font-size:17px;
}

#closeSidebar{
    border:0;
    background:none;
    color:#ddd;
    font-size:26px;
    cursor:pointer;
}

#outline{
    height:calc(100% - 58px);
    padding:10px;
    overflow:auto;
}

.outline-list{
    margin:0;
    padding:0;
    list-style:none;
}

.outline-list .outline-list{
    padding-left:16px;
}

.outline-item{
    margin:2px 0;
}

.outline-link{
    width:100%;
    padding:9px 10px;
    border:0;
    border-radius:6px;
    background:none;
    color:#ddd;
    font-size:14px;
    text-align:left;
    cursor:pointer;
}

.outline-link:hover{
    background:#2c2c2c;
    color:#fff;
}

/* Overlay */
#sidebarOverlay{
    position:fixed;
    z-index:19;
    inset:0;
    display:none;
    background:rgba(0,0,0,.45);
}

#sidebarOverlay.show{
    display:block;
}

/* Toolbar */
#toolbar{
    position:fixed;
    z-index:15;
    top:12px;
    left:12px;
    display:flex;
    gap:8px;
}

.toolbar-btn{
    height:40px;
    min-width:40px;
    padding:0 12px;
    border:1px solid #444;
    border-radius:7px;
    background:rgba(25,25,25,.92);
    color:#eee;
    font-size:17px;
    cursor:pointer;
    box-shadow:0 2px 10px rgba(0,0,0,.35);
}

.toolbar-btn:hover{
    background:#333;
}

/* Viewer */
#viewer{
    width:100%;
    height:100vh;
    overflow:auto;
    padding:55px 12px 35px;
    text-align:center;
}

.pdf-page{
    position:relative;
    width:max-content;
    margin:20px auto;
    line-height:0;
    background:#fff;
    box-shadow:0 0 20px rgba(0,0,0,.8);
}

.pdf-page canvas{
    display:block;
}

/* PDF links */
.annotation-layer{
    position:absolute;
    z-index:5;
    inset:0;
    pointer-events:none;
}

.annotation-link{
    position:absolute;
    display:block;
    pointer-events:auto;
    cursor:pointer;
    line-height:normal;
    text-decoration:none;
    background:rgba(0,100,255,0);
}

.annotation-link:hover{
    background:rgba(60,130,255,.12);
    outline:1px solid rgba(80,150,255,.45);
}

/* Watermark */
#watermark{
    position:fixed;
    z-index:30;
    top:10px;
    right:20px;
    color:rgba(255,255,255,.25);
    font-size:13px;
    pointer-events:none;
}

.empty-outline{
    padding:20px 10px;
    color:#888;
    font-size:14px;
    text-align:center;
}

@media(max-width:600px){
    #sidebar{
        width:285px;
    }

    #viewer{
        padding-left:5px;
        padding-right:5px;
    }
}
</style>
</head>

<body>

<div id="app">

    <aside id="sidebar">
        <div class="sidebar-header">
            <h2>Book Navigation</h2>
            <button id="closeSidebar" aria-label="Close navigation">×</button>
        </div>

        <nav id="outline"></nav>
    </aside>

    <div id="sidebarOverlay"></div>

    <div id="toolbar">
        <button id="openSidebar" class="toolbar-btn" title="Book navigation">☰</button>
    </div>

    <div id="watermark">Protected View</div>

    <main id="viewer"></main>

</div>

<script type="module" src="viewer.js"></script>

<script>
document.addEventListener("contextmenu",e=>e.preventDefault());

document.addEventListener("keydown",e=>{
    if(
        (e.ctrlKey&&["s","p","u"].includes(e.key.toLowerCase()))||
        e.key==="F12"
    ){
        e.preventDefault();
    }
});
</script>

</body>
</html>
