Pyrus Bourn, also called Pyro, is the ruler of District 3 and the principal antagonist of Rune of the Spellcaster. He operates from a volcano-associated industrial lair and relies on Fire Increaser technology before the orb transforms his relationship to magic. The bonus chapters also give him a historical role among the first island settlers, complicating a portrayal based solely on his present-day violence.

|tab=Overview

== Overview ==
Pyrus Bourn, also called Pyro, is the ruler of District 3 and the principal antagonist of Rune of the Spellcaster. He operates from a volcano-associated industrial lair and relies on Fire Increaser technology before the orb transforms his relationship to magic. The bonus chapters also give him a historical role among the first island settlers, complicating a portrayal based solely on his present-day violence.

== Personality ==
Pyrus resents the island's unequal and divided order, but pursues unity through personal dominance. He argues that coercion and destructive power can produce a better society while discounting the harm his actions cause. His rhetoric supplies a motive; it does not validate his methods.

He is theatrical, proud of his swordsmanship, and intolerant of humiliation, yet often engages in comic exchanges with Tom and Tony. The historical chapters show him fighting a common threat alongside the settlers. His later desire for supremacy therefore exists beside a capacity for cooperation when circumstances align, rather than a uniformly altruistic or uniformly mindless personality.

== Mystical Rank & Heritage ==
Before the orb crisis, Pyrus's flame output depends on manufactured equipment and substances rather than an ordinary innate reserve. After contact with the Terracustodis, Avery estimates him at '''Tier 3, Altus, Level 1'''; that is a character's immediate estimate, not a final formal assessment. The existing notes' around-Tier-4–5 summary and later Tier 7 entry concern broader progression.

The orb changes his body and spiritual makeup, allowing inferno discharge and a flame-like state. The first book's resolution explains that earlier magical exposure contributed to this outcome and that draining and restraining him is necessary. The transformation does not give him limitless sustainable output.

== Tools and Equipment ==
Pyrus uses a sword, armor, Fire Increaser products, communications equipment, and a helicopter. The Terracustodis is an ancient source of immense chaotic magic, not a device he creates. After his defeat, the orb is removed to District 7's secure custody; his ability to generate inferno remains part of his transformed condition.

== Trivia ==
* His animal motif is a lion.

|tab=Synopsis

== Synopsis ==

=== The Rune of the Spellcaster ===

==== Search for the Orb ====

Pyrus and his men search the Sky House area in New York while Avery and River observe them. His pursuit of the earth orb later reaches Regnum, where stolen information helps him exploit a security opening. He confronts Charlotte and has her abducted so Ellie can question her about the orb, forbidden magic, and the Angelor rune.

The rescue party infiltrates District 3, but Pyrus turns his attention to Avery and the rune. Capturing Avery aboard a helicopter, he obtains access to the sealed orb and brings the conflict back toward Lux Urbis. The artifact's unstable release causes a destructive crisis at the town hall.

==== Inferno Awakening and Defeat ====

Both Avery and Pyrus are affected by contact with the orb, but Pyrus becomes a flame-wielding being with powerful destructive discharge. He defeats Avery and then overwhelms Kaden as the hereditary ice blade exhausts the prodigy. Atlas and Charlotte finally contain and suppress him through combined compressed water and purple flames.

Pyrus is imprisoned under magic-regulating security. Council representatives sentence him indefinitely for his offenses and place District 3 under seizure, while his subordinates receive less severe sentences. His dissatisfaction with the ruling order persists even after defeat.

==== Historical Bonus Chapter ====

Journey of the Mystical Beings depicts an earlier Pyrus pursuing the settlers' voyage with Tom and Tony. His clash with them gives way to the wider threat associated with Ion Mustard. Once on the island, he settles around a volcanic mountain while retaining his antagonistic ambitions and his advisers' comic companionship.

=== I.T.E.R. Chronicles — Initialization ===

==== Consequences in the Main Narrative ====

Initialization treats Pyrus's attack as a recent security and political crisis. His defeat motivates new training, concerns over leaked knowledge of the orb, and Kaden's expansion of IT's defensive projects. The present-day story does not depict a new escape or a second modern confrontation with Pyrus in this volume.

==== Historical Bonus Chapters ====

An Evil Man's Visit returns to the earlier volcanic base. A delivery attributed to Mustard supplies armor, and Pyrus ventures into the settlement while Lord Doom's threat emerges. He ends up aiding the settlers against skeletons, while Tom and Tony bring a truck obtained from a wreck. The chapter ends with the defenders facing Doom's larger assault. These scenes concern the historical island storyline, not events occurring after his modern imprisonment.

=== Sources ===
Book 1: Chapters 4, 11–16; Journey of the Mystical Beings. Book 2: Chapters 5, 10–12; An Evil Man's Visit.

|tab=Powers & Abilities

== Powers & Abilities ==

== Established Abilities ==

=== Swordsmanship and Manufactured Flame ===

Before awakening, Pyrus combines exceptional weapon handling and physical pressure with Fire Increaser equipment. His first duel with Charlotte shows that a lack of normal innate magic does not make him a harmless opponent.

=== Inferno Magic ===

After touching the orb, he produces fireballs, Flame Whip, Hellflame Meteor, and Hellblast Charge, and temporarily becomes separable flames. His regenerating discharge and heavy reservoir pressure the students, but continued use and the captains' suppression expose limits.

=== Vulnerabilities ===

Kaden's extreme cold can dim his flames, while Atlas's confinement and Charlotte's stripping flame attacks reduce his advantage. His final restraint and IT's prison regulation establish that transformation can be controlled; the orb itself is no longer in his possession.

|tab=Relationships

== Relationships ==

=== Tom, Tony, and Ellie ===

[[char/tom_nado|Tom]], [[char/tony_smith|Tony]], and [[char/ellie_tracey|Ellie]] are distinct subordinates with Wind, Earth, and Lightning specialties. Tom and Tony also appear as advisers in the historical chapters; Ellie's modern interrogation role is separately introduced.

=== Avery and Kaden ===

[[char/avery_obtainia|Avery]] provides access to the rune Pyrus seeks. [[char/kaden_icelander|Kaden]] organizes the rescue and attempts to defeat him with the Icelorian Sword. Their resistance forces Pyrus to exercise his new power but does not alone end the crisis.

=== Charlotte and Atlas ===

[[char/charlotte_levy|Charlotte]] is his captive and later one of the captains who defeats him. [[char/atlas_aquia|Atlas]] supplies the containment necessary for his arrest. Their defense challenges his claim that indiscriminate destruction will improve the city.
