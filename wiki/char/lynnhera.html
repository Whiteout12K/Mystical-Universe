== Overview ==
Lynnhera, also called Lin Li and Isis of Many Colors in Book 2's reference material, is the '''Spiritstone Goddess'''. The catalogue associates her inheritance with spirit-based magic such as healing and purification. Her wider-series spiritual connection with Avery is retained in this page's infobox, but she is not named as an active participant in either early main narrative.

== Personality ==
Neither early main narrative supplies a named Lynnhera conversation or personal decision. Her deity classification and magical domain are therefore firmer grounds for this page than attributing the unidentified woman's dialogue in Avery's vision directly to her.

== Mystical Rank & Heritage ==
Book 2's divine catalogue classifies Lynnhera as a goddess associated with spirit-based magic. It does not give her a personal numerical rank in that entry. The copied Caela information previously placed here—Angelor and Magni of District 7—describes a different character and is not evidence for Lynnhera's identity.

== Tools and Equipment ==
The cited early-book entry does not identify a personal weapon, rune, or property for Lynnhera. Avery's rune is his artifact; its unresolved history is not enough to assign ownership to her in these two volumes.

== Synopsis ==

=== The Rune of the Spellcaster ===

Lynnhera is not named in the main narrative of Rune of the Spellcaster. Avery sees an unidentified woman after touching the orb, but the scene does not name her. That vision should remain an unresolved part of Avery's story rather than become a confirmed Lynnhera appearance.

=== I.T.E.R. Chronicles — Initialization ===

The end-of-volume divine catalogue names Lynnhera as the Spiritstone Goddess and associates her with healing, purification, and related spirit-based magic. This is reference material, not a scene depicting an intervention in the robot or academy plots.

Avery's concluding resonance with his rune suggests ancient and unfamiliar power, but the manuscript does not explicitly identify that sensation as Lynnhera. The later spiritual bond recorded in the wider lore can remain on the page without retroactively resolving the novel's mystery.

=== Sources ===
Book 2: divine catalogue (Lynnhera / Lin Li / Isis of Many Colors).

== Established Abilities ==

=== Spirit-Based Magic ===

The Book 2 catalogue links Lynnhera's inheritance to healing and purification. It does not specify an individual spell sequence, its range, or its limits. The broader Mage and spiritual-bond lore should be read separately from what this short catalogue entry establishes.

|tab=Relationships

== Relationships ==

=== Avery Obtainia ===

The existing wider lore records a spiritual bond with [[char/avery_obtainia|Avery]]. The first two main narratives leave the identities behind his visions and ancient power unresolved; they do not yet explain the bond directly.

=== Caela Obtainia ===

[[char/caela_obtainia|Caela]] is a distinct Angeloress involved in the island's historical founding and orb protection. Her biography and District 7 office do not belong in Lynnhera's infobox.
