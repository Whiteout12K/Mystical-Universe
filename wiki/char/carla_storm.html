== Overview ==
Carla is Black Rampart's centurion and a supervising captain during the freshmen's unusual recruitment battle. Book 2 describes her as a pale, mid-height woman with brown hair, gentle blue eyes, a gray dress, and a satchel. Her contribution is principally judgment and explanation rather than a featured duel.

== Personality ==
Carla is direct and socially composed, yet willing to rebuke Cedric's eagerness for conflict. She distinguishes meaningful testing from an escalating risk. Her explanation that precautions were necessary gives the intervention a rationale beyond disliking an exciting fight.

She also understands the institution's traditions and can explain them without simply excluding newcomers. Her acceptance of Jane helps turn the recruitment event into an opportunity after the dispute has been resolved.

== Mystical Rank & Heritage ==
The existing notes identify Carla as an Elf. Book 2 establishes her position as Black Rampart centurion and her understanding of Compression, but does not give an exact personal tier or demonstrate a specific elemental affinity in these appearances.

== Tools and Equipment ==
Carla carries a satchel in her introduction. No named weapon or magical artifact is used by her in the cited recruitment scenes, so the description does not assign one based on another character's abilities.

== Synopsis ==

=== The Rune of the Spellcaster ===

Carla is not named in the first novel's main story. Her direct involvement in the supplied books begins with the second volume's cohort challenge.

=== I.T.E.R. Chronicles — Initialization ===

Carla arrives with the other captains while the first-years challenge the second-years and Elmor. She explains the normal restriction on admitting freshmen, but takes part in judging the exceptional performance. When Avery's Compression appears, she identifies the underlying force as gravity and discusses the connection to combined affinities.

She pushes back against Cedric's preference to let the escalating conflict continue and supports precautions. After the captains approve the group, she offers Jane a place in Black Rampart. The novel's later cohort catalogue reinforces the group's emphasis on completing missions.

=== Sources ===
Book 2: Chapters 2–3; cohort catalogue.

== Powers & Abilities ==

== Established Abilities ==

=== Magical Knowledge ===

Carla recognizes Compression as one of the Eight Forces and explains its relation to gravity. This demonstrates understanding rather than proof that she personally possesses the same Regnum Spei.

=== Leadership and Assessment ===

Her shown skills concern evaluating risk, recruitment, and the rules governing a supervised match. The two books do not provide a full combat demonstration from which to describe a unique fighting style.

|tab=Relationships

== Relationships ==

=== Jane Tee ===

[[char/jane_tee|Jane]] is recruited into Carla's cohort in Book 2. The notes also list Kiara and Raymond in Black Rampart, but their individual involvement is not depicted in these two novels.

=== Fellow Captains ===

Carla challenges [[char/cedric_paine|Cedric]]'s combative habits and participates in the discussion with [[char/atlas_aquia|Atlas]], [[char/charlotte_levy|Charlotte]], and [[char/elmor_locks|Elmor]]. Their interaction gives her a mediating role in the institution's decisions.
