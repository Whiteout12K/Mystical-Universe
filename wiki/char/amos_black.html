Amos Black is a Magnivirigentis and one of the Mystical Legends. Known as the Tank, he is associated with IT Industries security and leads IT Agency’s T-Unit.

|tab=Overview

== Background ==
Amos works in IT Industries security and leads IT Agency’s T-Unit. His Fandom profile also associates him with Blue Legion and identifies Lily Black as his sister.

== Family ==
* [[Lily Black]] (Sister)

== Trivia ==
* His inspirations include Xibalonque and Carrion.
* His animal motif is a grizzly bear; his fruit motif is blackberries.
