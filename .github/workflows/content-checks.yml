name: Website content checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: content-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare EPUBs in the CI checkout
        run: python3 books/epub/prepare-epub.py --scan
      - name: Rebuild generated website indexes
        run: python3 scripts/build-site-index.py
      - run: python3 scripts/check-content.py
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: node --test tests/test-*.mjs
  sync-indexes:
    name: Save updated website indexes
    needs: check
    if: github.event_name == 'push' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate and save indexes
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin "$TARGET_BRANCH"
            git checkout -B index-sync FETCH_HEAD
            python3 scripts/build-site-index.py
            git add -- data/search-index.json data/wiki-search-index.json data/character-connections.json data/books.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Update generated website indexes'
            if git push origin "HEAD:refs/heads/$TARGET_BRANCH"; then exit 0; fi
          done
          echo '::error::Could not save generated indexes after three attempts. Check branch write permissions.'
          exit 1
