== Overview ==
Tom is Pyrus Bourn's right-hand subordinate and a Wind-affinity fighter whose tornadoes provide pursuit, restraint, and transport. His dark-red hair, gray shirt, and athletic trousers accompany his first modern appearance during the Sky House search. He is also one of Pyrus's longstanding advisers in the historical island chapters.

== Personality ==
Tom is loyal to Pyrus and eager to finish his assigned job. His experience shows in the way he escapes a combined trap and immediately answers the boss's call. He can also be bluntly comic, especially when explaining his actions or arguing with Tony.

His loyalty has practical substance in the historical chapters: he follows the skeleton army with a truck because he expects Pyrus to be in trouble. The same readiness to support his leader later makes him complicit in kidnapping and destructive attacks. Humor does not remove his responsibility for that work.

== Mystical Rank & Heritage ==
The existing lore identifies Tom as a Wentor. He states that the three subordinates trained to deal with Tier 5, Maximus opponents, but this is a claim about their training rather than a declaration of his own exact tier. His displayed wind control supports substantial combat experience without supplying a formal rank.

== Tools and Equipment ==
Tom uses a personal communications device to receive Pyrus's instructions. His wind itself supplies the most important movement tool: tornado platforms can carry him, his colleagues, and captives. A truck appears with Tom and Tony in the historical chapters and is obtained from wrecked equipment, not generated through his affinity.

== Trivia ==
* The character’s animal motif is a monkey.

|tab=Synopsis

== Synopsis ==

=== The Rune of the Spellcaster ===

==== Abduction and Rescue Battle ====

Tom accompanies Pyrus's New York search and later helps take Charlotte from Regnum. His gust pins the defenders down, and wind restraint lifts the teacher to the villain's side before the escape. At the District 3 base he pursues Avery's infiltration group and restores order when Tony has been knocked down.

Ted and Jane combine a steel hammer and rapidly regrowing plants to trap him. Tom uses wind thrust to deflect the hammer's fall and escape. Their renewed restraints do not keep him from leaving when Pyrus calls for help.

==== Orb Disaster ====

Tom reaches Lux Urbis and attempts to suppress the artifact's unnatural flames with a powerful wind release. The effort only slightly diminishes them. He is caught in the destruction surrounding the orb and is eventually arrested with Pyrus. The resolution places all three modern subordinates in neighboring prison cells.

==== Historical Role ====

In Journey of the Mystical Beings, Tom and Tony advise Pyrus, help pursue and board the settlers' vessel, and eventually settle beside their leader on the island.

=== I.T.E.R. Chronicles — Initialization ===

Tom does not receive a new present-day rescue or escape scene in Initialization. His modern status follows the preceding imprisonment.

An Evil Man's Visit depicts his historical partnership with Tony: they open and help fit Pyrus's delivered armor, then follow a skeleton force and bring their leader a truck. Their intervention lets Pyrus and his temporary allies reposition before facing the next assault. The humorous navigation dispute and admissions about scavenged supplies reveal their working relationship alongside the danger.

=== Sources ===
Book 1: Chapters 4, 11–16; Journey of the Mystical Beings. Book 2: An Evil Man's Visit.

|tab=Powers & Abilities

== Powers & Abilities ==

== Established Abilities ==

=== Wind Mobility and Restraint ===

Tom rides tornadoes, pushes enemies down with gusts, and uses focused wind for thrust. These applications allow him to choose height and escape routes as well as attack.

=== Defensive Maneuvering ===

Against Ted's descending hammer, he shifts its weight and direction rather than simply stopping the full impact. The scene demonstrates experienced use of movement and force.

=== Limits ===

His typhoon-scale response does not fully extinguish the orb's fire. That distinction keeps an impressive elemental display from being overstated as control over an ancient catalyst.

|tab=Relationships

== Relationships ==

=== Pyrus Bourn ===

[[char/pyrus_bourn|Pyrus]] is Tom's leader in both the historical and modern scenes. Tom follows operational calls and remains responsible for supporting the villain's acts.

=== Tony Smith ===

[[char/tony_smith|Tony]] is Tom's fellow adviser and frequent comic counterpart. They argue about details while continuing to work together.

=== Ted and Jane ===

[[char/teddric_tech|Ted]] and [[char/jane_tee|Jane]] combine their techniques against him during the rescue, forcing him to employ defensive wind mobility.
