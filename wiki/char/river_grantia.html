River Grant, also known as River Grantia, is a Naiad and Vulpivor of the Aquia family. She belongs to the Mystical Legends and Mystic cohort, and her water magic supports protection and healing.

|tab=Overview

== Background ==
River attends Regnum Academy’s 1A homeroom and belongs to Mystic. Her Aquia family includes Atalantia, Oceanus, Atlas, and Alteria. Her recorded rank in Rune of the Spellcaster is Tier 3, Level 2.

== Trivia ==
* Her inspirations include Columbina and Leon Cromwell.
* Her animal motif is a fox; her fruit motif is a pear.
