<!doctype html>
<html lang="en">
<head>
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="256x256" href="/images/website/favicon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Main Character Skill Tree</title>
<link rel="stylesheet" href="/ml-game/css/mlg-skill.css">
<link rel="stylesheet" href="/css/mlg.css">
<style>
body { margin:0; padding:10px 0; background:transparent; }
.path-node { padding:12px 0; border-bottom:1px solid #d6aa4526; }
.path-node:last-child { border-bottom:0; }
h3 { margin:0 0 8px; font-size:13px; color:#eddcb0; }
.path-icon { width:38px; height:38px; object-fit:cover; border-radius:50%; margin-right:10px; vertical-align:middle; }
.c4-rich-text { font-size:9px; line-height:1.45; }
.icon-container { display:flex; align-items:flex-start; gap:10px; }
.effect-icon { flex:none; padding-top:3px; }
.effect-text { min-width:0; }
.empty { color:#bba77e; font-size:9px; line-height:1.5; }
a { color:#eddcb0; }
</style>
</head>
<body>
<div id="path-content" role="status">Loading saved path…</div>
<script>
'use strict';
let effects={},lastCookie=null,tree=null;
 const make=(tag,cls,text)=>{const n=document.createElement(tag);n.className=cls;if(text)n.textContent=text;return n;};
 function style(node,values={}) { for(const [key,value] of Object.entries(values))if(key in node.style)node.style[key]=typeof value==='number'?`${value}px`:value; }
 function rich(parent,text,values) { const p=make('div','c4-rich-text');p.innerHTML=embedded(text||'');style(p,values);parent.append(p); }
 function embedded(text,seen=new Set()) {
  return String(text).replace(/\{\{effect:([^}]+)\}\}/g,(_,id)=>effectHTML(id.trim(),seen));
 }
 function effectHTML(id,seen) {
  const effect=effects[id];if(!effect||seen.has(id))return '';
  const trail=new Set(seen);trail.add(id);
  const container=make('div','icon-container');container.style.paddingLeft='15px';container.style.paddingTop='10px';
  if(effect.icon){const icon=make('div','effect-icon');const image=document.createElement('img');image.src=effect.icon;image.alt=`${effect.name} Icon`;image.width=20;image.height=20;icon.append(image);container.append(icon);}
  const text=make('div','effect-text'),name=make('b',effect.class||'',`[${effect.name||id}]`);text.append(name);
  const keys=Object.keys(effect).filter(k=>/^description\d*$/.test(k)).sort((a,b)=>(a==='description'?1:Number(a.slice(11)))-(b==='description'?1:Number(b.slice(11))));
  keys.forEach((key,i)=>{const line=make('div','');style(line,effect[`${key}_style`]||(key==='description2'?effect.descrption2_style:null)||{});if(i===0){line.append(make('span',String(effect.type).toLowerCase()==='buff'?'buff':'debuff',effect.type||''),document.createTextNode(': '));}const content=make('span','');content.innerHTML=embedded(effect[key],trail);line.append(content);text.append(line);});container.append(text);return container.outerHTML;
 }

function pathCookie(){return document.cookie.split('; ').find(value=>value.startsWith('c4_skill_tree_path='))||'';}
function render(){
 if(!tree)return;
 const container=document.getElementById('path-content');container.replaceChildren();
 const cookie=pathCookie();lastCookie=cookie;
 let saved=[];try {saved=JSON.parse(decodeURIComponent(cookie.slice(cookie.indexOf('=')+1)));}catch{}
 const nodes=tree.nodes,active=[],adjacency=new Map(Object.keys(nodes).map(id=>[id,new Set()]));
 for(const [id,node] of Object.entries(nodes))for(const peer of node.before||[]){if(nodes[peer]&&peer!==id){adjacency.get(id).add(peer);adjacency.get(peer).add(id);}}
 const conflicts=node=>Array.isArray(node.conflict)?node.conflict:typeof node.conflict==='string'?[node.conflict]:[];
 if(Array.isArray(saved))for(const id of saved){
  if(typeof id!=='string'||!nodes[id]||active.includes(id))continue;
  if(active.some(peer=>conflicts(nodes[id]).includes(peer)||conflicts(nodes[peer]).includes(id)))continue;
  if(active.length?active.some(peer=>adjacency.get(id).has(peer)):id===tree.rootId)active.push(id);
 }
 if(!active.length){container.innerHTML='<p class="empty">No saved skill-tree path. Select nodes using Simulate Path on the <a href="/webpages/game-c.html?char=c4" target="_top">Main Character page</a>.</p>';return;}
 for(const id of active){
  const node=nodes[id],entry=make('section','path-node'),title=make('h3','');
  if(node.icon){const image=make('img','path-icon');image.src=node.icon;image.alt='';title.append(image);}
  title.append(document.createTextNode(node.name));entry.append(title);rich(entry,node.description,node.description_style);
  for(const part of node.additional||[])rich(entry,part.text,part.style);
  for(const stage of node.stages||[]){entry.append(make('h3','',stage.name));rich(entry,stage.text,stage.style);}
  container.append(entry);
 }
}
async function load(){
 try {
  const responses=await Promise.all([fetch('/images/mlg-assets/Characters/C4/skill-tree.json',{cache:'no-cache'}),fetch('/images/mlg-assets/data-effects.json',{cache:'no-cache'})]);
  if(responses.some(response=>!response.ok))throw Error();
  [tree,effects]=await Promise.all(responses.map(response=>response.json()));render();
 }catch {document.getElementById('path-content').textContent='The saved skill-tree path could not be loaded.';}
}
window.addEventListener('focus',()=>{if(pathCookie()!==lastCookie)render();});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&pathCookie()!==lastCookie)render();});
setInterval(()=>{if(!document.hidden&&pathCookie()!==lastCookie)render();},1500);
load();
</script>
</body>
</html>
