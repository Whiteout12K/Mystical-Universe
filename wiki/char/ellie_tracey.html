Ellie Tracey is an Elemental and one of [[char/pyrus_bourn|Pyrus Bourn]]’s three subordinates, alongside [[char/tom_nado|Tom Nado]], [[char/tony_smith|Tony Smith]]. The trio appears together as Pyro’s Subordinates in Mystical Legends: Game.

|tab=Overview

== Background ==
The notes list this character among the street villains associated with Pyro. The game represents all three subordinates through a shared unit rather than separate playable entries.

== Trivia ==
* The character’s animal motif is a lynx cat.
