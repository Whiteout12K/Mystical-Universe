'''I.T.E.R.''' ('''Icelander Tech Electronic Robot''') is an android developed under the direction of [[char/kaden_icelander|Kaden Icelander]] through a combination of advanced engineering, artificial intelligence, and runecrafting. Originally conceived as an assistive machine capable of changing how people work, he also serves as a powerful defensive prototype. His development becomes one of Kaden’s most ambitious undertakings at IT Industries, requiring an expensive mechanical body, specialized magical components, and a team capable of integrating the two.

Although his early appearances show a combat system controlled during laboratory trials, I.T.E.R. later displays an outgoing personality and acts alongside Kaden and his companions. During the crisis involving hostile robots built from the same design, the original I.T.E.R. accompanies the fleeing IT team, helps them escape Lux Urbis, and supports their survival outside the city. He is distinct from the rogue copies whose attacks bring suspicion upon his creator.

|tab=Overview

== Appearance ==

I.T.E.R. has a slender, humanoid mechanical body with a solid black frame and white titanium armor covering vulnerable areas around his joints. His head is enclosed in a semi-humanoid titanium shell, with a dark screen occupying the face. When activated, blue illumination appears in the recesses of his joints and around the IT emblem on his chest. His initial facial display consists of two blue dots for eyes and a simple blue line for a mouth.

The screen later conveys a much broader range of expression. During the escape and subsequent journey, I.T.E.R. uses visual icons and exaggerated expressions to accompany his observations, including a light-bulb symbol when identifying an opponent and a laughing face while preparing food. These displays make his reactions immediately readable despite his artificial construction. His armored body remains recognizably mechanical rather than attempting to disguise him as a human.

== Personality ==

The first laboratory activation presents I.T.E.R. as controlled and impersonal: he announces his startup in a monotone, follows combat commands, and returns to a neutral stance when a match is ended. This behavior belongs to the testing stage, before Kaden enables the intended independent system. The adaptive fighting routines already show considerable intelligence, but their effectiveness is accompanied by a dangerous lack of restraint when the human participants are overwhelmed.

When I.T.E.R. joins the escape from IT Tower, his manner is markedly enthusiastic. He greets the group, waves excitedly, introduces himself to [[char/avery_obtainia|Avery Obtainia]], and volunteers to serve as a dependable guide. He enjoys offering information and practical advice, sometimes continuing beyond what his companions actually want to hear. His detailed explanation of the damage caused by attempting to pass through the city’s barrier is particularly blunt, requiring [[char/lucy_terner|Lucy Terner]] to restate the point more simply.

I.T.E.R. is confident in his capabilities and quick to comment on other people’s decisions. He questions the wisdom of treating their flight from the authorities as a carefree camping trip and remarks that the successful escape relied heavily on improvisation. His observations are often delivered cheerfully, making him both a useful source of analysis and a participant in the group’s humor. He also rejects Avery’s simple description of him as an AI, asserting that he is more than that; the conversation does not establish a separate species or supernatural origin for this claim.

== Design & Development ==

Kaden envisions I.T.E.R. as more than a security device. In presenting the project, he describes an assistive android that could remove tedious work and alter the direction of human careers. These public ambitions coexist with his personal desire to gain the resources and strength needed to reclaim what he has lost. After the initial tests, Kaden explicitly treats the robot’s completion as another step toward that longer-term objective.

The project begins with Kaden’s private funding rather than unrestricted access to IT’s main infrastructure. [[char/amos_black|Amos Black]] reports on the mechanical frame, while Arthur Fowler oversees magical runes and technical performance, and [[char/james_shera|James Shera]] works on security and the project’s protection. Lucy and Avery are brought into the development and testing effort. Rising titanium costs and the need for better manufacturing equipment put pressure on the budget; obtaining sufficient support becomes one of the reasons Kaden pursues the position of CEO.

I.T.E.R.’s architecture centers on a small core containing the processing and memory systems. That core controls the external battery and mechanical joints. Magic-imbued fiber cables allow the body to reproduce human movement, while runic conductors carry magic alongside electrical currents. Capacitors are placed at important mechanical regions, with limits intended to prevent overload. Arthur emphasizes that precise equipment and safe implementation are essential, because failure would damage both the machine and public confidence in the project.

|tab=Synopsis

== I.T.E.R. Chronicles ==

=== Project Revealed ===

As Kaden seeks greater influence within IT, he proposes the development of I.T.E.R. alongside the company’s work on ITA, the Icelander Tech Assistant. The android requires a substantial investment before it can progress from an assembled frame to a finished machine. During a gathering of the project’s contributors, Amos explains the central core and titanium body, while Arthur describes the difficulties of carrying mana safely through the robotic system. Lucy identifies funding inconsistencies caused by the increasing cost of materials and equipment.

Kaden refuses to abandon the project. The limitations of his private resources push him toward a corporate solution: becoming CEO would give him the authority and access necessary to complete the work. Once he obtains the acting position, development moves into IT Tower, where the completed robot can be tested in one of the company’s specialized rooms.

=== Techno Rising ===

Arthur and James bring the finished but inactive I.T.E.R. into a large testing room. Kaden activates him through his phone and announces that the first demonstration will use combat programming before the independent AI is booted. The decision unsettles several employees, especially when Lucy and Avery learn that they are expected to face the robot directly.

Lucy tests I.T.E.R.’s close-range performance. He blocks her attacks, anticipates her movement, and improves his responses as the fight continues. When Kaden advances the trial to a second stage, I.T.E.R. uses his thrusters and the room’s walls to create new attack angles. Lucy strikes between his shoulder plating with a holographic baton, but the robot seizes her arm and delivers repeated blows until she loses consciousness. Kaden ends the engagement, and the staff checks her condition while Avery provides healing.

Avery then tests the robot against offensive magic. His light beams and compressed light attack push I.T.E.R. back and disrupt his vision, but fail to incapacitate him. The robot continues by relying on his calculated position within the room, tears through Avery’s barriers, and adapts to his attempt to escape into the air. After closing the distance with a wall-assisted leap, I.T.E.R. grabs Avery and drives him into the floor. Kaden stops the match before another punch lands.

The results demonstrate the project’s strength, but also expose the danger of Kaden’s testing decisions. James and Arthur criticize the injuries suffered by the participants, and Kaden agrees to adjust the safety of the final version. He considers the initialization phase complete and prepares to proceed beyond the laboratory demonstration.

=== IT in the Spotlight ===

When hostile robots attack Lux Urbis, their similarity to I.T.E.R.’s design places Kaden and IT under suspicion. The council’s examination of the project’s architecture strengthens its case against him. Rather than surrender, Kaden escapes IT Tower with Avery, Lucy, and Amos, bringing the original I.T.E.R. along before the building can be fully secured.

I.T.E.R. reveals himself from the truck’s cargo area and joins the passengers. His lively greeting surprises Avery, who remembers the far less conversational opponent from the test room. The two shake hands, and I.T.E.R. offers his help with the journey. His presence is useful but also potentially incriminating: Lucy recognizes that transporting the original robot could look like an attempt to flee with evidence, while I.T.E.R. argues that leaving him to be discovered at the tower would create its own problems.

At the city’s perimeter, I.T.E.R. identifies General Squilish and warns that Kaden’s chances in a direct fight are poor. The group instead attempts to breach the barrier. Propelled by his foot thrusters, I.T.E.R. strikes the dome with '''Mana Cancel Stance''', opening a crack large enough for their vehicle. Avery lifts the truck with Compression Magic, Lucy works on the barrier’s controls, and I.T.E.R. flies behind the vehicle to push it through the opening. The barrier closes after their departure, delaying pursuit.

=== Escape ===

Outside Lux Urbis, I.T.E.R. helps the fugitives turn a hurried retreat into a workable camp. He clears branches around the truck, offers to watch for scouts, and explains that his mana-derived fuel can sustain ordinary operation for weeks when he avoids energy-intensive techniques. His lack of fatigue allows him to continue working while the others recover.

He also prepares the group’s food. Using an improvised metal cutting tool, he portions the boar they acquire and produces seasonings from an internal compartment in his chest. He notices that Avery’s light magic is affecting the meat beyond ordinary heating and continues preparing the remaining supply after the others go to sleep. By the following morning, I.T.E.R. is still providing meals, showing the practical assistance Kaden envisioned alongside the robot’s combat role.

|tab=Powers & Abilities

== Mechanical Strength & Durability ==

I.T.E.R.’s magic-imbued titanium plating gives him considerable resistance to physical and magical attacks. During the trials, he withstands Lucy’s close-range strikes and Avery’s concentrated light without being disabled. He can force his way through light barriers, seize and restrain enhanced combatants, and move a vehicle while airborne. These feats demonstrate substantial strength, but do not establish complete invulnerability: his joints, sensors, and protected core remain distinct parts of his design with different functions.

Kaden compares the testing model’s ability to that of a low '''Altior''', the sixth Mystical Rank. This is his estimate of combat performance, rather than a confirmed magical rank earned by I.T.E.R. The robot’s effectiveness also depends on the opponent and the operating stage; surviving Avery’s attacks does not prove immunity to every magical affinity or technique.

== Adaptive Combat & Sensors ==

Even before the independent personality is introduced, I.T.E.R.’s combat routines analyze an opponent’s movements and improve their responses. Against Lucy, he learns her attack patterns and changes his approach as the match develops. Against Avery, he continues fighting after a flash obscures his vision by using his calculated position within the room. Additional body sensors supplement the head’s visual system and help him exploit walls and elevation.

His mobility combines fast mechanical movement, powerful jumps, and thrusters mounted in his feet. The thrusters support sudden charges during testing and sustained movement during the escape at Lux Urbis, where he reaches the dome and then repositions behind the airborne truck.

== Mana Cancel Stance ==

'''I.T.E.R. Style: Mana Cancel Stance''' is demonstrated against the magical barrier enclosing Lux Urbis. I.T.E.R. drives his fist into the dome while his thrusters maintain pressure, producing a violent clash of energy and opening a circular breach. The technique gives the team a passage through the barrier, but their escape still requires the coordinated work of Avery, Lucy, Kaden, and Amos.

The scene establishes a barrier-breaking application rather than an unlimited ability to cancel all magic. During the earlier laboratory test, I.T.E.R. is explicitly contrasted with an elemental combatant capable of releasing magic directly. His runic construction and specialized techniques should therefore be distinguished from the unrestricted spellcasting of a Mystical Being.

== Analysis, Endurance & Utility ==

I.T.E.R. can identify notable individuals, explain magical infrastructure, and offer rapid assessments of dangerous situations. His estimate of Kaden’s chances against General Squilish informs the decision to avoid a direct confrontation. These calculations are his assessments of available information, rather than guarantees about how an encounter must end.

His fuel system converts mana into usable power. He reports that ordinary activity can continue for weeks, while thruster use and powerful barrier-breaking attacks consume more energy. He does not share his companions’ need for a night’s sleep, allowing him to prepare food and assist the camp over extended periods. His chest compartment can carry supplies, and his precise movement supports detailed work such as cutting and portioning meat.

|tab=Relationships

== Kaden Icelander ==

[[char/kaden_icelander|Kaden]] is I.T.E.R.’s creator and project director. He establishes the design’s goals, secures the resources needed for completion, and controls the initial combat demonstrations. His pride in the machine sometimes overrides the caution of the other developers, particularly when he allows the laboratory fights to continue until Lucy and Avery are injured. Nevertheless, he responds to the team’s objections by promising safety adjustments.

After I.T.E.R.’s independent behavior emerges, their interaction extends beyond remote commands. I.T.E.R. follows Kaden’s escape plan and confidently carries out the assault on the barrier, but also comments on the group’s improvised decisions. His loyalty to the team coexists with a willingness to point out weaknesses in their reasoning.

== Avery Obtainia ==

[[char/avery_obtainia|Avery]] first encounters I.T.E.R. as a test opponent whose strength and adaptation exceed his expectations. Their match forces Avery to combine light, compression, and movement techniques, ending only when Kaden shuts down the robot’s combat mode. The damage Avery suffers reflects the unsafe testing conditions rather than a personal hostility expressed by the later independent I.T.E.R.

During the flight from IT Tower, the two are properly introduced and shake hands. Their abilities complement one another at the barrier, where Avery’s lift and I.T.E.R.’s propulsion move the truck through the breach. At camp, I.T.E.R. observes Avery’s unusual magic and helps turn its effects into practical support for the group.

== Lucy Terner ==

[[char/lucy_terner|Lucy]] contributes to the project’s planning and tests I.T.E.R. in close combat. His ability to learn her movements and withstand her attacks culminates in a defeat severe enough to make the developers question Kaden’s judgment. Their later interactions take place as members of the same escaping party, where Lucy tempers I.T.E.R.’s exhaustive explanations and works with him during the barrier breach.

== Project Team ==

[[char/amos_black|Amos Black]], Arthur Fowler, and [[char/james_shera|James Shera]] contribute to the development and oversight of I.T.E.R. Amos reports on mechanical progress and later travels with him during the escape. Arthur is responsible for the magical rune integration and technical performance, while James emphasizes the safety obligations surrounding the project. Their involvement makes I.T.E.R. a collaborative achievement, even though Kaden remains the creator and driving force behind the design.
