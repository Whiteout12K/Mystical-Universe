<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Profile</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background:
                radial-gradient(
                    circle at top left,
                    #26345f 0%,
                    #101522 40%,
                    #080b12 100%
                );

            color: #f5f7ff;

        }


        .page {

            width: min(
                1100px,
                calc(100% - 32px)
            );

            margin: 0 auto;

            padding:
                50px 0 80px;

        }


        /* ==============================
           PROFILE HEADER
           ============================== */

        .profile {

            position: relative;

            overflow: hidden;

            padding: 35px;

            border-radius: 24px;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.12),
                    rgba(255,255,255,0.04)
                );

            border:
                1px solid
                rgba(255,255,255,0.12);

            box-shadow:
                0 25px 80px
                rgba(0,0,0,0.35);

            backdrop-filter:
                blur(20px);

        }


        .profile::before {

            content: "";

            position: absolute;

            width: 300px;

            height: 300px;

            border-radius: 50%;

            background:
                rgba(100,130,255,0.2);

            filter: blur(80px);

            top: -150px;

            right: -100px;

        }


        .profile-content {

            position: relative;

            display: flex;

            align-items: center;

            gap: 25px;

        }


        .avatar {

            width: 100px;

            height: 100px;

            flex-shrink: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 50%;

            font-size: 42px;

            font-weight: 700;

            background:
                linear-gradient(
                    135deg,
                    #6c7cff,
                    #9d63ff
                );

            box-shadow:
                0 10px 40px
                rgba(108,124,255,0.35);

        }


        .username {

            margin: 0;

            font-size: clamp(
                32px,
                5vw,
                52px
            );

            letter-spacing:
                -1.5px;

        }


        .subtitle {

            margin:
                7px 0 0;

            color:
                rgba(255,255,255,0.6);

            font-size: 15px;

        }


        /* ==============================
           STATS
           ============================== */

        .stats {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(
                        180px,
                        1fr
                    )
                );

            gap: 16px;

            margin-top: 24px;

        }


        .stat {

            padding: 22px;

            border-radius: 18px;

            background:
                rgba(255,255,255,0.06);

            border:
                1px solid
                rgba(255,255,255,0.08);

            transition:
                transform 0.2s ease,
                background 0.2s ease;

        }


        .stat:hover {

            transform:
                translateY(-3px);

            background:
                rgba(255,255,255,0.09);

        }


        .stat-label {

            color:
                rgba(255,255,255,0.55);

            font-size: 13px;

            text-transform:
                uppercase;

            letter-spacing:
                1px;

        }


        .stat-value {

            margin-top: 8px;

            font-size: 30px;

            font-weight: 700;

        }


        /* ==============================
           SECTIONS
           ============================== */

        .section {

            margin-top: 24px;

            padding: 28px;

            border-radius: 22px;

            background:
                rgba(255,255,255,0.055);

            border:
                1px solid
                rgba(255,255,255,0.08);

            box-shadow:
                0 15px 50px
                rgba(0,0,0,0.15);

        }


        .section-title {

            margin:
                0 0 20px;

            font-size: 20px;

        }


        /* ==============================
           PROGRESS BARS
           ============================== */

        .progress-container {

            margin-bottom: 18px;

        }


        .progress-header {

            display: flex;

            justify-content:
                space-between;

            margin-bottom: 7px;

            font-size: 14px;

        }


        .progress-label {

            color:
                rgba(255,255,255,0.7);

        }


        .progress-value {

            font-weight: 600;

        }


        .progress {

            height: 10px;

            overflow: hidden;

            border-radius: 999px;

            background:
                rgba(255,255,255,0.08);

        }


        .progress-bar {

            height: 100%;

            border-radius: inherit;

            background:
                linear-gradient(
                    90deg,
                    #687cff,
                    #a466ff
                );

            transition:
                width 0.7s ease;

        }


        /* ==============================
           ITEM GRID
           ============================== */

        .items {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(
                        150px,
                        1fr
                    )
                );

            gap: 12px;

        }


        .item {

            padding: 18px;

            border-radius: 14px;

            background:
                rgba(255,255,255,0.055);

            border:
                1px solid
                rgba(255,255,255,0.07);

            text-align: center;

        }


        .item-icon {

            font-size: 28px;

            margin-bottom: 8px;

        }


        .item-name {

            font-size: 14px;

            color:
                rgba(255,255,255,0.8);

        }


        /* ==============================
           DETAILS
           ============================== */

        .details {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(
                        200px,
                        1fr
                    )
                );

            gap: 12px;

        }


        .detail {

            display: flex;

            justify-content:
                space-between;

            gap: 15px;

            padding: 14px 16px;

            border-radius: 12px;

            background:
                rgba(255,255,255,0.04);

        }


        .detail-key {

            color:
                rgba(255,255,255,0.55);

        }


        .detail-value {

            font-weight: 600;

            text-align: right;

            word-break: break-word;

        }


        /* ==============================
           LOADING / ERROR
           ============================== */

        .loading {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            color:
                rgba(255,255,255,0.6);

        }


        .error {

            text-align: center;

            padding-top: 100px;

        }


        .error h1 {

            font-size: 40px;

        }


        .error p {

            color:
                rgba(255,255,255,0.55);

        }


        /* ==============================
           MOBILE
           ============================== */

        @media (
            max-width: 600px
        ) {

            .page {

                width:
                    min(
                        100% - 20px,
                        1100px
                    );

                padding-top: 20px;

            }


            .profile {

                padding: 25px;

            }


            .profile-content {

                align-items:
                    flex-start;

            }


            .avatar {

                width: 70px;

                height: 70px;

                font-size: 28px;

            }


            .section {

                padding: 20px;

            }

        }

    </style>

</head>


<body>


<div id="app">

    <div class="loading">

        Loading profile...

    </div>

</div>


<script>


/* ==========================================================
   GET USERNAME FROM URL
   ========================================================== */

const pathParts =
    window.location.pathname
        .split("/")
        .filter(Boolean);


let username =
    pathParts[
        pathParts.length - 1
    ];


/*
 * If you're testing this as:
 *
 * /view.html?username=avery
 *
 * this also works.
 */
const queryUsername =
    new URLSearchParams(
        window.location.search
    ).get("username");


if (queryUsername) {

    username =
        queryUsername;

}



/* ==========================================================
   LOAD PROFILE
   ========================================================== */

async function loadProfile() {

    try {

        const response =
            await fetch(
                "/api/user/" +
                encodeURIComponent(
                    username
                )
            );


        if (!response.ok) {

            showError(
                "User not found",
                "This profile does not exist."
            );

            return;

        }


        const result =
            await response.json();


        renderProfile(
            result.username,
            result.data
        );


    }

    catch (error) {

        console.error(error);

        showError(
            "Something went wrong",
            "Could not load this profile."
        );

    }

}


/* ==========================================================
   RENDER PROFILE
   ========================================================== */

function renderProfile(
    username,
    data
) {

    const initial =
        username
            .charAt(0)
            .toUpperCase();


    document
        .getElementById("app")
        .innerHTML = `

        <main class="page">


            <!-- PROFILE HEADER -->

            <section class="profile">

                <div class="profile-content">

                    <div class="avatar">

                        ${escapeHtml(
                            initial
                        )}

                    </div>


                    <div>

                        <h1 class="username">

                            ${escapeHtml(
                                username
                            )}

                        </h1>


                        <p class="subtitle">

                            Player Profile

                        </p>

                    </div>

                </div>

            </section>


            <!-- MAIN STATS -->

            <section class="stats">


                ${createStat(
                    "🪙",
                    "Coins",
                    data.coin ?? 0
                )}


                ${createStat(
                    "⭐",
                    "Level",
                    data.level ?? 1
                )}


                ${createStat(
                    "✨",
                    "Experience",
                    data.xp ?? 0
                )}


                ${createStat(
                    "❤️",
                    "Health",
                    data.health ?? 0
                )}


                ${createStat(
                    "💧",
                    "Mana",
                    data.mana ?? 0
                )}


            </section>


            <!-- VITALS -->

            <section class="section">

                <h2 class="section-title">

                    Character Status

                </h2>


                ${createProgress(
                    "Health",
                    data.health ?? 0,
                    100
                )}


                ${createProgress(
                    "Mana",
                    data.mana ?? 0,
                    100
                )}


            </section>


            <!-- ITEMS -->

            ${
                Array.isArray(
                    data.items
                )
                    ? createItems(
                        data.items
                    )
                    : ""
            }


            <!-- OTHER DATA -->

            ${createOtherData(
                data
            )}


        </main>

    `;

}


/* ==========================================================
   STAT CARD
   ========================================================== */

function createStat(
    icon,
    label,
    value
) {

    return `

        <div class="stat">

            <div
                style="
                    font-size:26px;
                    margin-bottom:6px;
                "
            >

                ${icon}

            </div>


            <div class="stat-label">

                ${label}

            </div>


            <div class="stat-value">

                ${escapeHtml(
                    value
                )}

            </div>

        </div>

    `;

}


/* ==========================================================
   PROGRESS BAR
   ========================================================== */

function createProgress(
    label,
    value,
    max
) {

    const percent =
        Math.max(
            0,
            Math.min(
                100,
                (Number(value) /
                    Number(max)) *
                    100
            )
        );


    return `

        <div
            class="progress-container"
        >

            <div
                class="progress-header"
            >

                <span
                    class="progress-label"
                >

                    ${escapeHtml(
                        label
                    )}

                </span>


                <span
                    class="progress-value"
                >

                    ${escapeHtml(
                        value
                    )}
                    /
                    ${escapeHtml(
                        max
                    )}

                </span>

            </div>


            <div class="progress">

                <div
                    class="progress-bar"
                    style="
                        width:${percent}%;
                    "
                ></div>

            </div>

        </div>

    `;

}


/* ==========================================================
   ITEMS
   ========================================================== */

function createItems(
    items
) {

    if (
        items.length === 0
    ) {

        return "";

    }


    return `

        <section class="section">

            <h2 class="section-title">

                Inventory

            </h2>


            <div class="items">

                ${items
                    .map(
                        item => `

                            <div
                                class="item"
                            >

                                <div
                                    class="item-icon"
                                >
                                    🎒
                                </div>

                                <div
                                    class="item-name"
                                >

                                    ${escapeHtml(
                                        item
                                    )}

                                </div>

                            </div>

                        `
                    )
                    .join("")
                }

            </div>

        </section>

    `;

}


/* ==========================================================
   OTHER JSON DATA
   ========================================================== */

function createOtherData(
    data
) {

    const excluded = [
        "coin",
        "level",
        "xp",
        "health",
        "mana",
        "items"
    ];


    const keys =
        Object.keys(data)
            .filter(
                key =>
                    !excluded.includes(
                        key
                    )
            );


    if (
        keys.length === 0
    ) {

        return "";

    }


    return `

        <section class="section">

            <h2 class="section-title">

                Profile Details

            </h2>


            <div class="details">

                ${keys
                    .map(
                        key => {

                            const value =
                                data[key];


                            return `

                                <div
                                    class="detail"
                                >

                                    <span
                                        class="detail-key"
                                    >

                                        ${escapeHtml(
                                            key
                                        )}

                                    </span>


                                    <span
                                        class="detail-value"
                                    >

                                        ${escapeHtml(
                                            formatValue(
                                                value
                                            )
                                        )}

                                    </span>

                                </div>

                            `;

                        }
                    )
                    .join("")
                }

            </div>

        </section>

    `;

}


/* ==========================================================
   FORMAT VALUES
   ========================================================== */

function formatValue(
    value
) {

    if (
        typeof value ===
        "object"
    ) {

        return JSON.stringify(
            value
        );

    }


    return String(value);

}


/* ==========================================================
   ERROR
   ========================================================== */

function showError(
    title,
    message
) {

    document
        .getElementById("app")
        .innerHTML = `

        <div class="page">

            <div class="error">

                <h1>

                    ${escapeHtml(
                        title
                    )}

                </h1>

                <p>

                    ${escapeHtml(
                        message
                    )}

                </p>

            </div>

        </div>

    `;

}


/* ==========================================================
   HTML ESCAPING
   ========================================================== */

function escapeHtml(
    value
) {

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* ==========================================================
   START
   ========================================================== */

loadProfile();

</script>


</body>

</html>
