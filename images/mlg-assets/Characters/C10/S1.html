<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Skill Info</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      color: #FFEBEE;
    }

    .icon-container {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .effect-icon {
      flex-shrink: 0;
    }

    .effect-text {
      flex: 1;
    }

    .body-text {
      background-color: #63141462;
      font-size: 9px;
      padding-left: 1em;
      padding-right: 1.5em;
      padding-top: 4em;
      padding-bottom: 4em;
    }

    .level-display {
      margin-top: 15px;
      font-size: 8px;
      color: #FFEBEE;
    }
  </style>
</head>

<body class="body-text">

  <div><b style="font-size:14px;">Special Skill: Lightning God Mode</b></div>

  <div style="padding-top:7px">Kiara infuses her basic attacks with yellow lightning that stuns all who come in close vicinity. She gains a power meter with 100 points which remains until all points are consumed.</div>

  <div id="des1" style="padding-top:7px"></div>

  <div id="des2" style="padding-top:7px"></div>

  <div style="padding-top:7px">Cooldown: 18 seconds</div>
  <div>Mana Cost: 130 MP</div>

  <div class="level-display" id="level"></div>

  <script>
    const maxLevel = 10;
    const baseDamage = [20, 120];

    // Read level from ?id=# in URL
    const params = new URLSearchParams(window.location.search);
    let level = parseInt(params.get("id")) || 1; // default = 1
    level = Math.min(maxLevel, Math.max(1, level)); // clamp between 1 and 10

    function updateSkill() {
      const multiplier = 1 + 0.25 * (level - 1);

      document.getElementById("des1").innerHTML =
        `Her basic skill is infused with <b style="color:#bf9000">[Wind]</b> damage, her attack speed increasing by <b>+${(baseDamage[0] * multiplier).toFixed(1)}%</b>. Each stage of her basic skill used will deplete 1 point and the cost increases by +2 points per stage increment, but resetting when stage 1 is used again.`;

      document.getElementById("des2").innerHTML =
        `Every 15 points depleted will send an AoE <b style="color:#bf9000">[Wind]</b> shockwave equal to <b>${(baseDamage[1] * multiplier).toFixed(1)}%</b> of value of the last damage dealt.`;

      document.getElementById("level").textContent = `< Skill Level: ${level} >`;
    }

    updateSkill();
  </script>

</body>

</html>
