Lux Luces is a royal princess of District 12, daughter of the [[fandom:Ultimus Rex|Magni Luminis,]] and a direct descendant of the great Zenith Luces. She is a [[fandom:demihuman]] [[fandom:Angelor]] who has the powers of [[fandom:light]] and [[fandom:wind]]. She is one of the primary members of the [[fandom:Nuntios]] enforcement established by IT to protect the secrecy of the Mystical Beings and secure safety in other parts of the world.

|tab=Overview

== Overview ==
Lux is a tall, slim, and attractive woman with long golden hair and golden eyes. In most situations, Lux always wears a white dress sometimes with a coat. She wears a shiny diamond rune pendant around her neck. Her attraction is so high that she mostly keeps to simple clothing. She also wears white sandals, gold bracelets, and small bird shaped earrings. Her hands are bare and she does not wear any rings, as she has stated that the first ring she would want to wear would be from her "true" lover.

When she activates her IT wrist band, she is surrounded in a green hologram armor specialized in healing and body enhancements, called the IT Medic Avatar. The armor surrounds her entire body and takes on the appearance of a futuristic astronaut armor. Instead of a holographic weapon, Lux wields her own magic, enhanced by the armor, to heal and reflect.

== Personality ==
Lux is an intelligent and skilled Mystical Being who contributed to the defeat of Malum's leader. As a princess of District 12, she has to keep a level head in most situations. Being raised in the capital, she also has high intelligence and a tactical mind. Lux is aware of being extra cautious due to her popularity and influence. She, at most times, has a cold and commanding presence, as to control and keep discussions and events in order. However, she also has a clumsy and silly side. This has especially been revealed when she releases herself of her regular duties as a princess. 

Being a demihuman, Lux lived most of her life with others of her kind. Most regular humans and Mystical Beings see her as very "pretty," often overlooking their own judgement. Lux realizes the distinct gap between the two factions and views it a "childish game." She has a high sense of justice and judgement, like protecting someone who is not of the same faction as herself or defying her father, the [[fandom:Lumen Luces|King]]. She is strong and will not back down from a fight, especially when it is necessary to defend an unfamiliar individual. 

Although she is very attractive and sought out by many admirers, she turns down everyone because she believes that she was not born to be the fun of others or to have fun. However, she developed romantic feelings towards [[char/avery_obtainia|Avery Obtainia]] ever since he first met her without the same type of feelings and actions that others often did. In addition, watching Avery grow and become someone truly extraordinary has set her eyes to be at his side. She has also declared that she would either be the [[fandom:Ultimus Rex|Magni Mage]] or the assistant to the Magni Mage someday. {{Spoiler|This was held true when Avery became the Magni Mage and she was able to be at his side, thus, fulfilling two of her deepest desires.}}
== Tools and Equipment ==

=== Diamond Angelor Rune ===

A special magical rune that Lux keeps around her neck which gives her accelerated control. When enough magic is poured into the pendant, the released magical power is more precise and effective. This rune is mainly used to purify extreme magical conditions and/or heal severe wounds.

=== IT Medic Avatar ===

A special IT technology which allows Lux to summon a green holographic armor that enhances her healing and attack abilities. This armor also enhances Lux's defense and increases her overall physical abilities. In its sealed mode, the holographic armor disappears and all remains is a bracelet around Lux's right hand.

== Trivia ==
* Lux is the only demihuman not regarded the same way as other demihuman. Most Mystical Beings see her as "very pretty" and "beautifully fair," thus, completely forgetting their discrimination towards all demihumans. Lux, however, does not like these emotions of others and rejects all who ask her out.
