== Overview ==
River is a Naiad with inherited Vulpivor features whose life is affected by prejudice within her own family and the wider Mystical hierarchy. Her caramel hair, fox ears, and habit of keeping her hood raised accompany a quiet introduction. Across the first two books, she moves from a hesitant companion into a decisive participant in the group's victories.

== Personality ==
River's early speech and reluctance to reveal her ears reflect anxiety and experience of being judged. Her timidity does not prevent action: she distracts Avery's bullies, fights the shadow pursuer, and helps the rescue party. She becomes firmer when someone she trusts is threatened.

Her growth is gradual rather than an immediate replacement of shyness with confidence. She continues to speak cautiously and prefers a low profile, but increasingly shares opinions and takes responsibility. The flag competition makes this especially clear, because its outcome rests on her movement and timing rather than on a louder teammate's strength.

== Mystical Rank & Heritage ==
River is identified as a '''Naiad''' with a Vulpivor parent, explaining the fox characteristics alongside freshwater magic. In Book 2's opening, she declares '''Tier 3, Altus, Level 2'''. Atlas identifies her as his younger half-sister through their mother's second marriage; his refusal to accept her legitimacy is a prejudiced family judgment, not a denial of the blood relationship.

== Tools and Equipment ==
River uses everyday school supplies and a hooded outfit that helps cover her fox ears. Book 2 includes the purchase of technology for schoolwork and a fair share of Team 44's prize money. Her principal contributions in these volumes come from water manipulation and bodily reinforcement rather than a named weapon or artifact.

== Trivia ==
* Her inspirations include Columbina and Leon Cromwell.
* Her animal motif is a fox; her fruit motif is a pear.

== Synopsis ==

=== The Rune of the Spellcaster ===

==== New York and the Sky House ====

River helps Avery escape Billy's gang with a water-reinforced stone. In Weeping Willows she explains her mixed heritage and basic magical history, and accompanies him to the cabin connected to Caela Obtainia. During the Hand of Doom encounter, she raises water spheres and stands beside Avery rather than allowing him to face the threat alone. Kaden's intervention helps them survive the confrontation.

==== Family Conflict and Charlotte's Rescue ====

At Regnum, River lives with Avery, Ted, and Jane. An encounter at the mall exposes Atlas's hostility toward her demihuman parentage. Avery defends her but cannot overcome Atlas's power, leaving both physically and emotionally shaken.

River later joins the District 3 rescue. Her large water sphere becomes a powerful ice mass when Kaden freezes it, and their combined tactics pressure Ellie. After the crisis, River invites Avery to the lake and explains that she wants to trust him with her past. Their exchange develops a shared wish to overcome prejudice through example rather than domination.

=== I.T.E.R. Chronicles — Initialization ===

==== Mystic and the Flag Competition ====

River participates in the attempt to enter the cohorts and accepts Elmor's invitation to Mystic. The quieter cohort environment offers another setting in which she can find belonging beyond her family's judgments.

She forms Team 44 with Avery, Ted, and Jane. During the contest, Jane traps or distracts opposing defenders while River uses mana-enhanced movement to seize Team 1's flag. They then exploit Team 20's distraction and take its flag as well. These captures end the game and secure first place without requiring Avery to defeat Kaden directly.

River's contribution demonstrates that her reserve does not equate to passivity. She withstands physical strain to complete the plan, proposes an equitable division of the money, and continues her friendships without seeking the public attention that victory could bring.

|tab=Powers & Abilities

== Powers & Abilities ==

== Established Abilities ==

=== Water Manipulation ===

River reinforces objects with water and creates or directs large water spheres. Her use of surrounding water at the docks illustrates that she can act under pressure despite her hesitation.

=== Cooperative Techniques ===

Kaden freezes River's water into a denser offensive mass during the Ellie fight. In Book 2, water propulsion also supports a vine raft made by Jane. These techniques depend on complementary abilities rather than a new fusion power being individually awarded to River.

=== Mana-Enhanced Movement ===

River concentrates mana in her feet to execute the flag captures. The narration notes possible muscular strain from overexertion. Her speed and timing are effective, but not without cost. Later Water Spirit releases or transformations listed in the game should not automatically be read as demonstrated events in these two novels.

|tab=Relationships

== Relationships ==

=== Atlas and Alteria Aquia ===

[[char/atlas_aquia|Atlas]] is River's older half-brother; [[char/alteria_aquia|Alteria]] belongs to the same Aquia family. Atlas describes their mother's remarriage to a demihuman and openly rejects River's legitimacy. The family's conflict remains unresolved in these two volumes.

=== Avery Obtainia ===

[[char/avery_obtainia|Avery]] treats River's heritage as something to understand rather than condemn. Their mutual protection builds trust, and she hopes to share her past with him. Their Book 1 lake scene connects that trust to a broader aspiration for justice.

=== Jane Tee and Teddric Tech ===

[[char/jane_tee|Jane]] and [[char/teddric_tech|Ted]] share Quad 44 and Team 44 with her. Jane's support and distractions enable River's decisive flag captures, while Ted and Avery occupy stronger opponents.
