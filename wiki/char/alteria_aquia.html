|tab=Overview

== Overview ==
Alteria is Atlas's younger sister and Tempest Aquia's vice captain. The first book mentions her place in the family; the second shows her testing Avery, commanding an elite competition team, and working on the disappearance investigation. Her silver hair and forceful demeanor accompany a strong belief in inherited status and magical superiority.

== Personality ==
Alteria is proud, confrontational, and impatient with work she considers beneath her standing. She openly objects to Avery's inclusion in Tempest Aquia and distrusts demihumans. Her confidence in pedigree and power often leads her to underestimate a lower-ranking opponent's adaptability.

The books repeatedly expose a difference between winning an exchange and fulfilling the actual objective. Avery surprises her with a denser light attack, and Team 44 takes her team's flag while she confronts Kaden. During the investigation, her dismissal of Avery's claims further shows that prejudice can obstruct judgment even in someone with considerable competence.

== Mystical Rank & Heritage ==
Alteria is a Water Spirit of the royal Aquia family. During the flag competition, Ted identifies her displayed power as '''Tier 5, Maximus, Level 3'''. Her expertise differs from Atlas's dense water: she emphasizes fine control and fluidity capable of penetrating imperfections in another person's magic.

== Tools and Equipment ==
Alteria forms and carries a water spear during her challenge to Avery and in the flag competition. The story treats it as an expression of her water techniques. She also uses the cohort's communication and transport arrangements while following Atlas on official missions.

|tab=Synopsis

== Synopsis ==

=== The Rune of the Spellcaster ===

Alteria is named as Atlas's immediate sibling while he explains River's connection to their mother's second marriage. The main narrative does not yet depict her acting in the academy or confronting Avery directly.

=== I.T.E.R. Chronicles — Initialization ===

==== Testing the New Recruit ====

At the Aquia estate, Alteria demands that Avery demonstrate why Atlas selected him. Her molecular water control pierces his imperfectly compressed light barrier, and she initially dismisses his earlier achievements as luck. Avery responds by concentrating his light into a faster, denser beam that surprises her defense. Atlas intervenes before the duel damages the estate further.

==== Flag Competition ====

Alteria leads the third-year Team 1 and coordinates with Flustra, Antaro, and Elegro. She engages Kaden and breaks his frozen falcon with a pinpoint water technique. Despite her superior displayed tier, River and Jane exploit the separation of combat from flag defense and eliminate her team. Team 1 finishes third, an outcome that frustrates her.

==== Disappearance Investigation ====

Alteria accompanies Atlas and Avery on the council assignment. She questions Avery's accusation against a noble and opposes prolonging the search. Atlas restrains her when her anger escalates and agrees to investigate further. The documents Avery helps recover make her earlier dismissal less tenable, but these scenes do not establish that her prejudice has disappeared.

=== Sources ===
Book 1: Chapter 10. Book 2: Chapters 6, 8–10, 14.

|tab=Powers & Abilities

== Powers & Abilities ==

== Established Abilities ==

=== Fine Water Control ===

Her water flows into gaps in Avery's barrier rather than simply colliding with its strongest surface. She describes training with Atlas to refine this control to the molecular level.

=== Entanglement of the Waves ===

A directed droplet enters a crack in Kaden's frozen falcon and breaks the construct apart. The technique demonstrates precision against a large formation, rather than proof that she can destroy any ice without resistance.

=== Spear Combat ===

Alteria combines her water spear with forceful movement and direct exchanges. Her high tier and technical training give her clear advantages, but the flag contest shows they cannot substitute for guarding the objective.

|tab=Relationships

== Relationships ==

=== Atlas Aquia ===

[[char/atlas_aquia|Atlas]] is both Alteria's brother and captain. He accepts some of her assumptions about status but refuses to let them rule every practical decision. He stops her attacks when they threaten his plans.

=== River Grant ===

[[char/river_grantia|River]] belongs to the same Aquia family through their mother's remarriage. Alteria's contempt for Vulpivors reinforces the wider family conflict.

=== Avery and Kaden ===

[[char/avery_obtainia|Avery]] challenges her expectations of a demihuman recruit. [[char/kaden_icelander|Kaden]] is a major flag-game opponent, but engaging him does not prevent her team's elimination elsewhere.
