Kaden Icelander is one of the main characters in the series Mystical Legends. He is an [[fandom:Icelorian]] who was born into a rich family. His father, Ioward, started a company called IT which Kaden soon took over as his own. Though he is powerful and influential, Kaden was really pushed to do better when he met an equal competitor.
|tab=Overview

== Overview ==
Kaden is a tall handsome guy who is loved by all who know of his great deeds and works, especially girls. He has dark intimidating blue eyes with extreme power. He usually walks about wearing a suit because he himself believes that it is professional. He also has a golden IT badge that is wears on his left side that signifies his importance and position in the IT workforce. Kaden has messy white hair that he often lets run wild as it is his personal Asian look.
== Personality ==
Outwardly, everyone see Kaden as a child prodigy who, due to his past history, overcame extreme unfavorable circumstances. Climbing even higher and later becoming the CEO of IT, Kaden's fame and popularity stirred others to follow his examples.

Kaden acts cool, and sometimes coldly, when he is around strangers and acquaintances. He looks down upon others of inferior positions which gives the impression to most fans that he is a model and cool guy but distant and unapproachable. His love for luxury and cleanliness proves his attitude towards status. Displaying his status and making sure others know their positions are Kaden's mindset. This point of view is what Kaden argues as the way of keeping fans and supporters from getting out of hand (either by taking advantage of him or bothering him).

Although he is regarded as a selfish individual many times, Kaden values those who show true work ethic and those who overcome harsh challenges. Though he likes hanging out with rich nobles, royals, and businessmen, he admits that those who did not earn money the hard way are spoiled and inconsiderate of smaller things in life.

Kaden is highly intelligent and always thinks rationally of any situation. This has proved useful whenever Kaden faces opponents with unknown magic powers. Kaden was also able to become the greatest swordsman and magic user due to his deduction and intelligence. Kaden never gets emotional over anything which has helped him grow and become stronger, especially after the fall of District 1.

Although Kaden has a working and productive nature, he also enjoys splurging money and having fun, every once and a while.
== Mystical Rank and Heritage ==
Born as a royal, Kaden Icelander was the prince of District 1 long before he became a powerful business owner. With strong inheritance, Kaden obtained powers beyond what is typically known of Mystical Beings, the main part being from his ancestor [[fandom:Ion Mustard]].

Later, when he decides to recapture District 1, he becomes the leader of the war effort, and later, the [[fandom:Ultimus Rex|Magni]] of the district.

=== Magic Rank Progression ===
Kaden is recorded as '''Tier 4, Level 1''' in his I.T.E.R. Chronicles, Initialization backstory, and '''Tier 4, Level 2''' during Rune of the Spellcaster.

{{Spoiler|His rank reaches '''Tier 5, Level 1''' in I.T.E.R. Chronicles, Liberation. The notes identify him as the '''True Demon King''' and '''God of Space''', associated with Shadow among the Gods of the Prime Elements.}}
== Tools and Equipment ==

=== Icelorian Rune ===

The Icelorian Rune, a ring, can alter into a long, bladed, bluish sword called the Goblin Sword. It is one of the legendary weapons of Icelorian heritage, said to have killed millions. It has no power on its own; however, when an Icelorian wields it, they can imbue their own powers into it. Kaden has imbued his own powers into the sword and trained to become the strongest swordsman of Mystical society. The sword becomes icier and brighter when Icelorian magic is flowed into it, thus giving the sword the properties of ice.

=== IT ===

Being a rich royal who earned his money through his intelligence, Kaden Icelander has the entire arsenal of IT equipment, weaponry, vehicles, and locations which he can utilize for his use. Rockets? He's got a satellite he can call. Car? He's got a garage full of custom auto-driving vehicles at his disposal. His IT facilities scattered around the globe also do intensive research to create the best and updated technologies.
