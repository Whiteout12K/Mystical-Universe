<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Skill Info</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      color: #FFEBEE;
    }

    .icon-container {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .effect-icon {
      flex-shrink: 0;
    }

    .effect-text {
      flex: 1;
    }

    .body-text {
      background-color: #63141462;
      font-size: 9px;
      padding-left: 1em;
      padding-right: 1.5em;
      padding-top: 4em;
      padding-bottom: 4em;
    }

    .level-display {
      margin-top: 15px;
      font-size: 8px;
      color: #FFEBEE;
    }
  </style>
</head>

<body class="body-text">

  <div><b style="font-size:14px;">Special Skill: Counterstrike(+)</b></div>

  <div id="des1" style="padding-top:7px"></div>

  <div id="des2" style="padding-top:7px"></div>

  <div style="padding-top:7px">Cooldown: 14 seconds</div>
  <div>Mana Cost: 80 MP</div>

  <div class="level-display" id="level"></div>

  <script>
    const maxLevel = 10;
    const baseDamage = [35, 10, 3];

    // Read level from ?id=# in URL
    const params = new URLSearchParams(window.location.search);
    let level = parseInt(params.get("id")) || 1; // default = 1
    level = Math.min(maxLevel, Math.max(1, level)); // clamp between 1 and 10

    function updateSkill() {
      const multiplier = 1 + 0.25 * (level - 1);

      document.getElementById("des1").innerHTML =
        `Throw quick, rapid magically imbued fist and compressed water projectile strikes, dealing <b>${(baseDamage[0] * multiplier).toFixed(1)}%</b> of defense as <b style="color:#80a1da">[Water]</b> damage per strike, up to 15 strikes when this skill button is held down.`;

      document.getElementById("des2").innerHTML =
        `When this skill ends, Atlas’ basic skill is greatly enhanced by an aura of blue mana, increasing his attack speed by +50% and initial damage increase of <b>+${(baseDamage[1] * multiplier).toFixed(1)}%</b>, consuming 15 MP per second and increasing damage increase by <b>+${(baseDamage[2] * multiplier).toFixed(1)}%</b> per second also. The enhancement ends when no MP remains or when another special skill is used (not including this special skill).`;

      document.getElementById("level").textContent = `< Skill Level: ${level} >`;
    }

    updateSkill();
  </script>

</body>

</html>
