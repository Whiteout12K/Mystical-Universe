|tab=Overview

== Overview ==
Teddric, usually called Ted, is Avery's first school friend and a Metalor with a strong interest in machinery. His broad build, headphones, and enthusiasm make him conspicuous beside Avery's reserve. The two books develop him as both a comic presence and a practical contributor whose inventions and metal techniques support the group's survival.

== Personality ==
Ted is outspoken, competitive, and fond of showing off, particularly when discussing technology or physical strength. He complains about tedious work and enjoys the prospect of prizes, yet he remains involved when a friend needs help. His jokes often provoke Jane's sharp replies.

His confidence sometimes exceeds his execution, as when Tom escapes his attempted restraint. He can nevertheless assess failure constructively: after the Pyrus battle he reminds Avery that saving Charlotte was the purpose of their mission. His function within the group is more substantial than comic relief because that reassurance helps Avery separate a difficult outcome from a meaningless effort.

== Mystical Rank & Heritage ==
OSNYC's assessment in Book 1 records '''Tier 2, Bonus, Level 3''' and above-average physical strength. At Book 2's cohort challenge, Ted identifies himself as '''Tier 3, Altus, Level 2'''. The Metalor identification and metal affinity remain consistent across these appearances; the supplied novels provide more specific progression than the earlier single-rank overview.

== Tools and Equipment ==
Ted's homemade hoverboard provides mobility during the District 3 rescue and in later school events. He repairs its damaged components while recuperating. His headphones and interest in IT equipment express his technical identity, but his constructions also provide tactical options rather than serving only as decoration.

== Trivia ==
* His inspirations include Itto and Ramiris.
* His animal motif is a groundhog; his fruit motif is an apple.

|tab=Synopsis

== Synopsis ==

=== The Rune of the Spellcaster ===

==== OSNYC and the Island Journey ====

Ted meets Avery during OSNYC's admission process and becomes his first guide to Mystical society, magic rankings, and species. Avery's lack of magical knowledge surprises him, but he continues helping instead of excluding him. He transfers with Avery and River to Regnum Academy, where they join Jane in Quad 44.

==== District 3 Rescue ====

Ted joins Kaden's effort to free Charlotte and fights Tony alongside the Masumi brothers. Metal constructions help pressure Tony's recovering earth defense. He later combines a heavy steel hammer with Jane's growing tree trap against Tom's tornado mobility; Tom evades the decisive blow, demonstrating the gap between a clever plan and defeating an experienced opponent.

Ted survives the ordeal and repairs his hoverboard in the medical wing. His conversation with Avery gives the rescue a constructive meaning: their teacher was freed and their group gained experience, even though the captains had to defeat Pyrus.

=== I.T.E.R. Chronicles — Initialization ===

==== Dai-Battalion and Team 44 ====

Ted participates in the freshmen's cohort challenge and is recruited into Dai-Battalion. He continues sharing schoolwork and dorm life with Avery, River, and Jane while trying to develop his own technical future.

During the flag competition, his Metal Mode and metal armor reinforce close combat. He helps occupy Kaden at the crucial stage while River and Jane take flags elsewhere. Team 44 wins the thousand-coin prize and Mistywood Armor. Ted initially imagines what he might do with the artifact, but agrees it suits Jane and takes a share of the currency instead. His response links his ambition to a practical acceptance of his teammates' different strengths.

=== Sources ===
Book 1: Chapters 2–3, 8–9, 13–16. Book 2: Chapters 1–3, 4–10.

|tab=Powers & Abilities

== Powers & Abilities ==

== Established Abilities ==

=== Metal Creation and Reinforcement ===

Ted forms metal fists, barriers, armor, and heavy weapons. His steel hammer uses weight and the hoverboard's approach to pressure Tom from above. Metal Mode supports more sustained reinforced combat in Book 2.

=== Machinery and Tactical Support ===

His hoverboard complements abilities that would otherwise be limited to the ground. During the flag contest, metal reinforcement and physical pressure help keep Kaden occupied. His role shows how equipment, material properties, and timing can contribute against an opponent with greater individual magical power.

|tab=Relationships

== Relationships ==

=== Avery Obtainia ===

[[char/avery_obtainia|Avery]] shares Ted's early school journey, dormitory, and rescue experience. Ted explains basic magical concepts and later offers reassurance when Avery doubts himself.

=== Jane Tee and River Grant ===

Ted and [[char/jane_tee|Jane]] trade frequent criticism but cooperate in battle. His weight-based hammer and her surrounding plants create a combined trap for Tom. [[char/river_grantia|River]] supplies support and later makes the flag captures on which Team 44's win depends.

=== Kaden Icelander ===

Ted admires and challenges [[char/kaden_icelander|Kaden]] without sharing his social standing. The flag contest allows him to contribute to a victory over the prodigy's team through distraction and teamwork.
