== Powers & Abilities ==

Avery’s early techniques are demonstrated in his academy and IT encounters. Water transformation, his later divine blessings, True Transformation, and Time Manipulation belong to his subsequent development in the character material and series outline; they are not all available to him when he first obtains the rune. Avery's abilities develop from a small reserve of Light magic into a combination of elemental control, healing, Compression, artifact use, spiritual perception, and later divine powers. His most effective techniques often combine several of these elements: a projectile becomes more dangerous when compressed, a barrier becomes more durable when its structure is refined, and movement becomes more effective when reinforced with magic. He is not naturally protected against every threat his powers can produce. Mana exhaustion, bodily injury, stronger opponents, and gaps in control repeatedly limit him. His training therefore emphasizes not only increasing output but also directing energy precisely enough to avoid waste and exploit an opponent's weakness.

== Light Magic / Photokinesis ==

Light is Avery's first recognized affinity. He can release it from his body, gather it into his hands, shape it into weapons or barriers, and direct it toward chosen targets. Its applications include illumination, interference with sight, impact, protection, healing, and the reinforcement of physical movement. Ordinary Light attacks need sufficient concentration to produce the desired effect. Gathering and shaping them can leave openings, particularly against an opponent who attacks before the construct is complete. Compression improves their density and force, but also increases the demand on Avery's concentration. The setting’s notes distinguish these visible attacks from freely traveling natural light: condensed magical energy behaves as a conserved, plasma-like manifestation and is not automatically moving at the actual speed of light. Avery’s affinity therefore does not by itself establish limitless speed or an unavoidable attack. He must still aim, stabilize what he creates, and respond to the target’s movement. Lux’s lessons also make a useful distinction between producing an impressive effect and controlling the mana underneath it. Avery’s repertoire expands most effectively when he improves the foundation supporting the visible technique.

=== Gladius Lucis ===

'''Gladius Lucis''' forms a sword of Light for close combat. Avery uses it when a ranged exchange is ineffective or when he needs to approach an opponent directly. Compression can make the weapon denser and more forceful. The sword does not remove his dependence on physical positioning. An opponent with superior reach, durability, speed, or technique can still place him at a disadvantage. His fight against I.T.E.R. shows that producing a magical blade does not ensure he can penetrate a sufficiently tough target.

=== Light Barrier ===

Avery creates barriers to intercept attacks and buy time to move or counterattack. Increasing their density improves their durability against both physical and magical force. A barrier's success depends on more than how much energy it contains. Alteria's water control exposes spaces in a construct Avery initially believes to be securely compressed. Stronger opponents can also break through his defenses directly; I.T.E.R. repeatedly tears through barriers that would be useful against less overwhelming attacks.

=== Light Beams and Light Fist ===

Avery can concentrate Light into a directed beam or gather an aura around his fist. A beam allows him to strike from a distance, while reinforcement around his hand supports a faster and more forceful punch. These techniques give him options at different ranges, but they remain dependent on the amount of magic he can safely release and the resistance of the target. He frequently combines them with movement rather than standing still and relying on output alone.

=== Light Searching Spheres ===

'''Light Searching Spheres''' forms projectiles that Avery directs toward a target or incoming attack. Against mist needles, the collision allows the intensity of his light to disperse the hostile material even as the sphere itself is absorbed. He can also gather a larger quantity of mana and compress it into a much smaller projectile. The '''Intense Light Searching Sphere''' stores considerable energy in a tiny form, releasing a powerful burst when it strikes. Its preparation requires enough concentration to keep the condensed mana from detonating prematurely. The impact on I.T.E.R. produces a violent shockwave and a flood of blinding light. Nevertheless, the attack does not guarantee victory over a target that can withstand it and continue adapting.

Their value lies in how he can alter the relationship between size and force. A broad release is easier to see coming and may waste energy, whereas a small condensed sphere can carry a much greater impact than its appearance suggests. Against a responsive opponent, however, preparation itself becomes a vulnerability: Avery has to maintain enough stability to release the attack deliberately while continuing to judge the surrounding fight. The I.T.E.R. encounter demonstrates both sides of this application, producing a conspicuous explosion without ending the contest.

=== Holo Technique — Agility Mode ===

Avery distributes Light magic around his body to reinforce his movement, reflexes, and awareness. The technique complements the evasive habits he learned on the streets and helps him respond more quickly during combat. Agility Mode is an application of his own magic rather than a suit of IT equipment. Its benefits diminish as his mana is depleted, and an opponent capable of reading or adapting to his movements can still close the distance.

== Healing Magic ==

Avery discovers the ability to ease injuries before traveling to the Mystical Island. He later applies golden light directly to wounds and uses healing to support his recovery after serious fights. Healing is an active process rather than complete immunity to harm. He can still be knocked unconscious, suffer damaged wings, require medical supervision, and need rest before resuming normal activity. Lux's treatment after the lake accident and her warning against flying show that a fast recovery does not make further strain harmless. He uses healing in situations where protection includes caring for someone after an attack has already landed. In the warehouse, attending to the abused child comes before demanding answers, and the practical use of his light helps establish trust with the survivors. During his own recovery, healing works alongside sleep, treatment, and instructions about further exertion. The distinction between accelerated repair and freedom from injury remains particularly important for his wings, whose damage can deprive him of a method of escape even when other injuries are improving.

=== Mythical Healing Magic ===

'''Mythical Healing Magic''' develops from '''Ceresara's Blessing'''. Avery emits golden light capable of treating minor to moderately severe injuries and supporting those within its aura. By carefully adjusting the action of his light, he promotes repair without using the same destructive intensity as an offensive attack. The ability extends to damaged tissue and bones, with applications to nerves and mental recovery. His command improves with his mana and control, but the severity of an injury and his available energy remain relevant.

== Compression ==

'''Compression''' is one of the Eight Forces and Avery's defining early Regnum Spei. It allows him to condense his magic and develop effects related to density, force, and localized gravitational control. Its appearance after contact with the destruction orb greatly increases the range of applications available to him. Possessing the ability does not give him instant mastery. He initially experiments with compressed Light and learns through encounters that expose its imperfections. Atlas's and Alteria's command of their own powers provides a practical demonstration of the difference between having an unusual ability and controlling it with precision.

Compression also shapes the way Avery learns. His first condensed sword is evidence of a power the adults can identify before he can explain it, while Alteria’s water shows him that a visually dense construct may still lack microscopic precision. His later experiments with lifting, repulsion, and changes in pressure follow from treating the force as something broader than simply making a projectile smaller. Atlas provides a comparison because he shares the Regnum Spei but combines it with much more developed control and a different visible elemental repertoire. That comparison repeatedly exposes how far Avery’s understanding lags behind his potential.

=== Compressed Light ===

Compression makes Avery's Light weapons, projectiles, and defensive constructs more substantial. A smaller construct can hold a greater concentration of energy, while an attack that appears slight may release a much larger force on impact. This increased concentration brings risks. Avery must stabilize the mana while preparing a compressed projectile, and a dense barrier can still contain structural weaknesses. He cannot assume that making an attack heavier or brighter will compensate for every difference in technique.

=== Telekinesis and Levitation ===

Avery applies Compression to lifting objects, altering their motion, and disrupting an opponent's position. He can also use it around his own body to soften a fall, float, or move across a surface with greatly reduced friction. During the I.T.E.R. test, he instinctively creates a magical field that lifts him from a vulnerable position and carries him out of the robot's immediate reach. The same movement gives him height, but does not prevent a sufficiently agile opponent from following him. His control of an external target can also be resisted by that target's own magic.

=== Localized Gravity ===

Avery develops gravitational applications that can draw targets down, reverse a force, or propel him away from danger. Techniques such as '''Space Reverse''' and '''Space Inverse''' let him change the pressure and direction acting within a limited area. In a duel, he uses these effects to pin an opponent and then alter his own orientation and elevation. They give him unusual attack angles and means of evasion, rather than unrestricted control over the entire battlefield.

== Water Magic ==

Avery's Water Spirit nature gives him a second elemental affinity. During Aqua Revolution, he discovers that he can breathe underwater and begins developing the ability to create and manipulate water. Compression allows him to make that water denser, supporting stronger impacts, restraints, and protective constructs. His Water techniques include raising a wall around himself or allies and using the flow to interfere with an opponent's movement. The effectiveness of these constructs depends on his control over both the water and the Compression applied to it.

== Holy Magic and Purification ==

Holy Magic is a powerful development of Avery's Light abilities. It produces fused, plasma-like energy that can break down material structures at a molecular level and deliver precise attacks over long distances. Its intensity diminishes as it passes through matter, and sufficiently strong magical barriers can withstand it. Its mana cost and physical toll prevent Avery from using it as freely as an ordinary Light technique. Greater reserves expand his opportunities, but control and restraint remain important. Purification also gives his Light a cleansing role, including his contribution to the effort to reclaim District 1.

== Angelor Characteristics ==

=== Wings and Flight ===

Avery's white wings emerge during the orb crisis. They give him natural aerial movement and an alternative to standing on the rune or levitating through Compression. He can use them to hover and change his position in battle. The wings remain physical parts of his body and can be injured. Damage sustained in the lake accident interferes with his ability to fly and requires treatment. Concealing them with the rune protects their secrecy, but does not mean that every accident or attack can be avoided.

=== Luxengan and Magical Perception ===

By directing mana into his eyes, Avery can perceive external magical fluctuations and traces left by the use of magic. This helps him judge potency, refine his own flow, and recognize opportunities to improve a technique. The perception is not the same as ordinary color vision. It does not directly identify an affinity simply by displaying the magic's color. Its pulse-like awareness can function in darkness, while nearby changes in pressure assist his anticipation at close range.

=== Rune-Assisted Awareness ===

Resonating with the rune expands Avery's perception beyond what his eyes can see. At Altus, Level 3, he places it above his head, closes his eyes, and projects an awareness of his dorm room. With further concentration, he faintly perceives Ted, Jane, and River beyond the room itself. This early projection is clearest nearby and less distinct farther away. It demonstrates a growing relationship between his mana, the artifact, and his senses without making every distant event equally visible.

== Spiritual Bond and Mage Magic ==

Avery is spiritually bonded with Lynnhera, a Water Spirit deity known as the Spiritstone Goddess. Through their anchored connection, she can share visions and access to her mastery of Mage magic. The bond is more deeply integrated than an ordinary external blessing, a distinction that becomes important when others attempt to draw her out of him. Access to Lynnhera's knowledge and power is not equivalent to Avery having unlimited, continuous command of every Mage technique. Her choices, their relationship, and the state of their shared existence influence what he can use. The bond can also threaten his autonomy when Lynnhera assumes control.

Lynnhera is identified in the notes as the Spiritstone Goddess, a Water Spirit associated with Spirit Magic and the title of Purity Mage. Avery’s connection with her is described as a spiritual bond, whereas the same notes use contracts or blessings for several other characters’ relationships with deities. The difference becomes explicit when the religion’s extraction attempt cannot treat her as a separate presence to be drawn out. It also gives the later struggle over his body a personal dimension: the source of counsel and power is present within the existence he is trying to direct for himself.

== Transformation ==

Avery can transform parts of his body, or his entire body, into water. This allows fluid movement and lets some attacks pass through a form that no longer behaves like ordinary flesh. He can compress transformed limbs or combine the state with Light magic to strengthen their use. The transformation has limitations. Temperature and Icelorian ultimate ice can interfere with returning to normal, while a fully dispersed water form cannot rely on ordinary human sight and hearing. He instead uses awareness through his water and magical pulses to understand his surroundings.

=== True Transformation ===

True Transformation develops after Avery fully merges with Lynnhera. His body becomes integrated with his magical essence and spirit, allowing him to manifest as mana and compressed magical matter. He can recover naturally from cuts and reshape parts of himself into materials or states he understands, including hard surfaces and cushioning fluid. His earlier water transformation remains available. Although the state reduces ordinary physical strain, Avery still depends on his mana. Extreme heat, Icelorian ultimate ice, degenerative magic, and mana-draining shadow powers remain dangerous. His ability to evade or minimize their effects depends on his skill; transformation does not make him universally invulnerable.

== Other Regnum Spei and Divine Blessings ==

'''Omnifusion''' is Ceresara's Second Blessing and encompasses Antifusion and Fusion. It later evolves into '''Time Manipulation''', linking Avery's divine development with his identity as the God of Time. '''Defense''' is associated with Artiana's Blessing, while '''Thought Acceleration''' is associated with Catathena's Blessing. These abilities broaden a repertoire that already emphasizes protection, perception, and the careful direction of power.

== Ki ==

Avery practices '''Awareness Ki''' and '''Empowerment Ki''' alongside his elemental and spiritual abilities. They form part of his broader cultivation rather than replacing the need to train his body, refine his mana, and understand his techniques.

== Physical and Mental Abilities ==

=== Agility and Reflexes ===

Years of street survival give Avery experience running, climbing, jumping, sliding, and changing direction in confined spaces. He is accustomed to judging a route quickly and escaping before a stronger pursuer can corner him. Magic builds on these habits, allowing greater leaps, softer landings, and sharper responses. His mobility is most effective when used with observation. He looks for a gap, changes position, and uses a construct or burst of magic to make the opening useful. This style often allows him to remain competitive without matching an opponent's raw strength.

=== Intelligence and Adaptation ===

Avery uses deduction and experimentation rather than relying only on inherited instinct. He applies his understanding of physics and materials to magic, asks more experienced users for explanations, and revises techniques when an encounter exposes a flaw. His progress does not make him an expert in every field. He is interested in sciences and programming, but still depends on specialists and teachers for much of his knowledge. His strength lies in combining observations from different situations and testing how they can be applied. His classroom difficulties qualify the image of an instinctive magical innovator. Understanding how to survive a chase does not provide formal combat footwork, and an interest in science does not ensure accurate experimental control or a well-organized laboratory report. Avery’s attempts to regulate the conductive plate’s heating initially swing between too little and too much output. He improves by watching the indicator, making smaller adjustments, and coordinating with Ted and River. The same willingness to identify a practical error, repeat a process, and accept another person’s method underlies his more conspicuous improvements in combat.

=== Endurance and Limitations ===

Avery can continue acting under pressure and after injury, but his ordinary durability is limited. Stronger physical attacks can break his defenses, and depleted mana weakens even techniques he previously maintained successfully. Healing and determination do not prevent unconsciousness, exhaustion, or the need for help. His desire to protect others can itself become a weakness when it pushes him to act before he has a workable plan. His companions are therefore important not only as people he protects, but as fighters, advisers, and rescuers whose abilities cover his own shortcomings.

|tab=Relationships

== Relationships ==

=== Teddric Tech ===

Ted is Avery's earliest close school friend and his first practical guide to the Mystical world. He explains unfamiliar terminology, helps Avery understand the academy, and treats his ignorance as something that can be overcome rather than a reason to exclude him. Their friendship includes constant banter, shared meals, competition, and life in Quad 44. Ted's confidence often contrasts with Avery's uncertainty, but it is not merely comic encouragement. After the orb crisis, he helps Avery understand that the consequences of the rescue do not erase its purpose or make him responsible for every action taken by the villains. The two continue supporting one another through cohort activities, IT-related problems, and the broader struggles affecting their friends. Avery benefits from Ted's loyalty and practical ingenuity, while Ted is willing to act when danger threatens people within their group.

Their shared room and common interests allow their friendship to grow through ordinary frustrations. Ted’s enthusiasm for equipment can turn a laboratory exercise into a chance to repair an apparatus, while his confidence in schoolwork often produces complaints Avery recognizes in himself. They work alongside River through missing course materials, report writing, and the embarrassment of realizing that other students have learned the same methods years earlier. Their jokes give that uncertainty a less threatening setting, making Ted a companion in the process of catching up rather than only someone who explains magic to Avery. Ted also notices changes Avery is reluctant to acknowledge, especially after his time with Lux. His teasing in the common room is intrusive enough for Avery to protest, but it occurs within a familiarity that Avery would not have allowed at the start of his life on the streets. Their friendship accommodates disagreement and embarrassment without making every vulnerable moment a reason to withdraw.

=== River Grantia ===

River is one of Avery's closest companions. Their friendship begins with his opposition to the bullying directed at her and grows through shared danger, the Sky House discovery, and their move to the Mystical Island. Avery repeatedly rejects the contempt aimed at her demihuman identity and her position within the Aquia family. He tries to defend her even when Atlas is far beyond his ability to defeat. River, in turn, increasingly trusts him with her feelings and personal history. Their bond is central to his developing ideals. Their wish to become Mystical Legends is tied to a future in which people are not denied dignity because of species or social standing. Team 44 also gives their trust a practical role, with River's contribution to the flag competition essential to the group's success.

At Regnum, their closeness continues through studying and living in Quad 44 rather than relying only on the memory of their first rescue. Both experience the difficulty of entering an institution whose expectations assume resources and training they have not had. They can recognize one another’s hesitation and benefit from the same help, while River’s contributions to Team 44 show that she is a capable partner rather than simply someone Avery protects. After the Winter’s Dance, Avery asks about her absence and recognizes the guardedness of her answer. Instead of insisting that she explain, he offers to listen when she wants to speak and mentions the cakes he brought back. The small exchange shows a gentler form of care than confrontation on her behalf: he remains attentive without deciding that concern entitles him to every part of her history. His later involvement with the Aquias brings that attitude into tension with the family judgments surrounding her.

=== Kaden Icelander ===

Kaden first appears as someone capable of rescuing Avery from threats he cannot handle. He becomes a friend, rival, recruiter, and employer whose influence opens doors to IT and other opportunities. Avery respects his power and intelligence but does not always find his motives transparent. Kaden's willingness to offer advancement also serves larger plans, particularly when Avery's magic becomes relevant to the I.T.E.R. project. Their friendship therefore includes both trust and an awareness that Kaden is making calculations beyond the immediate conversation. Their competitive relationship remains visible in the flag competition and combat assessments. Kaden's greater experience provides a standard for Avery to pursue, while his interventions show how much Avery still relies on others when his own judgment or endurance fails. When Kaden and IT are accused during the robot crisis, Avery stays with him rather than accepting the accusations at face value. Their flight and investigation test the loyalty behind their ordinary rivalry.

Avery sees enough of Kaden’s power and institutional authority to be impressed, but familiarity also allows him to question the performance surrounding that reputation. During the flag-game ceremony, he recognizes the exaggerated appearance of Kaden’s injuries as part of the prodigy’s public presentation. Their friendship can contain amusement at his self-importance while preserving respect for his abilities and gratitude for his intervention. Remaining with Kaden during the IT crisis is the more demanding expression of that trust. Avery has witnessed the project from inside and must judge his friend while official suspicion turns into pursuit. The later notes place his support beside Kaden’s effort to reclaim District 1, connecting their early rescue-and-rivalry relationship with the restoration of something central to Kaden’s own past.

=== Jane Tee ===

Jane is Avery's roommate and an important guide to everyday life at Regnum. She explains campus customs, school supplies, and the routines that Avery, Ted, and River have missed by arriving late. Her familiarity with the academy helps turn their dormitory into a functioning home rather than simply a place to sleep. As a member of Team 44, Jane also demonstrates the value of planning and creating opportunities for others. Her actions during the flag competition contribute directly to the team's victory while Avery is occupied with Kaden. Jane’s familiarity with the academy can initially make the gap between them more obvious. When she recognizes a method or mentions a supplementary booklet he does not know exists, her casual certainty reminds Avery that access to a textbook is not the same as preparation for the course. Yet she lends the material, joins the study group, and helps turn embarrassment into something workable. Her practical support becomes one of the ways Quad 44 functions as a household rather than merely an assigned dormitory.

Avery’s recommendation that she retain the Mistywood Armor after the flag competition reflects the same cooperation in reverse. He recognizes that the rare reward suits her plant abilities and does not demand it because he participated in earning it. The group’s division of the money then leaves room for the others to equip themselves, establishing a shared success that does not require identical rewards.

=== Dorian and Celia ===

Dorian and Celia become part of Avery’s academic support circle when he, Ted, and River admit that they are struggling with Regnum’s ordinary coursework. Their familiarity with the expected methods initially emphasizes how much preparation the trio lacks. Celia can mark a sentence’s structure before attempting a translation, while Dorian recognizes a shorter way to arrange the mathematical work Avery has been treating as separate problems. Neither needs to be unusually powerful to offer something Avery cannot supply through agility or an awakened mana reserve: practical knowledge of how to approach the assignment.

When Avery asks for help, they make room for the group instead of treating the gaps as a reason to exclude them. Celia explains how she organizes sentences and report headings, Dorian works through diagrams and reminds Avery about consultation hours, and Jane joins their library session with the supplementary booklet. The friendship gives Avery experience of receiving assistance from classmates outside his original circle. It also complicates his early suspicion of the academy’s privileged students, since the same environment that exposes unequal preparation contains people willing to help him overcome it.

=== Atlas Aquia ===

Atlas is Avery's cohort captain and one of the clearest examples of the gap between his ideals and the society around him. Avery is angered by Atlas's treatment of River, yet also recognizes the level of mastery he represents. Recruitment into Tempest Aquia does not immediately create equality between them. Atlas sees value in Avery's potential while retaining an interest in monitoring his unusual power. Avery gains access to training and responsibilities, but must work within a relationship shaped by rank, authority, and prejudice. The disappearance investigation forces their interaction onto firmer ground. Avery insists that the kidnapped children and the evidence deserve attention, pressing Atlas to respond to what he has found rather than dismissing him because of his standing.

The District 5 commission highlights the ambiguity of Atlas’s instruction. He has correctly inferred an aspect of Avery’s inheritance, but reveals it by forcing him into the sea before fully explaining what he expects to happen. Avery gains a major discovery from the experience while also being subjected to the captain’s assumption that he should follow first and understand later. That mixture of genuine knowledge, authority, and disregard for his uncertainty makes Atlas a more difficult mentor than a straightforward benefactor. The warehouse investigation produces another point of friction. Avery needs the captain’s resources and standing to pursue evidence against nobles, while the delay in assistance leaves him protecting the children himself. Their shared Compression power creates a technical connection between them, but it does not erase the social hierarchy or disagreements about whose account deserves belief.

=== Alteria Aquia ===

Alteria's early relationship with Avery is confrontational. At the Aquia estate, she exposes a weakness in his compressed barrier and treats his low mastery as proof that his unusual ability does not place him on her level. Avery learns from the encounter even while resisting her judgment of him. Their exchanges connect his magical training with the more difficult task of dealing with people who can teach him something useful without treating him as an equal. His later involvement with the water kingdom and work at the Aquia estate bring them into continued contact, extending their relationship beyond a single test of strength. Her early challenge is particularly instructive because she does not need to defeat his barrier by simply exceeding its mass. By moving water through the spaces his Compression has not closed, she identifies a flaw in his understanding and explains the precision behind her own technique. Avery answers by changing his attack rather than immediately mastering her method. Their interaction establishes a recurring imbalance: she can be dismissive and provocative, yet the expertise behind her criticism is real.

In the notes’ planned summer period, Avery’s lack of another place to live leads him to accept work at the Aquia estate, specifically in service to Alteria. The arrangement extends the contrast between his growing abilities and his insecure social position. Exceptional magic does not automatically give him property, money, or freedom from dependence on a noble household.

=== Charlotte Levy ===

Charlotte is an influential academy figure whose power and position initially seem far removed from Avery's own. Her capture by Pyrus nevertheless becomes a situation in which he chooses to act rather than remain a spectator. Helping recover her teaches Avery that meaningful participation does not require him to be the strongest person in a battle. The rescue also entangles him more deeply in Pyrus's pursuit of the rune and the destruction orb. Charlotte's later help against Pyrus reinforces the importance of the experienced allies surrounding him.

=== Lux Luces ===

Lux first takes an interest in Avery's unusual mana and Angelor heritage. As his substitute teacher, she recognizes how different his development is from that of students raised with magic. He asks for tutoring, and she responds with both scholarly curiosity and an interest in watching him grow. Their relationship becomes more personal through the lake accident, Lux's visits to the infirmary, and their conversations about ancestry. Avery respects her ability and status, but her willingness to speak closely with him makes her more than a distant royal figure. At the Winter's Dance, he accepts her invitation and learns to dance under her guidance. He notices the unusual closeness of her gestures but is initially reluctant to assume romantic intent. His uncertainty gradually gives way to feelings that he finds difficult to express directly. The crisis surrounding Aether's marriage plot brings those feelings into sharper focus. Avery helps expose the conspiracy, fights beside Lux, and earns Lumen's acknowledgment. Lux later summons him as her familiar, and their relationship remains important as he assumes the mantle of Magni Mage.

The current draft gives their early affection a gradual, reciprocal form. Avery admires her strength and asks for instruction, but her interest is not confined to evaluating his potential. She observes him privately, notices his uncertainty, and spends time with him outside the formal teacher-student setting in which they first become acquainted. Their dance and subsequent outing allow them to enjoy one another’s company without every conversation being about his artifact or her ancestry. The uneven wooden bird she keeps, the messages they exchange after returning home, and her expectation that he will choose their next lunch make this development concrete. Avery no longer deletes a message simply because he cannot justify why she needs to know about his departure. He sends it, receives her concern, and leaves for the commission with a pleasant future plan in mind. The later wedding-conspiracy outline develops those feelings under far more painful conditions, but the current volume already establishes the personal attachment on which that later conflict depends.

=== Kiara Katzol ===

Avery welcomes Kiara when she transfers to Regnum and defends her and River against students who object to demihumans attending the academy. His decision to accept a duel gives their friendship an immediate connection to the same injustice he has already encountered himself. Kiara supports his efforts, while she and Ted help expose the abduction plot occurring during the match. Their friendship becomes part of the larger circle of students who recognize one another's worth beyond the hierarchy imposed by the nobles. Their divine connections later make both of them targets for capture. Kiara also joins Avery and Raymond in investigating Aether and helping Lux during the attempted coup.

In the later outline, their shared experience of divine capture links personal friendship with the larger problem of people attempting to control those blessed by deities. Kiara’s bond does not function in the same way as Avery’s integration with Lynnhera, and the captors’ different response to him makes that distinction dangerous rather than merely theoretical. In the District 12 investigation, she also brings her own history with Aether and her relationship with Raymond. Avery acts beside friends with stakes and knowledge of their own, rather than gathering companions whose only purpose is his concern for Lux.

=== Caela Obtainia ===

Caela is Avery's mother and one of the central figures in the mystery of his origins. For much of his early life, he lacks a clear understanding of where she is, why they were separated, or what the rune's connection to her means. The Sky House, historical visions, and Lux's knowledge gradually give that absence a larger context. Avery's wish to find answers about Caela is not separate from his magical growth: the artifact he wields and the people pursuing it repeatedly connect his family history to present danger. Caela conceals Avery's identity in New York after attacks by the shadow cult make remaining together unsafe. The sealing of his early memories explains why his recollection of childhood does not initially match the circumstances of his birth and family.

The notes frame her decision to separate from him as an attempt at concealment under threat, while Avery’s sealed memories leave him unable to understand that decision from his childhood experience. Discovering the family connection therefore changes the meaning of his apparent abandonment without immediately supplying all the answers. The rune’s association with Caela becomes a thread he can follow, but its ability to respond to him more fully than to others also introduces questions about what he has inherited and why he was hidden. Her place among the Magni of District 7 and his own planned succession connect family history with a future public role. The outline records both positions, but it does not turn his first discovery of her identity into immediate entitlement to her authority. His intervening growth, relationships, and trials remain necessary parts of that progression.

=== Lynnhera ===

Lynnhera is spiritually anchored to Avery and becomes inseparable from the development of his Water Spirit nature and later magical body. Her connection can provide guidance, visions, and access to a level of magical knowledge beyond his own experience. Their bond is not always harmonious. Lynnhera has intentions of her own and can become a threat to his independence when she assumes control. Avery's friends must confront the consequences of a connection that can empower him while also suppressing his consciousness. The later conflict makes consent and identity central to their relationship. Avery’s reliance on her advice and power is followed by an act that suppresses him rather than simply offers him a stronger transformation. His friends’ defeat of Lynnhera is not an effortless restoration of the previous arrangement, since she continues to act under a concealed identity while he remains unconscious. The notes thus present their bond as an enduring connection whose benefits and dangers cannot be separated by treating the deity as a passive source of mana.

=== Oceanus Aquia and Captain Levi ===

Oceanus is connected with the intervention that changes Avery's life in New York and later helps arrange the students' move to the Mystical Island. His authority makes him an important presence in matters Avery cannot yet manage for himself. Captain Levi introduces Avery and his companions to another part of Mystical history during their journey. His stories of the Three Symbols place the island's public heroes within a past that is larger than the disputes the students have already witnessed.

=== Pyrus Bourn ===

Pyrus is one of Avery's first major enemies. His pursuit of the destruction orb turns Avery's discovery of the rune into an immediate threat and brings him into conflict with opponents far beyond his initial abilities. Their encounters force Avery to protect River, take part in Charlotte's rescue, and survive capture and the orb crisis. Pyrus's power makes the limits of Avery's awakening clear: gaining wings and stronger magic does not allow him to win alone. The conflict leaves a lasting impression on how he understands both responsibility and the danger of power without restraint. Pyrus’s transformation after taking power from the orb also provides a contrast with Avery’s own contact. Both emerge changed, but the villain’s escalation demonstrates how much destruction can follow an attempt to seize the artifact’s strength. Avery is left asking why his experience differed and what the power has done to him, questions the school’s officials can only partly answer. Their conflict therefore introduces not only a recurring enemy but a warning about the distance between obtaining power and understanding its consequences.
