Welcome to the '''Mystical Legends Universe''': a world of Mystical Beings, elemental magic, hidden heritage, and intertwined journeys. Explore the stories and people that bring this universe to life.

== A Universe of Stories ==
The Mystical Legends follows Avery Obtainia and his companions as they discover the Mystical, learn about their abilities, and confront the secrets of their world. From life in New York to Regnum Academy and the Mystical Island, their journeys connect personal growth with a much larger history.

This wiki brings together character profiles, story arcs, species, magic, and affiliations. Use the navigation above to explore a subject, or begin with [[char/avery_obtainia|Avery Obtainia]]. New articles will expand the archive as the universe grows.
