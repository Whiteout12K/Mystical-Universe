== Overview ==
Caela is an Angeloress associated with the early gathering of the Mystical Beings, the island's protective barrier, and the concealment of the earth orb. Her importance to the first two books is primarily historical. Avery encounters her legacy through the Sky House, the rune, and a vision, rather than meeting her as an openly identified present-day character.

== Personality ==
Caela acts protectively when the island's people and the orb are threatened. She supports Zenith's leadership because he initiated the voyage and has a plan, and uses her own specialized abilities to make that plan possible. Her willingness to fight accompanies a concern for safeguarding others.

Her confrontation with Lord Doom includes a recognition that those aligned with light can also have bad intentions. She rejects his actions without assuming that a light affinity makes every wielder morally right. This exchange gives her protective role a more considered basis than simple elemental opposition.

== Mystical Rank & Heritage ==
The historical chapters identify Caela as an '''Angeloress''', the female designation for an Angelor. They demonstrate light-oriented magic and unusual perception. Her Magni of District 7 status is preserved from the wider notes; the cited scenes do not declare an exact tier. The books' historical chronology should not be used to infer a conventional modern age for her.

== Tools and Equipment ==
Caela protects the earth orb, later called the Terracustodis or orb of destruction. She uses it in connection with the island's barrier and conceals it through a spell at the Sky House. The Rune of the Spellcaster becomes central to Avery's access to that legacy, although the books do not yet fully explain every origin or restriction of the artifact.

|tab=Synopsis

== Synopsis ==

=== The Rune of the Spellcaster ===

==== The Sky House Vision ====

River identifies the cabin as Caela's former home. Avery's vision shows Caela and Mr. Luces seeking a way to protect the earth orb from a shadow threat. She rejects destroying it because an attempt could devastate the surrounding area, and instead creates a spell to keep it hidden until the appropriate time. Lord Doom confronts her there; she binds him with magic and resists his shadows with a bright release of light.

==== Journey of the Mystical Beings ====

The historical bonus chapter depicts Caela joining Rowan and the Luces expedition. She uses perception that identifies people's species to help find other Mystical Beings. On the ship, she raises a defensive mist against dangerous weather. After the voyage, she prepares the island's concealment barrier so humans can pass through without recognizing the hidden settlement.

=== I.T.E.R. Chronicles — Initialization ===

==== Beginning of Trouble ====

The historical continuation explains that Caela used the orb to help create and reinforce the island's border. Lord Doom's threat reaches the settlers, and Caela fights beside Rowan with light and flame-like attacks. Her light dagger pressures the attacker, but his shadows can still knock her aside.

==== An Evil Man's Visit ====

When Zenith falls into an ancestral vision, Caela attempts to heal him but recognizes that the Gostlynger phenomenon must run its course. She then helps defend the settlement and the cabin against the skeleton attack. The chapter ends amid the wider assault rather than establishing a completed final victory.

These are earlier historical scenes. The unidentified woman in Avery's awakening vision should not be named as Caela solely because of resemblance or Avery's unresolved family questions.

=== Sources ===
Book 1: Chapters 4, 11–12, 16; Journey of the Mystical Beings. Book 2: Beginning of Trouble; An Evil Man's Visit.

|tab=Powers & Abilities

== Powers & Abilities ==

== Established Abilities ==

=== Light and Restraint ===

Caela forms binding chains, intense light releases, and a dagger made of light. Her battle with Doom illustrates both defensive resilience and the danger of an experienced shadow wielder.

=== Species Perception ===

Her vision identifies different Mystical species and helps gather the expedition's members. It is a demonstrated historical ability, with the later rune's identification function forming part of the related legacy.

=== Mist Barrier and Healing ===

She creates protective mist around the ship and helps establish the island's concealed border. She also attempts to heal Zenith but explains why healing cannot simply interrupt his inherited vision. This places a clear limit on what the scene proves about recovery magic.

|tab=Relationships

== Relationships ==

=== Zenith, William, and Rowan ===

Caela cooperates with the Luces family and Rowan during the gathering and settlement. She supports Zenith as leader and supplies perception and protective magic that complement the others' navigation and physical defense.

=== Avery Obtainia ===

[[char/avery_obtainia|Avery]] is connected to Caela through the wider family lore already recorded on his page. Within the first two books, her cabin and magical legacy provide clues to his origins, but his own understanding remains incomplete.

=== Lord Doom ===

Lord Doom seeks the orb she protects. Their conflict centers on the artifact's danger and incompatible claims about what power should accomplish.
