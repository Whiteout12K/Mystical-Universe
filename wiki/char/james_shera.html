James Shera, known as the Silent, is associated with IT Agency. The current Mystical Legends: Game roster presents him as an Elementor with a Fire affinity and a Healer role.

|tab=Overview

== Background ==
James’s Fandom profile associates him with IT security and IT Agency leadership. His game appearance uses the current roster’s Fire affinity and healing role.

The older Fandom profile describes James as a Wentor with Wind and Strength magic. These details differ from the current game roster; the game fields above follow the roster.
