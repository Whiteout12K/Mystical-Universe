<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JScratch · Live Inspector</title><link rel="icon" href="/images/website/icons/torch.svg" type="image/svg+xml"><link rel="stylesheet" href="editor/inspector.css"></head>
<body>
<header><strong>Live sprites</strong><span id="connection" role="status">Connecting…</span></header>
<div class="search-row"><input id="filter" type="search" placeholder="Find a sprite or clone…" aria-label="Find a sprite or clone"><span id="count">0</span></div>
<main><section class="objects"><div id="sprite-list" role="listbox" aria-label="Active sprites"><div id="list-spacer"></div><div id="list-rows"></div></div><p id="empty-list">Waiting for the game…</p></section>
<section id="detail" aria-label="Sprite properties"><div id="empty-detail">Select a sprite to inspect its live properties and variables.</div><article id="selected" hidden>
<div class="selected-heading"><h1 id="selected-name"></h1><span id="selected-type"></span></div><p id="selected-source"></p>
<div class="position"><div><small>X</small><strong id="pos-x">0</strong></div><div><small>Y</small><strong id="pos-y">0</strong></div><div><small>Scale</small><strong id="pos-scale">1</strong></div></div>
<details open><summary>Sprite vars <span id="vars-count"></span></summary><p class="hint">Values local to this sprite or clone.</p><div id="sprite-vars"></div></details>
<details open><summary>Private vars <span id="private-count"></span></summary><div id="private-vars"></div></details>
<details open><summary>Properties</summary><div id="properties"></div></details>
</article></section></main>
<footer>Live · read only <span id="updated"></span></footer>
<script type="module" src="editor/inspector.mjs"></script>
</body></html>
