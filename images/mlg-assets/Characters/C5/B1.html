<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Skill Info</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      color: #FFEBEE;
      background-color: #63141462;
      font-size: 9px;
      padding: 4em 1em;
      padding-right: 1.5em;
    }

    .icon-container {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .effect-icon {
      flex-shrink: 0;
    }

    .effect-text {
      flex: 1;
    }

    .level-display {
      margin-top: 15px;
      font-size: 8px;
      color: #FFEBEE;
    }
  </style>
</head>

<body>

  <div><b style="font-size:14px;">Basic Skill: Water Manipulation</b></div>

  <div style="padding-top:7px">River utilizes water around and within herself, dealing <b style="color:#80a1da">[Water]</b> damage.</div>
  <div id="stage1" style="padding-left:15px;padding-top:7px"></div>
  <div id="stage2" style="padding-left:15px;padding-top:7px"></div>
  <div id="stage3" style="padding-left:15px;padding-top:7px"></div>

  <div style="padding-left:15px;padding-top:10px" class="icon-container">
    <div class="effect-icon">
      <img src="../../Effect-Icons/overwhelming-mana.svg" alt="Mana Icon" style="width:20px; height:20px" />
    </div>
    <div class="effect-text">
      <b style="color:#3c78d8">[Overwhelming Mana]</b>
      <div style="padding-top:3px"><span style="color:#969595ad">Buff</span>: Stackable charge of energy (Infinite Stacks).</div>
    </div>
  </div>

  <div class="level-display" id="level"></div>

  <script>
    const maxLevel = 10;
    const baseDamage = [60, 85, 135];

    // Read level from ?id=#
    const params = new URLSearchParams(window.location.search);
    let level = parseInt(params.get("id")) || 1; // default = 1
    level = Math.min(maxLevel, Math.max(1, level)); // clamp between 1 and max

    function updateDamage() {
      const multiplier = 1 + 0.25 * (level - 1);

      document.getElementById("stage1").innerHTML =
        `<u>Stage 1</u>: Spray water from her fists, dealing <b>${(baseDamage[0] * multiplier).toFixed(1)}%</b> of attack as damage.`;

      document.getElementById("stage2").innerHTML =
        `<u>Stage 2</u>: Throws a sphere of water at opponents, dealing AoE damage equal to <b>${(baseDamage[1] * multiplier).toFixed(1)}%</b> of attack.`;

      document.getElementById("stage3").innerHTML =
        `<u>Stage 3</u>: Slashes with a surging wave, dealing <b>${(baseDamage[2] * multiplier).toFixed(1)}%</b> of attack as damage. Gain a stack of <b style="color:#3c78d8">[Overwhelming Mana]</b>.`;

      document.getElementById("level").textContent = `< Skill Level: ${level} >`;
    }

    updateDamage();
  </script>

</body>

</html>
