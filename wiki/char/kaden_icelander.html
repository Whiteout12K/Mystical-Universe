'''Kaden Icelander''' is an [[fandom:Icelorian|Icelorian]] prince, an IT executive, and one of the co-leaders of the [[mystical_legends|Mystical Legends]]. The son of [[char/ioward_icelander|Ioward Icelander]], he is known for his command of Ice Magic, his skill with the hereditary Icelorian Blade, and his role in developing IT's technology. At [[fandom:Regnum Academy|Regnum Academy]], he belongs to the [[fandom:Blue Legion|Blue Legion]] Cohort and becomes both a rival and an ally to [[char/avery_obtainia|Avery Obtainia]].

Kaden's public confidence conceals a history shaped by the loss of District 1. He seeks the influence, resources, and strength needed to recover his homeland and prevent another catastrophe. His ambition drives the growth of IT and the creation of '''I.T.E.R.''', but also brings him into conflict with the company's leadership, the authorities of Lux Urbis, and friends who question his methods.

|tab=Overview

== Appearance ==

Kaden is a tall young man with pale skin, untidy white hair, and lapis-blue eyes. He commonly wears a suit, maintaining a professional appearance even when his behavior is casual or theatrical. A gold IT badge marks his senior position within the organization.

His demeanor can change sharply when he releases his magic. An icy blue aura and falling temperatures make his presence physically apparent to those around him. In combat, his Icelorian Blade becomes brighter and more heavily coated in ice as he channels additional mana through it.

== Personality ==

Kaden is highly confident in his intelligence and magical ability. He enjoys presenting himself as someone who has already anticipated an opponent's next move, whether that opponent is a fellow student, a corporate director, or an enemy on the battlefield. He frequently uses teasing, calculated pauses, and dramatic demonstrations to control a conversation or attract attention to his plans.

His self-assurance can become arrogance. He dismisses objections when he believes he understands a problem better than everyone else and is willing to pressure people into accepting his decisions. He does not always distinguish between an ambitious project and the risks imposed on the people helping him complete it. The injuries sustained during I.T.E.R.'s combat trials expose this weakness: Kaden is fascinated by the machine's progress even while his colleagues are concerned about its test opponents.

Nevertheless, Kaden values competence and independent thinking. He takes an interest in Avery because the younger boy adapts quickly, questions explanations, and possesses unusual potential. He can also recognize the limits of individual strength. After losing the flag competition despite overpowering much of the field, he acknowledges that he cannot accomplish everything alone.

His attachment to formality is selective. Kaden expects professional conduct and insists on the importance of IT's rules, but his oldest companions readily interrupt or mock him. Lucy manages his schedule and challenges his claims, while Amos responds to his threats with jokes. Their familiarity reveals a less controlled side of him than the image he presents to employees or the public.

Kaden's ambition is rooted in grief as well as pride. After losing his homeland, he becomes withdrawn and reluctant to form new relationships. Lucy and Amos help pull him out of that isolation. His later drive to expand IT reflects a conviction that he must take responsibility for changing circumstances rather than wait for someone else to act.

== Heritage and Royal Status ==

Kaden is the prince of District 1 and the son of its ruler, Ioward Icelander. His Icelorian inheritance gives him considerable magical potential, particularly in the creation and manipulation of ice. His family line is connected with the Icelorian ancestor [[fandom:Ion Mustard|Ion Mustard]].

The fall of District 1 leaves him separated from the homeland and political position into which he was born. His life in New York and his work at IT become part of a long-term effort to regain what was lost.

{{Spoiler|Kaden later leads the effort to reclaim District 1. With Avery and the others helping cleanse the district, he becomes its new '''Magni Sage''' as its citizens return. His later identities include the '''True Demon King''' and the '''God of Space'''.}}

== IT Industries and the IT Agency ==

Kaden contributes to IT from its early development as '''Icelander Tech'''. While Ioward favors a stable business, Kaden wants the company to pursue a much more visible and ambitious role. He sees technology as a means of bridging the capabilities of ordinary humans and Mystical Beings, as well as a source of the resources needed for his own plans.

He directs research, hires personnel, negotiates with the board, and organizes recruitment into the IT Agency. His authority is substantial but not initially absolute. The board controls company resources, and his father's position limits what he can approve independently. These restrictions are one of the reasons he pursues the Acting CEO role.

His appointment begins as a '''six-month probation'''. During that period, he is expected to prove his ability to lead the company. He uses the position to improve cooperation between departments, advance the robot project, and give greater responsibilities to trusted associates.

== Tools and Equipment ==

=== Icelorian Rune and Goblin Sword ===

Kaden's hereditary artifact can be concealed as a ring and released as a long, blue-toned sword. It is known as the '''Icelorian Blade''', '''Icelorian Sword''', or '''Goblin Sword''', and is associated with the '''Signet Ring of the Universe'''.

The weapon serves as a conduit for its wielder's magic rather than an independent supply of power. Kaden infuses it with his own ice, strengthening its cutting force and allowing it to direct large-scale techniques. He can also throw it and use Ice Travel to reappear beside it during an attack.

The blade's power comes at a cost. Sustained use rapidly consumes his mana, and its most demanding techniques can leave him exhausted or unable to continue a battle.

=== IT Equipment and Facilities ===

Kaden has access to IT's vehicles, communications systems, security equipment, research facilities, and technical staff. Automated transport and ITA devices allow him to coordinate people and operations beyond his immediate location. The towers provide laboratories, production facilities, and secure spaces for the projects he oversees.

His authority over this infrastructure is an important part of his influence. It remains dependent on money, personnel, corporate decisions, and the political conditions in the districts where IT operates.

=== I.T.E.R. ===

'''I.T.E.R.''' stands for '''Icelander Tech Electronic Robot'''. Kaden initiates the project as a personal companion, assistant, and potential source of protection during dangerous work. Its construction involves engineers, technicians, security specialists, and test participants rather than Kaden alone.

The robot combines a durable mechanical body with systems that analyze opponents and adapt to their movements. After installation of its central system, it can speak, assist with tasks, and respond independently. Kaden regards it as both a technological achievement and an asset in his plan to reclaim District 1.

== Synopsis ==

=== District 1 and the Nuntios ===

Kaden grows up as the son of Ioward Icelander, ruler of District 1. His mother's death leaves a lasting absence in the family. He becomes involved in the development of IT and gathers the first IT Agency to oppose Malum, a company whose influence threatens the Icelanders' work and the district's stability. Josh Picard, Jay Neomo, Lux Luces, and Marin Kne become the Nuntios.

{{Spoiler|Unknown to Kaden, Ioward has made a pact with a Demon God in an attempt to revive his wife. Malum's involvement is part of a scheme to destroy District 1 and gather souls for the ritual. Kaden discovers the threat of a bomb and sends the Nuntios to stop it, but the attack succeeds. The revival fails, leaving the district devastated and few survivors. Kaden and Ioward leave for New York.}}

After the loss of the district, Kaden releases the Nuntios from their immediate service to him. He asks them to help others avoid the same fate. The four continue their training at Regnum Academy and develop into a cohort capable of undertaking exceptionally dangerous missions.

=== New York and IT's Expansion ===

At fourteen, Kaden attends school in New York while struggling to recover from the destruction of his former life. He withdraws from other students and treats new relationships as a risk he does not want to take. His father's control of IT also frustrates him, since the company's modest direction does not match his own ambitions.

Lucy Terner repeatedly challenges his isolation, while Amos Black persists in befriending him despite his dismissive responses. Their efforts help Kaden reconsider his attitude. He begins turning his frustration into plans for technology, business expansion, and a more influential place in the world.

He promotes IT-Phones and draws public attention to the company, then persuades its leadership to allow further expansion. His plans include towers in New York and District 7. He assigns Lucy and Amos construction responsibilities while preparing to attend Regnum Academy, where academic success and influential contacts will support the district-side operation.

=== Meeting Avery Obtainia ===

Kaden encounters Avery and River near IT Tower and recognizes their Mystical nature. Though he often speaks casually, he understands more about their situation than he initially reveals. His response to the shadow cult's pursuit demonstrates both his ice magic and his ability to assess danger quickly.

He later participates in discussions about the incidents surrounding Avery, the Mystical Island, and the suspicious use of magical power. Lucy's intelligence work and IT's transport records support these investigations. Kaden begins to regard Avery as someone whose unusual abilities may have importance beyond the immediate crisis.

=== Rescue in District 3 ===

After Pyrus Bourn abducts Charlotte Levy, Kaden organizes a student rescue party despite the political risks of entering District 3. He divides responsibilities between diversion and infiltration, coordinates the operation with IT equipment, and confronts Ellie Tracey with River's assistance.

When Pyrus escapes with Avery, Kaden follows the pursuit. Pyrus's awakening and inferno magic turn the confrontation into a much more dangerous battle. Kaden releases the Icelorian Blade and uses its cold to suppress the enemy's fire, including through Absolute Zero.

The weapon's demands and Pyrus's growing strength eventually overwhelm him. Kaden cannot finish the fight before Atlas and Charlotte intervene. His defeat leaves him with a powerful reminder that talent and preparation do not guarantee victory against every opponent.

=== Cohort Selection ===

Kaden accompanies Avery and the others into the cohort-selection challenge even though he already belongs to Blue Legion. He fights beside Avery against Elmor Locks, combining ice constructs and confinement with Avery's aerial attacks and light magic.

Elmor counters their techniques through superior experience and control. The encounter gives Kaden an opportunity to demonstrate his range while also exposing the difference between a promising student and a seasoned cohort captain.

=== Flag Competition ===

Kaden competes for Team 20 alongside Alisha Locks and confronts Avery's Team 44. By this point, he has reached Tier 4, Level 3. His aura, terrain control, and hereditary blade make him the most dangerous individual opponent Avery's team must contend with.

He raises an immense ice formation around the island, pursues Avery through the air using Ice Travel and successive ice constructs, and deploys Absolute Zero. When Avery breaks apart the enormous ice attack, Kaden reshapes what remains into a falcon and continues fighting from its back.

The scale of the duel does not decide the competition. While Kaden concentrates on Avery, River and Jane secure the flags that give Team 44 the victory. Exhausted by the fight and the loss, Kaden accepts that individual strength cannot replace teamwork.

=== Acting CEO of IT Industries ===

Following the competition, Kaden expands IT Agency recruitment and brings Avery into its work. Avery passes a practical interview and joins the developing robot project, entering the circle of people Kaden trusts with sensitive assignments.

Company restrictions threaten the pace of the project. With Ioward absent and the board controlling resources, Kaden decides that the most direct solution is to take the vacant leadership role himself. He argues for a phased transition, offers financial incentives, and secures a six-month appointment as Acting CEO.

He then reorganizes departmental cooperation and assigns greater responsibilities to his associates. Lucy serves as his personal secretary and leads Intelligence, while Amos remains central to engineering and Task Force operations.

=== Completion of I.T.E.R. ===

Kaden's team brings the robot to the testing stage. Its adaptive combat systems allow it to learn from Lucy's movements, and later tests against Avery demonstrate both the sophistication of its responses and the danger of treating live opponents as routine equipment checks.

Lucy and Avery are injured during the trials. Other members of the team object to the risks, but Kaden sees the robot's performance as evidence of success. Installation of the central system produces a speaking, responsive I.T.E.R. that can assist with work and express loyalty to its creator.

Kaden views the completed machine as an important step toward restoring what he lost. The achievement also gives his enemies a new way to attack him: technology built in IT's name can be used to implicate the company even when he has not authorized its deployment.

=== Robot Outbreak and Flight from Lux Urbis ===

{{Spoiler|Copies of I.T.E.R. appear in attacks on Lux Urbis. The machines' connection to IT makes Kaden a target for the authorities, while hostile political interests exploit the situation. Hayman confronts him, and Martin's identification of the original blueprints strengthens the accusation against him.}}

{{Spoiler|Kaden and his close associates escape IT Tower through a secondary route and flee by vehicle. Pursuers include General Squilish, whose terraforming magic threatens both their route and nearby civilians. Kaden recognizes that a direct battle would place the group at a serious disadvantage and concentrates on getting them out rather than proving himself in a duel.}}

{{Spoiler|Forced into hiding, the group travels through the forests and toward the black market of District 13. Kaden seeks the origin of the copied machines and a means of exposing the people behind them. The crisis intertwines with the kidnapping of demihumans, forced labor, and the growing conflict between the city's nobles and the resistance.}}

=== Reclaiming District 1 ===

{{Spoiler|When a group seeking divine power turns its attention to District 1's shadow energy, Kaden gains an opportunity to recover his homeland. He leads the effort to retake the district, with Avery's magic and the support of their companions helping cleanse it. As citizens return, he becomes the new Magni Sage.}}

{{Spoiler|After graduation, Kaden continues alongside the other Mystical Legends as they pursue their own paths and prepare for the threats emerging from the shadows. His later development connects his Icelorian inheritance and demonic legacy with the identities of True Demon King and God of Space.}}

|tab=Powers & Abilities

== Powers & Abilities ==

Kaden is an ice specialist whose techniques range from precise blades and restraints to large-scale terrain alteration. He combines this versatility with swordsmanship, spatial repositioning, tactical judgment, and extensive technological support. His strongest displays depend heavily on mana expenditure and the use of his hereditary artifact.

== Ice Magic / Cryokinesis ==

Kaden can create and manipulate ice in numerous shapes, including swords, drills, needles, chains, pillars, prisons, projectiles, and animal-shaped constructs. He uses ice both offensively and as a means of controlling where opponents can move.

His magic changes the surrounding environment as well as the immediate target. Large formations lower temperatures, create new surfaces to stand on, and transform a battlefield's height and available routes. He can redirect or reshape an existing creation instead of discarding it when the situation changes.

=== King's Domain ===

'''King's Domain''' spreads Kaden's ice across the surrounding battlefield. It provides the basis for several related applications:

* '''Kingdom's Pillars:''' Raises pillars that support Kaden's movement and give him elevated positions from which to attack.
* '''Needle Style:''' Launches small, concentrated ice projectiles at an opponent.
* '''Piercing Style:''' Uses concentrated, penetrating ice attacks.
* '''Knight Style:''' Shapes compact ice into paired longswords for close combat.

These techniques allow Kaden to shift between ranged pressure, control of the terrain, and direct weapon exchanges.

=== Ice Weapons and Restraints ===

* '''Ice Javelin:''' Produces a spear-like ice projectile.
* '''Twin Ice Blades:''' Creates two ice weapons for close-range attacks.
* '''Frozen Restraining:''' Uses ice to restrict a target's movement.
* '''Ice Prison:''' Encloses an opponent in dense ice. Kaden combines it with Avery's blinding light during their battle against Elmor.
* '''Ice Wall:''' Forms a barrier of ice.

His constructs are not unbreakable. Elmor can shatter or counter them with sufficiently powerful, precisely applied Wind magic.

=== Ice King's Ledge and Supreme Ice Pillar ===

'''Ice King's Ledge''' raises a mountainous formation around Kaden, giving him an elevated position and extending his influence across the battlefield. During the flag competition, its growth covers much of the island's edge.

'''Supreme Ice Pillar''' provides a more immediate answer to aerial movement. Ice erupts upward from the water toward Kaden, giving him a surface to catch and ride as it extends into the sky. The technique allows him to continue pursuing a flying opponent without possessing wings of his own.

=== Frost Eruption ===

Kaden sends jagged spikes outward from an ice surface. While fighting Avery on an immense ice mass, he uses the technique to threaten the Angelor from multiple directions and force him away from the platform.

=== Ice King's Ascension ===

'''Ice King's Ascension''' reshapes a large body of ice into a falcon-like construct that responds to Kaden's will. He stands on its head and directs it through his blade while its wings disturb the surrounding air.

The construct extends both his mobility and his reach in an aerial battle. It is formed from his magic and remains part of his active control of the battlefield.

== Swordsmanship ==

Kaden is capable of fighting with conjured weapons as well as the Icelorian Blade. He combines lunges, rapid changes in position, aerial exchanges, and ranged releases from the sword rather than relying solely on a conventional fencing stance.

* '''Ice Lance's Thrust:''' A forward sword attack accompanied by a trail of blue energy.
* '''Icicle Arch:''' A sweeping motion that releases ice needles, allowing him to interrupt a clash and attack from a changed angle.

Against Avery, Kaden uses the sword as both a weapon and an anchor for his movement. He can throw it past an opponent, disappear, and reappear beside it to resume the attack from another direction.

== Ice Travel and Spatial Movement ==

'''Ice Travel''' allows Kaden to disappear through a dark, mist-like transition and emerge at another position. In combat, he uses it to relocate to his thrown blade and continue an aerial pursuit. It also supports practical movement and the transport of equipment.

The technique makes his position difficult to follow, but does not remove the need to judge an opponent's reactions. Avery can adapt after observing the maneuver, forcing Kaden to vary his approach.

== Absolute Zero ==

'''Absolute Zero''' is one of the most demanding techniques Kaden channels through the Icelorian Blade. Its cold can oppose powerful inferno attacks and gather surrounding snow and ice into a massive directed formation.

During the flag competition, he sends an enormous ice mass after Avery. When the attack is damaged, he continues using the surviving ice as a surface for combat and ultimately reshapes it into his falcon. This adaptability makes the technique useful beyond its initial impact.

Its scale also carries a substantial cost. Kaden's reserves and physical condition limit how long he can sustain the blade's output, particularly after a sequence of other large techniques.

== Regnum Spei and Icelorian Inheritance ==

Kaden's hereditary abilities include '''Black Ice''' and '''Spatial Magic'''. They form part of an Icelorian magical inheritance associated with dark ice and exceptional adaptability.

{{Spoiler|His later arsenal includes '''White Ice''', '''Icengon''', '''Antigravity''', '''Decompression''', '''Transmutation''', and '''Absolute Transcendalism'''. These abilities accompany the expansion of his ice and spatial powers.}}

=== Shadow and Demon King Mode ===

{{Spoiler|Kaden's demonic inheritance is tied to the consequences of Ioward's pact. Shadow Manipulation and Demon King Mode become part of his later abilities, alongside his identity as the True Demon King. He is also associated with Shadow among the Gods of the Prime Elements and bears the title God of Space.}}

== Technical Knowledge ==

Kaden understands runecrafting, product development, robotics, and the integration of magic with technology. His early IT-Phone demonstrations help bring IT into public attention, while his later work directs the development of I.T.E.R.'s mechanical and adaptive systems.

He can also create runecrafted equipment for practical use. His technical skill complements his elemental magic, allowing him to approach problems with either a spell, a device, or a combination of both.

== Leadership and Strategy ==

Kaden organizes rescue parties, assigns operational roles, and uses intelligence gathered by IT to locate targets and coordinate movement. In business, he negotiates for authority, funding, and personnel rather than relying on technical knowledge alone.

His strategic judgments improve when he accepts the limits of a direct confrontation. During the pursuit through Lux Urbis, he prioritizes escape from General Squilish over a fight against the stronger opponent. Conversely, the flag competition shows that concentrating on defeating a single rival can leave the wider objective exposed.

== Limitations ==

* '''Mana Consumption:''' The Icelorian Blade and large ice formations rapidly reduce his reserves. The sword returns to ring form when his mana is exhausted.
* '''Stronger Opponents:''' Pyrus and experienced cohort captains can overcome or counter his techniques. His prodigy status does not guarantee victory across differences in power or experience.
* '''Divided Attention:''' An intense duel can distract him from objectives being pursued elsewhere, as demonstrated by Team 44's flag captures.
* '''Overconfidence:''' His certainty in his own judgment can lead him to underestimate risks, dismiss criticism, or expose allies to unnecessary danger.
* '''Institutional Constraints:''' IT's equipment and staff are powerful resources, but access to them depends on funding, corporate authority, and political circumstances.

|tab=Relationships

== Relationships ==

=== Avery Obtainia ===

Kaden becomes interested in Avery because of his unusual power, adaptability, and willingness to think independently. Their relationship develops through shared danger, competition, and work at IT. He gives Avery access to opportunities that would otherwise be difficult for a newly arrived commoner to obtain, while keeping a close watch on his growth.

Their rivalry is particularly visible during the flag competition, where each forces the other to reveal more of his abilities. Avery's team wins through cooperation rather than a simple victory in their duel. Kaden subsequently recruits him as an intern and includes him in I.T.E.R.'s development and testing.

The friendship is not free of tension. Kaden's treatment of live combat trials puts Avery at risk, while his habit of withholding information leaves others uncertain of his intentions. Nevertheless, Avery remains beside him when IT's enemies turn the authorities against him.

{{Spoiler|Avery later helps Kaden recover District 1, using his magic in the effort to cleanse the district. Their partnership continues as their respective roles develop toward the God of Time and God of Space.}}

=== Ioward Icelander ===

Ioward is Kaden's father and a central figure in both his royal upbringing and IT's history. After the family leaves District 1, they establish a new life in New York, but disagree over how far IT should expand. Kaden resents being kept from the authority and resources he believes he could use more effectively.

Ioward's absence from the company's leadership later creates the opening for Kaden's appointment as Acting CEO. Even while challenging his father's control, Kaden invokes their shared work and the future he believes IT should pursue.

{{Spoiler|Ioward's attempt to revive his wife lies behind the destruction of District 1. His pact and the resulting demonic legacy connect the family's tragedy to Kaden's later powers.}}

=== Lucy Terner ===

Lucy is one of Kaden's oldest close companions and one of the people who challenges his isolation in New York. Their familiarity continues within IT, where she serves as his secretary and later leads the Intelligence Force.

She manages his appointments, handles sensitive information, and questions his decisions without treating his position as a reason to remain silent. Kaden trusts her with important assignments and defends her competence when Amos provokes him. Amos teases them about being a couple, but Kaden denies that she is his girlfriend.

Lucy remains closely involved in the robot project and accompanies the group when the crisis forces them out of IT Tower.

=== Amos Black ===

Amos befriends Kaden during his withdrawn school years and persists despite being repeatedly dismissed. He becomes a key associate in IT's expansion, its engineering work, and its practical security.

Their conversations often involve teasing, complaints, and threats that neither treats as a complete break in the friendship. Amos's jokes about Lucy and the company's rules frequently undermine Kaden's attempt to maintain a stern professional image. Even so, Kaden relies on his ability and regards him as too valuable to discard over their arguments.

=== Charlotte Levy ===

Charlotte is a mentor and the Centurion of Kaden's Blue Legion Cohort. Her abduction drives him to organize the rescue in District 3. Their acquaintance provides him with trust and support within the academy, but does not exempt him from cohort duties or criticism.

=== Alisha Locks ===

Alisha is Kaden's teammate in the flag competition and a fellow Blue Legion member. She recognizes the scale of his ice magic and moves out of its way when he releases his power. Their cooperation contrasts with the broader teamwork that ultimately gives Avery's team the victory.

=== The Nuntios ===

Josh Picard, Jay Neomo, Lux Luces, and Marin Kne are connected to Kaden through the first IT Agency and the conflict with Malum. He recruits them for a purpose beyond their separate lives, and their relationship continues to influence the cohort's identity after the loss of District 1.

He later asks them to help prevent others from suffering a similar fate. When they meet again at Regnum, Lux recognizes him as the person who conducted their first mission.

=== IT's Board and Project Team ===

Kaden's relationship with the board combines negotiation, frustration, and mutual dependence. Chair Gren and Dr. Lillian question the cost and risk of his proposals, while Martin participates in company decisions and acts as a senior adviser. Kaden wins support by presenting opportunities for growth and promising material benefits.

His projects also depend on specialists such as Amos, Arthur Fowler, and James Shera. Their work makes I.T.E.R. possible, and their objections during dangerous tests challenge his tendency to place results above safety.

{{Spoiler|During the robot outbreak, Martin's identification of Kaden's blueprints helps the council build its case against him. The episode exposes the vulnerability of an executive whose authority can become evidence against him when the institution turns hostile.}}

=== Pyrus Bourn ===

Pyrus becomes Kaden's enemy through Charlotte's abduction and the confrontation over the Orb of Destruction. Kaden's ice provides a direct answer to the villain's fire, but Pyrus's awakening turns the fight against him. The defeat remains an important example of the limits of his early strength.
