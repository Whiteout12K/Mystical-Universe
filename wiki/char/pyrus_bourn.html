Pyrus Bourn, known as Pyro, is a Larvan associated with District 3. He commands Tom Nado, Tony Smith, and Ellie Tracey, and wields fire magic and the Orb of Destruction.

|tab=Overview

== Background ==
Originally human, Pyrus becomes a Larvan. His Fandom profile connects him with Fire Increaser Co., a volcano lair, and the Orb of Destruction. The notes record his progression from around Tier 4–5 in Rune of the Spellcaster to Tier 7, Level 1 in Interlude I.

== Subordinates ==
* [[char/tom_nado|Tom Nado]]
* [[char/tony_smith|Tony Smith]]
* [[char/ellie_tracey|Ellie Tracey]]

== Trivia ==
