<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MLG - Loading Character</title>

<link rel="icon" href="/images/website/favicon.png" type="image/png">
<link href="/css/bootstrap-min.css" rel="stylesheet">
<link rel="stylesheet" href="/css/home.css">
<link rel="stylesheet" href="/css/news.css">
<link rel="stylesheet" href="/css/mlg.css">
<link rel="stylesheet" href="/css/c4-skill-tree.css">
<script src="/js/bootstrap-bundle-min.js"></script>

<style>
:root{
  --character-button-color:#a20b0b;
  --fantasy-red:#741b22;
  --fantasy-red2:#a52a32;
  --fantasy-gold:#d6aa45;
  --fantasy-gold2:#f0ca69;
  --fantasy-dark:#111011;
  --fantasy-panel:#1b1819;
  --fantasy-panel2:#242021;
  --fantasy-border:rgba(214,170,69,.32);
  --fantasy-border-bright:rgba(240,202,105,.75);
  --fantasy-text:#eddcb0;
  --skill-transition:.25s ease;
}

*{box-sizing:border-box;font-family:Arial,sans-serif}

html{
  min-height:100%;
  background:#0e0000!important;
  background:
    radial-gradient(circle at 50% 0%,rgba(116,27,34,.24),transparent 38%),
    linear-gradient(180deg,#0d0c0d 0%,#2a000e 50%,#0d0c0d 100%);
}

body{
  margin:0;
  min-height:100vh;
  color:var(--fantasy-text);
  background:
    radial-gradient(circle at 50% 0%,rgba(116,27,34,.18),transparent 36%),
    radial-gradient(circle at 50% 100%,rgba(214,170,69,.05),transparent 30%),
    linear-gradient(180deg,#0d0c0d 0%,#171415 55%,#0d0c0d 100%);
}

.skills-heading-row{display:contents}
.skills-heading-row:has(.skill-variant-selector:not([hidden])){display:flex;align-items:center;flex-wrap:wrap;gap:20px}
.skills-heading-row:has(.skill-variant-selector:not([hidden])) h3{margin:0}
.skill-variant-selector:not([hidden]){display:flex;flex-wrap:wrap;gap:16px;margin:0;padding:4px 8px}
.skill-variant-selector button,.skill-variant-selector a{border:0;border-bottom:1px solid rgba(214,170,69,.16);border-radius:0;padding:3px 0;background:transparent;color:var(--fantasy-text);font:400 12px/1.5 Arial,sans-serif;cursor:pointer}
.skill-variant-selector button:hover,.skill-variant-selector button[aria-pressed="true"]{border-bottom-color:rgba(240,202,105,.4);color:var(--fantasy-gold2)}
.skill-variant-selector a[aria-current="true"],.skill-variant-selector a:hover{border-bottom-color:rgba(240,202,105,.4);color:var(--fantasy-gold2)}
#character-form-selector{justify-content:center;align-items:center;text-align:center;margin-bottom:28px;gap:10px}
#character-form-selector a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:9px 16px;border:0;border-radius:10px;text-decoration:none;font:700 1rem/1.5 Arial,sans-serif;letter-spacing:.02em;color:#a99c85;background:transparent;transition:background .18s ease,color .18s ease,box-shadow .18s ease}
#character-form-selector a:hover{color:#f0dfbc;background:rgba(240,202,105,.06)}
#character-form-selector a[aria-current="true"]{color:#f0ca69;background:linear-gradient(135deg,rgba(240,202,105,.13),rgba(240,202,105,.04));box-shadow:inset 0 0 0 1px rgba(240,202,105,.14),0 3px 12px rgba(0,0,0,.12)}
@media(prefers-reduced-motion:reduce){#character-form-selector a{transition:none}}
#character-form-selector a>div{font-size:inherit!important}
#character-form-selector .alter{display:inline-block;vertical-align:middle;margin-left:3px;padding:1px 5px;background:#ec7b43;border-color:#ec7b43;border-radius:4px;color:#ffdfcf;font-size:.75rem;font-weight:400;line-height:1.2;text-shadow:none}
.skill-variant-selector a:focus-visible,.skill-variant-selector button:focus-visible{outline:2px solid var(--fantasy-gold2);outline-offset:3px}

/* Page heading */

#page-heading{
  margin:0;
  color:var(--fantasy-gold2)!important;
  font:700 1.35rem Arial,sans-serif;
  letter-spacing:.08em;
  text-transform:uppercase;
  text-shadow:0 2px 8px #000;
  border-bottom:1px solid rgba(214,170,69,.18);
  background:linear-gradient(
    90deg,
    rgba(116,27,34,.32),
    rgba(20,18,19,.92) 35%,
    rgba(20,18,19,.92) 65%,
    rgba(116,27,34,.32)
  );
  box-shadow:0 3px 15px rgba(0,0,0,.35);
}

.container.py-4{
  padding-top:32px!important;
  padding-bottom:32px!important;
}

/* Character */

.splash-art{
  display:block;
  width:100%;
  height:600px;
  object-fit:contain;
  object-position:center;
  filter:
    drop-shadow(0 0 18px rgba(255,120,120,.25))
    drop-shadow(0 0 45px rgba(116,27,34,.22));
  transition:filter .35s ease,transform .35s ease;
}

.splash-art:hover{
  filter:
    drop-shadow(0 0 20px rgba(240,202,105,.2))
    drop-shadow(0 0 50px rgba(116,27,34,.35));
  transform:scale(1.01);
}

#character-info{
  padding:30px;
  color:var(--fantasy-text);
  border:1px solid rgba(214,170,69,.18);
  border-radius:14px;
  background:linear-gradient(
    145deg,
    rgba(38,32,33,.78),
    rgba(17,15,16,.78)
  );
  box-shadow:
    0 12px 35px rgba(0,0,0,.45),
    inset 0 1px 0 rgba(240,202,105,.06);
}

#character-name{
  margin-bottom:18px;
  color:var(--fantasy-text);
  font:700 2rem Arial,sans-serif;
  letter-spacing:.02em;
  text-shadow:0 2px 10px #000;
}

#character-name:after{
  content:"";
  display:block;
  width:90px;
  height:2px;
  margin-top:12px;
  background:linear-gradient(90deg,var(--fantasy-gold),transparent);
  box-shadow:0 0 8px rgba(240,202,105,.25);
}

.role-icon{
  width:60px;
  height:60px;
  margin-bottom:15px;
  object-fit:contain;
  filter:drop-shadow(0 0 7px rgba(240,202,105,.3));
}

/* Rarity */

#character-rarity{
  display:inline-block;
  font:700 1.5rem Arial,sans-serif;
  letter-spacing:.12em;
  text-shadow:0 2px 7px #000;
}


#character-rarity.lr{
  color:#edadda!important;
  text-shadow:
    0 0 5px rgba(255, 181, 230, 0.75),
    0 0 14px rgba(255, 202, 243, 0.4),
    0 2px 7px #000;
}

#character-rarity.ur{
  color:#cb5252!important;
  text-shadow:
    0 0 5px rgba(240, 105, 105, 0.75),
    0 0 14px rgba(240, 105, 105, 0.4),
    0 2px 7px #000;
}

#character-rarity.ssr{
  color:#cba952!important;
  text-shadow:
    0 0 5px rgba(240,202,105,.75),
    0 0 14px rgba(240,202,105,.4),
    0 2px 7px #000;
}

#character-rarity.sr{
  color:#a584cd!important;
  text-shadow:
    0 0 5px rgba(203,179,232,.65),
    0 0 13px rgba(203,179,232,.3),
    0 2px 7px #000;
}

#character-rarity.r{
  color:#6593b9!important;
  text-shadow:
    0 0 5px rgba(155,184,208,.55),
    0 0 12px rgba(155,184,208,.25),
    0 2px 7px #000;
}


/* Character information */

.character-info-row{
  padding:4px 12px!important;
  margin-bottom:2px;
  color:var(--fantasy-text)!important;
}

.character-info-label{
  color:var(--fantasy-gold)!important;
  font:700 14px Arial,sans-serif!important;
  letter-spacing:.03em;
}

.character-info-value,
.character-list-item,
#character-species,
#character-specialty,
#character-affiliation,
#character-attributes{
  color:var(--fantasy-text)!important;
  font:400 14px Arial,sans-serif!important;
}

.species{
  display:inline-block;
  padding:2px 7px;
  border-radius:4px;
  color:#fff!important;
}

/* Headings */

h3{
  margin-top:28px;
  margin-bottom:0;
  color:var(--fantasy-gold2);
  font:700 1.1rem Arial,sans-serif;
  letter-spacing:.08em;
  text-transform:uppercase;
  text-shadow:0 2px 7px #000;
}

hr.my-4{
  height:1px;
  margin-top:12px!important;
  margin-bottom:18px!important;
  opacity:1;
  border:0;
  background:linear-gradient(
    90deg,
    transparent,
    rgba(214,170,69,.5),
    rgba(240,202,105,.9),
    rgba(214,170,69,.5),
    transparent
  );
  box-shadow:0 0 7px rgba(214,170,69,.12);
}

/* Skill buttons */

.skill-sidebar{
  display:flex;
  gap:12px;
  overflow-x:auto;
  padding:7px 5px 15px;
  scrollbar-width:thin;
  scrollbar-color:var(--fantasy-gold) rgba(255,255,255,.04);
}

.skill-sidebar::-webkit-scrollbar{height:6px}

.skill-sidebar::-webkit-scrollbar-track{
  background:rgba(255,255,255,.035);
  border-radius:10px;
}

.skill-sidebar::-webkit-scrollbar-thumb{
  background:linear-gradient(90deg,var(--fantasy-red),var(--fantasy-gold));
  border-radius:10px;
}

.skill-btn{
  display:flex;
  flex:0 0 auto;
  align-items:center;
  justify-content:center;
  width:68px;
  height:68px;
  padding:2px;
  cursor:pointer;
  border:2px solid rgba(214,170,69,.3);
  border-radius:50%;
  background:radial-gradient(
    circle,
    #302a2b 0%,
    #211d1e 52%,
    #111011 100%
  );
  box-shadow:
    0 3px 10px rgba(0,0,0,.45),
    inset 0 0 0 1px rgba(255,255,255,.025);
  transition:
    transform .2s ease,
    border-color .2s ease,
    box-shadow .2s ease;
}

.skill-btn:hover{
  transform:translateY(-3px) scale(1.04);
  border-color:var(--fantasy-gold);
  box-shadow:
    0 6px 15px rgba(0,0,0,.55),
    0 0 14px rgba(214,170,69,.18);
}

.skill-btn.active{
  border-color:var(--character-button-color);
  box-shadow:
    0 0 0 1px rgba(240,202,105,.25),
    0 0 18px rgba(116,27,34,.55),
    inset 0 0 12px rgba(116,27,34,.35);
  transform:translateY(-2px);
}

.skill-btn img{
  width:63px;
  height:63px;
  object-fit:contain;
  border-radius:50%;
}

.skill-divider{
  width:1px;
  height:48px;
  flex:0 0 auto;
  margin:auto 5px;
  background:linear-gradient(
    180deg,
    transparent,
    rgba(214,170,69,.5),
    transparent
  );
}

/* Skill panel */

.skill-panel{
  position:relative;
  min-height:140px;
  padding:17px;
  border:1px solid var(--fantasy-border);
  border-radius:12px;
  background:linear-gradient(
    145deg,
    rgba(38,32,33,.98),
    rgba(20,18,19,.98)
  );
  box-shadow:
    0 8px 25px rgba(0,0,0,.55),
    inset 0 1px 0 rgba(240,202,105,.08);
  overflow:visible;
  transition:height var(--skill-transition);
}

.skill-panel:before{
  content:"";
  position:absolute;
  top:0;
  left:8%;
  right:8%;
  height:1px;
  background:linear-gradient(
    90deg,
    transparent,
    rgba(240,202,105,.7),
    transparent
  );
}

.skill-panel:after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  border-radius:12px;
  box-shadow:inset 0 0 30px rgba(116,27,34,.06);
}

.skill-frame{
  display:block;
  width:100%;
  min-width:0;
  min-height:120px;
  border:0;
  background:transparent;
  opacity:1;
  transition:opacity var(--skill-transition);
}

/* Character styles */

.character-style-row{
  display:flex;
  flex-wrap:nowrap;
  gap:12px;
  overflow-x:auto;
  padding:5px 4px 14px;
}

#characterStylesSection h5{
  color:var(--fantasy-gold2);
  font:700 1rem Arial,sans-serif;
  letter-spacing:.07em;
  text-transform:uppercase;
}

.style-card{
  flex:0 0 auto;
  width:200px;
  overflow:hidden;
  color:var(--fantasy-text)!important;
  border:1px solid var(--fantasy-border);
  border-radius:.75rem;
  background:linear-gradient(145deg,#242021,#151314);
  box-shadow:0 6px 18px rgba(0,0,0,.45);
  transition:
    transform .25s ease,
    border-color .25s ease,
    box-shadow .25s ease;
}

.style-card:hover{
  transform:translateY(-4px);
  border-color:var(--fantasy-border-bright);
  box-shadow:
    0 10px 24px rgba(0,0,0,.55),
    0 0 15px rgba(214,170,69,.08);
}

.style-card .card-body{
  color:var(--fantasy-text)!important;
  background:linear-gradient(180deg,rgba(116,27,34,.12),transparent);
}

.pixel-portrait{
  display:block;
  width:200px;
  height:200px;
  margin:.75rem auto 0;
  object-fit:contain;
  image-rendering:pixelated;
  filter:drop-shadow(0 4px 8px rgba(0,0,0,.4));
}

/* Mobile */

@media(max-width:767px){
  .character-summary{margin-bottom:28px}
  .splash-art{height:420px}
  #character-info{padding:25px!important}
  #character-name{font-size:1.8rem}
  .skill-sidebar{gap:10px;padding-left:2px;padding-right:2px}
  .skill-btn{width:62px;height:62px}
  .skill-btn img{width:57px;height:57px}
  .skill-panel{padding:10px;min-height:120px}
  #page-heading{font-size:1rem;letter-spacing:.05em}
}
</style>
</head>

<body>
<div id="subheader-placeholder"></div>

<h1 id="page-heading">Mystical Legends Game - Loading Character</h1>

<div class="container py-4">
  <nav id="character-form-selector" class="skill-variant-selector" aria-label="Choose character form" hidden></nav>
  <section class="character-summary row g-4 align-items-center">
    <div class="col-12 col-md-5">
      <img id="character-splash" class="splash-art" src="" alt="Character Splash">
    </div>

    <div id="character-info" class="col-12 col-md-7">
      <h1 id="character-name" class="display-6">Loading Character</h1>

      <div class="d-flex align-items-center gap-3 mb-2">
        <b id="character-rarity" class="ssr">SSR</b>
        <img id="character-role" class="role-icon" src="" alt="Character Role">
      </div>

      <div class="character-info-row">
        <span class="character-info-label">Species</span>:
        <span id="character-species" class="character-info-value"></span>
      </div>

      <div class="character-info-row">
        <span class="character-info-label">Specialty</span>:
        <span id="character-specialty" class="character-info-value"></span>
      </div>

      <div class="character-info-row">
        <span class="character-info-label">Affiliation</span>:
        <span id="character-affiliation" class="character-info-value"></span>
      </div>

      <div class="character-info-row">
        <span class="character-info-label">Attribute</span>:
        <span id="character-attributes" class="character-info-value"></span>
      </div>
    </div>
  </section>

  <div id="c4-skill-tabs" class="c4-skill-tabs" role="tablist" aria-label="Main character skill views" hidden>
    <button id="c4-skills-tab" type="button" role="tab" aria-selected="true" aria-controls="skills-view">Skills</button>
    <button id="c4-tree-tab" type="button" role="tab" aria-selected="false" aria-controls="c4-tree-view" tabindex="-1">Skill Tree</button>
  </div>
  <div class="skills-heading-row">
    <h3 id="skills-heading">Skills</h3>
    <div id="skill-variant-selector" class="skill-variant-selector" role="group" aria-label="Choose subordinate" hidden></div>
  </div>
  <hr id="skills-divider" class="my-4">

  <section id="skills-view">
    <div id="skillSidebar" class="skill-sidebar mb-3"></div>
    <div id="skillPanel" class="skill-panel"></div>
  </section>
  <section id="c4-tree-view" class="c4-tree-view" role="tabpanel" aria-labelledby="c4-tree-tab" hidden>
    <div class="c4-plane-controls" role="group" aria-label="Skill tree map controls">
      <button id="c4-zoom-out" type="button" aria-label="Zoom out">−</button>
      <output id="c4-zoom-value" aria-label="Map zoom">100%</output>
      <button id="c4-zoom-in" type="button" aria-label="Zoom in">+</button>
    </div>
    <div id="c4-tree-viewport" tabindex="0" class="c4-tree-viewport" role="region" aria-label="Skill tree branching from the Heart"><p id="c4-tree-status" role="status">Open Skill Tree to explore.</p><div id="c4-tree-space" class="c4-tree-space"><div id="c4-tree-map" class="c4-tree-map"></div></div></div>
    <div class="c4-path-controls">
      <button id="c4-simulate-path" type="button" aria-pressed="false" disabled>Simulate Path</button>
      <button id="c4-clear-path" type="button" disabled>Clear Path</button>
    </div>
    <p id="c4-path-message" class="c4-path-message" role="status" aria-live="polite"></p>
    <section id="c4-active-path" class="c4-active-path" aria-label="Selected path nodes" hidden></section>
  </section>
  <dialog id="c4-node-dialog" class="c4-node-dialog" aria-labelledby="c4-node-title">
    <button id="c4-node-close" class="c4-node-close" type="button" aria-label="Close node details" autofocus>×</button>
    <p id="c4-node-level" class="c4-node-level"></p><h2 id="c4-node-title"></h2><div id="c4-node-body"></div>
  </dialog>
</div>

<section id="characterStylesSection" class="container my-4" style="display:none">
  <h5 class="mb-3">Character Styles</h5>
  <div id="characterStyles" class="character-style-row"></div>
</section>

<script>
"use strict";

let activeSkillVariant=0;
let characterRoster=null;
let characterData=null,skills=[],activeSkillIndex=-1,skillLoadToken=0,skillResizeObserver=null;
const TRANSITION_DURATION=250,MIN_SKILL_HEIGHT=120,SKILL_VIEW_PATH="/ml-game/apps/skill.html";
const $=id=>document.getElementById(id);

function getCharacterId(){
  const id=(new URLSearchParams(location.search).get("char")||"c1").toLowerCase();
  return id==="c1b"?"c1":id;
}

function getSelectedCharacterId(){
  return getCharacterId()==="c1"&&location.hash==="#b"?"c1b":getCharacterId();
}

// Explicit skill lists take priority; forms without one inherit the base kit.
function resolveCharacter(id){
  const character=characterRoster[id];
  if(!character?.base_character)return character;
  const base=characterRoster[character.base_character];
  const overrides=character.skill_overrides||{};
  const inherited=(base.skills||[]).map(skill=>overrides[skill]||skill);
  // Costumes belong to each form, even when its skills are inherited.
  const shared=Object.fromEntries(Object.entries(base).filter(([key])=>!/^costume_\d+$/.test(key)));
  return {...shared,...character,skills:Array.isArray(character.skills)?character.skills:[...new Set([...inherited,...(character.additional_skills||[])])]};
}

function createCharacterFormSelector(){
  const selector=$("character-form-selector");
  selector.replaceChildren();
  const baseId=getCharacterId();
  const forms=Object.keys(characterRoster).filter(id=>id===baseId||characterRoster[id].base_character===baseId);
  selector.hidden=forms.length<2;
  forms.forEach(id=>{
    const link=document.createElement("a");
    const form=characterRoster[id];
    if(form.formatted_name)link.innerHTML=form.formatted_name;
    else link.textContent=form.name;
    link.setAttribute("aria-label",form.name);
    link.href=id===baseId?"#a":"#"+id.slice(baseId.length);
    if(id===getSelectedCharacterId())link.setAttribute("aria-current","true");
    selector.appendChild(link);
  });
}

function speciesClassName(species){
  return"species-"+String(species).toLowerCase().replace(/[^a-z0-9]+/g,"");
}

function createListItems(items,species=false){
  if(!Array.isArray(items))return"";
  return items.map(item=>species
    ?`<span class="species ${speciesClassName(item)} character-list-item">${item}</span>`
    :`<span class="character-list-item">${item}</span>`
  ).join(", ");
}

function getSkillCategory(skill){
  if(skill==="Dupes")return"Dupes";
  if(skill.startsWith("B"))return"Basic";
  if(skill.startsWith("S"))return"Special";
  if(skill.startsWith("U"))return"Ultimate";
  if(skill.startsWith("T"))return"Technical";
  return"Other";
}

function getSkillIcon(skill,path){
  return skill==="Dupes"
    ?"/images/mlg-assets/Stars/dupe.svg"
    :`${path}/skill_b/${skill.split("-")[0].toLowerCase()}.svg`;
}

function getSkillFile(skill,charId){
  const id=skill==="Dupes"?16:1;
  return`${SKILL_VIEW_PATH}?char=${encodeURIComponent(charId)}&skill=${encodeURIComponent(skill)}&id=${id}&style=rich-3&form=${encodeURIComponent(getSelectedCharacterId())}&variant=${activeSkillVariant}`;
}

function createSkillButtons(character){
  const sidebar=$("skillSidebar");
  sidebar.innerHTML="";
  const overrides=character.skill_variants?.[activeSkillVariant]?.skill_overrides||{};
  skills=(Array.isArray(character.skills)?character.skills:[]).map(skill=>overrides[skill]||skill);
  sidebar.style.display=skills.length?"flex":"none";

  let previousCategory=null;

  skills.forEach((skill,index)=>{
    const category=getSkillCategory(skill);

    if(previousCategory!==null&&category!==previousCategory){
      const divider=document.createElement("div");
      divider.className="skill-divider";
      sidebar.appendChild(divider);
    }

    const button=document.createElement("div");
    button.className=`skill-btn${index===0?" active":""}`;
    button.dataset.index=index;
    button.addEventListener("click",()=>showSkill(index));

    const image=document.createElement("img");
    image.src=getSkillIcon(skill,character.skills_path);
    image.alt=skill;
    image.loading="eager";
    image.decoding="async";
    button.title=skill;
    image.addEventListener("error",()=>{
      image.remove();
      button.textContent=skill.split("-")[0];
    },{once:true});

    button.appendChild(image);
    sidebar.appendChild(button);
    previousCategory=category;
  });
}

function createSkillVariantSelector(character){
  const selector=$("skill-variant-selector");
  selector.replaceChildren();
  const variants=character.skill_variants||[];
  selector.hidden=variants.length===0;
  activeSkillVariant=0;
  variants.forEach((variant,index)=>{
    const button=document.createElement("button");
    button.type="button";
    button.textContent=variant.name;
    button.setAttribute("aria-pressed",String(index===0));
    button.addEventListener("click",()=>{
      if(activeSkillVariant===index)return;
      const skillIndex=Math.max(0,activeSkillIndex);
      activeSkillVariant=index;
      selector.querySelectorAll("button").forEach((item,i)=>item.setAttribute("aria-pressed",String(i===index)));
      activeSkillIndex=-1;
      createSkillButtons(character);
      showSkill(Math.min(skillIndex,skills.length-1));
    });
    selector.appendChild(button);
  });
}

function setActiveButton(index){
  document.querySelectorAll(".skill-btn").forEach((button,i)=>{
    button.classList.toggle("active",i===index);
  });
}

/* ---------------------------------------------------------
   Iframe
--------------------------------------------------------- */

function createSkillIframe(){
  const iframe=document.createElement("iframe");
  iframe.className="skill-frame";
  iframe.title="Skill information";

  iframe.loading="eager";

  return iframe;
}

function loadSkillIframe(iframe,url){
  return new Promise(resolve=>{
    let finished=false;

    const finish=()=>{
      if(finished)return;
      finished=true;
      clearTimeout(timeout);
      iframe.removeEventListener("load",finish);
      resolve();
    };

    const timeout=setTimeout(finish,8000);

    iframe.addEventListener("load",finish,{once:true});
    iframe.src=url;
  });
}

async function prepareIframe(iframe){
  try{
    const doc=iframe.contentDocument||iframe.contentWindow.document;
    if(!doc)return;

    const style=document.createElement("style");

    style.textContent=`
      html{background:transparent!important;overflow:hidden!important;font-size:18.4px!important}
      html,body{height:auto!important;min-height:0!important}
      body{
        margin:0!important;padding:7px!important;box-sizing:border-box;
        background:transparent!important;
        color:#d8cdb8!important;overflow:hidden!important;
        font-family:Arial,sans-serif!important;font-size:.85rem!important;line-height:1.45;
        border:0;border-radius:0;
      }
      .skill-title{display:block;font-family:Georgia,serif!important;font-size:1.7rem!important;color:#f0ca69;line-height:1.2;margin:0 0 14px}
      .skill-type{display:block;font-family:Arial,sans-serif!important;font-size:.75rem!important;font-weight:400;color:#bba77e;line-height:1.45;margin-bottom:5px}
      .skill-title-separator{display:none}
      .skill-name{display:block}
      #skill-content u{text-decoration:none;color:#d6aa45;font-weight:700}
      :where(#skill-content) b{color:#f6dfa2;font-weight:700}
      .icon-container{gap:10px;line-height:1.45}
      .effect-icon{flex:none;padding-top:3px}
      .effect-text{min-width:0}
      .level-display{margin-top:22px;padding-top:12px;border-top:1px solid #d6aa4526;font-size:.75rem;color:#bba77e}
      .skill-meta{font-size:.75rem!important;line-height:1.5;color:#bba77e}
      .dupe-star{margin:14px 0 8px}
      @media(max-width:600px){body{padding:6px!important}}
    `;

    if(doc.head)doc.head.appendChild(style);

  }catch(error){
    console.error("Skill iframe preparation error:",error);
  }
}

function getIframeHeight(iframe){
  try{
    const doc=iframe.contentDocument||iframe.contentWindow.document;
    if(!doc)return MIN_SKILL_HEIGHT;

    const body=doc.body;
    // Measure natural content, never the iframe viewport: viewport height
    // would feed the previous assigned height back into the next resize.
    return Math.max(
      Math.ceil(body?.getBoundingClientRect().height||0)+20,
      MIN_SKILL_HEIGHT
    );
  }catch{
    return MIN_SKILL_HEIGHT;
  }
}

/*
  Wait for the mobile iframe to finish responsive
  layout before calculating its final height.
*/
async function waitForStableHeight(iframe){
  let previous=-1,stable=0,height=MIN_SKILL_HEIGHT;
  const deadline=performance.now()+1500;

  while(performance.now()<deadline){
    await new Promise(resolve=>requestAnimationFrame(resolve));

    height=getIframeHeight(iframe);

    if(Math.abs(height-previous)<=1)stable++;
    else stable=0;

    previous=height;

    if(stable>=2)break;
  }

  await new Promise(resolve=>requestAnimationFrame(resolve));
  return Math.max(getIframeHeight(iframe),MIN_SKILL_HEIGHT);
}

function observeIframeHeight(iframe,panel,token){
  const doc=iframe.contentDocument;
  if(!doc?.body)return null;
  let frame=0,lastHeight=0;
  const update=()=>{
    frame=0;
    if(token!==skillLoadToken||!iframe.isConnected)return;
    const height=getIframeHeight(iframe);
    if(Math.abs(height-lastHeight)<2)return;
    lastHeight=height;
    iframe.style.height=`${height}px`;
  };
  const schedule=()=>{
    if(!frame)frame=requestAnimationFrame(update);
  };
  const resize=typeof ResizeObserver!=="undefined"?new ResizeObserver(schedule):null;
  resize?.observe(doc.body);
  resize?.observe(panel);
  const mutation=new MutationObserver(schedule);
  mutation.observe(doc.body,{subtree:true,childList:true,characterData:true,attributes:true});
  doc.addEventListener("load",schedule,true);
  doc.addEventListener("error",schedule,true);
  window.addEventListener("resize",schedule);
  doc.fonts?.ready.then(schedule).catch(()=>{});
  schedule();
  return {disconnect(){
    resize?.disconnect();
    mutation.disconnect();
    if(frame)cancelAnimationFrame(frame);
    doc.removeEventListener("load",schedule,true);
    doc.removeEventListener("error",schedule,true);
    window.removeEventListener("resize",schedule);
  }};
}


/* ---------------------------------------------------------
   Skill display
--------------------------------------------------------- */

async function showSkill(index){
  if(!characterData||!skills[index])return;

  const panel=$("skillPanel");
  const charId=characterData.base_character||getSelectedCharacterId();
  const skill=skills[index];
  const url=getSkillFile(skill,charId);

  if(index===activeSkillIndex&&panel.querySelector(".skill-frame"))
    return;

  const token=++skillLoadToken;

  /*
    Only one iframe is allowed to exist in the panel at any time.
    The old iframe is removed before the new one is created.

    The panel keeps its current height while the new iframe loads.
    It only changes height after the new iframe has been measured,
    and only when the new skill actually has a different height.
    This prevents the panel from shrinking on every skill switch
    while still allowing long skills to shrink to shorter ones.
    Rapid clicking remains protected by the skill load token.
  */

  if(skillResizeObserver){
    skillResizeObserver.disconnect();
    skillResizeObserver=null;
  }

  const oldIframe=panel.querySelector(".skill-frame");
  const currentPanelHeight=panel.getBoundingClientRect().height;

  if(currentPanelHeight>0)
    panel.style.height=`${currentPanelHeight}px`;

  if(oldIframe){
    oldIframe.remove();
    activeSkillIndex=-1;
  }

  const newIframe=createSkillIframe();
  newIframe.style.height=`${MIN_SKILL_HEIGHT}px`;

  // Subscribe before navigation/insertion, including cached loads.
  const loaded=loadSkillIframe(newIframe,url);
  panel.appendChild(newIframe);
  await loaded;

  if(token!==skillLoadToken){
    newIframe.remove();
    return;
  }

  await prepareIframe(newIframe);

  if(token!==skillLoadToken){
    newIframe.remove();
    return;
  }

  const height=await waitForStableHeight(newIframe);

  if(token!==skillLoadToken){
    newIframe.remove();
    return;
  }

  /*
    Account for the panel padding and borders because the panel uses
    border-box sizing. This keeps the iframe completely inside the
    panel while still allowing the panel to resize to the new skill.
  */
  const panelStyle=getComputedStyle(panel);
  const panelExtraHeight=
    parseFloat(panelStyle.paddingTop||0)+
    parseFloat(panelStyle.paddingBottom||0)+
    parseFloat(panelStyle.borderTopWidth||0)+
    parseFloat(panelStyle.borderBottomWidth||0);

  const finalPanelHeight=Math.max(
    MIN_SKILL_HEIGHT,
    height+panelExtraHeight
  );

  newIframe.style.height=`${height}px`;

  /*
    Keep the current panel height when the new iframe is the same
    shape/height as the previous one. Only animate the panel when
    the new iframe actually requires a different height.
  */
  const panelHeightForComparison=
    currentPanelHeight>0
      ? currentPanelHeight
      : panel.getBoundingClientRect().height;

  const heightIsDifferent=
    Math.abs(finalPanelHeight-panelHeightForComparison)>2;

  if(heightIsDifferent){
    panel.style.height=`${panelHeightForComparison}px`;

    requestAnimationFrame(()=>{
      if(token!==skillLoadToken)return;
      panel.style.height=`${finalPanelHeight}px`;
    });
  }else{
    panel.style.height=`${finalPanelHeight}px`;
  }

  newIframe.style.opacity="1";
  newIframe.style.pointerEvents="auto";

  activeSkillIndex=index;
  setActiveButton(index);

  if(heightIsDifferent){
    setTimeout(()=>{
      if(token===skillLoadToken)
        panel.style.height="auto";
    },TRANSITION_DURATION+20);
  }else{
    panel.style.height="auto";
  }

  skillResizeObserver=observeIframeHeight(newIframe,panel,token);
}


/* ---------------------------------------------------------
   Character styles
--------------------------------------------------------- */

function isVideoFile(path){
  return/\.(mp4|webm|ogg|mov|m4v)$/i.test(path);
}

function createCostumePreview(costume){
  if(isVideoFile(costume.preview_path)){
    const video=document.createElement("video");

    Object.assign(video,{
      autoplay:true,
      loop:true,
      muted:true,
      playsInline:true,
      src:costume.preview_path,
      className:"pixel-portrait"
    });

    return video;
  }

  const image=document.createElement("img");

  image.src=costume.preview_path;
  image.className="card-img-top pixel-portrait";
  image.alt=costume.name||"Character Style";
  image.loading="lazy";
  image.decoding="async";

  return image;
}

function loadCharacterStyles(character){
  const section=$("characterStylesSection");
  const container=$("characterStyles");

  container.innerHTML="";

  const costumes=Object.keys(character)
    .filter(key=>/^costume_\d+$/.test(key))
    .sort((a,b)=>Number(a.split("_")[1])-Number(b.split("_")[1]))
    .map(key=>character[key])
    .filter(costume=>costume&&costume.preview_path);

  if(!costumes.length){
    section.style.display="none";
    return;
  }

  section.style.display="block";

  costumes.forEach(costume=>{
    const card=document.createElement("div");
    card.className="card text-center style-card";
    card.appendChild(createCostumePreview(costume));

    const body=document.createElement("div");
    body.className="card-body p-2";
    body.textContent=costume.name||`Costume ${costume.id}`;

    card.appendChild(body);
    container.appendChild(card);
  });
}

/* ---------------------------------------------------------
   Character
--------------------------------------------------------- */

function setupCharacter(character){
  characterData=character;
  activeSkillIndex=-1;
  createCharacterFormSelector();
  document.title=`MLG - ${character.name}`;
  $("page-heading").textContent=" ";

  const splash=$("character-splash");
  splash.src=character.splash_image;
  splash.alt=`${character.name} Splash`;
  splash.loading="eager";
  splash.decoding="async";

  if(character.splash_color)
    splash.style.filter=character.splash_color;

  if(character.button_color){
    document.documentElement.style.setProperty(
      "--character-button-color",
      character.button_color
    );
  }

  $("character-name").textContent=character.name;

  const rarity=$("character-rarity");
  rarity.textContent=character.rarity;
  rarity.className=character.rarity.toLowerCase();

  const role=$("character-role");
  role.src=character.rarity_img;
  role.alt=`${character.rarity} Role`;
  role.loading="eager";

  $("character-species").innerHTML=createListItems(character.species,true);
  $("character-specialty").innerHTML=createListItems(character.specialty);
  $("character-affiliation").innerHTML=createListItems(character.affiliation);
  $("character-attributes").innerHTML=createListItems(character.attributes);

  createSkillVariantSelector(character);
  createSkillButtons(character);
  loadCharacterStyles(character);

  if(skills.length)showSkill(0);
}

/* ---------------------------------------------------------
   Load
--------------------------------------------------------- */

async function loadCharacter(){
  const charId=getCharacterId();

  try{
    const response=await fetch(
      "/images/mlg-assets/data-character.json",
      {cache:"default"}
    );

    if(!response.ok)
      throw new Error(`Failed to load character data: ${response.status}`);

    const data=await response.json();
    characterRoster=data;
    if((new URLSearchParams(location.search).get("char")||"").toLowerCase()==="c1b"){
      const url=new URL(location.href);
      url.searchParams.set("char","c1");
      url.hash="b";
      history.replaceState(null,"",url);
    }
    const character=resolveCharacter(getSelectedCharacterId());

    if(!character)
      throw new Error(`Character "${charId}" was not found in data-character.json`);

    setupCharacter(character);
  }catch(error){
    console.error("Character loading error:",error);

    $("page-heading").textContent=
      "Mystical Legends Game - Character Not Found";

    $("character-name").textContent="Character Not Found";
    $("skillSidebar").style.display="none";
    $("characterStylesSection").style.display="none";
  }
}

window.addEventListener("hashchange",()=>{
  if(!characterRoster)return;
  const character=resolveCharacter(getSelectedCharacterId());
  if(character)setupCharacter(character);
});
loadCharacter();
