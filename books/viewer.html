<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=no">
<title>Document Viewer</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    color:#eee;
    font-family:Arial,sans-serif;
    user-select:none;
    -webkit-user-select:none;
}

#app{
    position:relative;
    width:100%;
    height:100%;
}

/* Sidebar */
#sidebar{
    position:absolute;
    z-index:30;
    top:0;left:0;
    width:320px;
    max-width:85vw;
    height:100%;
    overflow:hidden;
    background:#181818;
    border-right:1px solid #333;
    box-shadow:4px 0 18px #0008;
    transform:translateX(-100%);
    transition:transform .22s ease;
}

#sidebar.open{transform:translateX(0)}

.sidebar-header{
    height:58px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 16px;
    background:#202020;
    border-bottom:1px solid #333;
}

.sidebar-header h2{
    margin:0;
    font-size:17px;
}

#closeSidebar{
    border:0;
    background:none;
    color:#ddd;
    font-size:26px;
    cursor:pointer;
}

#outline{
    height:calc(100% - 58px);
    padding:10px;
    overflow:auto;
}

.outline-list{
    margin:0;
    padding:0;
    list-style:none;
}

.outline-list .outline-list{padding-left:16px}
.outline-item{margin:2px 0}

.outline-link{
    width:100%;
    padding:9px 10px;
    border:0;
    border-radius:6px;
    background:none;
    color:#ddd;
    font-size:14px;
    text-align:left;
    cursor:pointer;
}

.outline-link:hover{
    background:#2c2c2c;
    color:#fff;
}

.empty-outline{
    padding:20px 10px;
    color:#888;
    font-size:14px;
    text-align:center;
}

#sidebarOverlay{
    position:fixed;
    z-index:29;
    inset:0;
    display:none;
    background:#0007;
}

#sidebarOverlay.show{display:block}

/* Toolbar */
#toolbar{
    position:fixed;
    z-index:20;
    top:12px;
    left:12px;
    display:flex;
    gap:6px;
}

.toolbar-btn{
    height:40px;
    min-width:40px;
    padding:0 11px;
    border:1px solid #444;
    border-radius:7px;
    background:#191919eb;
    color:#eee;
    font-size:17px;
    cursor:pointer;
    box-shadow:0 2px 10px #0006;
}

.toolbar-btn:hover{background:#333}

/* Viewer */
#viewer{
    position:absolute;
    inset:0;
    overflow:auto;
    padding:60px 0 70px;
    overscroll-behavior:contain;
    touch-action:pan-x pan-y;
}

#pages{
    width:max-content;
    min-width:100%;
    transform-origin:top center;
}

.pdf-page{
    position:relative;
    margin:20px auto;
    line-height:0;
    background:#fff;
    box-shadow:0 0 20px #000c;
}

.pdf-page canvas{display:block}

/* PDF links */
.annotation-layer{
    position:absolute;
    z-index:5;
    inset:0;
    pointer-events:none;
}

.annotation-link{
    position:absolute;
    display:block;
    pointer-events:auto;
    cursor:pointer;
    line-height:normal;
    text-decoration:none;
    background:#0064ff00;
}

.annotation-link:hover{
    background:#3c82ff1f;
    outline:1px solid #5096ff73;
}

/* Page progress */
#pageProgress{
    position:fixed;
    z-index:20;
    bottom:16px;
    left:50%;
    transform:translateX(-50%);
    min-width:110px;
    padding:9px 15px;
    border:1px solid #444;
    border-radius:20px;
    background:#191919ed;
    color:#eee;
    font-size:14px;
    text-align:center;
    pointer-events:none;
    box-shadow:0 2px 12px #0008;
}

/* Zoom display */
#zoomLevel{
    display:flex;
    align-items:center;
    justify-content:center;
    min-width:55px;
    height:40px;
    padding:0 8px;
    border:1px solid #444;
    border-radius:7px;
    background:#191919eb;
    color:#bbb;
    font-size:12px;
    pointer-events:none;
}

/* Watermark */
#watermark{
    position:fixed;
    z-index:25;
    top:10px;
    right:20px;
    color:#ffffff40;
    font-size:13px;
    pointer-events:none;
}

@media(max-width:600px){
    #sidebar{width:285px}

    #toolbar{
        top:8px;
        left:8px;
    }

    .toolbar-btn{
        height:38px;
        min-width:38px;
        padding:0 9px;
    }

    #zoomLevel{
        height:38px;
        min-width:50px;
    }

    #viewer{padding-top:52px}

    #watermark{
        top:auto;
        bottom:18px;
        right:12px;
        font-size:10px;
    }

    #pageProgress{bottom:12px}
}
</style>
</head>

<body>

<div id="app">

    <aside id="sidebar">
        <div class="sidebar-header">
            <h2>Book Navigation</h2>
            <button id="closeSidebar" aria-label="Close navigation">×</button>
        </div>
        <nav id="outline"></nav>
    </aside>

    <div id="sidebarOverlay"></div>

    <div id="toolbar">
        <button id="openSidebar" class="toolbar-btn" title="Navigation">☰</button>
        <button id="zoomOut" class="toolbar-btn" title="Zoom out">−</button>
        <div id="zoomLevel">100%</div>
        <button id="zoomIn" class="toolbar-btn" title="Zoom in">+</button>
        <button id="fitWidth" class="toolbar-btn" title="Fit width">↔</button>
    </div>

    <div id="watermark">Protected View</div>

    <main id="viewer">
        <div id="pages"></div>
    </main>

    <div id="pageProgress">
        Page <span id="currentPage">1</span> / <span id="totalPages">0</span>
    </div>

</div>

<script type="module" src="viewer.js"></script>

<script>
document.addEventListener("contextmenu",e=>e.preventDefault());

document.addEventListener("keydown",e=>{
    if(
        (e.ctrlKey&&["s","p","u"].includes(e.key.toLowerCase()))||
        e.key==="F12"
    )e.preventDefault();
});
</script>

</body>
</html>
