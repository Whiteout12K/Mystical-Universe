== Overview ==
Cedric is the dark-green-haired captain of Centipedes. He appears among the cohort leaders watching the freshmen's recruitment battle and selects Ken and Kirk Masumi afterward. His relaxed and provocative manner distinguishes him from the more formal Atlas and Charlotte.

== Personality ==
Cedric repeatedly treats a disagreement as an opportunity for a fight. He teases the younger captain Len and encourages seeing the battle reach a conclusion even when others recognize the danger. Carla's reprimands expose the limitations of that enthusiasm.

His informality continues with his own members: he jokes about subordinates and assigns chore duties rather than presenting a polished elite organization. The behavior gives Centipedes a comic identity, but his recruitment choices still reflect an interest in destructive potential.

== Mystical Rank & Heritage ==
The notes identify Cedric as a Herbovir and record '''Tier 5, Level 2''' for Aqua Revolution. That later-arc entry is retained separately; the Book 2 recruitment scenes do not supply a personal tier. The general rank qualifications printed in the book should not be used to invent a missing level for him.

== Tools and Equipment ==
The relevant Book 2 appearances do not identify a named weapon or artifact used by Cedric. His demonstrated responsibilities concern recruitment and assigning work within Centipedes.

== Synopsis ==

=== The Rune of the Spellcaster ===

Cedric is not named in the first book's main story. His cohort's members and rivalries receive direct attention in the next volume.

=== I.T.E.R. Chronicles — Initialization ===

Cedric joins the other captains as the freshmen's unauthorized challenge grows serious. He comments on Atlas's shared Compression and speculates that Avery and Kaden might change the result if the battle continued. Carla rebukes his lack of concern for the risks.

After the group is admitted, Cedric recruits Ken and Kirk for their destructive fire abilities. His interaction with Lukas reinforces Centipedes' loose structure, with duties and punishment framed casually rather than through the prestige Atlas demands. His appearances establish a recognizable leadership temperament without showing his own full combat repertoire.

=== Sources ===
Book 2: Chapters 2–3; cohort catalogue.

== Established Abilities ==

=== Recruitment Judgment ===

Cedric is drawn to the Masumi brothers' destructive potential and actively recruits them. His interest in the battle reveals what he prioritizes, although other captains supply the caution he overlooks.

=== Recorded Affinity ===

Plant abilities and other skills already listed below belong to wider lore or gameplay. These two novels do not show a personal duel demonstrating Cedric's individual techniques.

|tab=Relationships

== Relationships ==

=== Carla Storm ===

[[char/carla_storm|Carla]] repeatedly criticizes Cedric's eagerness to create conflict. Their exchanges contrast his entertainment-minded approach with her emphasis on precautions.

=== Centipedes ===

Lukas Gallery is a senior member associated with the cohort. Ken and Kirk Masumi join after the challenge, giving Cedric two destructive fighters whose lack of refinement is part of their appeal to him.
