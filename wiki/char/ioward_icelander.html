== Overview ==
James is an IT security specialist and project participant introduced during the robot-development meeting in Initialization. The narration describes a tall, dark-skinned, muscular man with narrow eyes and a restrained manner. His most substantial appearance is the recruitment practical, where he demonstrates the strength expected of an experienced IT defender.

== Personality ==
James is laconic and intimidating, using brief statements and deliberate actions instead of showmanship. That restraint is not indifference. After the robot trials, he challenges Kaden's conduct and states that safety must remain central to IT.

During recruitment he applies harsh standards, first testing ordinary strength and then allowing magic. His judgment is practical and unsentimental: failing applicants are not accepted simply because they are confident. These scenes combine a protective professional ethic with a formidable examiner's presence.

== Mystical Rank & Heritage ==
James explicitly declares '''Tier 6, Bonus Dominus, Level 2''' during the recruitment examination in Book 2, Chapter 16. This replaces the old profile's unexplained Melior (V) label as the rank for these events. The scene establishes Shield Magic; it does not identify his species or confirm the Fire-affinity gameplay version as his narrative affinity.

== Tools and Equipment ==
James wears the IT uniform and appears with a gold badge at the recruitment event. His demonstrated shield is formed through magic, not described as an ordinary shield carried in his hands. He also helps move I.T.E.R. and checks combat-test injuries as part of project security.

== Synopsis ==

=== The Rune of the Spellcaster ===

James is not named in the first novel's main narrative. His documented on-page role begins in the second volume.

=== I.T.E.R. Chronicles — Initialization ===

==== Project Security ====

Kaden introduces James as a project lead, bodyguard, and security analyst for android production. James notes that Ioward's indefinite absence creates an opening for Kaden's promotion. Later he helps transport the completed robot and steps forward after it overwhelms Lucy.

When Avery is injured in the next test, James criticizes the conduct of the trial and emphasizes safety. His response provides a professional counterweight to Kaden's fascination with the machine's performance.

==== Task Force Examination ====

Standing in for Amos during recruitment, James asks applicants to strike him using physical force. He evades or overcomes the group and reveals his superior magical reserve. After he permits magic, their combined attacks meet his light-green, medieval-shield-shaped Shatter Wave and dissipate. The applicants' defeat demonstrates the level of competence demanded by IT, and none is accepted in that recruitment round.

=== Sources ===
Book 2: Chapters 12–13, 15–16.

|tab=Powers & Abilities

== Powers & Abilities ==

== Established Abilities ==

=== Shield Magic: Shatter Wave ===

James projects a shield-like aura from his palm and cancels the approaching combination of spells. The scene demonstrates a defensive answer to a specific wave of mixed attacks, without establishing immunity to all magic.

=== Strength and Presence ===

He uses physical movement, a forceful stomp, and an intimidating mana display during the test. The floor damage and the applicants' reaction establish practical power in addition to his stated tier.

=== Security Judgment ===

His response to the robot injuries shows risk awareness as part of his expertise, not merely a preference to avoid fighting.

|tab=Relationships

== Relationships ==

=== Kaden and the Project Team ===

[[char/kaden_icelander|Kaden]] directs the project James helps secure. James can challenge unsafe testing while continuing to serve its development. [[char/amos_black|Amos]] is the Task Force leader for whom he substitutes during recruitment.

=== Lucy and Avery ===

James checks [[char/lucy_terner|Lucy]] after her defeat and objects when [[char/avery_obtainia|Avery]] is hurt. Their shared trial and recruitment duties establish professional ties within IT.
