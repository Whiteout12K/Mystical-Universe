<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MLG - Loading Character</title>

<link rel="icon" href="/images/website/favicon.png" type="image/png">
<link href="/css/bootstrap-min.css" rel="stylesheet">
<link rel="stylesheet" href="/css/home.css">
<link rel="stylesheet" href="/css/news.css">
<link rel="stylesheet" href="/css/mlg.css">
<script src="/js/bootstrap-bundle-min.js"></script>

<style>
:root{
  --character-button-color:#a20b0b;
  --fantasy-red:#741b22;
  --fantasy-red2:#a52a32;
  --fantasy-gold:#d6aa45;
  --fantasy-gold2:#f0ca69;
  --fantasy-dark:#111011;
  --fantasy-panel:#1b1819;
  --fantasy-panel2:#242021;
  --fantasy-border:rgba(214,170,69,.32);
  --fantasy-border-bright:rgba(240,202,105,.75);
  --fantasy-text:#faf4e5;
  --skill-transition:.25s ease;
}

*{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

html{
  min-height:100%;
  background:#000!important;
  background:
    radial-gradient(circle at 50% 0%,rgba(116,27,34,.24),transparent 38%),
    linear-gradient(180deg,#0d0c0d 0%,#171415 50%,#0d0c0d 100%);
}

body{
  margin:0;
  min-height:100vh;
  color:var(--fantasy-text);
  background:#000!important;
  background:
    radial-gradient(circle at 50% 0%,rgba(116,27,34,.18),transparent 36%),
    radial-gradient(circle at 50% 100%,rgba(214,170,69,.05),transparent 30%),
    linear-gradient(180deg,#0d0c0d 0%,#171415 55%,#0d0c0d 100%);
}

/* Page heading */

#page-heading{
  margin:0;
  padding:14px 18px!important;
  color:var(--fantasy-gold2)!important;
  font:700 1.35rem Arial,sans-serif;
  letter-spacing:.08em;
  text-transform:uppercase;
  text-shadow:0 2px 8px #000;
  border-bottom:1px solid rgba(214,170,69,.18);
  background:linear-gradient(
    90deg,
    rgba(116,27,34,.32),
    rgba(20,18,19,.92) 35%,
    rgba(20,18,19,.92) 65%,
    rgba(116,27,34,.32)
  );
  box-shadow:0 3px 15px rgba(0,0,0,.35);
}

.container.py-4{
  padding-top:32px!important;
  padding-bottom:32px!important;
}

/* Character */

.splash-art{
  display:block;
  width:100%;
  height:600px;
  object-fit:contain;
  object-position:center;
  filter:
    drop-shadow(0 0 18px rgba(255,120,120,.25))
    drop-shadow(0 0 45px rgba(116,27,34,.22));
  transition:filter .35s ease,transform .35s ease;
}

.splash-art:hover{
  filter:
    drop-shadow(0 0 20px rgba(240,202,105,.2))
    drop-shadow(0 0 50px rgba(116,27,34,.35));
  transform:scale(1.01);
}

#character-info{
  padding:30px;
  color:var(--fantasy-text);
  border:1px solid rgba(214,170,69,.18);
  border-radius:14px;
  background:linear-gradient(
    145deg,
    rgba(38,32,33,.78),
    rgba(17,15,16,.78)
  );
  box-shadow:
    0 12px 35px rgba(0,0,0,.45),
    inset 0 1px 0 rgba(240,202,105,.06);
}

#character-name{
  margin-bottom:18px;
  color:var(--fantasy-text);
  font:700 2rem Arial,sans-serif;
  letter-spacing:.02em;
  text-shadow:0 2px 10px #000;
}

#character-name:after{
  content:"";
  display:block;
  width:90px;
  height:2px;
  margin-top:12px;
  background:linear-gradient(90deg,var(--fantasy-gold),transparent);
  box-shadow:0 0 8px rgba(240,202,105,.25);
}

.role-icon{
  width:60px;
  height:60px;
  object-fit:contain;
  filter:drop-shadow(0 0 7px rgba(240,202,105,.3));
}

/* Rarity */

#character-rarity{
  display:inline-block;
  font:700 1.5rem Arial,sans-serif;
  letter-spacing:.12em;
  text-shadow:0 2px 7px #000;
}

#character-rarity.ssr{
  color:#f0ca69!important;
  text-shadow:
    0 0 5px rgba(240,202,105,.75),
    0 0 14px rgba(240,202,105,.4),
    0 2px 7px #000;
}

#character-rarity.sr{
  color:#cbb3e8!important;
  text-shadow:
    0 0 5px rgba(203,179,232,.65),
    0 0 13px rgba(203,179,232,.3),
    0 2px 7px #000;
}

#character-rarity.r{
  color:#9bb8d0!important;
  text-shadow:
    0 0 5px rgba(155,184,208,.55),
    0 0 12px rgba(155,184,208,.25),
    0 2px 7px #000;
}

/* Character information */

.character-info-row{
  padding:9px 12px!important;
  margin-bottom:2px;
  color:var(--fantasy-text)!important;
  border-bottom:1px solid rgba(214,170,69,.09);
  border-radius:5px;
  background:rgba(255,255,255,.018);
  transition:background .2s ease,border-color .2s ease;
}

.character-info-row:hover{
  background:rgba(116,27,34,.1);
  border-color:rgba(214,170,69,.2);
}

.character-info-label{
  color:var(--fantasy-gold)!important;
  font:700 14px Arial,sans-serif!important;
  letter-spacing:.03em;
}

.character-info-value,
.character-list-item,
#character-species,
#character-specialty,
#character-affiliation,
#character-attributes{
  color:var(--fantasy-text)!important;
  font:400 14px Arial,sans-serif!important;
}

.species{
  display:inline-block;
  padding:2px 7px;
  border-radius:4px;
  color:#fff!important;
}

.species-angelor,
.species-metalor,
.species-naiad,
.species-icelorian,
.species-magnivirigentis,
.species-elf,
.species-felior,
.species-demihuman{
  color:#fff!important;
}

/* Headings */

h3{
  margin-top:28px;
  margin-bottom:0;
  color:var(--fantasy-gold2);
  font:700 1.1rem Arial,sans-serif;
  letter-spacing:.08em;
  text-transform:uppercase;
  text-shadow:0 2px 7px #000;
}

hr.my-4{
  height:1px;
  margin-top:12px!important;
  margin-bottom:18px!important;
  opacity:1;
  border:0;
  background:linear-gradient(
    90deg,
    transparent,
    rgba(214,170,69,.5),
    rgba(240,202,105,.9),
    rgba(214,170,69,.5),
    transparent
  );
  box-shadow:0 0 7px rgba(214,170,69,.12);
}

/* Skill buttons */

.skill-sidebar{
  display:flex;
  gap:12px;
  overflow-x:auto;
  padding:7px 5px 15px;
  scrollbar-width:thin;
  scrollbar-color:var(--fantasy-gold) rgba(255,255,255,.04);
}

.skill-sidebar::-webkit-scrollbar{
  height:6px;
}

.skill-sidebar::-webkit-scrollbar-track{
  background:rgba(255,255,255,.035);
  border-radius:10px;
}

.skill-sidebar::-webkit-scrollbar-thumb{
  background:linear-gradient(
    90deg,
    var(--fantasy-red),
    var(--fantasy-gold)
  );
  border-radius:10px;
}

.skill-btn{
  display:flex;
  flex:0 0 auto;
  align-items:center;
  justify-content:center;
  width:68px;
  height:68px;
  padding:2px;
  cursor:pointer;
  border:2px solid rgba(214,170,69,.3);
  border-radius:50%;
  background:radial-gradient(
    circle,
    #302a2b 0%,
    #211d1e 52%,
    #111011 100%
  );
  box-shadow:
    0 3px 10px rgba(0,0,0,.45),
    inset 0 0 0 1px rgba(255,255,255,.025);
  transition:
    transform .2s ease,
    border-color .2s ease,
    box-shadow .2s ease;
}

.skill-btn:hover{
  transform:translateY(-3px) scale(1.04);
  border-color:var(--fantasy-gold);
  box-shadow:
    0 6px 15px rgba(0,0,0,.55),
    0 0 14px rgba(214,170,69,.18);
}

.skill-btn.active{
  border-color:var(--character-button-color);
  box-shadow:
    0 0 0 1px rgba(240,202,105,.25),
    0 0 18px rgba(116,27,34,.55),
    inset 0 0 12px rgba(116,27,34,.35);
  transform:translateY(-2px);
}

.skill-btn img{
  width:63px;
  height:63px;
  object-fit:contain;
  border-radius:50%;
}

.skill-divider{
  width:1px;
  height:48px;
  flex:0 0 auto;
  margin:auto 5px;
  background:linear-gradient(
    180deg,
    transparent,
    rgba(214,170,69,.5),
    transparent
  );
}

/* Skill panel */

.skill-panel{
  position:relative;
  min-height:140px;
  padding:17px;
  border:1px solid var(--fantasy-border);
  border-radius:12px;
  background:linear-gradient(
    145deg,
    rgba(38,32,33,.98),
    rgba(20,18,19,.98)
  );
  box-shadow:
    0 8px 25px rgba(0,0,0,.55),
    inset 0 1px 0 rgba(240,202,105,.08);

  overflow:visible;

  transition:
    height var(--skill-transition);
}

.skill-panel:before{
  content:"";
  position:absolute;
  top:0;
  left:8%;
  right:8%;
  height:1px;
  background:linear-gradient(
    90deg,
    transparent,
    rgba(240,202,105,.7),
    transparent
  );
}

.skill-panel:after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  border-radius:12px;
  box-shadow:inset 0 0 30px rgba(116,27,34,.06);
}

.skill-frame{
  display:block;
  width:100%;
  min-width:0;
  min-height:120px;
  border:0;
  background:#0f0f0f;
  opacity:0;
  transition:opacity var(--skill-transition);
}

/* Character styles */

.character-style-row{
  display:flex;
  flex-wrap:nowrap;
  gap:12px;
  overflow-x:auto;
  padding:5px 4px 14px;
}

#characterStylesSection h5{
  color:var(--fantasy-gold2);
  font:700 1rem Arial,sans-serif;
  letter-spacing:.07em;
  text-transform:uppercase;
}

.style-card{
  flex:0 0 auto;
  width:200px;
  overflow:hidden;
  color:var(--fantasy-text)!important;
  border:1px solid var(--fantasy-border);
  border-radius:.75rem;
  background:linear-gradient(
    145deg,
    #242021,
    #151314
  );
  box-shadow:0 6px 18px rgba(0,0,0,.45);
  transition:
    transform .25s ease,
    border-color .25s ease,
    box-shadow .25s ease;
}

.style-card:hover{
  transform:translateY(-4px);
  border-color:var(--fantasy-border-bright);
  box-shadow:
    0 10px 24px rgba(0,0,0,.55),
    0 0 15px rgba(214,170,69,.08);
}

.style-card .card-body{
  color:var(--fantasy-text)!important;
  background:linear-gradient(
    180deg,
    rgba(116,27,34,.12),
    transparent
  );
}

.pixel-portrait{
  display:block;
  width:200px;
  height:200px;
  margin:.75rem auto 0;
  object-fit:contain;
  image-rendering:pixelated;
  filter:drop-shadow(0 4px 8px rgba(0,0,0,.4));
}

/* Mobile */

@media(max-width:767px){

  .splash-art{
    height:420px;
  }

  #character-info{
    padding:20px!important;
  }

  #character-name{
    font-size:1.8rem;
  }

  .skill-sidebar{
    gap:10px;
    padding-left:2px;
    padding-right:2px;
  }

  .skill-btn{
    width:62px;
    height:62px;
  }

  .skill-btn img{
    width:57px;
    height:57px;
  }

  .skill-panel{
    padding:10px;
    min-height:120px;
  }

  #page-heading{
    font-size:1rem;
    letter-spacing:.05em;
  }
}
</style>
</head>

<body>

<div id="subheader-placeholder"></div>

<h1 id="page-heading">
  Mystical Legends Game - Loading Character
</h1>

<div class="container py-4">

  <section class="row g-4 align-items-center">

    <div class="col-12 col-md-5">
      <img
        id="character-splash"
        class="splash-art"
        src=""
        alt="Character Splash">
    </div>

    <div
      id="character-info"
      class="col-12 col-md-7">

      <h1 id="character-name" class="display-6">
        Loading Character
      </h1>

      <div class="d-flex align-items-center gap-3 mb-2">

        <b id="character-rarity" class="ssr">
          SSR
        </b>

        <img
          id="character-role"
          class="role-icon"
          src=""
          alt="Character Role">

      </div>

      <div class="character-info-row">
        <span class="character-info-label">Species</span>:
        <span id="character-species" class="character-info-value"></span>
      </div>

      <div class="character-info-row">
        <span class="character-info-label">Specialty</span>:
        <span id="character-specialty" class="character-info-value"></span>
      </div>

      <div class="character-info-row">
        <span class="character-info-label">Affiliation</span>:
        <span id="character-affiliation" class="character-info-value"></span>
      </div>

      <div class="character-info-row">
        <span class="character-info-label">Attribute</span>:
        <span id="character-attributes" class="character-info-value"></span>
      </div>

    </div>
  </section>

  <h3>Skills</h3>
  <hr class="my-4">

  <section>
    <div id="skillSidebar" class="skill-sidebar mb-3"></div>
    <div id="skillPanel" class="skill-panel"></div>
  </section>

</div>

<section
  id="characterStylesSection"
  class="container my-4"
  style="display:none">

  <h5 class="mb-3">Character Styles</h5>

  <div id="characterStyles" class="character-style-row"></div>

</section>

<script>
"use strict";

/* =========================================================
   State
========================================================= */

let characterData=null;
let skills=[];
let activeSkillIndex=-1;
let skillLoadToken=0;

const FONT_SCALE=1.3;
const TRANSITION_DURATION=250;
const MIN_SKILL_HEIGHT=120;
const SKILL_VIEW_PATH="/ml-game/skill.html";

/* =========================================================
   Utilities
========================================================= */

const $=id=>document.getElementById(id);

function getCharacterId(){
  return(
    new URLSearchParams(location.search).get("char")||"c1"
  ).toLowerCase();
}

function speciesClassName(species){
  return"species-"+String(species)
    .toLowerCase()
    .replace(/[^a-z0-9]+/g,"");
}

function createListItems(items,species=false){

  if(!Array.isArray(items))
    return"";

  return items.map(item=>species
    ?`<span class="species ${speciesClassName(item)} character-list-item">${item}</span>`
    :`<span class="character-list-item">${item}</span>`
  ).join(", ");
}

/* =========================================================
   Skills
========================================================= */

function getSkillCategory(skill){

  if(skill==="Dupes")
    return"Dupes";

  if(skill.startsWith("B"))
    return"Basic";

  if(skill.startsWith("S"))
    return"Special";

  if(skill.startsWith("U"))
    return"Ultimate";

  if(skill.startsWith("T"))
    return"Technical";

  return"Other";
}

function getSkillIcon(skill,path){

  return skill==="Dupes"
    ?"/images/mlg-assets/Stars/dupe.svg"
    :`${path}/skill_b/${skill.toLowerCase()}.svg`;
}

function getSkillFile(skill,charId){

  const id=skill==="Dupes"?16:1;

  return`${SKILL_VIEW_PATH}?char=${encodeURIComponent(charId)}&skill=${encodeURIComponent(skill)}&id=${id}`;
}

/* =========================================================
   Skill buttons
========================================================= */

function createSkillButtons(character){

  const sidebar=$("skillSidebar");

  sidebar.innerHTML="";

  skills=Array.isArray(character.skills)
    ?character.skills
    :[];

  sidebar.style.display=
    skills.length?"flex":"none";

  let previousCategory=null;

  skills.forEach((skill,index)=>{

    const category=getSkillCategory(skill);

    if(
      previousCategory!==null &&
      category!==previousCategory
    ){

      const divider=document.createElement("div");

      divider.className="skill-divider";

      sidebar.appendChild(divider);
    }

    const button=document.createElement("div");

    button.className=
      `skill-btn${index===0?" active":""}`;

    button.dataset.index=index;

    button.addEventListener(
      "click",
      ()=>showSkill(index)
    );

    const image=document.createElement("img");

    image.src=getSkillIcon(
      skill,
      character.skills_path
    );

    image.alt=skill;
    image.loading="eager";
    image.decoding="async";

    button.appendChild(image);
    sidebar.appendChild(button);

    previousCategory=category;
  });
}

function setActiveButton(index){

  document.querySelectorAll(".skill-btn")
    .forEach((button,i)=>{

      button.classList.toggle(
        "active",
        i===index
      );
    });
}

/* =========================================================
   Iframe creation
========================================================= */

function createSkillIframe(url){

  const iframe=document.createElement("iframe");

  iframe.className="skill-frame";
  iframe.title="Skill information";
  iframe.src="about:blank";

  let resolveLoad;

  const loaded=new Promise(resolve=>{
    resolveLoad=resolve;
  });

  let finished=false;

  const finish=()=>{

    if(finished)
      return;

    finished=true;

    clearTimeout(timeout);

    resolveLoad();
  };

  iframe.addEventListener(
    "load",
    finish,
    {once:true}
  );

  /*
    This timeout is only a safety net.

    It prevents a broken iframe from permanently
    blocking the page. It is NOT responsible for
    determining the final height.
  */
  const timeout=setTimeout(
    finish,
    8000
  );

  /*
    The load listener exists before navigation.
  */
  iframe.src=url;

  return{
    iframe,
    loaded
  };
}

/* =========================================================
   Iframe document preparation
========================================================= */

async function prepareIframe(iframe){

  try{

    const doc=
      iframe.contentDocument||
      iframe.contentWindow.document;

    if(!doc)
      return;

    /*
      Apply the existing intended iframe typography.
      No visible styling of the parent page is changed.
    */
    const style=document.createElement("style");

    style.textContent=`
      html,
      body{
        background:#0f0f0f!important;
        color:#e6e6e6!important;
        overflow:hidden!important;
        font-family:Arial,sans-serif!important;
        font-size:${FONT_SCALE*90}%!important;
      }

      body *{
        font-family:Arial,sans-serif!important;
        font-size:inherit!important;
      }
    `;

    if(doc.head)
      doc.head.appendChild(style);

    if(doc.fonts?.ready){

      try{
        await doc.fonts.ready;
      }catch{}
    }

    /*
      Wait for all images that are currently part
      of the skill page.
    */
    const images=[
      ...(doc.images||[])
    ];

    await Promise.all(
      images.map(image=>{

        if(image.complete)
          return Promise.resolve();

        return new Promise(resolve=>{

          image.addEventListener(
            "load",
            resolve,
            {once:true}
          );

          image.addEventListener(
            "error",
            resolve,
            {once:true}
          );

        });
      })
    );

  }catch(error){

    console.error(
      "Skill iframe preparation error:",
      error
    );
  }
}

/* =========================================================
   Height measurement
========================================================= */

function getIframeHeight(iframe){

  try{

    const doc=
      iframe.contentDocument||
      iframe.contentWindow.document;

    if(!doc)
      return MIN_SKILL_HEIGHT;

    const body=doc.body;
    const html=doc.documentElement;

    const height=Math.max(
      body?.scrollHeight||0,
      body?.offsetHeight||0,
      body?.clientHeight||0,
      html?.scrollHeight||0,
      html?.offsetHeight||0,
      html?.clientHeight||0,
      MIN_SKILL_HEIGHT
    );

    return height+20;

  }catch{

    return MIN_SKILL_HEIGHT;
  }
}

/*
  Mobile browsers can perform another responsive
  layout pass after the iframe's load event.

  Instead of trusting one measurement, this function
  waits until the measured height becomes stable.

  This is the key fix for the first-visit problem.
*/
async function waitForStableHeight(iframe){

  let previous=-1;
  let stableCount=0;
  let height=MIN_SKILL_HEIGHT;

  /*
    Maximum stabilization time.

    This is intentionally much shorter than the
    old 5-second iframe timeout in normal operation,
    while still allowing slower mobile devices
    enough time to finish layout.
  */
  const deadline=performance.now()+1500;

  while(performance.now()<deadline){

    await new Promise(resolve=>{
      requestAnimationFrame(resolve);
    });

    height=getIframeHeight(iframe);

    if(
      height===previous ||
      Math.abs(height-previous)<=1
    ){

      stableCount++;

    }else{

      stableCount=0;
    }

    previous=height;

    /*
      Two consecutive identical measurements means
      the responsive layout has settled.
    */
    if(stableCount>=2)
      break;
  }

  /*
    One final measurement after the stabilization
    frames catches late layout changes.
  */
  await new Promise(resolve=>{
    requestAnimationFrame(resolve);
  });

  height=getIframeHeight(iframe);

  return Math.max(
    height,
    MIN_SKILL_HEIGHT
  );
}

/* =========================================================
   Dynamic iframe height observer
========================================================= */

function observeIframeHeight(iframe,panel,token){

  try{

    const doc=
      iframe.contentDocument||
      iframe.contentWindow.document;

    if(!doc)
      return null;

    const body=doc.body;
    const html=doc.documentElement;

    if(!body&&!html)
      return null;

    let lastHeight=0;

    const update=()=>{

      if(token!==skillLoadToken)
        return;

      const newHeight=getIframeHeight(iframe);

      if(
        Math.abs(newHeight-lastHeight)<2
      ){
        return;
      }

      lastHeight=newHeight;

      iframe.style.height=
        `${newHeight}px`;

      /*
        If the panel is already in its natural state,
        let its content determine its height.

        During transitions, showSkill() controls it.
      */
      if(
        panel.style.height==="auto" ||
        !panel.style.height
      ){

        panel.style.height=
          `${newHeight}px`;

        requestAnimationFrame(()=>{
          if(token===skillLoadToken)
            panel.style.height="auto";
        });
      }
    };

    const observer=new ResizeObserver(update);

    if(body)
      observer.observe(body);

    if(html)
      observer.observe(html);

    return observer;

  }catch(error){

    console.warn(
      "ResizeObserver unavailable for skill iframe:",
      error
    );

    return null;
  }
}

/* =========================================================
   Show skill
========================================================= */

async function showSkill(index){

  if(
    !characterData||
    !skills[index]
  ){
    return;
  }

  const panel=$("skillPanel");

  /*
    Do nothing if this exact skill is already displayed.
  */
  if(
    index===activeSkillIndex &&
    panel.querySelector(".skill-frame")
  ){
    return;
  }

  const token=++skillLoadToken;

  const charId=getCharacterId();
  const skill=skills[index];
  const url=getSkillFile(skill,charId);

  const isFirstSkill=
    activeSkillIndex===-1;

  setActiveButton(index);

  /*
    Save the current height only when changing
    between already-existing skills.
  */
  const currentHeight=Math.max(
    panel.getBoundingClientRect().height,
    MIN_SKILL_HEIGHT
  );

  /*
    IMPORTANT:

    On the FIRST load, don't force the panel into
    an artificial starting height.

    This prevents the user from seeing a small box
    while the first iframe is still settling.
  */
  if(!isFirstSkill){

    panel.style.height=
      `${currentHeight}px`;
  }

  const oldFrame=
    panel.querySelector(".skill-frame");

  const{
    iframe,
    loaded
  }=createSkillIframe(url);

  /*
    First-load iframe is inserted normally.

    For a skill change, temporarily position the new
    iframe normally as well so its real height can be
    measured correctly.
  */
  panel.appendChild(iframe);

  await loaded;

  if(token!==skillLoadToken){

    iframe.remove();
    return;
  }

  await prepareIframe(iframe);

  if(token!==skillLoadToken){

    iframe.remove();
    return;
  }

  /*
    This is the major difference from the old version.

    We don't immediately trust scrollHeight.

    We wait for the iframe's responsive layout to
    stabilize first.
  */
  const newHeight=
    await waitForStableHeight(iframe);

  if(token!==skillLoadToken){

    iframe.remove();
    return;
  }

  iframe.style.height=
    `${newHeight}px`;

  /*
    -------------------------------------------------------
    FIRST SKILL
    -------------------------------------------------------

    No height animation.

    The browser gets the correct final height before
    revealing the iframe.
  */
  if(isFirstSkill){

    panel.style.height=
      `${newHeight}px`;

    iframe.style.opacity="1";

    /*
      Allow the panel to return to natural sizing after
      the first frame has been established.
    */
    requestAnimationFrame(()=>{

      if(token!==skillLoadToken)
        return;

      panel.style.height="auto";
    });

  }else{

    /*
      -----------------------------------------------------
      NORMAL SKILL SWITCH
      -----------------------------------------------------

      Preserve the existing visual transition.
    */

    panel.offsetHeight;

    requestAnimationFrame(()=>{

      if(token!==skillLoadToken)
        return;

      panel.style.height=
        `${newHeight}px`;

      iframe.style.opacity="1";
    });

    /*
      Remove the old iframe after the new one has
      started appearing.
    */
    if(
      oldFrame &&
      oldFrame!==iframe
    ){

      oldFrame.style.position="absolute";
      oldFrame.style.left="0";
      oldFrame.style.top="0";
      oldFrame.style.width="100%";
      oldFrame.style.height="100%";
      oldFrame.style.opacity="0";
      oldFrame.style.pointerEvents="none";

      setTimeout(()=>{

        if(oldFrame.isConnected)
          oldFrame.remove();

      },TRANSITION_DURATION);
    }

    /*
      After the normal transition, let the content
      determine its own natural height.
    */
    setTimeout(()=>{

      if(token!==skillLoadToken)
        return;

      panel.style.height="auto";

    },TRANSITION_DURATION+30);
  }

  activeSkillIndex=index;

  /*
    Keep watching the iframe because some skill pages
    may change height after their initial rendering.
  */
  observeIframeHeight(
    iframe,
    panel,
    token
  );
}

/* =========================================================
   Character styles
========================================================= */

function isVideoFile(path){
  return/\.(mp4|webm|ogg|mov|m4v)$/i.test(path);
}

function createCostumePreview(costume){

  if(isVideoFile(costume.preview_path)){

    const video=document.createElement("video");

    Object.assign(video,{
      autoplay:true,
      loop:true,
      muted:true,
      playsInline:true,
      src:costume.preview_path,
      className:"pixel-portrait"
    });

    return video;
  }

  const image=document.createElement("img");

  image.src=costume.preview_path;
  image.className="card-img-top pixel-portrait";
  image.alt=costume.name||"Character Style";
  image.loading="lazy";
  image.decoding="async";

  return image;
}

function loadCharacterStyles(character){

  const section=$("characterStylesSection");
  const container=$("characterStyles");

  container.innerHTML="";

  const costumes=Object.keys(character)
    .filter(key=>/^costume_\d+$/.test(key))
    .sort(
      (a,b)=>
        Number(a.split("_")[1])-
        Number(b.split("_")[1])
    )
    .map(key=>character[key])
    .filter(
      costume=>
        costume&&costume.preview_path
    );

  if(!costumes.length){

    section.style.display="none";
    return;
  }

  section.style.display="block";

  costumes.forEach(costume=>{

    const card=document.createElement("div");

    card.className=
      "card text-center style-card";

    card.appendChild(
      createCostumePreview(costume)
    );

    const body=document.createElement("div");

    body.className="card-body p-2";

    body.textContent=
      costume.name||
      `Costume ${costume.id}`;

    card.appendChild(body);
    container.appendChild(card);
  });
}

/* =========================================================
   Character setup
========================================================= */

function setupCharacter(character){

  characterData=character;

  document.title=
    `MLG - ${character.name}`;

  $("page-heading").textContent=" ";

  const splash=
    $("character-splash");

  splash.src=
    character.splash_image;

  splash.alt=
    `${character.name} Splash`;

  splash.loading="eager";
  splash.decoding="async";

  if(character.splash_color)
    splash.style.filter=
      character.splash_color;

  if(character.button_color){

    document.documentElement.style.setProperty(
      "--character-button-color",
      character.button_color
    );
  }

  $("character-name").textContent=
    character.name;

  const rarity=
    $("character-rarity");

  rarity.textContent=
    character.rarity;

  rarity.className=
    character.rarity.toLowerCase();

  const role=
    $("character-role");

  role.src=
    character.rarity_img;

  role.alt=
    `${character.rarity} Role`;

  role.loading="eager";

  $("character-species").innerHTML=
    createListItems(
      character.species,
      true
    );

  $("character-specialty").innerHTML=
    createListItems(
      character.specialty
    );

  $("character-affiliation").innerHTML=
    createListItems(
      character.affiliation
    );

  $("character-attributes").innerHTML=
    createListItems(
      character.attributes
    );

  createSkillButtons(character);
  loadCharacterStyles(character);

  /*
    -------------------------------------------------------
    INITIAL SKILL
    -------------------------------------------------------

    No artificial double-requestAnimationFrame delay.

    The skill is started immediately after the DOM
    elements have been created.

    showSkill() itself performs the important stabilization
    work before revealing the iframe.
  */
  if(skills.length){

    showSkill(0);
  }
}

/* =========================================================
   Load character data
========================================================= */

async function loadCharacter(){

  const charId=getCharacterId();

  try{

    const response=await fetch(
      "/images/mlg-assets/data-character.json",
      {
        cache:"default"
      }
    );

    if(!response.ok){

      throw new Error(
        `Failed to load character data: ${response.status}`
      );
    }

    const data=
      await response.json();

    const character=
      data[charId];

    if(!character){

      throw new Error(
        `Character "${charId}" was not found in data-character.json`
      );
    }

    setupCharacter(character);

  }catch(error){

    console.error(
      "Character loading error:",
      error
    );

    $("page-heading").textContent=
      "Mystical Legends Game - Character Not Found";

    $("character-name").textContent=
      "Character Not Found";

    $("skillSidebar").style.display=
      "none";

    $("characterStylesSection").style.display=
      "none";
  }
}

/* =========================================================
   Start
========================================================= */

loadCharacter();
</script>
