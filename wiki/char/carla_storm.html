Carla Storm is an Elf and the centurion of Black Rampart. In Mystical Legends: Game, she is a Wind-affinity healer whose specialties include support, disruption, and crowd control.

|tab=Overview

== Background ==
Carla leads Black Rampart as its centurion. The cohort also includes [[char/kiara_katzol|Kiara Katzol]], [[char/jane_tee|Jane Tee]], and [[char/raymond_valoris|Raymond Valoris]].
