<!doctype html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="The groovy music and OST of the Mystical Legends Series and Game.">
  <meta name="keywords" content="Mystical Legends, Mystical, Legends, mystical universe, magical characters, angelor, elves, modern fantasy, mystical creatures">
  <title>Mystical Legends Music</title>
  <link rel="icon" href="../images/website/favicon.png" type="image/png">
  <link href="../css/bootstrap-min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/home.css">
  <link rel="stylesheet" href="../css/news.css">
  <link rel="stylesheet" href="../css/mlg.css">
  <link rel="stylesheet" href="../css/music.css">
  <script src="../js/bootstrap-bundle-min.js"></script>

  <style>
    /* =====================================================
       PLAY / PAUSE ICON
       ===================================================== */

    #play {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    #play img {
      width: 22px;
      height: 22px;
      object-fit: contain;
      display: block;
    }
    
  </style>

</head>

<body>

  <div id="subheader-placeholder"></div>
  <main class="music-page">

<section id="jukebox">

  <header class="music-header">
    <span class="music-header-line"></span>
    <p class="music-eyebrow">THE MYSTICAL LEGENDS ARCHIVES</p>
    <h1 class="title">Official Soundtrack</h1>
    <p class="music-subtitle">By Various Artists</p>
  </header>

  <div class="player">

    <div class="album-area">
      <div class="album-frame">
        <div class="album-inner">
          <img id="cover" src="" alt="Album cover">
        </div>
      </div>
    </div>

    <div class="song-info">
      <div id="song-title">Song</div>
    </div>

    <audio id="audio" preload="metadata"></audio>

    <div
      class="progress-container"
      id="progress-container"
      role="slider"
      aria-label="Song progress"
      aria-valuemin="0"
      aria-valuemax="100"
      aria-valuenow="0"
      aria-valuetext="0:00 of 0:00"
      tabindex="0"
    >
      <div class="progress" id="progress"></div>
    </div>

    <div class="time">
      <span id="current-time">0:00</span>
      <span id="duration">0:00</span>
    </div>

    <div class="controls">

      <button
        id="shuffle"
        type="button"
        aria-label="Shuffle"
      >⇄</button>

      <button
        id="prev"
        type="button"
        aria-label="Previous song"
      >◁</button>

      <button
        id="play"
        type="button"
        aria-label="Play"
      >
        <img
          id="play-icon"
          src="/images/website/icons/play.png"
          alt=""
        >
      </button>

      <button
        id="next"
        type="button"
        aria-label="Next song"
      >▷</button>

      <button
        id="repeat"
        type="button"
        aria-label="Repeat"
      >↺</button>

    </div>

  </div>

  <div class="playlist" id="playlist"></div>

</section>

  </main>

  <script>

    /* =====================================================
       SONG DATABASE
       ===================================================== */

    let songs = [];


    /* =====================================================
       ELEMENTS
       ===================================================== */

    const audio = document.getElementById("audio");
    const play = document.getElementById("play");
    const playIcon = document.getElementById("play-icon");
    const prev = document.getElementById("prev");
    const next = document.getElementById("next");
    const shuffleBtn = document.getElementById("shuffle");
    const repeatBtn = document.getElementById("repeat");
    const progress = document.getElementById("progress");
    const progressContainer = document.getElementById("progress-container");
    const title = document.getElementById("song-title");
    const cover = document.getElementById("cover");
    const playlist = document.getElementById("playlist");
    const currentTimeEl = document.getElementById("current-time");
    const durationEl = document.getElementById("duration");


    /* =====================================================
       PLAY / PAUSE ICON
       ===================================================== */

    const PLAY_ICON = "/images/website/icons/play.png";
    const PAUSE_ICON = "/images/website/icons/pause.png";


    function setPlayIcon(isPlaying) {
      playIcon.src = isPlaying ? PAUSE_ICON : PLAY_ICON;

      playIcon.alt = isPlaying ? "Pause" : "Play";

      play.setAttribute(
        "aria-label",
        isPlaying ? "Pause" : "Play"
      );
    }


    /* =====================================================
       PLAYER STATE
       ===================================================== */

    let index = 0;
    let playing = false;
    let shuffle = false;
    let repeat = false;
    let seeking = false;
    let loadVersion = 0;
    let seekVersion = 0;
    let pendingSeekRatio = null;
    const durationCache = new Map();
    let loadPromise = null;


    /* =====================================================
       TIME FORMAT
       ===================================================== */

    function formatTime(time) {
      if (!Number.isFinite(time) || time < 0) return "0:00";

      const totalSeconds = Math.floor(time);
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = String(totalSeconds % 60).padStart(2, "0");

      return `${minutes}:${seconds}`;
    }


    /* =====================================================
       GET VALID DURATION
       ===================================================== */

    function getDuration() {
      if (
        Number.isFinite(audio.duration) &&
        audio.duration > 0
      ) {
        return audio.duration;
      }

      if (
        songs[index] &&
        durationCache.has(songs[index].file)
      ) {
        const cached = durationCache.get(songs[index].file);

        if (
          Number.isFinite(cached) &&
          cached > 0
        ) {
          return cached;
        }
      }

      return null;
    }


    /* =====================================================
       HAS VALID DURATION
       ===================================================== */

    function hasValidDuration() {
      const duration = getDuration();

      return Number.isFinite(duration) && duration > 0;
    }


    /* =====================================================
       RESET PROGRESS
       ===================================================== */

    function resetProgress() {
      progress.style.width = "0%";

      currentTimeEl.textContent = "0:00";
      durationEl.textContent = "0:00";

      progressContainer.setAttribute(
        "aria-valuenow",
        "0"
      );

      progressContainer.setAttribute(
        "aria-valuetext",
        "0:00 of 0:00"
      );
    }


    /* =====================================================
       SET VISUAL POSITION
       ===================================================== */

    function setVisualPosition(
      time,
      duration = getDuration()
    ) {
      if (
        !Number.isFinite(duration) ||
        duration <= 0
      ) {
        return;
      }

      if (!Number.isFinite(time)) {
        time = 0;
      }

      time = Math.max(
        0,
        Math.min(duration, time)
      );

      const percentage =
        (time / duration) * 100;

      progress.style.width =
        `${percentage}%`;

      currentTimeEl.textContent =
        formatTime(time);

      durationEl.textContent =
        formatTime(duration);

      progressContainer.setAttribute(
        "aria-valuenow",
        percentage.toFixed(2)
      );

      progressContainer.setAttribute(
        "aria-valuetext",
        `${formatTime(time)} of ${formatTime(duration)}`
      );
    }


    /* =====================================================
       UPDATE PROGRESS
       ===================================================== */

    function updateProgress() {
      if (seeking) return;

      const duration = getDuration();

      if (
        !Number.isFinite(duration) ||
        duration <= 0
      ) {
        return;
      }

      let currentTime = audio.currentTime;

      if (!Number.isFinite(currentTime)) {
        currentTime = 0;
      }

      currentTime = Math.max(
        0,
        Math.min(duration, currentTime)
      );

      setVisualPosition(
        currentTime,
        duration
      );
    }


    /* =====================================================
       UPDATE PROGRESS FROM RATIO
       ===================================================== */

    function updateProgressFromRatio(
      ratio,
      duration = getDuration()
    ) {
      if (
        !Number.isFinite(duration) ||
        duration <= 0
      ) {
        return;
      }

      ratio = Math.max(
        0,
        Math.min(1, ratio)
      );

      setVisualPosition(
        ratio * duration,
        duration
      );
    }


    /* =====================================================
       UPDATE ACTIVE PLAYLIST ITEM
       ===================================================== */

    function updateActivePlaylistItem() {
      document
        .querySelectorAll(".song")
        .forEach((song, i) => {
          song.classList.toggle(
            "active",
            i === index
          );
        });
    }


    /* =====================================================
       GET BAR RATIO
       ===================================================== */

    function getProgressRatio(clientX) {
      const rect =
        progressContainer.getBoundingClientRect();

      if (
        !Number.isFinite(rect.width) ||
        rect.width <= 0
      ) {
        return null;
      }

      return Math.max(
        0,
        Math.min(
          1,
          (clientX - rect.left) / rect.width
        )
      );
    }


    /* =====================================================
       APPLY ACTUAL SEEK
       ===================================================== */

    function applySeek(
      targetTime,
      localSeekVersion
    ) {
      const duration = getDuration();

      if (
        !Number.isFinite(duration) ||
        duration <= 0
      ) {
        return false;
      }

      if (
        localSeekVersion !== seekVersion
      ) {
        return false;
      }

      targetTime = Math.max(
        0,
        Math.min(duration, targetTime)
      );

      try {
        if (
          typeof audio.fastSeek === "function"
        ) {
          try {
            audio.fastSeek(targetTime);
          } catch (error) {}
        }

        audio.currentTime = targetTime;

      } catch (error) {
        console.warn(
          "Audio seek failed:",
          error
        );

        return false;
      }

      setVisualPosition(
        targetTime,
        duration
      );

      requestAnimationFrame(() => {
        if (
          localSeekVersion !== seekVersion
        ) {
          return;
        }

        if (!seeking) {
          updateProgress();
        }
      });

      return true;
    }


    /* =====================================================
       SEEK TO RATIO
       ===================================================== */

    function seekToRatio(ratio) {
      if (!Number.isFinite(ratio)) {
        return false;
      }

      ratio = Math.max(
        0,
        Math.min(1, ratio)
      );

      const duration = getDuration();

      if (
        !Number.isFinite(duration) ||
        duration <= 0
      ) {
        pendingSeekRatio = ratio;

        updateProgressFromRatio(ratio);

        return false;
      }

      pendingSeekRatio = null;

      const targetTime =
        ratio * duration;

      seekVersion++;

      const localSeekVersion =
        seekVersion;

      return applySeek(
        targetTime,
        localSeekVersion
      );
    }


    /* =====================================================
       APPLY PENDING SEEK
       ===================================================== */

    function applyPendingSeek() {
      if (
        pendingSeekRatio === null ||
        !hasValidDuration()
      ) {
        return;
      }

      const ratio =
        pendingSeekRatio;

      pendingSeekRatio = null;

      seekToRatio(ratio);
    }


    /* =====================================================
       LOAD SONG
       ===================================================== */

    function loadSong(songIndex) {
      if (
        !songs.length ||
        !songs[songIndex]
      ) {
        return Promise.resolve(false);
      }

      loadVersion++;

      const currentLoadVersion =
        loadVersion;

      index = songIndex;
      seeking = false;
      pendingSeekRatio = null;

      seekVersion++;

      audio.pause();

      playing = false;
      setPlayIcon(false);

      resetProgress();

      title.textContent =
        songs[songIndex].title;

      cover.src =
        songs[songIndex].cover;

      cover.alt =
        `${songs[songIndex].title} cover`;

      updateActivePlaylistItem();

      const songFile =
        songs[songIndex].file;

      if (durationCache.has(songFile)) {
        const cachedDuration =
          durationCache.get(songFile);

        if (
          Number.isFinite(cachedDuration) &&
          cachedDuration > 0
        ) {
          durationEl.textContent =
            formatTime(cachedDuration);
        }
      }

      loadPromise =
        new Promise((resolve) => {

          let finished = false;

          function cleanup() {
            audio.removeEventListener(
              "loadedmetadata",
              onMetadata
            );

            audio.removeEventListener(
              "durationchange",
              onDurationChange
            );

            audio.removeEventListener(
              "loadeddata",
              onLoadedData
            );

            audio.removeEventListener(
              "canplay",
              onCanPlay
            );

            audio.removeEventListener(
              "error",
              onError
            );
          }


          function finish(success) {
            if (finished) return;

            if (
              currentLoadVersion !==
              loadVersion
            ) {
              cleanup();
              resolve(false);
              return;
            }

            finished = true;

            cleanup();

            if (
              success &&
              hasValidDuration()
            ) {
              const duration =
                getDuration();

              durationCache.set(
                songFile,
                duration
              );

              updateProgress();
            }

            resolve(success);
          }


          function processDuration() {
            if (
              currentLoadVersion !==
              loadVersion
            ) {
              return;
            }

            const duration =
              audio.duration;

            if (
              Number.isFinite(duration) &&
              duration > 0
            ) {
              durationCache.set(
                songFile,
                duration
              );

              durationEl.textContent =
                formatTime(duration);

              updateProgress();

              applyPendingSeek();

              finish(true);
            }
          }


          function onMetadata() {
            processDuration();
          }


          function onDurationChange() {
            processDuration();
          }


          function onLoadedData() {
            processDuration();
          }


          function onCanPlay() {
            processDuration();
          }


          function onError() {
            if (
              currentLoadVersion !==
              loadVersion
            ) {
              return;
            }

            console.error(
              "Unable to load audio:",
              songFile,
              audio.error
            );

            finish(false);
          }


          audio.addEventListener(
            "loadedmetadata",
            onMetadata
          );

          audio.addEventListener(
            "durationchange",
            onDurationChange
          );

          audio.addEventListener(
            "loadeddata",
            onLoadedData
          );

          audio.addEventListener(
            "canplay",
            onCanPlay
          );

          audio.addEventListener(
            "error",
            onError
          );

          audio.src = songFile;

          audio.load();

          processDuration();

        });

      return loadPromise;
    }


    /* =====================================================
       PLAY SONG
       ===================================================== */

    async function playSong() {
      if (
        !songs.length ||
        !audio.src
      ) {
        return;
      }

      if (!hasValidDuration()) {

        if (!loadPromise) {
          return;
        }

        const loaded =
          await loadPromise;

        if (
          !loaded ||
          !hasValidDuration()
        ) {
          return;
        }
      }

      applyPendingSeek();

      try {

        await audio.play();

        if (audio.paused) {
          playing = false;
          setPlayIcon(false);
          return;
        }

        playing = true;
        setPlayIcon(true);

      } catch (error) {

        console.error(
          "Audio playback failed:",
          error
        );

        playing = false;
        setPlayIcon(false);
      }
    }


    /* =====================================================
       PAUSE SONG
       ===================================================== */

    function pauseSong() {
      audio.pause();

      playing = false;

      setPlayIcon(false);
    }


    /* =====================================================
       PLAY / PAUSE
       ===================================================== */

    play.addEventListener(
      "click",
      () => {

        if (playing) {
          pauseSong();
        } else {
          playSong();
        }

      }
    );


    /* =====================================================
       NEXT SONG
       ===================================================== */

    async function nextSong() {
      if (!songs.length) return;

      let nextIndex;

      if (
        shuffle &&
        songs.length > 1
      ) {

        do {
          nextIndex =
            Math.floor(
              Math.random() *
              songs.length
            );

        } while (
          nextIndex === index
        );

      } else {

        nextIndex =
          (index + 1) %
          songs.length;

      }

      const selectedIndex =
        nextIndex;

      const loaded =
        await loadSong(selectedIndex);

      if (
        loaded &&
        index === selectedIndex
      ) {
        await playSong();
      }
    }


    /* =====================================================
       PREVIOUS SONG
       ===================================================== */

    async function prevSong() {
      if (!songs.length) return;

      const previousIndex =
        (index - 1 + songs.length) %
        songs.length;

      const selectedIndex =
        previousIndex;

      const loaded =
        await loadSong(selectedIndex);

      if (
        loaded &&
        index === selectedIndex
      ) {
        await playSong();
      }
    }


    next.addEventListener(
      "click",
      nextSong
    );

    prev.addEventListener(
      "click",
      prevSong
    );


    /* =====================================================
       SHUFFLE
       ===================================================== */

    shuffleBtn.addEventListener(
      "click",
      () => {

        shuffle = !shuffle;

        shuffleBtn.classList.toggle(
          "active",
          shuffle
        );

      }
    );


    /* =====================================================
       REPEAT
       ===================================================== */

    repeatBtn.addEventListener(
      "click",
      () => {

        repeat = !repeat;

        repeatBtn.classList.toggle(
          "active",
          repeat
        );

      }
    );


    /* =====================================================
       AUDIO: TIME UPDATE
       ===================================================== */

    audio.addEventListener(
      "timeupdate",
      () => {

        if (!seeking) {
          updateProgress();
        }

      }
    );


    /* =====================================================
       AUDIO: LOADED METADATA
       ===================================================== */

    audio.addEventListener(
      "loadedmetadata",
      () => {

        if (!hasValidDuration()) {
          return;
        }

        if (songs[index]) {
          durationCache.set(
            songs[index].file,
            audio.duration
          );
        }

        durationEl.textContent =
          formatTime(audio.duration);

        updateProgress();

        applyPendingSeek();

      }
    );


    /* =====================================================
       AUDIO: DURATION CHANGE
       ===================================================== */

    audio.addEventListener(
      "durationchange",
      () => {

        if (!hasValidDuration()) {
          return;
        }

        if (songs[index]) {
          durationCache.set(
            songs[index].file,
            audio.duration
          );
        }

        durationEl.textContent =
          formatTime(audio.duration);

        if (!seeking) {
          updateProgress();
        }

        applyPendingSeek();

      }
    );


    /* =====================================================
       AUDIO: LOADED DATA
       ===================================================== */

    audio.addEventListener(
      "loadeddata",
      () => {

        if (hasValidDuration()) {
          updateProgress();
          applyPendingSeek();
        }

      }
    );


    /* =====================================================
       AUDIO: PROGRESS
       ===================================================== */

    audio.addEventListener(
      "progress",
      () => {

        if (hasValidDuration()) {
          durationEl.textContent =
            formatTime(getDuration());
        }

      }
    );


    /* =====================================================
       AUDIO: SEEKED
       ===================================================== */

    audio.addEventListener(
      "seeked",
      () => {

        if (!seeking) {
          updateProgress();
        }

      }
    );


    /* =====================================================
       AUDIO: PLAY
       ===================================================== */

    audio.addEventListener(
      "play",
      () => {

        playing = true;

        setPlayIcon(true);

      }
    );


    /* =====================================================
       AUDIO: PAUSE
       ===================================================== */

    audio.addEventListener(
      "pause",
      () => {

        if (!audio.ended) {

          playing = false;

          setPlayIcon(false);

        }

      }
    );


    /* =====================================================
       AUDIO: WAITING
       ===================================================== */

    audio.addEventListener(
      "waiting",
      () => {}
    );


    /* =====================================================
       AUDIO: ERROR
       ===================================================== */

    audio.addEventListener(
      "error",
      () => {

        console.error(
          "Unable to load audio:",
          songs[index]?.file,
          audio.error
        );

        playing = false;

        setPlayIcon(false);

      }
    );


    /* =====================================================
       POINTER DOWN
       ===================================================== */

    progressContainer.addEventListener(
      "pointerdown",
      event => {

        event.preventDefault();

        seeking = true;

        seekVersion++;

        try {
          progressContainer.setPointerCapture(
            event.pointerId
          );
        } catch (error) {}

        const ratio =
          getProgressRatio(
            event.clientX
          );

        if (ratio === null) return;

        seekToRatio(ratio);

      }
    );


    /* =====================================================
       POINTER MOVE
       ===================================================== */

    progressContainer.addEventListener(
      "pointermove",
      event => {

        if (!seeking) return;

        event.preventDefault();

        const ratio =
          getProgressRatio(
            event.clientX
          );

        if (ratio === null) return;

        seekToRatio(ratio);

      }
    );


    /* =====================================================
       POINTER UP
       ===================================================== */

    progressContainer.addEventListener(
      "pointerup",
      event => {

        if (!seeking) return;

        event.preventDefault();

        const ratio =
          getProgressRatio(
            event.clientX
          );

        if (ratio !== null) {
          seekToRatio(ratio);
        }

        seeking = false;

        try {
          progressContainer.releasePointerCapture(
            event.pointerId
          );
        } catch (error) {}

        requestAnimationFrame(() => {

          if (!seeking) {
            updateProgress();
          }

        });

      }
    );


    /* =====================================================
       POINTER CANCEL
       ===================================================== */

    progressContainer.addEventListener(
      "pointercancel",
      event => {

        seeking = false;

        try {
          progressContainer.releasePointerCapture(
            event.pointerId
          );
        } catch (error) {}

        updateProgress();

      }
    );


    /* =====================================================
       LOST POINTER CAPTURE
       ===================================================== */

    progressContainer.addEventListener(
      "lostpointercapture",
      () => {

        if (seeking) {

          seeking = false;

          requestAnimationFrame(() => {
            updateProgress();
          });

        }

      }
    );


    /* =====================================================
       KEYBOARD SEEKING
       ===================================================== */

    progressContainer.addEventListener(
      "keydown",
      event => {

        const duration =
          getDuration();

        if (
          !Number.isFinite(duration) ||
          duration <= 0
        ) {
          return;
        }

        let newTime =
          Number.isFinite(
            audio.currentTime
          )
            ? audio.currentTime
            : 0;

        switch (event.key) {

          case "ArrowRight":
            newTime += 5;
            break;

          case "ArrowLeft":
            newTime -= 5;
            break;

          case "Home":
            newTime = 0;
            break;

          case "End":
            newTime = duration;
            break;

          default:
            return;
        }

        event.preventDefault();

        newTime = Math.max(
          0,
          Math.min(duration, newTime)
        );

        seekVersion++;

        const localSeekVersion =
          seekVersion;

        applySeek(
          newTime,
          localSeekVersion
        );

        setVisualPosition(
          newTime,
          duration
        );

      }
    );


    /* =====================================================
       SONG END
       ===================================================== */

    audio.addEventListener(
      "ended",
      async () => {

        if (repeat) {

          seekVersion++;

          try {

            audio.currentTime = 0;

          } catch (error) {

            console.warn(
              "Unable to restart song:",
              error
            );

          }

          setVisualPosition(
            0,
            getDuration()
          );

          await playSong();

        } else {

          await nextSong();

        }

      }
    );


    /* =====================================================
       BUILD PLAYLIST
       ===================================================== */

    function buildPlaylist() {

      playlist.innerHTML = "";

      songs.forEach(
        (song, songIndex) => {

          const div =
            document.createElement("div");

          div.className = "song";

          div.innerHTML = `
            <div class="song-header">

              <span class="song-number">
                ${String(songIndex + 1).padStart(2, "0")}
              </span>

              <span class="song-name">
                ${song.title}
              </span>

              <span class="song-arrow">
                ⌄
              </span>

            </div>

            <div class="song-details">

              <div class="song-meta">

                <img
                  src="${song.cover}"
                  alt="${song.title} cover"
                >

                <div class="song-text">

                  <div>
                    <strong>Artist:</strong>
                    ${song.artist}
                  </div>

                  <div>
                    <strong>Album:</strong>
                    ${song.album}
                  </div>

                  <small>
                    ${song.description}
                  </small>

                </div>

              </div>

            </div>
          `;

          div.addEventListener(
            "click",
            async () => {

              if (
                songIndex === index &&
                audio.src
              ) {

                if (!playing) {
                  await playSong();
                }

                return;
              }

              const selectedIndex =
                songIndex;

              const loaded =
                await loadSong(
                  selectedIndex
                );

              if (
                loaded &&
                index === selectedIndex
              ) {
                await playSong();
              }

            }
          );

          playlist.appendChild(div);

        }
      );
    }


    /* =====================================================
       LOAD SONG DATABASE
       ===================================================== */

    async function loadSongDatabase() {

      try {

        const response =
          await fetch(
            "/index/songs.json",
            {
              cache: "no-cache"
            }
          );

        if (!response.ok) {
          throw new Error(
            `HTTP ${response.status}`
          );
        }

        const data =
          await response.json();

        if (!Array.isArray(data)) {
          throw new Error(
            "songs.json is not an array."
          );
        }

        songs = data;

        if (!songs.length) {

          console.warn(
            "The song database is empty."
          );

          return;
        }

        buildPlaylist();

        await loadSong(0);

      } catch (error) {

        console.error(
          "Song JSON failed to load:",
          error
        );

      }
    }


    /* =====================================================
       INITIALIZE
       ===================================================== */

    setPlayIcon(false);

    loadSongDatabase();

  </script>
