== Overview ==
Tony is Pyrus's left-hand subordinate and an Earth-affinity combatant. He accompanies the Sky House search, assists Charlotte's abduction, and fights the rescue party in District 3. The historical chapters also place him beside Tom as an adviser and resourceful, if comic, helper to their leader.

== Personality ==
Tony can be physically formidable while uncertain or easily unsettled in his speech. Kaden's identity alarms him, and the Masumi brothers' renewed aggression makes him retreat. These reactions contrast with the density of his defenses rather than cancelling his strength.

With Tom, he is talkative and often literal-minded. He corrects their leader's account of who the original villain was and jokes about their new island home. His humor and loyalty help characterize the group, but the modern story still holds him accountable for the attacks he supports.

== Mystical Rank & Heritage ==
The existing notes identify Tony as a Terralor. Book 1 describes him as the strongest of the three subordinates in that confrontation while also portraying him as the least composed. This is a comparison within the group, not a precise tier declaration or a guarantee of superiority in every situation.

== Tools and Equipment ==
Tony uses Earth Magic to create barriers and bodily covering instead of depending on a named weapon. He helps handle Fire Increaser barrels and later operates a scavenged truck with Tom in the historical story. Those industrial objects are resources used by the group, not his innate magical creations.

== Trivia ==
* The character’s animal motif is a baboon.

== Synopsis ==

=== The Rune of the Spellcaster ===

Tony helps Pyrus search the New York cabin and participates in the Regnum attack. Rumble Thrust erupts the ground to launch the villains and the captured Charlotte into an aerial escape assisted by Tom's tornado.

During the District 3 rescue, Ted and the Masumi brothers attack him together. Earth barriers divert metal projectiles and repair under pressure, but coordinated strikes eventually knock him into a wall. Tom revives him and sends him back to work. In the later exchanges, the brothers continue pressing his earthen covering until Kaden adds ice to restrain him. He is imprisoned alongside the other subordinates after the crisis.

The bonus chapter gives Tony an earlier role aboard Pyrus's expedition and in the settlement that follows the voyage.

=== I.T.E.R. Chronicles — Initialization ===

Initialization supplies no new modern battle for Tony after the arrests. An Evil Man's Visit instead continues his historical work with Tom. They open Pyrus's armor shipment, provide transport while the skeleton army attacks, and admit that the truck and other supplies came from a wrecked vessel. They then stand with Pyrus and the settlers when Lord Doom renews the assault.

=== Sources ===
Book 1: Chapters 4, 11–16; Journey of the Mystical Beings. Book 2: An Evil Man's Visit.

|tab=Powers & Abilities

== Powers & Abilities ==

== Established Abilities ==

=== Earth Barriers and Armor ===

Tony forms dense layers and regenerating barriers that can divert projectiles and absorb close-range strikes. The coordinated rescue-party attack shows that pressure from different directions can still break his concentration.

=== Rumble Thrust ===

His ground eruption launches the escape party high above Regnum. Used with Tom's airborne control, the technique becomes a transport and extraction tool as well as an offensive disruption.

=== Physical Durability ===

His earth covering reduces the effect of some attacks, but the book shows him being staggered, knocked out, and restrained. It should not be described as an invulnerable body.

|tab=Relationships

== Relationships ==

=== Pyrus and Tom ===

[[char/pyrus_bourn|Pyrus]] commands Tony, while [[char/tom_nado|Tom]] works with him in both historical and modern operations. Their practical cooperation remains clear despite disagreements and comic confusion.

=== Rescue Party ===

[[char/teddric_tech|Ted]], Ken, and Kirk combine pressure against Tony in District 3. Their success is cooperative rather than a single effortless victory by one student.
