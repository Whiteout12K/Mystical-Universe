Elmor is a Regnum graduate, Mystic centurion, and academy-linked diplomat. He escorts the mainland transfers to the Mystical Island, helps interpret the orb crisis, and later tests the freshmen's readiness for cohort duties. His friendly presentation coexists with a substantial gap in combat experience between himself and the students.

|tab=Overview

== Overview ==
Elmor is a Regnum graduate, Mystic centurion, and academy-linked diplomat. He escorts the mainland transfers to the Mystical Island, helps interpret the orb crisis, and later tests the freshmen's readiness for cohort duties. His friendly presentation coexists with a substantial gap in combat experience between himself and the students.

== Personality ==
Elmor is approachable and willing to explain matters, but he does not equate encouragement with removing standards. He permits the first-years to attempt the cohort test when others object and joins their opponents to make the challenge meaningful.

After Charlotte's rescue, he recognizes courage while calling the students' conduct reckless. His outlook therefore combines opportunity with a concern for consequences. Being surprised or slightly wounded by an unfamiliar technique does not make him incompetent; the challenge draws out potential while still showing what a captain can do.

== Mystical Rank & Heritage ==
Elmor explicitly identifies his power with '''Bonus Dominus, Tier 6''' during the Book 2 cohort battle. No level is specified in that declaration. The existing lore identifies him as a Wentor, consistent with his repeated use of wind, but the books' stated tier should take precedence over assumptions drawn from his casual demeanor.

== Tools and Equipment ==
His wind provides platforms, barriers, and transport without requiring a vehicle in combat. A hammer is listed in the existing profile, but the cited Book 1 and 2 scenes principally demonstrate elemental techniques rather than a named weapon attack.

|tab=Synopsis

== Synopsis ==

=== The Rune of the Spellcaster ===

Elmor introduces himself as a government agent and academy diplomat while escorting Avery, Ted, and River to the island. He later questions the school information leak and helps extinguish the faculty-building fire with Emperor's Wrestling.

Following Pyrus's defeat, he visits the recovering students, explains the arrests and concealment of the incident, and helps identify Avery's denser light as Compression. He distinguishes the group's admirable intentions from the lack of experience behind their unauthorized intervention.

=== I.T.E.R. Chronicles — Initialization ===

==== The Cohort Challenge ====

Elmor permits the freshmen to remain at a restricted recruitment event and offers a test alongside the second-years. He establishes rules against killing, attacks on defeated opponents, and the use of familiars by the defending side.

Avery and Kaden coordinate against his layered wind defenses. Elmor responds with stronger tornadoes and airborne boulders, displaying the distance between student and captain. Avery's unusual Compression surprises him and slightly injures him before the other captains halt the escalating fight.

Elmor subsequently helps explain the Eight Forces and invites River to Mystic. Book 2 also names Alisha Locks, a flag-game competitor on Kaden's team, as his younger sister, giving the profile a family connection beyond his professional duties.

=== Sources ===
Book 1: Chapters 8, 11, 16. Book 2: Chapters 1–3, 9.

|tab=Powers & Abilities

== Powers & Abilities ==

== Established Abilities ==

=== Wind Defense and Control ===

Elmor creates barriers and dense wind walls, supports himself on a small tornado, and lifts boulders for directed attacks. His wind is therefore useful for mobility, environmental control, and defense as well as direct striking.

=== Emperor's Wrestling ===

During the school emergency, he uses wind to help suppress the fire. This application shows the same affinity acting in emergency response rather than competitive battle.

=== Tactical Restraint ===

His recruitment fight operates under explicit safety conditions. The ultimate escalation and intervention reveal that even a supervised test requires judgment when unfamiliar powers appear.

|tab=Relationships

== Relationships ==

=== River Grant ===

[[char/river_grantia|River]] accepts his invitation into Mystic. Their connection is that of captain and recruited student.

=== Alisha Locks ===

Alisha is identified as Elmor's younger sister during the flag competition. Her participation on Kaden's team is separate from Elmor's own role in administering the earlier cohort test.

=== Avery and Kaden ===

[[char/avery_obtainia|Avery]] and [[char/kaden_icelander|Kaden]] challenge his defense together. Their performance affects their opportunities, while his assessment and explanations remain part of their education.
