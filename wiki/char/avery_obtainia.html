'''Avery M. Obtainia-Reeyn''', commonly known as '''Avery Obtainia''', is the main protagonist of '''Mystical Legends''' and a member of the [[mystical_legends|Mystical Legends]]. An [[fandom:Angelor|Angelor]] raised in New York without knowledge of his origins, he enters the Mystical world with little magical strength and no understanding of the society to which he belongs. His discovery of the '''Rune of the Spellcaster''' connects him to his mother, [[char/caela_obtainia|Caela Obtainia]], and to the history of the [[fandom:Mystical Island|Mystical Island]].

Avery becomes a student at [[fandom:Regnum Academy|Regnum Academy]], a member of the [[fandom:Tempest Aquia|Tempest Aquia]] Cohort, and an intern at the [[IT|IT Agency]]. His fighting style combines agility learned through years of survival with Light magic, healing, and the Regnum Spei of '''Compression'''. Although his unusual inheritance gives him considerable potential, his progress depends on training, experimentation, and the help of companions who are often much stronger than he is.

His experiences of poverty and discrimination shape his desire to protect others and challenge the divisions between nobles, commoners, and demihumans. Together with his friends, he pursues the ideal of becoming a Mystical Legend through actions that improve the lives of others.

|tab=Overview

== Appearance ==

Avery is a relatively short young man with shoulder-length golden hair, usually parted in the middle, and bright sapphire-pink eyes. His frame is lean but physically conditioned by years of running, climbing, and evading pursuers in New York. His ordinary appearance initially gives little indication of his Angelor heritage, since his wings have not yet emerged when he first learns of his species.

He commonly wears a plain white polo with a loose collar, a dark red jacket, and dark gray trousers. After moving to the Mystical Island, he carries a backpack containing school supplies and his most valued belongings. At Regnum Academy, he wears the standard maroon sweater and gray trousers, while cohort assignments and his work at IT require their own uniforms and formal clothing.

After his awakening, Avery develops white wings. He usually conceals them with the rune, particularly when revealing his demihuman identity would draw unwanted attention. The golden Rune of the Spellcaster often hovers behind him like a halo, though he can move it to other positions or place it above his head. White markings around one eye become another distinguishing feature associated with his unusual power.

{{Spoiler|His later transformations can turn his hair white and alter the nature of his body. His development as a true Angelor also includes a metamorphosis associated with butterfly-like wings.}}

== Personality ==

=== Independence and Curiosity ===

Avery is cautious, observant, and accustomed to solving problems without dependable adult support. His early life teaches him to look for exits, judge the intentions of strangers, and conceal information when he believes it may be used against him. Even after finding a more secure home, he remains attentive to the possibility that an apparent opportunity may carry obligations he does not yet understand.

This caution coexists with persistent curiosity. Rather than accepting magic as self-explanatory, Avery asks how it works, what its limits are, and why one technique succeeds where another fails. He repeatedly relates magical phenomena to physics, bodily movement, and the behavior of materials. His questions can make him appear inexperienced beside students raised in Mystical households, but they also lead him to experiment with applications that others take for granted.

He is capable of acknowledging his ignorance. At the beginning of his education, he relies on Ted to explain matters as basic as the existence of Mystical Beings. Later, he asks Lux for direct tutoring and accepts that his command of magic remains incomplete despite his rapid growth. His technical interests extend to science, computing, website development, and some game development.

=== Compassion and Sense of Justice ===

Avery is strongly protective of people he sees being mistreated. He helps River against bullies before he possesses enough magic to defend himself reliably, and his willingness to protect her continues when the danger becomes far greater than an ordinary school dispute. At Regnum, the contempt directed at demihumans turns his private concern for friends into opposition to the social hierarchy around them.

His compassion frequently overrides convenience and personal safety. When he discovers kidnapped children during a cohort assignment, he refuses to leave them behind merely because their rescue is outside the task he was given. He also presses the Aquias to investigate when they initially doubt his account. He values evidence and practical intervention, but is unwilling to let authority alone determine whether a victim deserves help.

Avery's ambitions are closely connected to this outlook. Becoming stronger is a means to protect others, uncover the truth about his family, and create a place where origin and species do not determine a person's opportunities. His conversations with River help give the idea of the Mystical Legends a shared purpose beyond personal fame.

=== Insecurity and Responsibility ===

Avery is not consistently confident in his decisions. His desire to help can lead him into situations beyond his strength, and the consequences of the orb crisis leave him feeling responsible for damage he could not control. Ted's reassurance is important because it reminds him that rescuing Charlotte still mattered, even when the rescue also exposed the group to further danger.

He often measures himself against companions such as Kaden and Atlas, whose experience makes the gap between potential and mastery impossible to ignore. Defeats, injuries, and failed techniques do not immediately erase his determination, but they force him to reconsider his approach. His improvement comes through adapting to these setbacks rather than winning every encounter.

Avery is also reserved in matters of affection. He values close friendships and responds to kindness, yet can hesitate to interpret romantic attention directly. With Lux, his admiration for her ability and status initially makes him cautious about assuming that her closeness means more than friendship.

== Background and Heritage ==

Avery grows up believing he has no meaningful knowledge of his parents. He survives on the streets of New York, steals food and valuables, and eventually lives with the Alexanders. Their arrangement provides shelter in exchange for work but leaves him largely responsible for his own education, food, and future.

His admission to a Mystical school changes his understanding of himself. A ranking assessment identifies him as an Angelor with Light affinity, despite his initially low magical output. His lack of visible wings makes that identity difficult for him to accept at first. Their later emergence confirms that he is also a demihuman, exposing him to prejudices that influential students are accustomed to treating as normal.

The rune and the Sky House connect his present life to Caela Obtainia and the earlier history of the Mystical Beings. Visions, the artifact's selective response, and the interest of people seeking the destruction orb make his family history a matter of both personal identity and immediate danger.

{{Spoiler|Before the age of seven, Avery lives with Caela. When attacks by the shadow cult make remaining with her unsafe, she takes him to New York and places him in an orphanage to conceal his identity. His early memories are sealed, leaving him with the impression that he has always lived there. Fragments of those memories gradually return during later crises.}}

{{Spoiler|Avery's heritage and spiritual development also include a Water Spirit nature and a bond with Lynnhera, the Spiritstone Goddess. That connection becomes central to the changes in his magic and body.}}

== Magic Rank Progression ==

Avery begins at '''Tier 1: Commonus''', with magical output judged below average even though his physical strength is comparatively good. Contact with the Terracustodis leads to an awakening and advancement to '''Tier 2: Bonus, Level 3'''. By the period of early cohort selection, he is '''Tier 3: Altus, Level 1'''.

Following his training and the I.T.E.R. trials, he reaches '''Tier 3: Altus, Level 3''', close to the threshold of Magnus. His increased mana strengthens his resonance with the rune and allows a wider sensory projection around his room.

{{Spoiler|'''Tier 4, Level 1''' — Aqua Revolution<br>'''Tier 4, Level 3''' — Festival Saga<br>'''Tier 5, Level 2''' — Red Showdown<br>'''Tier 5, Level 3''' — Rogue God<br>'''Tier 5, Level 3 – Tier 6, Level 1–Level 2''' — Interlude I<br>'''Tier 7, Level 2''' — Shadow Dwelling}}

His rank does not give a complete account of his fighting ability. Mobility, magical control, the rune, and the suitability of a technique can help him challenge stronger opponents, but large differences in experience or power remain dangerous.

== Affiliations ==

=== Regnum Academy and Quad 44 ===

Avery's first stable community on the Mystical Island is Quad 44, shared with [[char/teddric_tech|Teddric Tech]], [[char/river_grantia|River]], and [[char/jane_tee|Jane Tee]]. The quad gives him both companions and a practical introduction to academy life. Their cooperation later extends to Team 44 during the flag competition.

=== Tempest Aquia ===

Atlas recruits Avery into Tempest Aquia after observing his unusual power during the confrontation with Elmor. Membership provides access to training, commissions, and the Aquia estate, but also places him under scrutiny. Atlas's interest in Avery's potential does not immediately overcome his prejudice against demihumans.

=== IT Agency ===

Kaden brings Avery into IT as an intern and gradually involves him in work surrounding I.T.E.R. His silver badge and ITA-Pad grant access and responsibilities beyond those expected of a new employee. The position gives him opportunities to learn, though his advancement also allows IT to supervise his unusual abilities closely.

== Tools and Equipment ==

=== Rune of the Spellcaster ===

The '''Rune of the Spellcaster''' is Avery's principal artifact. Discovered in the Sky House in Weeping Woods, Central Park, the golden ring responds to him and can be controlled telepathically. He can make it hover, turn, move beside him, or fly toward a target. Standing on it gives him a means of aerial travel distinct from using his wings.

The rune absorbs and releases Avery's magic, supporting more precise attacks and techniques that would otherwise be difficult to control. Its pocket space conceals his wings and initially holds the sealed earth orb. Its connection with that orb makes it a target for Pyrus and others seeking destructive power.

Its response is selective. Lux recognizes the artifact's historical importance but cannot activate it with her own magic. Avery's resonance grows alongside his mana, and placing it above his head helps extend his awareness beyond the limits of ordinary sight.

=== ITA-Pad and Silver Badge ===

IT provides Avery with an ITA-Pad for assignments, communications, and access to information relevant to his work. His silver badge marks his unusually rapid advancement within the agency. Avery initially questions whether skipping the ordinary bronze stage is a mistake, only to learn that the promotion is deliberate.

These items represent institutional access rather than an inherent increase in magical rank. His employment duties and the expectations attached to the badge continue alongside his academy and cohort commitments.

== Trivia ==

* Aspects of his character are inspired by Nicole and Nahida from ''Genshin Impact'', and Luminous Valentine from ''That Time I Got Reincarnated as a Slime''.
* His abilities and imagery are associated with Virgo, sapphire, and wisdom.

== Synopsis ==

=== New York ===

Avery survives as a young thief in New York, using speed and familiarity with the streets to obtain food and escape pursuit. After stealing an exceptionally valuable object, he is captured and confronted by the man connected with Oceanus Aquia. The encounter redirects his life toward education and an arrangement with the Alexanders.

Three years later, Avery enters OSNYC, where he meets Ted. What he assumes is an ordinary school becomes his introduction to the existence of Mystical Beings. Ted explains the nature of magic and helps him negotiate his first encounters with a world for which he has no preparation.

The school's assessment identifies Avery as an Angelor with Light affinity and Tier 1 magic. His physical strength exceeds his magical output, but the discovery raises more questions than it answers. He knows little about his parents and has none of the visible wings associated with his species.

=== River and the Sky House ===

Avery intervenes when River is bullied and begins forming a friendship with her. His first attempts at healing reveal that his light can do more than illuminate an area or strike an opponent. The two seek refuge in Weeping Woods and discover the Sky House, a cabin tied to Caela Obtainia.

Within this setting, Avery obtains the golden rune and experiences a vision of the past involving the sealing of an earth orb. The artifact is not merely a useful possession: it links him to people and events whose significance he cannot yet explain.

Pyrus's search for the orb and a subsequent attack by a Hand of Doom place Avery and River in immediate danger. Avery continues trying to protect her despite being outmatched. Kaden intervenes, and the investigation brings the students to the attention of Oceanus and other authorities concerned with the cult and the missing orb.

=== Arrival on the Mystical Island ===

Avery, Ted, and River travel to the Mystical Island and begin attending Regnum Academy in District 7, Lux Urbis. They join Jane Tee in Quad 44 and encounter a society whose magical achievements coexist with rigid class divisions.

Avery's unfamiliarity extends to ordinary student life: dormitory customs, uniforms, school supplies, cohorts, and the responsibilities of living at the academy all require explanation. The annual lights celebration introduces him to the public authority of figures such as Atlas Aquia and Charlotte Levy. Their displays of power reinforce his desire to improve while making clear how far he remains from their level.

When Atlas treats River with contempt, Avery tries to defend her. The confrontation exposes the gulf between his resolve and his strength, as well as the prejudice he will face once his own demihuman identity becomes visible.

=== Charlotte's Capture ===

Pyrus invades Regnum and abducts Charlotte, seeking information connected with the destruction orb. Avery joins an unauthorized rescue party led by Kaden rather than waiting for the situation to resolve through official channels.

The group enters District 3 and attempts to recover the captive cohort captain. Avery helps open Charlotte's cell, but the rescue does not become a straightforward victory. Tom Nado's intervention forces him to retreat, and the threats surrounding the rune continue to draw Pyrus toward him.

The episode strengthens Avery's willingness to risk himself for others while also showing that courage alone cannot compensate for limited preparation. His role in the rescue is significant without making him the equal of the much stronger people involved.

=== The Orb Crisis and Awakening ===

Pyrus captures Avery and seizes the rune aboard a helicopter. The release of the orb leads to a disaster near the town hall, placing the surrounding city in danger. Avery's contact with the Terracustodis brings him into a vision in which an unidentified woman warns him about the cost of the power before him.

His awakening increases the density and force of his light and brings forth his wings. Even with these changes, he cannot overcome Pyrus alone. Kaden also struggles against the villain's increased power before Atlas and Charlotte bring the confrontation under control.

Afterwards, Avery is troubled by his part in the chain of events. Ted helps him confront that guilt without dismissing the danger or the value of rescuing Charlotte. His conversations with River turn their wish for a better future into a commitment to oppose injustice through their own actions.

=== Cohort Selection ===

Avery and his friends seek an early opportunity to join the academy's cohorts. Their encounter with second-year candidates and Elmor Locks becomes a test of whether their abilities can justify that ambition. Avery uses Compression to exploit an opening in Elmor's defense, drawing attention to a power that is unusual for a student at his level.

Atlas recruits him into Tempest Aquia. The invitation offers training and recognition, but it is also motivated by the need to observe and understand his abilities. Avery enters the cohort knowing that talent has not removed the inequalities surrounding him.

At the Aquia estate, Alteria tests his control. Her water penetrates his compressed Light barrier at a level of precision he cannot yet counter. Avery responds by adapting his offense with a concentrated Light attack, but Atlas ends the exchange before it escalates further. The encounter teaches Avery that density alone does not make a barrier flawless.

=== The Flag Competition ===

Avery competes with Ted, River, and Jane as Team 44. Their success depends on combining their strengths and reading the wider field rather than treating the competition as a sequence of isolated duels.

Avery faces Kaden directly and tests his growing command of Light and Compression against the prodigy's ice. Their rivalry does not result in Avery simply overpowering him. While their confrontation absorbs attention, Jane distracts the flag defenders and River secures the remaining flags. The team's victory reinforces the value of coordination over an individual's reputation.

=== IT Internship ===

After passing Kaden's recruitment challenge, Avery begins working at IT. He gains access to the I.T.E.R. project and receives a silver badge, an advancement so rapid that he initially assumes an error has been made. Kaden confirms that the arrangement is intentional and supplies him with an ITA-Pad.

The internship brings Avery into contact with a different kind of power: technology, research, institutional influence, and the ambitions of the people directing them. He benefits from the opportunity but must also negotiate the agency's interest in his unusual magic.

His academy studies, cohort duties, and IT work begin to overlap. Rather than replacing one part of his life, the position adds another set of obligations and introduces him to problems whose consequences extend beyond the school.

=== The Disappearances ===

During a Tempest Aquia assignment, Avery discovers imprisoned demihuman children and overhears evidence of a noble's dealings with Malum. He refuses to ignore what he has found, confronts a mist-wielding guard, and frees the captives.

His response places the children's safety above the convenience of completing his commission without interference. He then presses Atlas and Alteria to investigate, despite their initial unwillingness to accept the full implications of his account. Recovered documents give the group evidence of an organized operation rather than an isolated incident.

The discovery deepens Avery's understanding of the relationship between prejudice and exploitation. The treatment of demihumans is no longer only a matter of insults or unequal standing at school; it is connected to trafficking, forced labor, and political interests.

=== I.T.E.R. Trials ===

Avery participates in the assessment of I.T.E.R., using Light attacks, Compression, enhanced movement, and telekinesis against the machine. His ability to condense a powerful projectile causes a significant impact, but the robot continues adapting to his techniques.

When his barriers fail, he uses Compression to lift himself and slide out of immediate danger. The machine counters even his attempt to gain height, closing the distance with wall-assisted movement. Avery suffers a serious injury before Kaden ends the encounter.

His healing contributes to recovery, but the fight exposes the limits of his endurance and control. Afterwards, he reaches Altus, Level 3, and discovers a stronger resonance with the rune. Placing it above his head allows him to perceive the room around him and faintly sense activity beyond it.

=== The I.T.E.R. Crisis ===

{{Spoiler|Stolen I.T.E.R. blueprints and attacks by copied machines lead the authorities to pursue Kaden and his associates. Avery remains with his friends as they escape IT and become fugitives, even as familiar cohorts are sent after them. Their search for the origin of the machines takes them through the forests and the black market of District 13.}}

{{Spoiler|As tension between nobles and demihumans becomes open conflict, Avery continues investigating the disappearances. The group discovers a factory where captives are traded and forced to produce robot parts. Their confrontation with its operators exposes a connection to Morphius and the wider attempt to manipulate the city.}}

=== The Nuntios and Lux Luces ===

When the Nuntios return to Regnum as substitute teachers, Avery meets Lux Luces during a late-night encounter near the kitchen. Lux later becomes his Magic 101 teacher and takes an interest in the unusual colors of his affinity-less mana.

During a private conversation, she explains the rarity of that magic, examines the Rune of the Spellcaster, and connects his ability to wield it with Caela Obtainia. Avery asks for direct tutoring, and Lux agrees. Their shared interest in Angelor history gives their relationship a purpose beyond the classroom.

An accident during the Nuntios' fishing outing sends Avery into the lake and injures his wings. Lux retrieves him, treats the wound, and visits him in the infirmary. Although his recovery is unusually fast, she tells him to avoid flight until he has properly healed.

At the Winter's Dance, Lux chooses Avery as her partner and guides him through the steps. They discuss his experiences, his goals, and their ancestry. Avery values the attention but initially interprets her closeness with caution, unsure whether he should understand it as more than friendship.

=== The Duel and Kiara's Abduction ===

After Kiara Katzol and Imo Lordius arrive at Regnum, Avery helps welcome them into the group. Hostile nobles challenge the right of demihumans to attend the academy, and Avery accepts a duel to defend Kiara and River's standing.

His opponent's greater experience forces him to improvise with Light constructs, mobility, and localized gravitational effects. During the match, Ted discovers that Kiara has been abducted outside the arena. Her escape and their testimony expose the conspiracy surrounding the confrontation.

Professor Taskah intervenes and addresses the academy's treatment of commoners and demihumans. Avery's effort does not make the underlying prejudice disappear, but it gives his companions a public example of resistance and helps reinforce their place at Regnum.

=== Aqua Revolution ===

{{Spoiler|Avery discovers that he can breathe underwater and develops his connection with Water magic. He accompanies Atlas and Alteria on work involving the water kingdom, becoming involved in the conflicts surrounding the Aquia family, River's past, and threats to their kingdom. His access to Water and his growing understanding of his heritage expand both his abilities and the questions surrounding his origins.}}

=== Divine Capture and Graduation ===

{{Spoiler|A group seeking to harness the deities captures Avery and Kiara. While its ritual can draw out powers connected with divine blessings, Avery presents a different problem: Lynnhera has become integrated with him. His captors turn their attention to his catalyst rather than treating him as an ordinary contractor.}}

{{Spoiler|The conflict extends to District 1, where Kaden seeks to reclaim the ruined district. Avery's cleansing magic contributes to the effort with support from his companions. After the academy's final trials, the friends graduate and pursue separate paths to become stronger against the shadows.}}

=== Shadow Dwelling ===

{{Spoiler|Lumen's proposed marriage alliance between Lux and Prince Aether places Avery in conflict with his own growing feelings. Alongside Kiara and Raymond, he investigates Aether's dealings and discovers evidence of an attempted seizure of District 12. The group defeats the men sent to stop them and rushes to the wedding.}}

{{Spoiler|Aether's attack, intended for Lumen, kills Lux's mother. Avery joins Lux, Kiara, and Raymond in pursuing him, but even their combined strength is nearly overwhelmed. Lumen ultimately defeats Aether. In the aftermath, Avery and Lux recognize their mutual feelings, while Lumen acknowledges Avery as worthy of her. The two withdraw from the commotion for a quiet walk together.}}

=== Later Spiritual Development ===

{{Spoiler|Avery's bond with Lynnhera becomes both a source of strength and a danger to his independence. When she takes control and uses his power to manifest herself, his companions must intervene. Her subsequent identity as Morgen conceals her nature while Avery's own consciousness remains suppressed for a time.}}

{{Spoiler|His eventual development includes True Transformation, further divine blessings, and Omnifusion's evolution into Time Manipulation. His later identity is associated with the God of Time. He also becomes Lux's familiar after her summoning ritual unexpectedly calls him through his pure magical body.}}

|tab=Powers & Abilities

== Powers & Abilities ==

Avery's abilities develop from a small reserve of Light magic into a combination of elemental control, healing, Compression, artifact use, spiritual perception, and later divine powers. His most effective techniques often combine several of these elements: a projectile becomes more dangerous when compressed, a barrier becomes more durable when its structure is refined, and movement becomes more effective when reinforced with magic.

He is not naturally protected against every threat his powers can produce. Mana exhaustion, bodily injury, stronger opponents, and gaps in control repeatedly limit him. His training therefore emphasizes not only increasing output but also directing energy precisely enough to avoid waste and exploit an opponent's weakness.

== Light Magic / Photokinesis ==

Light is Avery's first recognized affinity. He can release it from his body, gather it into his hands, shape it into weapons or barriers, and direct it toward chosen targets. Its applications include illumination, interference with sight, impact, protection, healing, and the reinforcement of physical movement.

Ordinary Light attacks need sufficient concentration to produce the desired effect. Gathering and shaping them can leave openings, particularly against an opponent who attacks before the construct is complete. Compression improves their density and force, but also increases the demand on Avery's concentration.

=== Gladius Lucis ===

'''Gladius Lucis''' forms a sword of Light for close combat. Avery uses it when a ranged exchange is ineffective or when he needs to approach an opponent directly. Compression can make the weapon denser and more forceful.

The sword does not remove his dependence on physical positioning. An opponent with superior reach, durability, speed, or technique can still place him at a disadvantage. His fight against I.T.E.R. shows that producing a magical blade does not ensure he can penetrate a sufficiently tough target.

=== Light Barrier ===

Avery creates barriers to intercept attacks and buy time to move or counterattack. Increasing their density improves their durability against both physical and magical force.

A barrier's success depends on more than how much energy it contains. Alteria's water control exposes spaces in a construct Avery initially believes to be securely compressed. Stronger opponents can also break through his defenses directly; I.T.E.R. repeatedly tears through barriers that would be useful against less overwhelming attacks.

=== Light Beams and Light Fist ===

Avery can concentrate Light into a directed beam or gather an aura around his fist. A beam allows him to strike from a distance, while reinforcement around his hand supports a faster and more forceful punch.

These techniques give him options at different ranges, but they remain dependent on the amount of magic he can safely release and the resistance of the target. He frequently combines them with movement rather than standing still and relying on output alone.

=== Light Searching Spheres ===

'''Light Searching Spheres''' forms projectiles that Avery directs toward a target or incoming attack. Against mist needles, the collision allows the intensity of his light to disperse the hostile material even as the sphere itself is absorbed.

He can also gather a larger quantity of mana and compress it into a much smaller projectile. The '''Intense Light Searching Sphere''' stores considerable energy in a tiny form, releasing a powerful burst when it strikes. Its preparation requires enough concentration to keep the condensed mana from detonating prematurely.

The impact on I.T.E.R. produces a violent shockwave and a flood of blinding light. Nevertheless, the attack does not guarantee victory over a target that can withstand it and continue adapting.

=== Holo Technique — Agility Mode ===

Avery distributes Light magic around his body to reinforce his movement, reflexes, and awareness. The technique complements the evasive habits he learned on the streets and helps him respond more quickly during combat.

Agility Mode is an application of his own magic rather than a suit of IT equipment. Its benefits diminish as his mana is depleted, and an opponent capable of reading or adapting to his movements can still close the distance.

== Healing Magic ==

Avery discovers the ability to ease injuries before traveling to the Mystical Island. He later applies golden light directly to wounds and uses healing to support his recovery after serious fights.

Healing is an active process rather than complete immunity to harm. He can still be knocked unconscious, suffer damaged wings, require medical supervision, and need rest before resuming normal activity. Lux's treatment after the lake accident and her warning against flying show that a fast recovery does not make further strain harmless.

=== Mythical Healing Magic ===

'''Mythical Healing Magic''' develops from '''Ceresara's Blessing'''. Avery emits golden light capable of treating minor to moderately severe injuries and supporting those within its aura. By carefully adjusting the action of his light, he promotes repair without using the same destructive intensity as an offensive attack.

The ability extends to damaged tissue and bones, with applications to nerves and mental recovery. His command improves with his mana and control, but the severity of an injury and his available energy remain relevant.

== Compression ==

'''Compression''' is one of the Eight Forces and Avery's defining early Regnum Spei. It allows him to condense his magic and develop effects related to density, force, and localized gravitational control. Its appearance after contact with the destruction orb greatly increases the range of applications available to him.

Possessing the ability does not give him instant mastery. He initially experiments with compressed Light and learns through encounters that expose its imperfections. Atlas's and Alteria's command of their own powers provides a practical demonstration of the difference between having an unusual ability and controlling it with precision.

=== Compressed Light ===

Compression makes Avery's Light weapons, projectiles, and defensive constructs more substantial. A smaller construct can hold a greater concentration of energy, while an attack that appears slight may release a much larger force on impact.

This increased concentration brings risks. Avery must stabilize the mana while preparing a compressed projectile, and a dense barrier can still contain structural weaknesses. He cannot assume that making an attack heavier or brighter will compensate for every difference in technique.

=== Telekinesis and Levitation ===

Avery applies Compression to lifting objects, altering their motion, and disrupting an opponent's position. He can also use it around his own body to soften a fall, float, or move across a surface with greatly reduced friction.

During the I.T.E.R. test, he instinctively creates a magical field that lifts him from a vulnerable position and carries him out of the robot's immediate reach. The same movement gives him height, but does not prevent a sufficiently agile opponent from following him. His control of an external target can also be resisted by that target's own magic.

=== Localized Gravity ===

Avery develops gravitational applications that can draw targets down, reverse a force, or propel him away from danger. Techniques such as '''Space Reverse''' and '''Space Inverse''' let him change the pressure and direction acting within a limited area.

In a duel, he uses these effects to pin an opponent and then alter his own orientation and elevation. They give him unusual attack angles and means of evasion, rather than unrestricted control over the entire battlefield.

== Water Magic ==

{{Spoiler|Avery's Water Spirit nature gives him a second elemental affinity. During Aqua Revolution, he discovers that he can breathe underwater and begins developing the ability to create and manipulate water. Compression allows him to make that water denser, supporting stronger impacts, restraints, and protective constructs.}}

{{Spoiler|His Water techniques include raising a wall around himself or allies and using the flow to interfere with an opponent's movement. The effectiveness of these constructs depends on his control over both the water and the Compression applied to it.}}

== Holy Magic and Purification ==

{{Spoiler|Holy Magic is a powerful development of Avery's Light abilities. It produces fused, plasma-like energy that can break down material structures at a molecular level and deliver precise attacks over long distances. Its intensity diminishes as it passes through matter, and sufficiently strong magical barriers can withstand it.}}

{{Spoiler|Its mana cost and physical toll prevent Avery from using it as freely as an ordinary Light technique. Greater reserves expand his opportunities, but control and restraint remain important. Purification also gives his Light a cleansing role, including his contribution to the effort to reclaim District 1.}}

== Angelor Characteristics ==

=== Wings and Flight ===

Avery's white wings emerge during the orb crisis. They give him natural aerial movement and an alternative to standing on the rune or levitating through Compression. He can use them to hover and change his position in battle.

The wings remain physical parts of his body and can be injured. Damage sustained in the lake accident interferes with his ability to fly and requires treatment. Concealing them with the rune protects their secrecy, but does not mean that every accident or attack can be avoided.

=== Luxengan and Magical Perception ===

By directing mana into his eyes, Avery can perceive external magical fluctuations and traces left by the use of magic. This helps him judge potency, refine his own flow, and recognize opportunities to improve a technique.

The perception is not the same as ordinary color vision. It does not directly identify an affinity simply by displaying the magic's color. Its pulse-like awareness can function in darkness, while nearby changes in pressure assist his anticipation at close range.

=== Rune-Assisted Awareness ===

Resonating with the rune expands Avery's perception beyond what his eyes can see. At Altus, Level 3, he places it above his head, closes his eyes, and projects an awareness of his dorm room. With further concentration, he faintly perceives Ted, Jane, and River beyond the room itself.

This early projection is clearest nearby and less distinct farther away. It demonstrates a growing relationship between his mana, the artifact, and his senses without making every distant event equally visible.

== Spiritual Bond and Mage Magic ==

{{Spoiler|Avery is spiritually bonded with Lynnhera, a Water Spirit deity known as the Spiritstone Goddess. Through their anchored connection, she can share visions and access to her mastery of Mage magic. The bond is more deeply integrated than an ordinary external blessing, a distinction that becomes important when others attempt to draw her out of him.}}

{{Spoiler|Access to Lynnhera's knowledge and power is not equivalent to Avery having unlimited, continuous command of every Mage technique. Her choices, their relationship, and the state of their shared existence influence what he can use. The bond can also threaten his autonomy when Lynnhera assumes control.}}

== Transformation ==

{{Spoiler|Avery can transform parts of his body, or his entire body, into water. This allows fluid movement and lets some attacks pass through a form that no longer behaves like ordinary flesh. He can compress transformed limbs or combine the state with Light magic to strengthen their use.}}

{{Spoiler|The transformation has limitations. Temperature and Icelorian ultimate ice can interfere with returning to normal, while a fully dispersed water form cannot rely on ordinary human sight and hearing. He instead uses awareness through his water and magical pulses to understand his surroundings.}}

=== True Transformation ===

{{Spoiler|True Transformation develops after Avery fully merges with Lynnhera. His body becomes integrated with his magical essence and spirit, allowing him to manifest as mana and compressed magical matter. He can recover naturally from cuts and reshape parts of himself into materials or states he understands, including hard surfaces and cushioning fluid. His earlier water transformation remains available.}}

{{Spoiler|Although the state reduces ordinary physical strain, Avery still depends on his mana. Extreme heat, Icelorian ultimate ice, degenerative magic, and mana-draining shadow powers remain dangerous. His ability to evade or minimize their effects depends on his skill; transformation does not make him universally invulnerable.}}

== Other Regnum Spei and Divine Blessings ==

{{Spoiler|'''Omnifusion''' is Ceresara's Second Blessing and encompasses Antifusion and Fusion. It later evolves into '''Time Manipulation''', linking Avery's divine development with his identity as the God of Time.}}

{{Spoiler|'''Defense''' is associated with Artiana's Blessing, while '''Thought Acceleration''' is associated with Catathena's Blessing. These abilities broaden a repertoire that already emphasizes protection, perception, and the careful direction of power.}}

== Ki ==

Avery practices '''Awareness Ki''' and '''Empowerment Ki''' alongside his elemental and spiritual abilities. They form part of his broader cultivation rather than replacing the need to train his body, refine his mana, and understand his techniques.

== Physical and Mental Abilities ==

=== Agility and Reflexes ===

Years of street survival give Avery experience running, climbing, jumping, sliding, and changing direction in confined spaces. He is accustomed to judging a route quickly and escaping before a stronger pursuer can corner him. Magic builds on these habits, allowing greater leaps, softer landings, and sharper responses.

His mobility is most effective when used with observation. He looks for a gap, changes position, and uses a construct or burst of magic to make the opening useful. This style often allows him to remain competitive without matching an opponent's raw strength.

=== Intelligence and Adaptation ===

Avery uses deduction and experimentation rather than relying only on inherited instinct. He applies his understanding of physics and materials to magic, asks more experienced users for explanations, and revises techniques when an encounter exposes a flaw.

His progress does not make him an expert in every field. He is interested in sciences and programming, but still depends on specialists and teachers for much of his knowledge. His strength lies in combining observations from different situations and testing how they can be applied.

=== Endurance and Limitations ===

Avery can continue acting under pressure and after injury, but his ordinary durability is limited. Stronger physical attacks can break his defenses, and depleted mana weakens even techniques he previously maintained successfully. Healing and determination do not prevent unconsciousness, exhaustion, or the need for help.

His desire to protect others can itself become a weakness when it pushes him to act before he has a workable plan. His companions are therefore important not only as people he protects, but as fighters, advisers, and rescuers whose abilities cover his own shortcomings.

|tab=Relationships

== Relationships ==

=== Teddric Tech ===

Ted is Avery's earliest close school friend and his first practical guide to the Mystical world. He explains unfamiliar terminology, helps Avery understand the academy, and treats his ignorance as something that can be overcome rather than a reason to exclude him.

Their friendship includes constant banter, shared meals, competition, and life in Quad 44. Ted's confidence often contrasts with Avery's uncertainty, but it is not merely comic encouragement. After the orb crisis, he helps Avery understand that the consequences of the rescue do not erase its purpose or make him responsible for every action taken by the villains.

The two continue supporting one another through cohort activities, IT-related problems, and the broader struggles affecting their friends. Avery benefits from Ted's loyalty and practical ingenuity, while Ted is willing to act when danger threatens people within their group.

=== River Grantia ===

River is one of Avery's closest companions. Their friendship begins with his opposition to the bullying directed at her and grows through shared danger, the Sky House discovery, and their move to the Mystical Island.

Avery repeatedly rejects the contempt aimed at her demihuman identity and her position within the Aquia family. He tries to defend her even when Atlas is far beyond his ability to defeat. River, in turn, increasingly trusts him with her feelings and personal history.

Their bond is central to his developing ideals. Their wish to become Mystical Legends is tied to a future in which people are not denied dignity because of species or social standing. Team 44 also gives their trust a practical role, with River's contribution to the flag competition essential to the group's success.

=== Kaden Icelander ===

Kaden first appears as someone capable of rescuing Avery from threats he cannot handle. He becomes a friend, rival, recruiter, and employer whose influence opens doors to IT and other opportunities.

Avery respects his power and intelligence but does not always find his motives transparent. Kaden's willingness to offer advancement also serves larger plans, particularly when Avery's magic becomes relevant to the I.T.E.R. project. Their friendship therefore includes both trust and an awareness that Kaden is making calculations beyond the immediate conversation.

Their competitive relationship remains visible in the flag competition and combat assessments. Kaden's greater experience provides a standard for Avery to pursue, while his interventions show how much Avery still relies on others when his own judgment or endurance fails.

{{Spoiler|When Kaden and IT are accused during the robot crisis, Avery stays with him rather than accepting the accusations at face value. Their flight and investigation test the loyalty behind their ordinary rivalry.}}

=== Jane Tee ===

Jane is Avery's roommate and an important guide to everyday life at Regnum. She explains campus customs, school supplies, and the routines that Avery, Ted, and River have missed by arriving late. Her familiarity with the academy helps turn their dormitory into a functioning home rather than simply a place to sleep.

As a member of Team 44, Jane also demonstrates the value of planning and creating opportunities for others. Her actions during the flag competition contribute directly to the team's victory while Avery is occupied with Kaden.

=== Atlas Aquia ===

Atlas is Avery's cohort captain and one of the clearest examples of the gap between his ideals and the society around him. Avery is angered by Atlas's treatment of River, yet also recognizes the level of mastery he represents.

Recruitment into Tempest Aquia does not immediately create equality between them. Atlas sees value in Avery's potential while retaining an interest in monitoring his unusual power. Avery gains access to training and responsibilities, but must work within a relationship shaped by rank, authority, and prejudice.

The disappearance investigation forces their interaction onto firmer ground. Avery insists that the kidnapped children and the evidence deserve attention, pressing Atlas to respond to what he has found rather than dismissing him because of his standing.

=== Alteria Aquia ===

Alteria's early relationship with Avery is confrontational. At the Aquia estate, she exposes a weakness in his compressed barrier and treats his low mastery as proof that his unusual ability does not place him on her level.

Avery learns from the encounter even while resisting her judgment of him. Their exchanges connect his magical training with the more difficult task of dealing with people who can teach him something useful without treating him as an equal.

{{Spoiler|His later involvement with the water kingdom and work at the Aquia estate bring them into continued contact, extending their relationship beyond a single test of strength.}}

=== Charlotte Levy ===

Charlotte is an influential academy figure whose power and position initially seem far removed from Avery's own. Her capture by Pyrus nevertheless becomes a situation in which he chooses to act rather than remain a spectator.

Helping recover her teaches Avery that meaningful participation does not require him to be the strongest person in a battle. The rescue also entangles him more deeply in Pyrus's pursuit of the rune and the destruction orb. Charlotte's later help against Pyrus reinforces the importance of the experienced allies surrounding him.

=== Lux Luces ===

Lux first takes an interest in Avery's unusual mana and Angelor heritage. As his substitute teacher, she recognizes how different his development is from that of students raised with magic. He asks for tutoring, and she responds with both scholarly curiosity and an interest in watching him grow.

Their relationship becomes more personal through the lake accident, Lux's visits to the infirmary, and their conversations about ancestry. Avery respects her ability and status, but her willingness to speak closely with him makes her more than a distant royal figure.

At the Winter's Dance, he accepts her invitation and learns to dance under her guidance. He notices the unusual closeness of her gestures but is initially reluctant to assume romantic intent. His uncertainty gradually gives way to feelings that he finds difficult to express directly.

{{Spoiler|The crisis surrounding Aether's marriage plot brings those feelings into sharper focus. Avery helps expose the conspiracy, fights beside Lux, and earns Lumen's acknowledgment. Lux later summons him as her familiar, and their relationship remains important as he assumes the mantle of Magni Mage.}}

=== Kiara Katzol ===

Avery welcomes Kiara when she transfers to Regnum and defends her and River against students who object to demihumans attending the academy. His decision to accept a duel gives their friendship an immediate connection to the same injustice he has already encountered himself.

Kiara supports his efforts, while she and Ted help expose the abduction plot occurring during the match. Their friendship becomes part of the larger circle of students who recognize one another's worth beyond the hierarchy imposed by the nobles.

{{Spoiler|Their divine connections later make both of them targets for capture. Kiara also joins Avery and Raymond in investigating Aether and helping Lux during the attempted coup.}}

=== Caela Obtainia ===

Caela is Avery's mother and one of the central figures in the mystery of his origins. For much of his early life, he lacks a clear understanding of where she is, why they were separated, or what the rune's connection to her means.

The Sky House, historical visions, and Lux's knowledge gradually give that absence a larger context. Avery's wish to find answers about Caela is not separate from his magical growth: the artifact he wields and the people pursuing it repeatedly connect his family history to present danger.

{{Spoiler|Caela conceals Avery's identity in New York after attacks by the shadow cult make remaining together unsafe. The sealing of his early memories explains why his recollection of childhood does not initially match the circumstances of his birth and family.}}

=== Lynnhera ===

{{Spoiler|Lynnhera is spiritually anchored to Avery and becomes inseparable from the development of his Water Spirit nature and later magical body. Her connection can provide guidance, visions, and access to a level of magical knowledge beyond his own experience.}}

{{Spoiler|Their bond is not always harmonious. Lynnhera has intentions of her own and can become a threat to his independence when she assumes control. Avery's friends must confront the consequences of a connection that can empower him while also suppressing his consciousness.}}

=== Oceanus Aquia and Captain Levi ===

Oceanus is connected with the intervention that changes Avery's life in New York and later helps arrange the students' move to the Mystical Island. His authority makes him an important presence in matters Avery cannot yet manage for himself.

Captain Levi introduces Avery and his companions to another part of Mystical history during their journey. His stories of the Three Symbols place the island's public heroes within a past that is larger than the disputes the students have already witnessed.

=== Pyrus Bourn ===

Pyrus is one of Avery's first major enemies. His pursuit of the destruction orb turns Avery's discovery of the rune into an immediate threat and brings him into conflict with opponents far beyond his initial abilities.

Their encounters force Avery to protect River, take part in Charlotte's rescue, and survive capture and the orb crisis. Pyrus's power makes the limits of Avery's awakening clear: gaining wings and stronger magic does not allow him to win alone. The conflict leaves a lasting impression on how he understands both responsibility and the danger of power without restraint.
