Lucy Terner is an Elf and one of the Mystical Legends. Known as the Black Assassin, she works with IT Industries and IT Agency, where her Fandom profile identifies her as the leader of A-Unit.

|tab=Overview

== Background ==
Lucy combines her work as an IT Industries secretary with her position in IT Agency’s A-Unit. Her Fandom profile associates her with Blue Legion and records the White Assassin as her sister.

{{Spoiler|The notes identify Lucy as a future Magni of District 2.}}

== Family ==
* [[The White Assassin]] (sister)

== Trivia ==
* Her inspirations include Odette and Frey.
* Her animal motif is a cheetah; her fruit motif is a banana.
