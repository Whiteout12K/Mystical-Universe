<!DOCTYPE html>

<html>

<head>

    <meta charset="UTF-8">

    <title>Create User</title>

</head>

<body>

    <h1>Create User</h1>


    <form id="createForm">

        <input
            id="username"
            placeholder="Username"
            required
        >

        <input
            id="password"
            placeholder="4 digit password"
            maxlength="4"
            inputmode="numeric"
            type="password"
            required
        >

        <button>
            Create User
        </button>

    </form>


    <p id="message"></p>


<script>

document
    .getElementById("createForm")
    .addEventListener(
        "submit",
        async event => {

            event.preventDefault();


            const username =
                document.getElementById(
                    "username"
                ).value.trim();


            const password =
                document.getElementById(
                    "password"
                ).value.trim();


            const response =
                await fetch(
                    "/api/create-user",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            username,
                            password
                        })
                    }
                );


            const result =
                await response.json();


            if (response.ok) {

                document.getElementById(
                    "message"
                ).textContent =
                    "User created successfully!";

            } else {

                document.getElementById(
                    "message"
                ).textContent =
                    result.error;

            }

        }
    );

</script>

</body>

</html>
