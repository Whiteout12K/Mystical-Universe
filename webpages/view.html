<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Player Profile</title>
<link rel="stylesheet" href="/css/mlg.css">
<link rel="stylesheet" href="/css/mlg-c-viewer.css">
</head>
<body>
<div id="app"><div class="loading">Loading profile...</div></div>

<script>
const pathParts=location.pathname.split("/").filter(Boolean);
let username=new URLSearchParams(location.search).get("username")||pathParts[pathParts.length-1];
let characterDatabase={},accountStyleDatabase={},weaponDatabase={},accessoryDatabase={},artifactDatabase={},currentPlayerData={};
const premiumNames={diamond_core:"Diamond Core",sr_star_lv_frag:"SR Star Lv. Fragments",ssr_star_lv_frag:"SSR Star Lv. Fragments",ur_star_lv_frag:"UR Star Lv. Fragments"};

async function loadJSON(path,key){
 try{let r=await fetch(path,{cache:"no-cache"});if(!r.ok)throw Error(`${key} HTTP ${r.status}`);return await r.json()}
 catch(e){console.error(`Could not load ${key}:`,e);return{}}
}
async function loadCharacterDatabase(){characterDatabase=await loadJSON("/images/mlg-assets/data-character.json","data-character.json")}
async function loadAccountStyleDatabase(){accountStyleDatabase=await loadJSON("/images/mlg-assets/account-style.json","account-style.json")}
async function loadWeaponDatabase(){weaponDatabase=await loadJSON("/images/mlg-assets/data-weapon.json","data-weapon.json")}
async function loadAccessoryDatabase(){accessoryDatabase=await loadJSON("/images/mlg-assets/data-accessory.json","data-accessory.json")}
async function loadArtifactDatabase(){artifactDatabase=await loadJSON("/images/mlg-assets/data-artifact.json","data-artifact.json")}

function getCharacterInfo(id){
 const k=`c${id}`,c=characterDatabase.characters;
 if(characterDatabase[k])return characterDatabase[k];
 if(c?.[k])return c[k];
 if(Array.isArray(c))return c[id-1]||{};
 return{}
}
function getDatabaseItem(db,id,prefix){
 const k=`${prefix}${id}`;
 if(db?.[k])return db[k];
 if(Array.isArray(db))return db.find(x=>Number(x?.id??x?.artifact_id)===Number(id))||{};
 if(db?.items?.[k])return db.items[k];
 return{}
}
function normalizeAssetPath(path){
 if(path==null)return"";
 let v=String(path).trim();
 if(!v)return"";
 if(/^(https?:|data:|blob:)/.test(v))return v;
 return(v.replace("/images/character_art/","/images/character-art/")).startsWith("/")?v:`/${v}`
}
function getAccountStyleAsset(section,key){
 const s=accountStyleDatabase?.[section];
 return s&&typeof s==="object"&&Object.prototype.hasOwnProperty.call(s,key)?normalizeAssetPath(s[key]):""
}
function getAvatarImage(id){return getAccountStyleAsset("avatar",`img_${id}`)}
function getAvatarFrame(id){return getAccountStyleAsset("avatar",`frame_${id}`)}
function getBackgroundImage(id){return getAccountStyleAsset("background",`img_${id}`)}

async function loadProfile(){
 try{
  if(!username||username==="view.html")return showError("No Player","No username was provided.");
  const r=await fetch(`/api/user/${encodeURIComponent(username)}`,{cache:"no-cache"});
  if(!r.ok)return showError("Player Not Found","This profile does not exist.");
  const result=await r.json();
  currentPlayerData=result?.data&&typeof result.data==="object"?result.data:{};
  renderProfile(result?.username||username,currentPlayerData)
 }catch(e){console.error("Profile loading error:",e);showError("Connection Error","Could not load this profile.")}
}

function renderProfile(username,data){
 const owned=Array.isArray(data.c_owned)?data.c_owned.filter(Boolean).length:0;
 const achievements=Object.values(data.achievements||{}).filter(Boolean).length;
 const avatarId=num(data.avatar,1),avatarFrameId=num(data.avatar_frame,1),backgroundId=num(data.bg,1);
 const avatarImage=getAvatarImage(avatarId),avatarFrame=getAvatarFrame(avatarFrameId),backgroundImage=getBackgroundImage(backgroundId);
 const cls=backgroundImage?"profile profile-custom-background":"profile";
 const style=backgroundImage?` style="background-image:url('${escapeAttribute(backgroundImage)}');"`:"";
 document.getElementById("app").innerHTML=`
 <main class="page">
  <section class="${cls}"${style}><div class="profile-content">
   <div class="avatar-wrap"><div class="avatar">
    ${avatarImage?`<img class="profile-avatar-image" src="${escapeAttribute(avatarImage)}" alt="${escapeAttribute(username)}" onerror="handleAvatarError(this)">`:`<span class="avatar-fallback-letter">${escapeHtml(username.charAt(0).toUpperCase())}</span>`}
    ${avatarFrame?`<img class="profile-avatar-frame" src="${escapeAttribute(avatarFrame)}" alt="" aria-hidden="true" onerror="this.style.display='none'">`:""}
   </div></div>
   <div class="profile-heading"><h1 class="username">${escapeHtml(username)}</h1><p class="subtitle">Mystical Legends Player Profile</p><div class="rank">Adventure Rank ${num(data.ar_level,1)}</div></div>
  </div></section>
  <section class="stats">
   ${stat("Silver Coins",num(data.silver_coin))}${stat("Adventure Rank",num(data.ar_level,1))}${stat("Energy",num(data.energy))}${stat("Characters",owned)}${stat("Achievements",achievements)}${stat("Season Pass Lv.",num(data.season_pass_level,1))}
  </section>
  ${createAdventure(data)}${createSeasonPass(data)}${createPremium(data)}${createCharacters(data)}${createAchievements(data)}${createSkillTree(data)}${createCharacterSystems(data)}${createFlags(data)}
 </main>`
}

function handleAvatarError(img){
 const a=img.parentElement;img.remove();
 if(a&&!a.querySelector(".avatar-fallback-letter")){
  const f=document.createElement("span");f.className="avatar-fallback-letter";f.textContent=username.charAt(0).toUpperCase();a.prepend(f)
 }
}
function stat(label,value){return`<div class="stat"><div class="stat-label">${label}</div><div class="stat-value">${escapeHtml(value)}</div></div>`}

function createAdventure(data){
 const l=num(data.ar_level,1),x=num(data.ar_xp);
 return`<section class="section"><h2 class="section-title">Adventure Progress</h2>${progress("Adventure Rank XP",x,xpForRank(l))}${detailGrid({"Adventure Rank":l,"Current Energy":num(data.energy),"Silver Coins":num(data.silver_coin)})}</section>`
}
function createSeasonPass(data){
 const l=num(data.season_pass_level,1),x=num(data.season_pass_xp);
 return`<section class="section"><h2 class="section-title">Season Pass</h2><div class="details">${detail("Status",data.season_pass_owned?"Owned":"Not Owned")}${detail("Level",l)}${detail("XP",x)}</div>${progress("Season Pass XP",x,xpForRank(l))}</section>`
}
function createPremium(data){
 const p=data.premium||{};
 return`<section class="section"><h2 class="section-title">Premium Treasury</h2><div class="grid">${Object.entries(premiumNames).map(([k,n])=>`<div class="item"><div class="item-name">${n}</div><div class="item-sub">${num(p[k])} owned</div></div>`).join("")}</div></section>`
}

function createCharacters(data){
 const owned=Array.isArray(data.c_owned)?data.c_owned:[];
 const chars=owned.map((v,i)=>v?createCharacterTab(i+1,data):"").filter(Boolean);
 if(!chars.length)return`<section class="section character-collection"><h2 class="section-title">Character Collection</h2><div class="empty">No characters have been obtained yet.</div></section>`;
 return`<section class="section character-collection"><h2 class="section-title">Character Collection <span class="badge">${chars.length} OWNED</span></h2><div id="character-list" class="character-list">${chars.join("")}</div></section>`
}

function createCharacterTab(id,data){
 const i=getCharacterInfo(id),p=data[`c${id}`]||{},name=i.name||p.name||`Character ${id}`,rarity=p.rarity??"",img=i.profile_image||"",ri=i.rarity_img||"";
 return`<button type="button" class="character-tab" data-character-id="${id}" onclick="toggleCharacter(${id})">
 <div class="character-icon-wrap">${img?`<img class="character-icon" src="${escapeAttribute(img)}" alt="${escapeAttribute(name)}" onerror="this.style.display='none'">`:`<span class="item-symbol"></span>`}</div>
 <div class="character-tab-info"><div class="character-id">C${id}</div><div class="character-name">${escapeHtml(name)}</div>
 ${rarity!==""?`<div class="character-rarity ${getRarityClass(rarity)}">${ri?`<img src="${escapeAttribute(ri)}" alt="${escapeAttribute(getRarityName(rarity))}">`:""}${escapeHtml(getRarityName(rarity))}</div>`:""}
 </div></button>`
}

function toggleCharacter(id){
 const list=document.getElementById("character-list");if(!list)return;
 const existing=list.querySelector(".character-details"),clicked=list.querySelector(`[data-character-id="${id}"]`);
 if(existing?.dataset.characterId===String(id)){existing.remove();clicked?.classList.remove("active");return}
 existing?.remove();
 list.querySelectorAll(".character-tab.active").forEach(x=>x.classList.remove("active"));
 if(!clicked)return;
 const tabs=Array.from(list.querySelectorAll(".character-tab")),idx=tabs.indexOf(clicked);
 let rowEnd=clicked;
 for(let i=idx+1;i<tabs.length;i++){if(tabs[i].offsetTop!==clicked.offsetTop)break;rowEnd=tabs[i]}
 rowEnd.insertAdjacentHTML("afterend",createCharacterDetails(id,currentPlayerData));
 clicked.classList.add("active")
}

function createCharacterDetails(id,data){
 const i=getCharacterInfo(id),p=data[`c${id}`]||{},name=i.name||p.name||`Character ${id}`,rarity=p.rarity??"",ri=i.rarity_img||"",splash=i.splash_image||"",level=getCharacterLevel(p),stats=calculateCharacterStats(i,level),equipment=getCharacterEquipment(p),species=getValues(i.species,p.species),roles=getValues(i.role,p.role),affinities=getValues(i.affinity,p.affinity);
 return`<div class="character-details" data-character-id="${id}">
 <div class="character-details-top">
  <div class="character-splash-wrap">${splash?`<img class="character-splash" src="${escapeAttribute(splash)}" alt="${escapeAttribute(name)}" onerror="this.style.display='none'">`:`<span class="item-symbol"></span>`}</div>
  <div class="character-info">
   <div class="character-detail-heading"><h3 class="character-detail-name">${escapeHtml(name)}</h3>
   ${rarity!==""?`<div class="character-detail-rarity ${getRarityClass(rarity)}">${ri?`<img src="${escapeAttribute(ri)}" alt="${escapeAttribute(getRarityName(rarity))}">`:""}${escapeHtml(getRarityName(rarity))}</div>`:""}</div>
   <div class="character-detail-level">Level <strong>${level}</strong></div>
   ${createCharacterMeta(species,roles,affinities)}${createCharacterStats(stats,equipment)}
  </div>
 </div>${createEquipment(equipment)}</div>`
}

function createCharacterMeta(species,roles,affinities){
 return`<div class="character-meta-section">
 ${species.length?`<div class="character-meta-block character-species-block"><div class="character-meta-label">Species</div><div class="character-meta-values">${createCharacterListItems(species,"species")}</div></div>`:""}
 ${roles.length?`<div class="character-meta-block"><div class="character-meta-label">Role</div><div class="character-meta-values character-role-values">${createCharacterListItems(roles,"role")}</div></div>`:""}
 ${affinities.length?`<div class="character-meta-block"><div class="character-meta-label">Affinity</div><div class="character-meta-values character-affinity-values">${createCharacterListItems(affinities,"affinity")}</div></div>`:""}
 </div>`
}

function speciesClassName(species){
 return"species-"+String(species).toLowerCase().replace(/[^a-z0-9]+/g,"")
}

function elementClassName(element){
 return"element-"+String(element).toLowerCase().replace(/[^a-z0-9]+/g,"")
}

function affinityClassName(affinity){
 return String(affinity).toLowerCase().replace(/[^a-z0-9]+/g,"")
}

function createCharacterListItems(items,type="normal"){
 if(!Array.isArray(items))return"";
 return items.map(item=>{
  if(type==="species")return`<span class="species ${speciesClassName(item)} character-list-item">${escapeHtml(item)}</span>`;
  if(type==="affinity")return`<b class="affinity ${affinityClassName(item)} character-list-item">${escapeHtml(item)}</b>`;
  if(type==="element")return`<span class="element ${elementClassName(item)} character-list-item">${escapeHtml(item)}</span>`;
  return`<span class="character-list-item">${escapeHtml(item)}</span>`
 }).join(" ")
}

function getValues(a,b){
 const s=Array.isArray(a)?a:a!==undefined&&a!==null&&a!==""?[a]:Array.isArray(b)?b:b!==undefined&&b!==null&&b!==""?[b]:[];
 return s.flat(Infinity).filter(v=>v!==undefined&&v!==null&&String(v).trim()).map(String).filter((v,i,a)=>a.indexOf(v)===i)
}
function getRarityClass(v){
 const n=Number(v);
 if(Number.isFinite(n))return{1:"c",2:"un",3:"r",4:"sr",5:"ssr",6:"ur",7:"lr"}[n]||"";
 const r=String(v).toLowerCase().replace(/[^a-z]/g,"");
 return["c","un","r","sr","ssr","ur","lr"].includes(r)?r:""
}
function getRarityName(v){
 const n=Number(v);
 if(Number.isFinite(n))return{1:"C",2:"UN",3:"R",4:"SR",5:"SSR",6:"UR",7:"LR"}[n]||String(v);
 return String(v||"")
}
function getRarityBoxClass(v){const r=getRarityClass(v);return r?`rarity-${r}`:""}

function getCharacterLevel(p){
 for(const v of[p.level,p.lv,p.character_level,p.char_level]){
  const l=Number(v);if(Number.isFinite(l)&&l>0)return Math.floor(l)
 }
 return 1
}
function calculateCharacterStats(info,level){
 const b=info.base_stats||{},f=info.stat_change_by_level||{},m=Array.isArray(f.main_stat)?f.main_stat:[],u=typeof f.unique_stat==="string"?f.unique_stat:null,mw=Number(f.main_stat_weight)||0,uw=Number(f.unique_stat_weight)||0;
 return Object.entries(b).reduce((r,[key,val])=>{
  const base=Number(val);if(!Number.isFinite(base))return r;
  const weight=m.includes(key)?mw:u===key?uw:0;
  r.push({key,base,current:level>1?base+base*weight*(level-1):base});return r
 },[])
}

/* ============================================================
   CHARACTER STAT + EQUIPMENT CALCULATION
   ============================================================ */

function normalizeStatKey(name){
 return String(name||"").toLowerCase().trim().replace(/\s+/g,"_").replace(/-/g,"_")
}

function isPercentStat(type,name){
 const t=String(type||"").trim();
 const key=normalizeStatKey(name);

 /*
    gauge_gain and cooldown_red are percentage stats, but they
    are additive percentage stats. They must NOT multiply the
    character's existing value like a percentage modifier.

    Example:
    Base Energy Gauge Gain = 10%
    Artifact = +5% Gauge Gain

    Result = 15%, not 10.5%.
 */
 if(key==="gauge_gain"||key==="cooldown_red")return false;

 if(t==="%")return true;
 if(t==="+")return false;

 return["crit_rate","crit_dmg","healing_rate"].includes(key)
}

function isDirectPercentStat(name){
 const key=normalizeStatKey(name);
 return["gauge_gain","cooldown_red"].includes(key)
}

function isAdditionalStat(name){
 const key=normalizeStatKey(name);
 return["gauge_gain","cooldown_red"].includes(key)
}

function getEquipmentStatEntries(info,level,artifact=false,p=null){
 const r=[];
 if(!info)return r;

 if(artifact){
  const f=info.stat_change_by_level||{};

  const mainName=p?.main??f.main;
  const mainBase=Number(p?.main_value??f.main_value);
  const mainType=p?.main_type??f.main_type??"";

  if(mainName&&Number.isFinite(mainBase)){
   const w=Number(f.main_stat_weight)||0;
   r.push({
    name:mainName,
    base:mainBase,
    value:level>1?mainBase+mainBase*w*(level-1):mainBase,
    type:mainType,
    source:"artifact"
   })
  }

  if(p){
   for(let i=1;i<=4;i++){
    const name=p[`sub_${i}`],base=Number(p[`sub_${i}_value`]);
    if(!name||!Number.isFinite(base))continue;
    const rolls=Math.min(5,Math.max(0,Number(p[`sub_${i}_rolls`])||0));
    r.push({
     name,
     base,
     value:base*(rolls+1),
     type:p[`sub_${i}_type`]||"+",
     rolls,
     source:"artifact"
    })
   }
  }

  return r
 }

 const f=info.stat_change_by_level||{},w=Number(f.main_stat_weight)||0;

 for(let i=1;i<=2;i++){
  const name=f[`main_${i}`],base=Number(f[`main_${i}_value`]);
  if(!name||!Number.isFinite(base))continue;

  r.push({
   name,
   base,
   value:level>1?base+base*w*(level-1):base,
   type:"+",
   source:"equipment"
  })
 }

 return r
}

function collectCharacterEquipmentStats(equipment){
 const additive={},artifactAdditive={},artifactPercent={};

 function add(map,name,value){
  const key=normalizeStatKey(name);
  if(!key||!Number.isFinite(Number(value)))return;
  map[key]=(map[key]||0)+Number(value)
 }

 for(const type of["weapon","accessory"]){
  const item=equipment[type];
  if(!item)continue;

  const id=item.id;
  const db=type==="weapon"?weaponDatabase:accessoryDatabase;
  const prefix=type==="weapon"?"w":"a";
  const info=getDatabaseItem(db,id,prefix);
  const level=num(item.level,info.level||1);

  getEquipmentStatEntries(info,level,false).forEach(s=>{
   add(additive,s.name,s.value)
  })
 }

 for(const item of equipment.artifacts||[]){
  if(!item)continue;

  const id=item.id;
  const info=getDatabaseItem(artifactDatabase,id,"o");
  const level=num(item.level,info.level||1);

  getEquipmentStatEntries(info,level,true,item).forEach(s=>{
   /*
      gauge_gain and cooldown_red are direct percentage
      additions. Keep them in artifactAdditive so they are
      displayed correctly in the character stat breakdown.

      Other percentage stats retain the existing percentage
      calculation behavior.
   */
   if(isDirectPercentStat(s.name)){
    add(artifactAdditive,s.name,s.value)
   }else if(isPercentStat(s.type,s.name)){
    add(artifactPercent,s.name,s.value)
   }else{
    add(artifactAdditive,s.name,s.value)
   }
  })
 }

 return{additive,artifactAdditive,artifactPercent}
}

function calculateCharacterFinalStats(stats,equipment){
 const equipmentStats=collectCharacterEquipmentStats(equipment);
 const finalStats={};
 const baseStats={};
 const mainEquipmentStats={};
 const artifactStats={};

 stats.forEach(s=>{
  const key=normalizeStatKey(s.key);
  const base=Number(s.current)||0;
  const equipmentAdd=Number(equipmentStats.additive[key])||0;
  const artifactAdd=Number(equipmentStats.artifactAdditive[key])||0;
  const artifactPercent=Number(equipmentStats.artifactPercent[key])||0;

  const additiveTotal=base+equipmentAdd+artifactAdd;
  const final=additiveTotal*(1+artifactPercent/100);

  baseStats[key]=base;
  mainEquipmentStats[key]=equipmentAdd;

  artifactStats[key]=
   artifactAdd+
   (additiveTotal*(artifactPercent/100));

  finalStats[key]=final
 })

 /*
    Additional stats such as gauge_gain and cooldown_red may
    exist only on artifacts and not inside base_stats.

    Add them to the final stat collection so they can still
    appear in the Additional Stats section for every character.
 */
 const additionalKeys=["gauge_gain","cooldown_red"];

 additionalKeys.forEach(key=>{
  if(Object.prototype.hasOwnProperty.call(finalStats,key))return;

  const base=Number(baseStats[key]||0);
  const equipmentAdd=Number(equipmentStats.additive[key]||0);
  const artifactAdd=Number(equipmentStats.artifactAdditive[key]||0);
  const artifactPercent=Number(equipmentStats.artifactPercent[key]||0);

  const additiveTotal=base+equipmentAdd+artifactAdd;
  const final=additiveTotal*(1+artifactPercent/100);

  baseStats[key]=base;
  mainEquipmentStats[key]=equipmentAdd;
  artifactStats[key]=artifactAdd+(additiveTotal*(artifactPercent/100));
  finalStats[key]=final
 })

 return{baseStats,mainEquipmentStats,artifactStats,finalStats,equipmentStats}
}

/* ============================================================
   CHARACTER STAT LABELS
   ============================================================ */

function getCharacterStatDisplayName(name){
 const key=normalizeStatKey(name);

 if(key==="mana_regen"||key==="mana_regeneration"||key==="mp_regen"||key==="mp_regeneration"){
  return"Mana Regen (MP/s)"
 }

 if(key==="stamina_regen"||key==="stamina_regeneration"||key==="stamina_recovery"){
  return"Stamina Regen (p/s)"
 }

 if(key==="gauge_gain"){
  return"EG Gain"
 }

 if(key==="cooldown_red"){
  return"CD Red"
 }

 return pretty(name)
}

function formatCharacterStatSuffix(name){
 const key=normalizeStatKey(name);
 const percent=["crit_rate","crit_dmg","healing_rate","gauge_gain","cooldown_red"].includes(key);
 return percent?"%":""
}

function formatCharacterStat(name,value){
 return`${formatStat(value)}${formatCharacterStatSuffix(name)}`
}

function createAdditionalStats(stats,equipment,calculated){
 const additionalKeys=["gauge_gain","cooldown_red"];

 return`<div class="character-additional-stats">
  <button type="button" class="character-additional-stats-button" onclick="toggleAdditionalStats(this)">
   <span>Additional Stats</span><span class="character-additional-stats-arrow">+</span>
  </button>
  <div class="character-additional-stats-content">
   ${additionalKeys.map(key=>{
    const baseStat=stats.find(s=>normalizeStatKey(s.key)===key);
    const base=baseStat?Number(baseStat.current)||0:Number(calculated?.baseStats?.[key]||0);
    const equipmentAdd=Number(calculated?.mainEquipmentStats?.[key]||0);
    const artifactAdd=Number(calculated?.artifactStats?.[key]||0);
    const total=Number(calculated?.finalStats?.[key]||0);

    return`<div class="character-stat">
     <span class="character-stat-name">${escapeHtml(getCharacterStatDisplayName(key))}</span>
     <span class="character-stat-values">
      <span class="character-stat-current">${formatCharacterStat(key,total)}</span>
      <span class="character-stat-equipment">${equipmentAdd?`+${formatStat(equipmentAdd)}%`:""}</span>
      <span class="character-stat-artifact">${artifactAdd?`+${formatStat(artifactAdd)}%`:""}</span>
      <span class="character-stat-base">(${formatCharacterStat(key,base)})</span>
     </span>
    </div>`
   }).join("")}
  </div>
 </div>`
}

function toggleAdditionalStats(button){
 const box=button.parentElement;
 if(!box)return;
 box.classList.toggle("open");
 const arrow=button.querySelector(".character-additional-stats-arrow");
 if(arrow)arrow.textContent=box.classList.contains("open")?"−":"+"
}

/* ============================================================
   CHARACTER STATS
   ============================================================ */

function createCharacterStats(stats,equipment){
 if(!stats.length){
  const emptyCalculated=calculateCharacterFinalStats([],equipment);
  return`<div class="empty">No base stats defined.</div>${createAdditionalStats(stats,equipment,emptyCalculated)}`
 }

 const calculated=calculateCharacterFinalStats(stats,equipment);

 return`<div class="character-stats-heading">
  <span class="character-stats-heading-title">Stats</span>
  <div class="character-stats-heading-legend">
   <span class="character-stats-legend-total">Total</span>
   <span class="character-stats-legend-equipment">Main Equipment</span>
   <span class="character-stats-legend-artifact">Artifact</span>
   <span class="character-stats-legend-base">Base</span>
  </div>
 </div>
 <div class="character-stats">${stats.map(s=>{
  const key=normalizeStatKey(s.key);
  const total=calculated.finalStats[key]??s.current;
  const equipmentValue=calculated.mainEquipmentStats[key]||0;
  const artifactValue=calculated.artifactStats[key]||0;
  const base=calculated.baseStats[key]??s.base;

  return`
 <div class="character-stat">
  <span class="character-stat-name">${escapeHtml(getCharacterStatDisplayName(s.key))}</span>
  <span class="character-stat-values">
   <span class="character-stat-current">${formatCharacterStat(s.key,total)}</span>
   <span class="character-stat-equipment">${equipmentValue?`+${formatStat(equipmentValue)}${formatCharacterStatSuffix(s.key)}`:""}</span>
   <span class="character-stat-artifact">${artifactValue?`+${formatStat(artifactValue)}${formatCharacterStatSuffix(s.key)}`:""}</span>
   <span class="character-stat-base">(${formatCharacterStat(s.key,base)})</span>
  </span>
 </div>`
 }).join("")}</div>${createAdditionalStats(stats,equipment,calculated)}`
}

/* ============================================================
   ARTIFACT
   ============================================================ */
function getArtifactPieceData(info,p,pieceNum){
 const n=Number(pieceNum)||1;
 const nameKey=`piece_num_${n}_name`;
 const imageKey=`piece_num_${n}_img`;
 return{
  name:info?.[nameKey]||p?.[nameKey]||"",
  image:normalizeAssetPath(info?.[imageKey]||p?.[imageKey]||"")
 }
}

function createArtifactItem(p){
 const id=p.id,i=getDatabaseItem(artifactDatabase,id,"o"),name=i.name||p.name||"Unknown Artifact",rarity=p.rarity??i.rarity,rc=getRarityClass(rarity),rn=getRarityName(rarity),level=num(p.level,i.level||1),pieceNum=num(p.piece_num,1),pieceData=getArtifactPieceData(i,p,pieceNum),image=pieceData.image,mainStat=calculateArtifactMainStat(i,p,level),subStats=calculateArtifactSubStats(i,p),pieceType=getArtifactPieceName(pieceNum),artifactDisplayName=pieceData.name?`${pieceType}: ${pieceData.name}`:pieceType;
 return`<div class="equipped-item equipped-display artifact-display ${getRarityBoxClass(rarity)}">
 <div class="artifact-heading">
  <div class="artifact-image-wrap">${image?`<img class="artifact-image" src="${escapeAttribute(image)}" alt="${escapeAttribute(artifactDisplayName)}" onerror="handleEquipmentImageError(this)">`:`<span class="item-symbol"></span>`}</div>
  <div class="artifact-heading-info">
   <div class="equipment-rarity-line"><span class="equipment-rarity ${rc}">${escapeHtml(rn)}</span><span class="equipment-type ${rc}">Artifact</span></div>
   <div class="artifact-name">${escapeHtml(name)}</div>
   <div class="artifact-level">Level <span>${level}</span></div>
  </div>
 </div>
 <div class="artifact-piece"><strong>${escapeHtml(artifactDisplayName)}</strong></div>
 ${mainStat?`<div class="artifact-main-stat"><span class="artifact-stat-label">Main Stat</span><span class="artifact-stat-value"><span class="artifact-stat-name">${escapeHtml(getCharacterStatDisplayName(mainStat.name))}</span>: ${formatGearStat(mainStat.name,mainStat.value,mainStat.type)}</span></div>`:""}
 ${subStats.length?`<div class="artifact-sub-stats">${subStats.map(s=>`<div class="artifact-sub-stat"><span>${escapeHtml(getCharacterStatDisplayName(s.name))}${createRollDots(s.rolls)}</span><strong>${formatGearStat(s.name,s.value,s.type)}</strong></div>`).join("")}</div>`:""}
 </div>`
}

function createRollDots(rolls){
 const n=Math.min(5,Math.max(0,Number(rolls)||0));
 return n?` <span class="artifact-roll-dots" aria-label="${n} rolls">${"• ".repeat(n).trim()}</span>`:""
}

function handleEquipmentImageError(img){

 if(w&&!w.querySelector(".item-symbol")){const f=document.createElement("span");f.className="item-symbol";w.appendChild(f)}
}
function calculateEquipmentMainStats(info,level){
 const f=info?.stat_change_by_level||{},w=Number(f.main_stat_weight)||0,r=[];
 for(let i=1;i<=2;i++){
  const name=f[`main_${i}`],base=Number(f[`main_${i}_value`]);
  if(!name||!Number.isFinite(base))continue;
  r.push({name,base,value:level>1?base+base*w*(level-1):base,type:f[`main_${i}_type`]||""})
 }
 return r
}
function createEquipmentMainStats(stats){
 if(!stats.length)return"";
 return`<div class="equipment-main-stats">${stats.map(s=>`<div class="equipment-main-stat"><span class="equipment-stat-name">${escapeHtml(pretty(s.name))}</span><span class="equipment-stat-value">: ${formatGearStat(s.name,s.value,s.type)}</span></div>`).join("")}</div>`
}
function calculateArtifactMainStat(info,p,level){
 const f=info?.stat_change_by_level||{},name=p.main||f.main,base=Number(p.main_value??f.main_value),type=p.main_type??f.main_type??"";
 if(!name||!Number.isFinite(base))return null;
 const w=Number(f.main_stat_weight)||0;
 return{name,base,value:level>1?base+base*w*(level-1):base,type}
}
function calculateArtifactSubStats(info,p){
 const r=[];
 for(let i=1;i<=4;i++){
  const name=p[`sub_${i}`],base=Number(p[`sub_${i}_value`]);
  if(!name||!Number.isFinite(base))continue;
  const rolls=Math.min(5,Math.max(0,Number(p[`sub_${i}_rolls`])||0));
  r.push({name,value:base*(rolls+1),base,rolls,type:p[`sub_${i}_type`]||""})
 }
 return r
}
function getArtifactPieceName(n){return{1:"Headgear",2:"Chestplate",3:"Leggings",4:"Boots"}[Number(n)]||`Piece ${n}`}

 return`+${n}${percent?"%":""}`
}

function createAchievements(data){
 const e=Object.entries(data.achievements||{});if(!e.length)return"";
 const u=e.filter(([,v])=>v).length;
 return`<section class="section"><h2 class="section-title">Achievements <span class="badge">${u}/${e.length}</span></h2><div class="grid">${e.map(([k,v])=>`<div class="achievement ${v?"":"locked"}"><div class="achievement-symbol"></div><div><div class="item-name">${escapeHtml(pretty(k))}</div><div class="item-sub">${v?"Unlocked":"Locked"}</div></div></div>`).join("")}</div></section>`
}
function createSkillTree(data){

}
function createCharacterSystems(data){
 const a={equipped:data.c_equipped_skills,skill1:data.c_skill1_owned,skill2:data.c_skill2_owned,skill3:data.c_skill3_owned,skill4:data.c_skill4_owned,costumes:data.c_costume_owned};
 Object.keys(a).forEach(k=>a[k]=Array.isArray(a[k])?a[k]:[]);
 const ec=Array.isArray(data.c_costume_equipped)?data.c_costume_equipped:[];
 const c={equipped:countNested(a.equipped),skill1:countNumbers(a.skill1),skill2:countNumbers(a.skill2),skill3:countNumbers(a.skill3),skill4:countNumbers(a.skill4),costumes:countNumbers(a.costumes)};
 if(!Object.values(c).some(Boolean))return"";
 return`<section class="section"><h2 class="section-title">Character Progression</h2><div class="details">${detail("Equipped Skills",c.equipped)}${detail("Basic Skills Owned",c.skill1)}${detail("Special Skills Owned",c.skill2)}${detail("Ultimate Skills Owned",c.skill3)}${detail("Technical Skills Owned",c.skill4)}${detail("Costumes Owned",c.costumes)}${detail("Equipped Costumes",ec.filter(v=>v!=null).length)}</div></section>`
}
function createFlags(data){
 const e=Object.entries(data.flags||{});if(!e.length)return"";
 return`<section class="section"><h2 class="section-title">Milestones & Flags</h2><div class="details">${e.map(([k,v])=>detail(pretty(k),formatValue(v))).join("")}</div></section>`
}

function progress(label,value,max){
 value=Number(value)||0;max=Math.max(Number(max)||1,1);
 const pct=Math.min(100,Math.max(0,value/max*100));
 return`<div class="progress-container"><div class="progress-header"><span class="progress-label">${escapeHtml(label)}</span><span class="progress-value">${num(value)} / ${num(max)}</span></div><div class="progress"><div class="progress-bar" style="width:${pct}%"></div></div></div>`
}

function detailGrid(o){return`<div class="details">${Object.entries(o).map(([k,v])=>detail(k,v)).join("")}</div>`}
function xpForRank(l){return Math.max(100,l*100)}
function countNumbers(v){
 if(Array.isArray(v))return v.reduce((t,x)=>t+countNumbers(x),0);
 return typeof v==="number"&&v>0?v:0
}
function countNested(v){
 if(!Array.isArray(v))return 0;

const escapeAttribute=escapeHtml;
