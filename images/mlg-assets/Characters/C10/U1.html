<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Skill Info</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      color: #FFEBEE;
    }

    .icon-container {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .effect-icon {
      flex-shrink: 0;
    }

    .effect-text {
      flex: 1;
    }

    .body-text {
      background-color: #63141462;
      font-size: 9px;
      padding-left: 1em;
      padding-right: 1.5em;
      padding-top: 4em;
      padding-bottom: 4em;
    }

    .level-display {
      margin-top: 15px;
      font-size: 8px;
      color: #FFEBEE;
    }
  </style>
</head>

<body class="body-text">

  <div><b style="font-size:14px;">Ultimate Skill: Electrostasis Pulse</b></div>

  <div style="padding-top:7px">Kiara gathers lightning into her palm and lets it free to implode the space around her.  </div>

  <div id="des1" style="padding-top:7px"></div>

  <div style="padding-top:7px">If she has an active power meter, consume 9 points and the AoE is increased further and, upon use, gains 30% of energy gauge back.</div>

  <div style="padding-top:7px">Energy Gauge: 100%</div>

  <div class="level-display" id="level"></div>

  <script>
    const maxLevel = 10;
    const baseDamage = [690];

    // Read level from ?id=# in URL
    const params = new URLSearchParams(window.location.search);
    let level = parseInt(params.get("id")) || 1; // default = 1
    level = Math.min(maxLevel, Math.max(1, level)); // clamp between 1 and 10

    function updateSkill() {
      const multiplier = 1 + 0.25 * (level - 1);

      document.getElementById("des1").innerHTML =
        `The lightning will send a high current in a wide AoE, dealing <b>${(baseDamage[0] * multiplier).toFixed(1)}%</b> of attack as <b style="color:#bf9000">[Wind]</b> damage.`;

      document.getElementById("level").textContent = `< Skill Level: ${level} >`;
    }

    updateSkill();
  </script>

</body>

</html>
