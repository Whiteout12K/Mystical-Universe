Charlotte Levy is a Gostlynger and the centurion of Blue Legion. She teaches the 2A homeroom at Regnum Academy and is married to Douglas Levy.

|tab=Overview

== Background ==
Charlotte’s responsibilities extend across Blue Legion and Regnum Academy’s 2A homeroom. The notes identify her as the housewife of the Blue Legion mansion and the wife of Douglas Levy.
