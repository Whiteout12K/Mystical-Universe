== Overview ==
Charlotte is a Regnum graduate, magic teacher, and Blue Legion centurion. Her black hair, purple eyes, and cold bearing reflect the demanding authority she brings to instruction. The first two books place her at the intersection of teaching, emergency defense, and the academy's elite cohort system.

== Personality ==
Charlotte is blunt and frequently critical, but her instruction is directed toward improvement rather than mere humiliation. She identifies mistakes, supplies concrete advice, and expects students to maintain their own training when ordinary coursework resumes. Her restrained approval is consequently meaningful.

Her capture exposes her vulnerability within a coordinated enemy attack, while her return against Pyrus demonstrates that the earlier duel did not exhaust her abilities. She can recognize unexpected student achievements without endorsing their recklessness. In Book 2, she also takes the political consequences of the orb incident seriously and does not dismiss Avery's concern as simply childish curiosity.

== Mystical Rank & Heritage ==
The existing notes identify Charlotte as a Gostlynger and noble. In the novels she demonstrates purple fire and knowledge of shadow and forbidden magic. The supplied scenes do not give her a precise personal tier, so the general qualifications of a captain or teacher should not be converted into an invented exact rank.

== Tools and Equipment ==
Charlotte summons a black lion familiar through a dark-purple portal at the founding celebration. In combat she frequently shapes purple fire around her hands, feet, and attacks rather than relying on a separate ordinary weapon. Her classrooms, presentations, and arranged practice matches also show deliberate preparation behind her severe delivery.

|tab=Synopsis

== Synopsis ==

=== The Rune of the Spellcaster ===

==== Teacher and Captive ====

Charlotte meets the island arrivals and later supervises their magic courses. Her practical matches teach control and combinations, while her lectures explain discharge, affinity, cohort work, and civil responsibilities. She intervenes when the school catches fire and tries to absorb the hostile flames with her own purple fire.

Pyrus confronts her about the earth orb. Their close combat is interrupted by Tom's wind restraint and Tony's launching earth technique, allowing the villains to abduct her. In District 3, Ellie questions her about forbidden magic and the rune. Charlotte explains the rune's Angelor restriction but refuses to provide forbidden knowledge.

==== Return to the Battle ====

The students unlock her cell and the Masumi brothers help warn the district. After recovering, Charlotte joins Atlas at the town hall. Her lingering purple flames pressure Pyrus while his movement is constrained by compressed water. Their combination strips his inferno form and ends the crisis. She recognizes the rescue party's potential while still understanding the danger of their choices.

=== I.T.E.R. Chronicles — Initialization ===

Charlotte helps judge the unusual cohort challenge, acknowledges Avery and Kaden's progress, and keeps Blue Legion's expectations intact. Her authority is separate from simply being the students' familiar classroom teacher.

When emergency training disrupts ordinary academics, she restores rigorous lectures and assessments before the semester ends. She also asks Avery and Ted to record their earlier experiences and discusses the unresolved governance issues surrounding Pyrus, the orb, and possible information leaks. These scenes connect her classroom role to the wider security crisis rather than reducing her to an obstacle to the students' free time.

=== Sources ===
Book 1: Chapters 9–16. Book 2: Chapters 2–5.

|tab=Powers & Abilities

== Powers & Abilities ==

== Established Abilities ==

=== Purple Fire ===

Charlotte coats her hands in flame for rapid close-range attacks and uses Purple Fire Beam for concentrated discharge. Her flames can linger after a strike, restricting movement and creating further pressure.

=== Talon of the Abyss and Flame Dragon's Ascent ===

These attacks appear in the final fight against Pyrus. The dragon-shaped flame strips the fire surrounding his body while Atlas controls the enclosure. Their effectiveness is demonstrated as part of a coordinated engagement, not an isolated claim that she can instantly defeat any inferno user.

=== Magical Knowledge ===

Her study of shadow and forbidden magic makes her a target for interrogation. She recognizes the Rune of the Spellcaster and its restrictions, showing scholarly value alongside combat ability.

|tab=Relationships

== Relationships ==

=== Kaden Icelander ===

[[char/kaden_icelander|Kaden]] considers Charlotte a mentor and organizes her rescue. She later assigns him ordinary cohort responsibilities instead of rewarding his confidence with exemption.

=== Students and Fellow Captains ===

[[char/avery_obtainia|Avery]], [[char/teddric_tech|Ted]], and their companions become students whose initiative she can respect without excusing every risk. [[char/atlas_aquia|Atlas]] supplies the complementary restraint needed to defeat Pyrus.

=== Pyrus Bourn and Ellie Tracey ===

[[char/pyrus_bourn|Pyrus]] abducts Charlotte for information, while [[char/ellie_tracey|Ellie]] participates in questioning her. The encounter illustrates that her knowledge is valuable to enemies as well as students.
