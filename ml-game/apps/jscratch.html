<title>JScratch .js Maker</title>
<style>
*{box-sizing:border-box}
:root{
--red:#741b22;--red2:#a52a32;--gold:#d6aa45;--gold2:#f0ca69;
--dark:#121012;--panel:#1c181a;--panel2:#262022;--panel3:#30282a;
--text:#f5ead2;--muted:#9f9487;--border:#493c36;--glow:#f0ca69
}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:var(--dark);color:var(--text)}
button,input,select{font:inherit}button{border:0;cursor:pointer}
#app{display:flex;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 70% 15%,#35251f 0,#181316 38%,#0e0c0e 100%)}
#sidebar{width:265px;min-width:265px;background:linear-gradient(180deg,#211a1c,#151214);border-right:1px solid #554237;display:flex;z-index:20;box-shadow:5px 0 25px #0008}
#categories{width:43px;min-width:43px;background:linear-gradient(180deg,#151113,#0e0c0e);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:7px 5px;overflow-y:auto}
.cat{width:31px;height:31px;min-height:31px;border-radius:8px;background:#282124;color:#777;border:1px solid #3b3031;font-size:0;position:relative;transition:.12s}
.cat:after{content:"";position:absolute;left:8px;top:8px;width:15px;height:15px;border-radius:4px;background:currentColor;box-shadow:0 0 8px currentColor}
.cat:hover,.cat.active{color:var(--gold2);background:#392c27;border-color:#876633;transform:scale(1.05);box-shadow:0 0 10px #d6aa4530}
.cat[data-cat="Canvas"]{color:#38aab5}.cat[data-cat="Sprite"]{color:#468ac0}.cat[data-cat="Motion"]{color:#3d9a68}.cat[data-cat="Operators"]{color:#8066c5}.cat[data-cat="Variables"]{color:#c18b2d}.cat[data-cat="Sensing"]{color:#4784a4}.cat[data-cat="Control"]{color:#d34d4d}.cat[data-cat="Events"]{color:#b27b20}.cat[data-cat="Clones"]{color:#9250ad}.cat[data-cat="Sound"]{color:#81509c}.cat[data-cat="Data"]{color:#9a7840}
#palette-area{flex:1;min-width:0;display:flex;flex-direction:column}
#logo{height:44px;min-height:44px;padding:10px;font-size:14px;font-weight:bold;color:var(--gold2);border-bottom:1px solid #3e3230;display:flex;align-items:center;justify-content:space-between;text-shadow:0 0 9px #d6aa4540;letter-spacing:.2px}
#logo:before{content:"";margin-right:7px;color:var(--gold)}
#logo span{flex:1}
#closeBlocks{display:none;background:#392b2b;color:#fff;width:28px;height:28px;border-radius:6px;font-size:18px;line-height:1}
#palette-title{height:32px;min-height:32px;padding:8px 10px 5px;font-size:10px;font-weight:bold;letter-spacing:1.2px;text-transform:uppercase;color:#aa9a89;border-bottom:1px solid #30282a;background:#181416}
#palette{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px}
.palette-block{margin-bottom:5px;cursor:grab;user-select:none}.palette-block:active{cursor:grabbing}
.palette-block.eventcontainer,.palette-block.ifcontainer{min-height:100px}.palette-block.eventcontainer .stack.nested{min-height:32px}.palette-block.eventcontainer .nested-label{display:none}.palette-block.eventcontainer>.block-row{margin-bottom:2px}.palette-block.eventcontainer>.event-field{margin-top:3px}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#toolbar{height:50px;min-height:50px;background:linear-gradient(180deg,#211a1c,#181416);border-bottom:1px solid #514039;display:flex;align-items:center;gap:6px;padding:6px 8px;overflow-x:auto;overflow-y:hidden;box-shadow:0 2px 12px #0007}
.tool{background:linear-gradient(180deg,#393033,#2b2427);color:#eee;padding:7px 10px;border:1px solid #4b3d3c;border-radius:6px;font-size:12px;white-space:nowrap;transition:.12s;box-shadow:0 1px 2px #0006}
.tool:hover{background:linear-gradient(180deg,#4a3a36,#352b2d);border-color:#806548;transform:translateY(-1px)}
.tool.primary{background:linear-gradient(180deg,#a52a32,#741b22);border-color:#b85a50;color:#fff;box-shadow:0 0 12px #741b2245}
.tool.green{background:linear-gradient(180deg,#39764b,#28613a);border-color:#56815e}
#blocksToggle{display:none}
#zoomControls{position:fixed;right:14px;bottom:14px;display:flex;align-items:center;gap:3px;padding:5px;background:#181416ee;border:1px solid #554237;border-radius:8px;box-shadow:0 5px 20px #000b,0 0 12px #d6aa4510;z-index:100000;backdrop-filter:blur(8px)}
#zoomControls .tool{padding:7px 9px}
#zoomText{min-width:50px;text-align:center;color:#c8bca9;font-size:12px}
#scripts{height:38px;background:linear-gradient(180deg,#171214,#121012);border-bottom:1px solid #493a36;display:flex;align-items:end;gap:3px;padding:0 7px;overflow-x:auto}
.script-tab{height:32px;padding:8px 12px;background:#252022;color:#9d9286;border:1px solid transparent;border-bottom:0;border-radius:6px 6px 0 0;white-space:nowrap;font-size:12px;user-select:none;cursor:grab;transition:.12s}
.script-tab:hover{background:#30282a;color:#d9cbb8}.script-tab:active{cursor:grabbing}.script-tab.active{background:linear-gradient(180deg,#3b302e,#2c2526);color:var(--gold2);border-color:#56443b}.script-tab .x{margin-left:7px;color:#777;cursor:pointer}.script-tab .x:hover{color:#f08080}.script-tab.dragging{opacity:.55}.script-tab.drop-before{box-shadow:-3px 0 0 var(--gold2)}.script-tab.drop-after{box-shadow:3px 0 0 var(--gold2)}
#workspace{position:relative;flex:1;overflow:auto;background-color:#211c1e;background-image:radial-gradient(#51443c88 1px,transparent 1px),linear-gradient(#00000008 1px,transparent 1px);background-size:20px 20px,20px 20px;touch-action:auto;scroll-behavior:auto}
#workspace:before{content:"";position:fixed;inset:88px 0 0 265px;pointer-events:none;background:radial-gradient(circle at 50% 30%,#d6aa4507,transparent 55%);z-index:0}
#world{position:relative;left:0;top:0;width:100%;height:100%;min-width:1px;min-height:1px;transform-origin:0 0;z-index:1}
#empty{position:absolute;left:20px;top:20px;color:#756b63;text-align:left;pointer-events:none}
#empty b{display:block;font-size:20px;color:#a99a87;margin-bottom:7px;text-shadow:0 0 10px #d6aa4520}
#dropLine{position:fixed;height:3px;background:linear-gradient(90deg,transparent,var(--gold2),transparent);border-radius:4px;display:none;z-index:999999;pointer-events:none;box-shadow:0 0 10px var(--gold2)}
#dropSlot{position:fixed;height:26px;border:2px solid var(--gold2);border-radius:12px;display:none;z-index:999999;pointer-events:none;box-shadow:0 0 12px #f0ca69aa}
#codePanel{position:absolute;right:0;top:0;width:430px;height:100%;background:#100e10ed;border-left:1px solid #57463c;display:none;z-index:50;flex-direction:column;backdrop-filter:blur(12px)}
#codeHead{height:50px;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid #463832;color:var(--gold2)}
#code{flex:1;margin:0;padding:15px;overflow:auto;color:#e2d7c8;background:#0a090a;font-family:monospace;font-size:13px;line-height:1.55;white-space:pre}
#closeCode{background:#392b2b;color:#fff;padding:7px 10px;border-radius:5px}
#sidebarBackdrop{display:none}
.block{position:relative;display:flex;align-items:center;gap:4px;min-height:34px;width:max-content;max-width:700px;padding:5px 7px;background:#514b4b;color:#fff;border:1px solid #ffffff10;border-radius:6px;box-shadow:0 3px 7px #0009;font-size:12px;white-space:nowrap;user-select:none;transition:filter .08s}
.block:hover{filter:brightness(1.08)}
.block.event{background:linear-gradient(135deg,#a9771e,#855912)}.block.control{background:linear-gradient(135deg,#d15151,#a9363b);min-width:200px;display:block;padding:6px}.block.clone{background:linear-gradient(135deg,#934db0,#71388c)}.block.sound{background:linear-gradient(135deg,#8957a5,#684080)}.block.canvas{background:linear-gradient(135deg,#2b8790,#21666e)}.block.sprite{background:linear-gradient(135deg,#4682b2,#315f8a)}.block.motion{background:linear-gradient(135deg,#3e9163,#2e704d)}.block.operator{background:linear-gradient(135deg,#6857a0,#504180);border-radius:17px}.block.variable{background:linear-gradient(135deg,#cc9635,#a97625)}.block.sensing{background:linear-gradient(135deg,#4b83a4,#37677f);border-radius:17px}.block.data{background:linear-gradient(135deg,#766034,#584821)}
.block.dragging{opacity:.72;z-index:999999;filter:brightness(1.15)}.block.selected{outline:2px solid var(--gold2);outline-offset:2px;box-shadow:0 0 12px #f0ca6950}
.block.boolean{border-radius:0;clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,10px 100%,0 50%)}.block.boolean .slot{border-radius:12px}
.block.eventcontainer,.block.ifcontainer{display:block}.block.eventcontainer,.block.clone.eventcontainer{width:max-content;max-width:none;min-width:260px}
.block.eventcontainer>.nested-label,.block.ifcontainer>.nested-label{display:block}.block.eventcontainer>.stack.nested{margin-top:3px}.block.eventcontainer>.event-field{width:100%;min-width:0}.block.eventcontainer>.stack.nested{width:max-content;min-width:100%;max-width:none}
.block input,.block select{height:22px;border:1px solid #b9a98f;border-radius:4px;padding:2px 5px;min-width:45px;max-width:150px;background:#fff;color:#111;outline:none;font-size:11px}
.block input:focus{border-color:var(--gold);box-shadow:0 0 5px #d6aa4566}.block input[type=number]{width:60px}.block input[type=text]{width:88px}.block input[type=color]{width:42px;min-width:42px;padding:2px;background:#fff;cursor:pointer}.block input.wide{width:135px}
.event-field{display:flex;align-items:center;gap:4px;margin:3px 0 2px 2px;font-size:9px;color:#fff9}.event-field .slot{margin-left:1px}
.slot{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;min-width:43px;height:22px;margin:0 2px;padding:0 4px;background:#fff;color:#222;border-radius:12px;box-shadow:inset 0 1px 2px #0005}
.slot.boolean-slot{border-radius:0;clip-path:polygon(7px 0,calc(100% - 7px) 0,100% 50%,calc(100% - 7px) 100%,7px 100%,0 50%)}
.slot .block{transform:none;margin:0;box-shadow:none;min-height:20px;height:20px;font-size:11px;padding:2px 5px}.slot .block.operator,.slot .block.sensing,.slot .block.variable{height:20px;min-height:20px}
.stack{position:relative;display:flex;flex-direction:column;align-items:flex-start}.stack>.block{margin-bottom:1px}
.stack.nested{min-height:25px;margin:4px 0 0 2px;padding:4px 4px 3px 10px;border-left:3px solid #0005;border-radius:0 0 5px 5px;background:#0003;width:calc(100% - 2px)}
.block.eventcontainer>.stack.nested{width:max-content;min-width:100%;max-width:none}.stack.nested:empty:after{content:"Drop blocks here";display:block;color:#ffffff55;font-size:10px;padding:4px}
.control>.block-row{display:flex;align-items:center;gap:4px;flex-wrap:wrap}.control>.nested-label{font-size:9px;color:#fff9;margin:4px 0 1px 2px}.if-else{margin-top:4px;padding-top:4px;border-top:1px solid #fff4}.eventcontainer>.nested-label{font-size:9px;color:#fff9;margin:4px 0 1px 2px}
.context-menu{position:fixed;display:none;min-width:125px;background:#241e20;border:1px solid #5b493e;border-radius:6px;z-index:999999;box-shadow:0 8px 25px #000b;padding:3px}.context-menu button{display:block;width:100%;padding:8px 14px;background:none;color:#ddd;text-align:left;font-size:12px;border-radius:4px}.context-menu button:hover{background:#45332d;color:var(--gold2)}
.drag-ghost{position:fixed;pointer-events:none;z-index:999999}#importInput{display:none}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:#141113}::-webkit-scrollbar-thumb{background:#51433d;border-radius:8px}::-webkit-scrollbar-thumb:hover{background:#725b48}

@media(max-width:700px){
#sidebar{position:fixed;left:0;top:0;width:min(88vw,320px);min-width:0;height:100%;transform:translateX(-100%);transition:transform .18s ease;box-shadow:5px 0 25px #000b;z-index:100}
#sidebar.open{transform:translateX(0)}
#sidebarBackdrop{position:fixed;inset:0;background:#0009;z-index:90}
#sidebarBackdrop.open{display:block}
#categories{width:38px;min-width:38px;padding:7px 5px}
.cat{width:27px;height:27px;min-height:27px}.cat:after{left:7px;top:7px;width:13px;height:13px}
#closeBlocks{display:block;background:#392b2b}
#blocksToggle{display:block;background:#454545}
#toolbar{height:50px;min-height:50px;padding:6px;gap:5px}
#toolbar .tool{padding:7px 9px}
#scripts{height:38px;padding:0 5px}.script-tab{padding:8px 10px}
#codePanel{width:100%;border-left:0}
#codeHead{height:46px;padding:7px 10px}#code{padding:12px;font-size:12px}
#empty{left:15px;top:15px}#empty b{font-size:17px}
#zoomControls{right:10px;bottom:10px}
}

@media(max-width:430px){
#toolbar .tool:not(#blocksToggle):not(#newScript):not(#showCode){display:none}
#zoomText{min-width:43px}#zoomControls{right:8px;bottom:8px}#zoomControls .tool{padding:7px}
#codeHead b{font-size:13px}
}#toolbar{height:auto;min-height:50px;flex-wrap:wrap}#projectStatus{font-size:11px;color:var(--gold);margin-left:auto}#runtimePanel{width:min(1000px,96vw);height:min(800px,94dvh);padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--text)}#runtimePanel::backdrop{background:#000b}.runtime-tools{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.runtime-tools button{padding:7px;border-radius:4px;background:var(--panel3);color:var(--gold2)}#runtimeFrame{width:100%;height:65%;border:0;background:#000}#runtimeDebug{max-height:22%;overflow:auto;font:12px/1.5 monospace;white-space:pre-wrap}.block.runtime-active{outline:2px solid #70d29a}.block.runtime-error{outline:2px solid #ff8585}.load-blocks{background:var(--panel3);color:var(--gold2);padding:9px;margin:8px 0}#toolbar{max-height:130px;overflow:auto}@media(max-width:430px){#toolbar .tool:is(#runProject,#saveProject,#openProject,#undoProject,#redoProject){display:block;padding:6px;font-size:11px}}
</style>

</head>

<div id="app">
<aside id="sidebar">
<div id="categories"></div>
<div id="palette-area">
<div id="logo"><span>JScratch .js Maker</span><button id="closeBlocks">×</button></div>
<div id="palette-title"></div>
<div id="palette"></div>
</div>

<div id="sidebarBackdrop"></div>
<main id="main">
<div id="toolbar">

<span id="projectStatus" role="status"></span>
</div>
<div id="scripts"></div>
<div id="workspace">
<div id="world"></div>
<div id="empty"><b>Drag blocks here</b>Build your scripts visually.</div>
<div id="dropLine"></div>
<div id="dropSlot"></div>
</div>
<div id="codePanel">
<div id="codeHead"><b>Generated JavaScript</b><button id="closeCode">×</button></div>
<pre id="code"></pre>
</div>
</main>
</div>

<dialog id="runtimePanel" aria-label="JScratch project preview"><div class="runtime-tools"><button id="restartProject">Restart</button><button id="pauseProject">Pause</button><button id="stepProject">Step</button><button id="stopProject">Stop</button><button id="closeRuntime">Close</button></div><iframe id="runtimeFrame" title="Project stage"></iframe><pre id="runtimeDebug" aria-live="polite"></pre></dialog>
<div id="zoomControls">

<span id="zoomText">100%</span>
<button class="tool" id="zoomIn">+</button>
<button class="tool" id="zoomReset">Reset</button>
</div>

<div class="context-menu" id="menu"><button data-action="duplicate">Duplicate</button><button data-action="delete">Delete</button></div>

        const b=createBlock(def);restoreState(b,data.block);slot.replaceChildren(b);setupBlock(b);return
    }
    const input=slot.querySelector(":scope > input");if(input&&data.value!==undefined)input.value=data.value
}
function restoreState(b,data){
    if(!data)return;if(data.manualPosition)b.dataset.manualPosition="true";
    const slots=getDirectSlots(b);data.slots?.forEach((v,i)=>slots[i]&&restoreSlot(slots[i],v));
    if(data.stacks)Object.entries(data.stacks).forEach(([name,list])=>{
        const stack=b.querySelector(`:scope > .stack[data-stack="${name}"],:scope > .if-else > .stack[data-stack="${name}"]`);if(!stack)return;
        stack.replaceChildren();if(list.length>150){deferredStacks.set(stack,list.slice());const load=document.createElement('button');load.className='load-blocks';load.textContent='Show next 150 blocks ('+list.length+' remaining)';load.onclick=e=>{e.stopPropagation();const remaining=deferredStacks.get(stack);const chunk=remaining.splice(0,150);const fragment=document.createDocumentFragment();for(const data of chunk){const def=findDef(data.type);if(def){const child=createBlock(def);restoreState(child,data);fragment.append(child);}}stack.insertBefore(fragment,load);if(!remaining.length){deferredStacks.delete(stack);load.remove();}else load.textContent='Show next 150 blocks ('+remaining.length+' remaining)';normalizeWorld();};stack.append(load);}else list.forEach(childData=>{const def=findDef(childData.type);if(!def)return;const child=createBlock(def);restoreState(child,childData);stack.appendChild(child)})
    })
}
function renderWorld(limit=200){
    world.replaceChildren();const s=scripts[activeScript];
    if(!s){updateEmpty();resizeWorld();return}
    renderedModelCount=Math.min(limit,s.blocks.length);
    s.blocks.slice(0,renderedModelCount).forEach(data=>{
        const def=findDef(data.type);if(!def)return;
        const b=createBlock(def);b.style.position="absolute";b.style.left=b.style.top="20px";restoreState(b,data);world.appendChild(b)
    });
    if(s.blocks.length>renderedModelCount){const load=document.createElement('button');load.className='load-blocks';load.id='moreRootBlocks';load.textContent='Show next 200 blocks ('+(s.blocks.length-renderedModelCount)+' remaining)';load.onclick=()=>{saveCurrent();const top=workspace.scrollTop;renderWorld(renderedModelCount+200);workspace.scrollTop=top;};world.append(load);}
    normalizeWorld();updateEmpty();workspace.scrollLeft=workspace.scrollTop=0
}
const defs=new Map(cats.flatMap(c=>BLOCKS[c].map(d=>[d[0],d])));
function findDef(type){return defs.get(type)||null}
function getDirectSlots(b){return[...b.querySelectorAll(":scope > .block-row > .slot,:scope > .event-field > .slot")]}
function formatValue(v,type){
    if(type==="number"&&v!=="")return v;
    if(type==="boolean")return v==="true"||v==="false"?v:JSON.stringify(v);
    if(v==="true"||v==="false"||/^-?\d+(\.\d+)?$/.test(v))return v;
    return JSON.stringify(v)
}
function slotValue(slot){
    const child=slot.querySelector(":scope > .block");if(child)return generateExpression(child);
    const input=slot.querySelector(":scope > input");return input?formatValue(input.value,slot.dataset.type||input.type):""
}
function generateExpression(b){
    if(ZERO_FIELD_BLOCKS.has(b.dataset.type))return b.dataset.fn+"()";
    return b.dataset.fn+"("+getDirectSlots(b).map(slotValue).filter(Boolean).join(", ")+")"
}
function generateStatement(b,level=0){
    const fn=b.dataset.fn,vals=getDirectSlots(b).map(slotValue).filter(Boolean),ind="    ".repeat(level),mode=b.dataset.mode;
    if(ZERO_FIELD_BLOCKS.has(b.dataset.type)&&mode==="statement")return ind+fn+"()";
    if(!CONTAINER_MODES.has(mode))return ind+fn+"("+vals.join(", ")+")";
    if(["repeat","repeatUntil","whileBlock","forever"].includes(fn)){
        const inside=generateStack(b.querySelector('[data-stack="main"]'),level+1);
        return ind+fn+"("+vals.join(", ")+(inside?(vals.length?",":"")+"\n"+inside+"\n"+ind:"")+")"
    }
    if(fn==="ifBlock"){
        const a=generateStack(b.querySelector('[data-stack="main"]'),level+1),e=generateStack(b.querySelector('[data-stack="else"]'),level+1);
        let out=ind+"ifBlock("+vals[0];if(a)out+=",\n"+a;if(e)out+=",\n"+ind+"    \"else\",\n"+e;return out+")"
    }
    if(EVENT_HANDLER_BLOCKS.has(fn)){
        const inside=generateStack(b.querySelector('[data-stack="main"]'),level+1);
        return ind+fn+"("+vals.join(", ")+(inside?(vals.length?",":"")+"\n"+inside+"\n"+ind:"")+")"
    }
    return ind+fn+"("+vals.join(", ")+")"
}
function generateStack(stack,level){
    if(!stack)return"";
    const blocks=[...stack.children].filter(x=>x.classList.contains("block"));
    return blocks.map((b,i)=>{
        const current=generateStatement(b,level);
        return current+(i<blocks.length-1?",\n":"")
    }).join("")
}

/* ---------- JAVASCRIPT GENERATION ---------- */

function generateScript(){
    const roots=[...world.children].filter(isRootBlock);
    if(!roots.length)return"";

    let out="";
    roots.forEach((b,i)=>{
        const code=generateStatement(b);
        if(!code)return;

        const isEvent=EVENT_HANDLER_BLOCKS.has(b.dataset.fn);

        if(isEvent){
            if(out)out+="";
            out+=code+";";
            if(i<roots.length-1)out+="\n\n";
        }else{
            if(out&&!out.endsWith("\n"))out+="\n";
            out+=code+";";
        }
    });

    return out
}

function generateAll(){saveCurrent();return JScratchProject.generate(scripts,defs,ZERO_FIELD_BLOCKS).code;}

function refreshCode(){scheduleProjectSave();if(codePanelOpen){clearTimeout(codeRefreshTimer);codeRefreshTimer=setTimeout(()=>$("code").textContent=generateAll(),100);}}
$("showCode").onclick=()=>{saveCurrent();codePanelOpen=true;$("code").textContent=generateAll();$("codePanel").style.display="flex"};
$("closeCode").onclick=()=>{codePanelOpen=false;$("codePanel").style.display="none"};
$("copyCode").onclick=async()=>{saveCurrent();await navigator.clipboard.writeText(generateAll());const b=$("copyCode");b.textContent="Copied!";setTimeout(()=>b.textContent="Copy",900)};
$("download").onclick=()=>{saveCurrent();const blob=new Blob([generateAll()],{type:"text/javascript"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="code-blocks.js";a.click();URL.revokeObjectURL(a.href)};
function setZoom(z){
    saveCurrent();zoom=Math.max(.5,Math.min(2,z));$("zoomText").textContent=Math.round(zoom*100)+"%";normalizeWorld()
}
$("zoomIn").onclick=()=>setZoom(zoom+.1);$("zoomOut").onclick=()=>setZoom(zoom-.1);$("zoomReset").onclick=()=>setZoom(1);

function duplicateBlock(b){
    if(!b)return;
    const data=serializeNested(b),def=findDef(b.dataset.type);if(!def)return;
    const copy=createBlock(def);restoreState(copy,data);copy.style.position="absolute";copy.style.left=copy.style.top="20px";copy.dataset.manualPosition="";
    const roots=[...world.children].filter(isRootBlock),i=roots.indexOf(b);
    i>=0&&roots[i+1]?world.insertBefore(copy,roots[i+1]):world.appendChild(copy)
}
function deleteSelected(){
    if(!selected)return;
    selected.remove();selected=null;normalizeWorld();updateEmpty();saveCurrent();refreshCode()
}
document.addEventListener("click",e=>{if(!e.target.closest("#menu"))menu.style.display="none"});
menu.onclick=e=>{
    if(!selected)return;
    if(e.target.dataset.action==="delete")deleteSelected();
    else if(e.target.dataset.action==="duplicate"){duplicateBlock(selected);normalizeWorld();saveCurrent();refreshCode()}
    menu.style.display="none"
};
document.addEventListener("keydown",e=>{
    if(e.key==="Escape"&&isMobileEditor()&&sidebar.classList.contains("open")){closeBlocks();return}
    if(!selected||document.activeElement.closest("input,textarea,select,[contenteditable]"))return;
    if(e.key==="Delete"||e.key==="Backspace"){deleteSelected();return}
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="d"){e.preventDefault();duplicateBlock(selected);normalizeWorld();saveCurrent();refreshCode()}
});

/* ---------- JAVASCRIPT IMPORTER ---------- */
function tokenizeJS(source){
    const tokens=[];let i=0;
    while(i<source.length){
        const c=source[i];
        if(/\s/.test(c)){i++;continue}
        if("\"'`".includes(c)){
            const q=c;let v=q,esc=false;i++;
            while(i<source.length){const ch=source[i];v+=ch;i++;if(esc){esc=false;continue}if(ch==="\\"){esc=true;continue}if(ch===q)break}
            tokens.push({type:"string",value:v});continue
        }
        if(/[A-Za-z_$]/.test(c)){
            let v=c;i++;while(i<source.length&&/[A-Za-z0-9_$]/.test(source[i]))v+=source[i++];tokens.push({type:"identifier",value:v});continue
        }
        if(/[0-9.-]/.test(c)){
            let v=c;i++;while(i<source.length&&/[0-9.eE+-]/.test(source[i]))v+=source[i++];tokens.push({type:"number",value:v});continue
        }
        if("(),;".includes(c)){tokens.push({type:c,value:c});i++;continue}
        tokens.push({type:"symbol",value:c});i++
    }
    return tokens
}
function parseImportedValue(tokens,index){
    const t=tokens[index];if(!t)return[null,index];
    if(t.type==="string"){let value;try{value=JSON.parse(t.value)}catch{value=t.value.slice(1,-1)}return[{kind:"literal",value,valueType:"text"},index+1]}
    if(t.type==="number")return[{kind:"literal",value:t.value,valueType:"number"},index+1];
    if(t.type==="identifier"){
        if(t.value==="true"||t.value==="false")return[{kind:"literal",value:t.value,valueType:"boolean"},index+1];
        if(tokens[index+1]?.type==="(")return parseImportedCall(tokens,index);
        return[{kind:"literal",value:t.value,valueType:"text"},index+1]
    }
    return[{kind:"literal",value:t.value,valueType:"text"},index+1]
}
function parseImportedCall(tokens,index){
    const name=tokens[index]?.value;let i=index+1;if(tokens[i]?.type!=="(")return[null,index+1];i++;
    const args=[];
    while(i<tokens.length&&tokens[i].type!==")"){
        if(tokens[i].type===","||tokens[i].type===";"){i++;continue}
        const r=parseImportedValue(tokens,i);if(!r[0])break;args.push(r[0]);i=r[1];if(tokens[i]?.type===",")i++
    }
    if(tokens[i]?.type===")")i++;return[{kind:"call",fn:name,args},i]
}
function parseImportedProgram(source){
    const tokens=tokenizeJS(source),calls=[];let i=0;
    while(i<tokens.length){
        if(tokens[i].type==="identifier"){
            const r=parseImportedCall(tokens,i);
            if(r[0]){calls.push(r[0]);i=r[1];if(tokens[i]?.type===";")i++;continue}
        }
        i++
    }
    return calls
}
function splitImportedScripts(source){
    const lines=source.replace(/\r\n?/g,"\n").split("\n"),sections=[];let name="Script 1",current=[],quote=null,escaped=false;
    for(const line of lines){
        let comment=-1;
        for(let i=0;i<line.length;i++){
            const c=line[i];
            if(quote){if(escaped){escaped=false;continue}if(c==="\\"){escaped=true;continue}if(c===quote)quote=null;continue}
            if("\"'`".includes(c)){quote=c;continue}
            if(c==="/"&&line[i+1]==="/"){comment=i;break}
        }
        if(comment>=0){
            const code=line.slice(0,comment).trim();if(code)current.push(code);
            if(current.length)sections.push({name,source:current.join("\n")});
            name=line.slice(comment+2).trim()||"Script "+(sections.length+1);current=[]
        }else if(line.trim())current.push(line)
    }
    if(current.length)sections.push({name,source:current.join("\n")});return sections
}
function importedModel(call,omitted,depth=0){
    const def=findDef(call.fn);if(!def){omitted.add(call.fn);return null;}if(depth>300)throw Error('Imported block nesting is too deep.');
    const fields=ZERO_FIELD_BLOCKS.has(call.fn)?[]:(SPECIAL_ROWS[call.fn]||def.slice(3)).filter(Array.isArray);
    if(EVENT_HANDLER_BLOCKS.has(call.fn))fields.push(['text',call.fn==='whenBroadcast'?'Start Menu':'Player1']);
    const data={type:def[0],values:[],slots:[],stacks:{}};
    data.slots=fields.map(([type,value],i)=>{const arg=call.args[i];if(arg?.kind==='call'){const block=importedModel(arg,omitted,depth+1);if(block)return{block};}return{type,value:arg?.kind==='literal'?String(arg.value??''):String(value??'')};});
    const nested=args=>args.filter(arg=>arg.kind==='call').map(arg=>importedModel(arg,omitted,depth+1)).filter(Boolean);
    if(call.fn==='ifBlock'){const ei=call.args.findIndex(arg=>arg.kind==='literal'&&arg.value==='else');data.stacks.main=nested(call.args.slice(1,ei<0?undefined:ei));data.stacks.else=ei<0?[]:nested(call.args.slice(ei+1));}
    else if(['repeat','repeatUntil','whileBlock','forever',...EVENT_HANDLER_BLOCKS].includes(call.fn))data.stacks.main=nested(call.args.slice(fields.length));
    return data;
}
function importJS(source){
    const sections=splitImportedScripts(source);
    if(!sections.length){alert("No code sections were found in this .js file.");return}
    const imported=[],omitted=new Set();
    sections.forEach((section,index)=>{
        const calls=parseImportedProgram(section.source),blocks=[];
        calls.forEach(call=>{const data=importedModel(call,omitted);if(data){data.x=data.y=20;data.manualPosition=false;blocks.push(data)}});
        if(blocks.length)imported.push({name:section.name||"Script "+(index+1),blocks})
    });
    if(!imported.length){alert("No supported code blocks were found in this .js file.");return}
    scripts=imported;activeScript=0;renderScripts();renderWorld();workspace.scrollLeft=workspace.scrollTop=0;refreshCode();if(omitted.size)alert("Unsupported calls were omitted: "+[...omitted].join(", "));
}
$("importJS").onclick=()=>$("importInput").click();
$("importInput").onchange=async e=>{
    const file=e.target.files[0];if(!file)return;
    try{importJS(await file.text())}catch(err){console.error(err);alert("Could not import the JavaScript file.")}e.target.value=""
};

/* ---------- EDITOR SCROLLING ---------- */
workspace.addEventListener("wheel",e=>{
    if(e.shiftKey){workspace.scrollLeft+=e.deltaY;e.preventDefault()}
},{passive:false});
window.addEventListener("resize",()=>{if(!isMobileEditor())closeBlocks();resizeWorld()});

function centerEditor(){workspace.scrollLeft=workspace.scrollTop=0}

let codeRefreshTimer=null,projectSaveTimer=null,projectHistory=[],projectHistoryIndex=-1,restoringProject=true;
const PROJECT_KEY='jscratch-project-v1';
function projectData(){saveCurrent();return{format:'jscratch',version:1,scripts,activeScript,zoom};}
function projectSnapshot(){return JSON.stringify(projectData());}
function projectNotice(text){$('projectStatus').textContent=text;}
function historyControls(){$('undoProject').disabled=projectHistoryIndex<=0;$('redoProject').disabled=projectHistoryIndex>=projectHistory.length-1;}
function recordProject(){if(restoringProject)return;const text=projectSnapshot();if(projectHistory[projectHistoryIndex]!==text){projectHistory.splice(projectHistoryIndex+1);projectHistory.push(text);let bytes=projectHistory.reduce((sum,item)=>sum+item.length,0);while(projectHistory.length>2&&(projectHistory.length>40||bytes>20000000)){bytes-=projectHistory.shift().length;}projectHistoryIndex=projectHistory.length-1;}historyControls();try{localStorage.setItem(PROJECT_KEY,text);projectNotice('Autosaved');}catch{projectNotice('Autosave unavailable — use Save project');}}
function scheduleProjectSave(){if(restoringProject)return;clearTimeout(projectSaveTimer);projectSaveTimer=setTimeout(recordProject,300);}
function restoreProject(project){JScratchProject.validate(project,defs);restoringProject=true;clearTimeout(projectSaveTimer);scripts=project.scripts;activeScript=Math.max(0,Math.min(scripts.length-1,Number(project.activeScript)||0));zoom=Math.max(.5,Math.min(2,Number(project.zoom)||1));renderScripts();renderWorld();$('zoomText').textContent=Math.round(zoom*100)+'%';if(codePanelOpen)$('code').textContent=JScratchProject.generate(scripts,defs,ZERO_FIELD_BLOCKS).code;restoringProject=false;}
$('undoProject').onclick=()=>{clearTimeout(projectSaveTimer);recordProject();if(projectHistoryIndex>0){restoreProject(JSON.parse(projectHistory[--projectHistoryIndex]));historyControls();try{localStorage.setItem(PROJECT_KEY,projectHistory[projectHistoryIndex]);}catch{}projectNotice('Undone');}};
$('redoProject').onclick=()=>{if(projectHistoryIndex<projectHistory.length-1){restoreProject(JSON.parse(projectHistory[++projectHistoryIndex]));historyControls();try{localStorage.setItem(PROJECT_KEY,projectHistory[projectHistoryIndex]);}catch{}projectNotice('Redone');}};
function downloadProjectText(text,name,type){const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
$('saveProject').onclick=()=>{recordProject();downloadProjectText(JSON.stringify(projectData(),null,2),'project.jscratch.json','application/json');};
$('openProject').onclick=()=>$('projectInput').click();
$('projectInput').onchange=async e=>{const file=e.target.files[0];if(file)try{const project=JSON.parse(await file.text());restoreProject(project);recordProject();projectNotice('Project opened');}catch(error){projectNotice(error.message);}e.target.value='';};
document.addEventListener('keydown',event=>{if(event.target.closest('input,textarea,[contenteditable]'))return;if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='z'){event.preventDefault();$(event.shiftKey?'redoProject':'undoProject').click();}});
window.addEventListener('pagehide',()=>{if(!restoringProject)recordProject();});
const runtimeModules=['back-process','canvas','sprite','motion','operator','data','sensing','control','clone','sound','json','ui'];let runtimeLocations=new Map(),debugTimer=null;
function runPreview(){
    const generated=JScratchProject.generate(projectData().scripts,defs,ZERO_FIELD_BLOCKS,{debug:true});runtimeLocations=generated.locations;
    const frame=$('runtimeFrame');frame.contentWindow?.MLGame?.stop();
    const base=new URL('/ml-game/',location.href).href;
    const stage='<canvas id="game-canvas"></canvas>';
    const assets=runtimeModules.map(name=>'<script src="'+new URL('js/'+name+'.js',base).href+'"><'+'/script>').join('');
    const tagging='function __jscratchTag(id,value){if(value&&typeof value==="object")value._editorId=id;return value;}';
    const code=(tagging+'\n'+generated.code).replace(/<\/script/gi,'<\\/script');
    frame.srcdoc='<!doctype html><html><head><base href="'+base+'"><style>html,body{margin:0;overflow:hidden;background:#000}canvas{display:block}</style></head><body>'+stage+assets+'<script>'+code+'<'+'/script></body></html>';
    if(!$('runtimePanel').open)$('runtimePanel').showModal();$('pauseProject').textContent='Pause';
    clearInterval(debugTimer);debugTimer=setInterval(()=>{const api=frame.contentWindow?.MLGame;if(!api)return;const state=api.inspect();$('runtimeDebug').textContent=(state.paused?'Paused':state.running?'Running':'Stopped')+' · '+state.executedBlocks+' blocks executed\n'+JSON.stringify(state.variables,null,2)+(state.errors.length?'\n'+state.errors.map(e=>e.script+': '+e.message).join('\n'):'');const current=api.ENGINE.lastBlock;const source=runtimeLocations.get(current?._editorId);document.querySelectorAll('.runtime-active,.runtime-error').forEach(b=>b.classList.remove('runtime-active','runtime-error'));if(source&&source.scriptIndex===activeScript){const roots=[...world.children].filter(isRootBlock);let b=roots[Number(source.path.split('.')[0])];for(const part of source.path.split('.').slice(1)){const m=part.match(/^(main|else)(\d+)$/);if(m){const stack=b?.querySelector('[data-stack="'+m[1]+'"]');b=stack?[...stack.children].filter(isRootBlock)[Number(m[2])]:null;}}b?.classList.add(state.errors.length?'runtime-error':'runtime-active');}},250);
}
$('runProject').onclick=runPreview;$('restartProject').onclick=runPreview;
$('pauseProject').onclick=()=>{const api=$('runtimeFrame').contentWindow?.MLGame;if(!api)return;if(api.ENGINE.paused){api.resume();$('pauseProject').textContent='Pause';}else{api.pause();$('pauseProject').textContent='Resume';}};
$('stepProject').onclick=()=>{$('runtimeFrame').contentWindow?.MLGame?.step();$('pauseProject').textContent='Resume';};
$('stopProject').onclick=()=>$('runtimeFrame').contentWindow?.MLGame?.stop();
$('closeRuntime').onclick=()=>$('runtimePanel').close();$('runtimePanel').addEventListener('close',()=>{$('runtimeFrame').contentWindow?.MLGame?.stop();clearInterval(debugTimer);});
renderPalette();
newScript();
setZoom(1);
try{const saved=localStorage.getItem(PROJECT_KEY);if(saved)restoreProject(JSON.parse(saved));}catch(error){projectNotice('Saved project could not be opened: '+error.message);}restoringProject=false;recordProject();
requestAnimationFrame(()=>{resizeWorld();centerEditor()});
