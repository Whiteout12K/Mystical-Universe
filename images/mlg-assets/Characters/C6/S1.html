<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Skill Info</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      color: #FFEBEE;
    }

    .icon-container {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .effect-icon {
      flex-shrink: 0;
    }

    .effect-text {
      flex: 1;
    }

    .body-text {
      background-color: #63141462;
      font-size: 9px;
      padding-left: 1em;
      padding-right: 1.5em;
      padding-top: 4em;
      padding-bottom: 4em;
    }

    .level-display {
      margin-top: 15px;
      font-size: 8px;
      color: #FFEBEE;
    }
  </style>
</head>

<body class="body-text">

  <div><b style="font-size:14px;">Special Skill: Reflection Counter</b></div>

  <div style="padding-top:7px"></div>

  <div id="des1" style="padding-top:7px"></div>

  <div id="des2" style="padding-top:7px"></div>

  <div style="padding-top:7px">Cooldown: 15 seconds</div>
  <div>Mana Cost: 200 MP</div>

  <div class="level-display" id="level"></div>

  <script>
    const maxLevel = 10;
    const baseDamage = [5, 5];

    // Read level from ?id=# in URL
    const params = new URLSearchParams(window.location.search);
    let level = parseInt(params.get("id")) || 1; // default = 1
    level = Math.min(maxLevel, Math.max(1, level)); // clamp between 1 and 10

    function updateSkill() {
      const multiplier = 1 + 0.25 * (level - 1);

      document.getElementById("des1").innerHTML =
        `Atlas counters incoming attacks by raising a compressed water wall, dealing the damage that an incoming attack would deal back at the opponents as <b style="color:#80a1da">[Water]</b> damage. This wall will remain even when Atlas is off-field and stays for <b>${(baseDamage[0] * multiplier).toFixed(1)}</b> seconds. AoE attacks will not be completely deflected.`;

      document.getElementById("des2").innerHTML =
        `The repelled attack can crit, in fact, the crit chance and damage increases by <b>+${(baseDamage[1] * multiplier).toFixed(1)}%</b> for every 100 MP depleted from max MP overall (not just from this skill).`;

      document.getElementById("level").textContent = `< Skill Level: ${level} >`;
    }

    updateSkill();
  </script>

</body>

</html>
