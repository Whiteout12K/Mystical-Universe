<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/images/website/favicon.png" type="image/png">
<title>MLG Profile Card Collection</title>

<link href="/css/bootstrap-min.css" rel="stylesheet">
<link rel="stylesheet" href="/css/home.css">
<link rel="stylesheet" href="/css/news.css">
<link rel="stylesheet" href="/css/mlg.css">
<link rel="stylesheet" href="/css/game-hub.css">
<script src="/js/bootstrap-bundle-min.js"></script>

<style>
*{box-sizing:border-box}
:root{--gold:#d6aa45;--gold2:#f0ca69;--text:#f7edd9;--muted:#9e9488;--line:#d6aa453d;background:#190707}
html,body{margin:0;min-height:100%;color:var(--text);font-family:Inter,Arial,sans-serif;background:radial-gradient(circle at 55% 0,#402026,#1a1316 31%,#0b0a0c 75%,#080809)}
body{min-height:100vh}button,input{font:inherit}

/* APP */
.app{height:100vh;display:grid;grid-template-columns:290px 1fr;overflow:hidden}
.sidebar{display:flex;flex-direction:column;min-width:0;z-index:50;background:linear-gradient(#261a1dfb,#0e0d0ffe);border-right:1px solid var(--line);box-shadow:14px 0 38px #0007}
.side-head{flex:0 0 auto;padding:21px 17px 15px;border-bottom:1px solid var(--line)}
.brand{font:900 1.22rem Georgia,serif;color:#f2d18a;letter-spacing:.025em}
.brand small{display:block;margin-top:5px;color:var(--muted);font:700 .63rem Inter,Arial,sans-serif;letter-spacing:.15em;text-transform:uppercase}

.search-wrap{position:relative;margin-top:15px}
.search-wrap:before{content:"⌕";position:absolute;left:11px;top:50%;transform:translateY(-53%);color:#a98c59;font-size:1.3rem}
#card-search{width:100%;padding:10px 11px 10px 34px;outline:0;border:1px solid var(--line);border-radius:7px;background:#100e10;color:#eee}
#card-search:focus{border-color:#b89049;box-shadow:0 0 0 2px #d6aa451f}

.library-meta{display:flex;justify-content:space-between;margin-top:10px;color:#968c80;font-size:.65rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase}

/* CARD LIBRARY - 12 VISIBLE THEN SCROLL */
.card-list{
 --item-h:54px;
 --gap:5px;
 flex:0 1 auto;
 display:flex;
 flex-direction:column;
 gap:var(--gap);
 width:100%;
 max-height:calc(var(--item-h) * 12 + var(--gap) * 11 + 18px);
 min-height:0;
 padding:9px;
 overflow-x:hidden;
 overflow-y:auto;
 overscroll-behavior:contain;
 scrollbar-width:thin;
 scrollbar-color:#594438 transparent
}
.card-list::-webkit-scrollbar{width:6px}
.card-list::-webkit-scrollbar-track{background:transparent}
.card-list::-webkit-scrollbar-thumb{background:#594438;border-radius:20px}
.card-list::-webkit-scrollbar-thumb:hover{background:#806248}

/* NO CARD IMAGES */
.card-item{
 flex:0 0 var(--item-h);
 width:100%;min-width:0;height:var(--item-h);
 display:flex;align-items:center;justify-content:space-between;
 gap:10px;padding:8px 9px 8px 11px;
 border:1px solid transparent;border-radius:6px;
 background:#ffffff05;color:#e8dfd4;
 text-align:left;cursor:pointer;transition:.16s
}
.card-item:hover{background:#211b1d;border-color:#d6aa452e;transform:translateX(2px)}
.card-item.active{background:linear-gradient(90deg,#70322d6b,#382a242b);border-color:#d6aa457a;box-shadow:inset 3px 0 var(--gold)}

.list-info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.list-name{overflow:hidden;color:#eee5d9;font:700 .8rem Georgia,serif;text-overflow:ellipsis;white-space:nowrap}
.list-meta{margin-top:4px;overflow:hidden;color:#91877a;font-size:.57rem;font-weight:600;letter-spacing:.015em;text-overflow:ellipsis;white-space:nowrap}

.list-rarity{
 flex:0 0 auto;
 min-width:32px;padding:3px 5px;
 border:1px solid #44392a;border-radius:3px;
 background:#0b0a0c;
 font-size:.55rem;font-weight:1000;
 text-align:center
}
.no-results{padding:30px 10px;color:#81786e;text-align:center;font-size:.76rem}

/* MAIN */
.main{position:relative;overflow:auto}
.main:before{content:"";position:fixed;inset:0 0 0 290px;pointer-events:none;opacity:.025;background-image:linear-gradient(45deg,#fff 1px,transparent 1px),linear-gradient(-45deg,#fff 1px,transparent 1px);background-size:20px 20px}
.stage{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px}
.topbar{width:min(500px,100%);display:flex;align-items:center;justify-content:space-between;margin-bottom:15px;color:#aaa095;font-size:.69rem}
.nav-controls{display:flex;gap:6px}
.icon-btn{width:34px;height:34px;padding:0;border:1px solid var(--line);border-radius:7px;background:#171316d9;color:#d9bd82;cursor:pointer;transition:.15s}
.icon-btn:hover{background:#292023;border-color:#a98849}
.icon-btn:disabled{opacity:.25;cursor:default}
.mobile-menu{display:none}

/* CARD */
.card-shell{position:relative;width:min(430px,88vw);filter:drop-shadow(0 28px 33px #0009)}
.card-shell:before{content:"";position:absolute;inset:-8px;z-index:-2;border-radius:28px;background:linear-gradient(145deg,#65615e,#181617 24%,#a7894c 48%,#191718 73%,#595450);box-shadow:0 0 0 2px #060607,0 0 30px #d2a54a21}
.card-shell:after{content:"";position:absolute;inset:-4px;z-index:-1;border:1px solid #ffffff29;border-radius:25px;pointer-events:none}
.tcg-card{position:relative;width:100%;aspect-ratio:5/7;overflow:hidden;isolation:isolate;border:2px solid #ffffff29;border-radius:21px;background:#111;box-shadow:inset 0 0 0 2px #0008,inset 0 0 30px #0006}
.card-art{position:absolute;inset:0;z-index:-8;width:100%;height:100%;object-fit:cover;filter:blur(.5px)}
.art-shade{position:absolute;inset:0;z-index:-7;pointer-events:none;background:linear-gradient(#0003,transparent 23%,transparent 59%,#0000001a 72%,#040304a6),linear-gradient(90deg,#0003,transparent 13% 87%,#0003)}
.card-pattern{position:absolute;inset:0;z-index:-6;opacity:.09;pointer-events:none;background:repeating-linear-gradient(127deg,transparent 0 36px,#fff3 37px,transparent 38px 74px)}
.inner-frame{position:absolute;inset:9px;z-index:20;border:1px solid #fff3;border-radius:14px;pointer-events:none}
.corner{position:absolute;z-index:21;width:45px;height:45px;pointer-events:none}
.corner.tl{left:9px;top:9px;border-left:2px solid #f0ca69b3;border-top:2px solid #f0ca69b3;border-radius:12px 0 0}
.corner.br{right:9px;bottom:9px;border-right:2px solid #f0ca69b3;border-bottom:2px solid #f0ca69b3;border-radius:0 0 12px}

/* RARITY */
.tcg-card.card-c{box-shadow:inset 0 0 23px #49494966}
.tcg-card.card-un{box-shadow:inset 0 0 23px #6aa84f66}
.tcg-card.card-r{box-shadow:inset 0 0 23px #0000ff55}
.tcg-card.card-sr{box-shadow:inset 0 0 25px #9900ff66}
.tcg-card.card-ssr{box-shadow:inset 0 0 27px #ff99006b}
.tcg-card.card-ur{box-shadow:inset 0 0 27px #ff00006b}
.tcg-card.card-lr{box-shadow:inset 0 0 27px #d5a6bd70}

/* STATS */
.stats{position:absolute;left:20px;top:18px;z-index:18;display:flex;align-items:flex-start;gap:17px;pointer-events:none}
.stat{--c:#fff;min-width:25px;display:flex;flex-direction:column;align-items:center;text-align:center;transform:skew(-3deg)}
.stat.hp{--c:#84d56e}.stat.attack{--c:#ff526c}.stat.intelligence{--c:#52b8ff}
.stat-label{display:block;margin:0 0 1px;color:#fff;font-size:.45rem;font-weight:1000;font-style:italic;letter-spacing:.08em;line-height:1;text-transform:uppercase;text-shadow:0 1px 2px #000,0 0 3px #000,0 0 5px var(--c)}
.stat-value{display:block;color:#fff;font-family:Arial Black,Impact,Inter,sans-serif;font-size:1.8rem;font-weight:1000;letter-spacing:-.08em;line-height:.88;-webkit-text-stroke:.3px #fff;text-shadow:0 2px 2px #000d,0 0 3px #000,0 0 6px var(--c),0 0 10px color-mix(in srgb,var(--c) 70%,transparent)}

/* ROLE */
.card-role{position:absolute;top:16px;right:17px;z-index:18;width:57px;height:57px;object-fit:contain;filter:drop-shadow(0 3px 4px #0004) drop-shadow(0 0 5px #0005);pointer-events:none}
.card-role[src=""]{display:none}

/* INFO */
.card-info{position:absolute;left:17px;right:17px;bottom:70px;z-index:10;padding:6px 10px 7px;border-left:3px solid #8b3e3e;border-radius:2px;background:linear-gradient(110deg,#f9f8f866,#ffffff6e);color:#1c1816;font-size:.7rem;line-height:1.27;box-shadow:0 5px 18px #0006;backdrop-filter:blur(1px);text-shadow:0 0 20px #f7f3f3bd}
.card-info:before{content:"";position:absolute;inset:0;opacity:.05;pointer-events:none}
.additional{position:relative}
.box,.box1,.box2{display:inline-block;margin-right:3px;padding:2px 5px;border-radius:2px;color:#ffffffe3;font-size:.55rem;font-weight:1000;line-height:1.15}
.box1{background:#272326}.box2{background:#6b5640}.keyword{font-weight:1000}
.flavor{display:block;padding-top:3px;border-top:1px solid #0003;color:#2a2a2a;font-size:.61rem;font-style:italic}

/* BOTTOM */
.bottom-panel{position:absolute;left:0;right:0;bottom:0;z-index:6;height:72px;clip-path:polygon(0 13%,100% 0,100% 100%,0 100%)}
.bottom-panel:before{content:"";position:absolute;inset:0;opacity:.12;background:repeating-linear-gradient(140deg,transparent 0 28px,#ffffff8c 29px,transparent 30px 58px)}
.bottom-panel:after{content:"";position:absolute;left:0;right:0;top:9px;height:1px;background:#ffffff59}
.card-category{position:absolute;right:18px;bottom:52px;z-index:12;padding:2px 11px 2px 14px;clip-path:polygon(8% 0,100% 0,92% 100%,0 100%);background:#473131;color:#fff;font-size:.48rem;font-style:italic;font-weight:1000;letter-spacing:.06em}
.card-name{position:absolute;left:19px;bottom:27px;z-index:10;max-width:73%;overflow:hidden;color:#fff;font:900 1.48rem Georgia,serif;letter-spacing:.005em;text-overflow:ellipsis;text-shadow:0 2px 3px #0006,0 0 7px #0006;white-space:nowrap;line-height:1}
.card-subtype{position:absolute;left:20px;bottom:14px;z-index:10;max-width:67%;overflow:hidden;color:#eeeeeea3;font-size:.45rem;font-weight:800;line-height:1.1;text-overflow:ellipsis;text-shadow:0 1px 3px #0007;white-space:nowrap}
.card-subtype .box{margin:0 1px;padding:1px 3px;font-size:.43rem;vertical-align:middle}
.card-id{position:absolute;right:59px;bottom:13px;z-index:10;color:#eee;font-size:.48rem;font-weight:900;text-shadow:0 1px 2px #000}
.card-rarity{position:absolute;right:18px;bottom:9px;z-index:12;min-width:34px;height:20px;display:grid;place-items:center;padding:0 5px;font-size:.5rem;font-weight:1000}

/* COPYRIGHT + SAMPLE */
.card-legal{position:absolute;right:3px;top:50%;z-index:22;transform:translateY(-50%) rotate(180deg);writing-mode:vertical-rl;color:#ffffff57;font-size:.31rem;font-weight:700;letter-spacing:.07em;text-shadow:0 1px 2px #0005;white-space:nowrap;pointer-events:none}
.sample{position:absolute;inset:0;z-index:40;display:none;place-items:center;pointer-events:none;color:#ffffff6b;font-size:4rem;font-weight:300;letter-spacing:.08em;text-shadow:0 2px 5px #0005;transform:rotate(-4deg)}
.tcg-card[data-sample="true"] .sample{display:grid}
.card-caption{width:min(500px,100%);margin-top:20px;color:#81786f;font-size:.67rem;text-align:center}
.card-caption strong{color:#bda370}
.error{margin:auto;padding:25px;border:1px solid #834249;border-radius:9px;background:#32191d;text-align:center}
.overlay{display:none}

/* MOBILE */
@media(max-width:800px){
 .app{display:block;height:100vh}
 .main{height:100vh}.main:before{inset:0}

 .sidebar{
  position:fixed!important;top:0!important;bottom:0!important;left:0!important;
  width:min(310px,86vw);height:100dvh;z-index:2147483647!important;
  transform:translateX(-105%);transition:transform .24s ease;
  box-shadow:18px 0 40px #000c
 }
 .sidebar.open{transform:translateX(0)!important}

 .overlay{
  position:fixed!important;inset:0!important;z-index:2147483646!important;
  display:block;pointer-events:none;background:#000a;opacity:0;transition:opacity .2s
 }
 .overlay.show{pointer-events:auto;opacity:1}

 /* Keep 12-card design but never exceed available mobile height */
 .card-list{
  flex:0 1 auto;
  max-height:min(
   calc(var(--item-h) * 12 + var(--gap) * 11 + 18px),
   calc(100dvh - 150px)
  )
 }

 .mobile-menu{display:block}
 .stage{justify-content:flex-start;padding:18px 14px 25px}
 .card-shell{width:min(420px,88vw)}
}

@media(max-width:460px){
 .card-list{--item-h:52px}
 .card-item{padding:7px 8px 7px 10px}
 .list-name{font-size:.76rem}.list-meta{font-size:.54rem}

 .stats{left:16px;top:15px;gap:11px}
 .stat{min-width:39px}.stat-label{font-size:.43rem}.stat-value{font-size:2.05rem}
 .card-role{top:14px;right:15px;width:49px;height:49px}
 .card-info{left:15px;right:15px;bottom:65px;padding:6px 8px;font-size:.61rem}
 .bottom-panel{height:66px}.card-category{bottom:48px}
 .card-name{bottom:25px;font-size:1.3rem}.card-subtype{bottom:13px;font-size:.4rem}
 .card-id{bottom:12px}.card-rarity{bottom:8px}
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar" id="sidebar">
 <div class="side-head">
  <div class="brand">Mystical Legends<small>Trading Card Archive</small></div>
  <div class="search-wrap">
   <input id="card-search" type="search" placeholder="Search cards..." autocomplete="off">
  </div>
  <div class="library-meta">
   <span>Card Library</span>
   <span id="card-count">0 cards</span>
  </div>
 </div>

 <div class="card-list" id="card-list"></div>
</aside>

<div class="overlay" id="overlay"></div>

<main class="main">
<div class="stage">

 <div class="topbar">
  <button class="icon-btn mobile-menu" id="menu-btn">☰</button>
  <span id="current-position">Card 1 / 1</span>
  <div class="nav-controls">
   <button class="icon-btn" id="prev-btn">‹</button>
   <button class="icon-btn" id="next-btn">›</button>
  </div>
 </div>

 <div class="card-shell">
  <article class="tcg-card" id="card">

   <img class="card-art" id="card-art" alt="">
   <div class="art-shade"></div>
   <div class="card-pattern"></div>
   <div class="inner-frame"></div>
   <div class="corner tl"></div>
   <div class="corner br"></div>

   <div class="stats">
    <div class="stat hp">
     <span class="stat-label" id="hp-label">HP</span>
     <span class="stat-value" id="hp">0</span>
    </div>
    <div class="stat attack">
     <span class="stat-label" id="attack-label">ATK</span>
     <span class="stat-value" id="attack">0</span>
    </div>
    <div class="stat intelligence">
     <span class="stat-label" id="intelligence-label">INT</span>
     <span class="stat-value" id="intelligence">0</span>
    </div>
   </div>

   <img class="card-role" id="card-role" alt="Role">

   <div class="card-info" id="card-info"></div>
   <div class="bottom-panel" id="bottom-panel"></div>
   <div class="card-category" id="category"></div>
   <div class="card-name" id="name"></div>
   <div class="card-subtype" id="subtype"></div>
   <div class="card-id" id="card-id"></div>
   <div class="card-rarity" id="rarity"></div>

   <div class="card-legal">
    Mystical Legends © <span id="copyright-year"></span> · All Rights Reserved
   </div>

   <div class="sample">SAMPLE</div>
  </article>
 </div>

 <div class="card-caption">
  <strong id="caption-name"></strong>
  <span id="caption-detail"></span>
 </div>

</div>
</main>
</div>

<script>
const CARD_FILE="tcg-cards.json",$=id=>document.getElementById(id);
let db={},cardIds=[],filteredIds=[],activeId="";

async function loadCards(){
 try{
  const r=await fetch(CARD_FILE);
  if(!r.ok)throw Error(`Could not load ${CARD_FILE} (${r.status})`);

  db=await r.json();
  cardIds=Object.keys(db.cards||{});
  if(!cardIds.length)throw Error("No cards found.");

  const q=new URLSearchParams(location.search).get("id");
  activeId=db.cards?.[q]?q:db.cards?.[db.default_card]?db.default_card:cardIds[0];

  filteredIds=[...cardIds];
  renderLibrary();
  selectCard(activeId,false);
 }catch(e){
  console.error(e);
  document.querySelector(".app").innerHTML=
   `<div class="error"><h2>Unable to load cards</h2><div>${esc(e.message)}</div></div>`;
 }
}

function renderLibrary(){
 const q=$("card-search").value.trim().toLowerCase();

 filteredIds=cardIds.filter(id=>{
  const c=db.cards[id];
  return[
   id,c.name,c.card_number,c.rarity,c.category,
   strip(normalizeClasses(c.subtype||"")),c.role
  ].join(" ").toLowerCase().includes(q);
 });

 $("card-count").textContent=`${filteredIds.length} card${filteredIds.length===1?"":"s"}`;

 $("card-list").innerHTML=filteredIds.length?filteredIds.map(id=>{
  const c=db.cards[id],r=getRarity(c.rarity);

  /* Text only: name + details + rarity */
  return `<button class="card-item ${id===activeId?"active":""}" data-id="${esc(id)}">
   <span class="list-info">
    <span class="list-name">${esc(strip(c.name||id))}</span>
    <span class="list-meta">${esc(c.card_number||id)} · ${esc(strip(c.category||"Card"))}</span>
   </span>
   <span class="list-rarity ${r}">${esc(c.rarity||"")}</span>
  </button>`;
 }).join(""):'<div class="no-results">No matching cards found.</div>';

 document.querySelectorAll(".card-item").forEach(b=>
  b.onclick=()=>selectCard(b.dataset.id)
 );
}

function selectCard(id,url=true){
 const c=db.cards?.[id];
 if(!c)return;

 activeId=id;
 renderCard(c);
 renderLibrary();
 updateNavigation();

 document.querySelector(".card-item.active")?.scrollIntoView({block:"nearest"});

 if(url){
  const u=new URL(location.href);
  u.searchParams.set("id",id);
  history.replaceState(null,"",u);
 }

 closeSidebar();
}

function renderCard(c){
 const r=getRarity(c.rarity),card=$("card");

 card.className=`tcg-card card-${r}`;
 card.dataset.sample=String(c.sample??false);

 $("card-art").src=c.art||"";
 $("card-art").alt=strip(c.name||"Card");
 $("card-art").style.objectPosition=c.design?.art_position||"center";

 setStat("hp",c.stats?.hp??0,c.labels?.hp||"HP");
 setStat("attack",c.stats?.attack??c.stats?.damage??0,c.labels?.attack||c.labels?.damage||"ATK");
 setStat("intelligence",c.stats?.intelligence??0,c.labels?.intelligence||"INT");

 const role=$("card-role");
 role.src=c.role||"";
 role.style.display=c.role?"block":"none";

 const bottom=$("bottom-panel");
 removePrefix(bottom,"name-");
 if(["c","r","sr","ssr","ur"].includes(r))bottom.classList.add(`name-${r}`);

 $("name").innerHTML=normalizeClasses(c.name||"");
 $("subtype").innerHTML=normalizeClasses(c.subtype||"");
 $("card-id").textContent=c.card_number||"";
 $("category").innerHTML=normalizeClasses(c.category||"");

 const rb=$("rarity");
 rb.className=`card-rarity ${r}`;
 rb.textContent=c.rarity||"";

 renderAdditional(c.additional||[]);

 $("caption-name").textContent=strip(c.name||"");
 $("caption-detail").textContent=` — ${c.card_number||""} · ${c.rarity||""}`;
 document.title=`${strip(c.name||"Card")} | Mystical Legends TCG`;
}

function setStat(k,v,l){
 $(k).textContent=v;
 $(`${k}-label`).textContent=l;
}

function normalizeClasses(h=""){
 return String(h).replace(
  /class=(["'])(.*?)\1/gi,
  (_,q,c)=>`class=${q}${c.trim().split(/[;\s]+/).filter(Boolean).join(" ")}${q}`
 );
}

function renderAdditional(a){
 $("card-info").innerHTML=a.map(x=>{
  const s=buildStyle(x.style||{});
  return `<div class="additional"${s?` style="${s}"`:""}>${normalizeClasses(x.text||"")}</div>`;
 }).join("");
}

function buildStyle(s){
 const r=[];

 ["fontSize","paddingTop","paddingBottom","paddingLeft","paddingRight",
  "marginTop","marginBottom","marginLeft","marginRight","letterSpacing"]
 .forEach(k=>addSize(r,cssName(k),s[k]));

 ["fontWeight","fontStyle","textAlign","lineHeight","color","opacity"]
 .forEach(k=>addRaw(r,cssName(k),s[k]));

 return r.join(";");
}

function cssName(k){return k.replace(/[A-Z]/g,m=>"-"+m.toLowerCase())}
function addSize(o,p,v){if(v!==undefined&&v!==null&&v!=="")o.push(`${p}:${typeof v==="number"?v+"px":v}`)}
function addRaw(o,p,v){if(v!==undefined&&v!==null&&v!=="")o.push(`${p}:${v}`)}

function getRarity(v=""){
 v=String(v).trim().toLowerCase();
 return["c","un","r","sr","ssr","ur","lr"].includes(v)?v:"c";
}

function removePrefix(el,p){
 [...el.classList].forEach(c=>c.startsWith(p)&&el.classList.remove(c));
}

function updateNavigation(){
 const i=cardIds.indexOf(activeId);
 $("current-position").textContent=`Card ${i+1} / ${cardIds.length}`;
 $("prev-btn").disabled=i<=0;
 $("next-btn").disabled=i>=cardIds.length-1;
}

function navigate(d){
 const i=cardIds.indexOf(activeId)+d;
 if(i>=0&&i<cardIds.length)selectCard(cardIds[i]);
}

function openSidebar(){
 $("sidebar").classList.add("open");
 $("overlay").classList.add("show");
 document.body.classList.add("library-open");
}

function closeSidebar(){
 $("sidebar").classList.remove("open");
 $("overlay").classList.remove("show");
 document.body.classList.remove("library-open");
}

function strip(h){
 const e=document.createElement("div");
 e.innerHTML=normalizeClasses(h);
 return e.textContent||"";
}

function esc(v){
 return String(v??"")
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");
}

$("copyright-year").textContent=new Date().getFullYear();
$("card-search").addEventListener("input",renderLibrary);
$("prev-btn").onclick=()=>navigate(-1);
$("next-btn").onclick=()=>navigate(1);
$("menu-btn").onclick=openSidebar;
$("overlay").onclick=closeSidebar;

document.addEventListener("keydown",e=>{
 if(document.activeElement===$("card-search"))return;
 if(e.key==="ArrowLeft")navigate(-1);
 if(e.key==="ArrowRight")navigate(1);
 if(e.key==="Escape")closeSidebar();
});

loadCards();
</script>

</body>
</html>
