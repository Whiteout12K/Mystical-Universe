'''Kiara Clio Katzol''', commonly known as '''Kiara Katzol''', is a [[fandom:Felior|Felior]] and a member of the [[mystical_legends|Mystical Legends]]. She attends [[fandom:Regnum Academy|Regnum Academy]] and belongs to the [[fandom:Black Rampart|Black Rampart]] Cohort under [[char/carla_storm|Carla Storm]]. A lightning user known for her speed and feline mannerisms, she combines close-range attacks with an ancient artifact and a contract with the deity [[fandom:Zekron|Zekron]].

Kiara is an outspoken opponent of discrimination against demihumans. Her involvement in the resistance in [[fandom:Lux Urbis|Lux Urbis]] helps bring about changes to the academy's admissions system. After enrolling, she becomes friends with [[char/avery_obtainia|Avery Obtainia]] and his companions, though prejudice among the student body continues to threaten her safety.

|tab=Overview

== Appearance ==

Kiara is a short young woman with silver-light purple hair, aquamarine violet eyes, cat ears, and a tail matching the color of her hair. Her ears stand above the sides of her head, while her tail is often visible beneath her skirt. Her expressions and movements frequently resemble those of a cat, particularly when she becomes excited or irritated.

When she arrives at Regnum Academy, Kiara wears a white T-shirt, a blue jacket, and a knee-length brown skirt. At the Winter's Dance, she wears a white blouse with a reflective, translucent skirt. She also wears a bracelet that is the condensed form of an ancient artifact.

== Personality ==

Kiara is lively, playful, and eager to make friends. She frequently incorporates feline puns into her speech, greets others with variations of “meow,” and punctuates her reactions with purring, hissing, or paw-like gestures. Her enthusiasm is particularly apparent when she meets other demihumans at Regnum; she quickly approaches River and Jane, admires their clothes, and asks whether the academy has a cat club.

Her outgoing manner can make her intrusive. Fascinated by [[char/river_grantia|River]]'s fox ears and tail, Kiara initially fails to anticipate how uncomfortable her curiosity makes the quieter girl. Nevertheless, her eagerness comes from a desire for companionship rather than hostility. Finding acceptance among Avery's friends helps her settle into a school where demihumans remain a minority.

Kiara is quick to answer insults and refuses to treat her demihuman features as something shameful. When hostile students threaten her and River, she supports Avery's decision to challenge their prejudice and wishes she could fight alongside him. Her cheerfulness does not prevent her from recognizing danger or acting decisively: during the attempted abduction, she escapes her restraints, incapacitates opponents, and seeks help rather than remaining trapped in a fight against a stronger adversary.

She also enjoys teasing her friends. Her arguments with [[char/teddric_tech|Ted]] range from his academic habits to their competing interests in fantasy and science fiction. With [[char/lux_luces|Lux]], her playfulness develops into a more personal friendship built on their shared circumstances and mutual interest in ancient artifacts.

== Background and Affiliations ==

Kiara comes from District 10 and has known [[char/raymond_valoris|Raymond Valoris]] and Alana since childhood. Her experiences of noble hostility contribute to her opposition to the treatment of demihumans. After escaping captivity with the help of friends, she becomes involved in the resistance at Lux Urbis.

She later enrolls at Regnum Academy, where she shares Class 1A with Avery, Ted, River, and Raymond. Within Black Rampart, her fellow members include [[char/jane_tee|Jane Tee]] and Raymond, with Carla Storm serving as Centurion. She also joins the Mystical Legends.

== Mystical Rank and Divine Connections ==

Kiara is '''Tier 3, Level 2''' during I.T.E.R. Chronicles. Her lightning-enhanced movement makes speed one of her principal advantages, allowing her to evade opponents whose physical strength exceeds her own.

She has a deity contract with '''Zekron''', the Skylander, Storm Mage, and Lightcrown God. His affinity is Power Magic.

{{Spoiler|By Interlude I, Kiara reaches '''Tier 6, Level 1–Level 2'''. Her later divine identity is the '''Goddess of Death''', associated with Wind among the Gods of the Prime Elements. She and Raymond are also connected to the future rule of District 10.}}

== Tools and Equipment ==

=== Seal Ring Bracelet ===

Kiara obtains her bracelet at a bidding event and finds that it resonates only with her. The artifact can take a condensed bracelet form and possesses a pocket space capable of storing materials. Lux recognizes its nature after sensing the ominous aura around it and compares it with her own amulet and Avery's Rune of the Spellcaster.

Kiara does not initially understand the full significance of owning a Seal Ring. Her conversation with Lux gives her a clearer understanding of the rare artifact in her possession.

=== Gathering Sickle ===

Kiara wields a sickle in combat. During the attempted abduction at Regnum, she cuts her way out of the sack in which she has been confined and confronts her captors with the weapon drawn.

{{Spoiler|The '''Gathering Sickle''' is associated with the '''Funeral Ring of Death'''. Its space-cutting power is connected with Severance.}}

== Familiar ==

Kiara's familiar is a lightning tiger she calls '''Derpy Tiger'''. During the summoning ritual supervised by Professor Taskah, yellow mana gathers before the tiger emerges from the circle. The animal approaches her as its owner and follows her back to the other students.

The tiger is roughly the size of a small lion. Its usual orange-and-dark striped coat briefly changes to blue and black when a pulse of electricity moves through its body.

== Trivia ==

* Kiara's associated animal is the cat, and her associated fruit is pineapple.
* Aspects of her character are inspired by Durin and Venti from ''Genshin Impact'', and Rimuru Tempest from ''That Time I Got Reincarnated as a Slime''.
* She refers to Avery as “Mr. Angelor” during their early conversations.
* Her interest in a cat club contrasts with the academy's limited range of cultural clubs.

== Synopsis ==

=== Childhood ===

Kiara grows up in District 10 and forms a close friendship with Raymond Valoris and Alana. Raymond first meets them while accompanying his family on a diplomatic visit. The three support one another despite the hostility surrounding demihumans.

Prince Aether and other noble children repeatedly target the group. Their insults escalate into violence, leaving Kiara and her friends injured. Raymond's mother intervenes and condemns the attackers rather than siding with them because of their noble status. The incident deepens Kiara's resentment of the nobility and establishes her long-standing hostility toward Aether.

=== Demihuman Resistance ===

After escaping captivity with the assistance of friends, Kiara takes a leading role in the demihuman resistance. During the conflict at the gates of Lux Urbis, she is reunited with Raymond, who has spent years searching for her.

The pair seek help from Alana, who has moved to the city. While Raymond returns to assist the demihumans, Kiara confronts Alana's decision to side with the nobles. Their disagreement becomes a fight, and Kiara severs their friendship. Raymond continues to support the resistance, strengthening the bond between him and Kiara.

Kiara's contribution helps prevent the conflict from escalating into a war with greater casualties. In its aftermath, Lux Urbis reforms admissions so that applicants can be considered regardless of species, opening the way for her enrollment at Regnum.

=== Arrival at Regnum Academy ===

Charlotte Levy introduces Kiara and [[fandom:Imo Lordius|Imo Lordius]] to Avery's group as incoming transfer students. Kiara responds enthusiastically to her new companions and is particularly pleased to meet River, another demihuman. The group shows the newcomers the campus, including its dormitories, classrooms, lake, and stadium. Kiara and Imo are assigned to Quad 43, next to Avery's quad.

Their welcome is interrupted by Lukas Gallery and other students who object to demihumans attending the academy. Avery defends Kiara and River and accepts a duel to challenge the nobles' prejudice. Kiara supports him, though she warns that the opposing cohort captain is considerably stronger than he is.

=== Attempted Abduction ===

While Avery's duel draws attention to the arena, hostile students abduct Kiara and confine her in a sack. Ted notices suspicious activity outside the venue and confronts Lukas Gallery and his companions. During the ensuing struggle, Kiara cuts through the sack with her sickle and frees herself.

When Josh Hake blocks their escape, Kiara uses '''Feline Fury''' to strike down two of the assailants and rush past him. Her speed allows her to avoid a direct contest with his superior physical strength. She then encounters Professor Taskah and asks for help.

Kiara and Ted return to the arena as witnesses to the plot. Their testimony exposes the attempted murder, while the principal uses the confrontation to address the academy's treatment of demihumans and commoners. Afterwards, Kiara joins the gathering in Avery's quad to support him.

=== Meeting the Nuntios ===

Kiara approaches the Nuntios during their stay at Regnum. Jay's teasing earns him a punch, while Lux asks about her adjustment to school and whether she has encountered further bullying.

Lux notices the aura around Kiara's bracelet. Kiara explains that she acquired it at a bidding event and that it appears to resonate only with her. Lux identifies it as a Seal Ring and shows her own pendant in comparison. Kiara realizes that Avery's halo-like rune belongs to the same class of artifacts. The conversation begins a friendship between the two girls.

At the Winter's Dance, Kiara attends in a white blouse and reflective skirt with a first-year noble as her partner.

=== Familiar Contract ===

During a familiar-summoning exercise, Kiara offers her blood to the ritual circle. A large lightning tiger emerges from the gathering yellow mana and approaches her. She accepts the creature enthusiastically, calling it Derpy Tiger, and returns to the group with the animal following her.

=== Divine Captivity ===

{{Spoiler|Kiara and Avery are captured by a group attempting to draw out the deities connected to them. The captors seek divine power for a ritual tied to the shadow energy of District 1. Avery's unusual bond with Lynnhera prevents an ordinary extraction, leading the group to pursue his catalyst instead.}}

=== Shadow Dwelling ===

{{Spoiler|When Prince Aether becomes engaged to Lux, Kiara's childhood enemy returns as a threat to someone she has come to care about. Her friendship with Lux deepens during this period, and Lux helps her recognize her feelings for Raymond. Kiara and Raymond become a couple.}}

{{Spoiler|Kiara, Raymond, and Avery investigate Aether's activities and uncover evidence of his plan to seize District 12. After defeating the men sent to intercept them, they hurry to the wedding, where Aether's attack kills Lux's mother. Kiara joins Avery, Raymond, and Lux in pursuing him. Their combined efforts are insufficient to overcome his strength, but Lumen arrives and defeats him, allowing Aether to be captured.}}

|tab=Powers & Abilities

== Powers & Abilities ==

Kiara's fighting style emphasizes lightning-enhanced speed, rapid attacks, and evasive movement. Her Felior agility and use of a sickle allow her to strike at close range without relying on a prolonged contest of physical strength. Alongside her elemental abilities, she practices Sage Magic, alchemy, and ki.

== Lightning Magic / Electrokinesis ==

Kiara channels yellow lightning through her attacks and movement. During her escape from the attempted abduction, she closes the distance to two opponents almost instantly, knocks them down, and passes Josh Hake before he can stop her. Her speed is a tactical advantage even against opponents who can withstand stronger physical blows.

=== Feline Fury ===

'''Feline Fury''' is a lightning technique combining a cat-like stance with an explosive forward rush. Kiara uses it to attack in quick succession and reposition before an opponent can respond. Its use against her captors demonstrates her ability to disable multiple targets while avoiding a slower, stronger fighter.

== Felior Characteristics ==

As a Felior, Kiara has cat ears, a tail, and feline mannerisms. Her species is associated with agility, maneuverability, flexibility, and speed-enhancing magic. Kiara applies these traits through low stances, sudden lunges, and rapid changes of position.

Her senses are also keen. She recognizes familiar voices while moving at speed and identifies River's concealed demihuman characteristics when they first meet.

== Sage Magic, Alchemy, and Ki ==

Kiara's disciplines include [[fandom:Sage|Sage Magic]] and [[fandom:Alchemy|alchemy]]. She also uses [[fandom:Awareness Ki|Awareness Ki]] and [[fandom:Empowerment Ki|Empowerment Ki]], complementing her elemental magic and physical combat skills.

== Regnum Spei ==

Kiara's Regnum Spei includes '''Contamination''', '''Electro-Charged''', and '''Dark Lightning'''. Her later development adds divine blessings, spatial abilities, and powers connected to the soul.

=== Divine Blessings ===

{{Spoiler|'''Shadow Clones''' is associated with Artiana's blessing, while '''Space Phasing''' is associated with Mercemes' blessing. Hadestias' blessing grants '''Severance''', a space-tearing ability. '''Energy Condensation''' is associated with Son Adoli's blessing.}}

=== Soul Abilities ===

{{Spoiler|Kiara gains '''Soul Magic''' by absorbing it from Hadestias' catalyst. '''Soul Corridor''' is also among her Regnum Spei, forming part of her later soul-related abilities.}}

=== God Slayer Transformation ===

{{Spoiler|'''God Slayer Transformation''' is one of Kiara's later transformations, alongside her development into the Goddess of Death.}}

== Artifact Use ==

Kiara can wield her sickle at close range and use its edge to free herself from confinement. Her Seal Ring bracelet resonates with her and can hold materials in a pocket space. Its condensed form allows her to carry an ancient artifact without keeping its larger manifestation exposed.

{{Spoiler|The Gathering Sickle's association with the Funeral Ring of Death links her weapon to the spatial cutting of Severance.}}

== Familiar ==

Derpy Tiger is a lightning-aligned familiar bound to Kiara through a summoning ritual. It recognizes her as its owner and displays electrical energy capable of briefly changing the appearance of its coat.

== Mystical Legends: Game ==

Kiara's playable incarnation emphasizes rapid close-range attacks and elemental infusion. Its Wind damage classification and separate Lightning conversion are gameplay properties; her lightning remains central to her identity as a spellcaster.

* '''Feline Fury:''' A sequence of lightning-claw swipes, a pouncing strike, and a spinning claw attack.
* '''Lightning God Mode:''' Infuses her attacks with yellow lightning, increases attack speed, and releases shockwaves as its power meter is consumed.
* '''Lynx Prowl:''' Places Kiara in the Golden Flash state, increasing speed and skill damage and allowing her to phase forward before attacking. Repeated use reduces her health and defense.
* '''Electrostasis Pulse:''' Releases gathered lightning around Kiara in a wide-area attack.
* '''Lightning Discharge:''' Converts qualifying lightning-based attacks to Lightning Element damage, weakens defenses and barriers, and interacts with Water through Charged effects.
* '''Contamination:''' Allows two unlocked elemental infusions to apply together through an infusion Special Skill.

|tab=Relationships

== Relationships ==

=== Raymond Valoris ===

Raymond is Kiara's childhood friend. Their friendship begins when his family visits her home district, and they grow close alongside Alana. His mother's intervention against Aether's bullying reinforces the importance of that bond during a period when noble hostility threatens the group.

After Kiara disappears, Raymond searches for her for years. They reunite at the gates of Lux Urbis during the demihuman conflict, and he supports the resistance while she confronts Alana. They later share both Class 1A and Black Rampart membership at Regnum.

{{Spoiler|With Lux's encouragement, Kiara recognizes the romantic nature of her feelings for Raymond. Their childhood loyalty develops into a relationship, and they fight together against Aether during the crisis in District 12. They are later associated with District 10's Magni succession.}}

=== Avery Obtainia ===

Avery welcomes Kiara to Regnum and defends her right to attend the academy when hostile nobles confront the newcomers. Kiara is grateful for his support and offers to fight beside him, though the duel's rules prevent her from joining the match.

After the attempted abduction is exposed, Kiara and Ted help Avery at the arena and join his friends in celebrating his efforts. Their shared experience of demihuman prejudice gives them common ground within the Mystical Legends.

{{Spoiler|Their deity connections later make both of them targets for capture. Kiara also accompanies Avery and Raymond in investigating Aether and helping Lux during the attempted coup.}}

=== Teddric Tech ===

Ted helps free Kiara during the plot outside the arena. While he distracts the captors, she escapes her restraints and uses her speed to break through their attempts to stop them. Their cooperation helps expose the conspiracy.

Away from danger, the two trade teasing remarks. Kiara mocks his enthusiasm for arithmetic, and their arguments extend to whether fantasy or science fiction is superior. Despite their bickering, they readily support the same friends.

=== River Grantia ===

Kiara is excited to meet another demihuman at Regnum and approaches River with little hesitation. She notices River's concealed features and admires the softness of her fox ears and tail. Her enthusiasm initially overwhelms River, whose reserved temperament contrasts with Kiara's openness.

The two face the same prejudice from hostile students and become part of the same circle of friends around Avery.

=== Lux Luces ===

Lux welcomes Kiara and asks whether she is adjusting to the academy without further bullying. Their shared ownership of ancient artifacts gives them an immediate subject of conversation: Lux identifies Kiara's bracelet as a Seal Ring, shows her own amulet, and encourages her to learn from strong companions.

{{Spoiler|Their friendship deepens around Lux's proposed marriage to Aether. Lux helps Kiara understand her feelings for Raymond, while Kiara helps investigate Aether's plot and fights beside Lux after the wedding is attacked.}}

=== Alana ===

Alana is a childhood friend of Kiara and Raymond. Their earlier closeness breaks down after Kiara discovers that Alana has sided with the nobles in Lux Urbis. Kiara confronts her in the hope of gaining help for the demihumans, but their disagreement becomes a fight. The encounter ends their friendship.

=== Prince Aether ===

Aether is one of Kiara's oldest enemies. As a child, he uses his age and noble status to intimidate her and her friends, joining other children in insulting and attacking them. His actions contribute to Kiara's distrust of the aristocracy.

{{Spoiler|His engagement to Lux brings their hostility into a wider political conflict. Kiara helps uncover his attempted seizure of District 12 and takes part in the pursuit that ends with his defeat and imprisonment.}}

=== Black Rampart ===

Kiara belongs to Black Rampart alongside Jane Tee and Raymond, under Centurion Carla Storm. Her membership places her within Regnum's cohort system as well as the broader circle of the Mystical Legends.

=== Zekron and the Deities ===

Kiara has a contract with Zekron, whose titles include Skylander, Storm Mage, and Lightcrown God.

{{Spoiler|Her later abilities also connect her to Artiana, Mercemes, Hadestias, and Son Adoli. Hadestias is associated with both Severance and the catalyst from which she gains Soul Magic.}}
