<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Create User</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
  background: #0d1114;
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  font-family: Arial, sans-serif;
  color: #eee;
  background: radial-gradient(
    circle at center,
    #273746 0,
    #151b20 45%,
    #0d1114 100%
  );
}

.register-card {
  position: relative;
  width: 100%;
  max-width: 410px;
  padding: 34px 32px 30px;
  background: rgba(24, 30, 35, .94);
  border: 1px solid rgba(150, 180, 205, .35);
  border-radius: 4px;
  box-shadow: 0 15px 45px rgba(0, 0, 0, .5);
}

.register-card:before,
.register-card:after {
  content: "";
  position: absolute;
  width: 26px;
  height: 26px;
  border-color: #b9d8ec;
}

.register-card:before {
  top: -1px;
  left: -1px;
  border-top: 2px solid;
  border-left: 2px solid;
}

.register-card:after {
  right: -1px;
  bottom: -1px;
  border-right: 2px solid;
  border-bottom: 2px solid;
}

h1 {
  margin: 0;
  text-align: center;
  font-size: 29px;
  font-weight: 400;
  letter-spacing: 1px;
  text-shadow: 0 2px 5px #000;
}

.subtitle {
  margin: 7px 0 28px;
  text-align: center;
  color: #aebbc5;
  font-size: 13px;
}

.form-group {
  margin-bottom: 17px;
}

label {
  display: block;
  margin: 0 0 7px;
  color: #cbd5dc;
  font-size: 13px;
}

input {
  width: 100%;
  padding: 13px 14px;
  border: 1px solid #3c4851;
  border-radius: 2px;
  background: #11171b;
  color: #fff;
  font-size: 15px;
  outline: none;
  transition: .2s;
}

input:focus {
  border-color: #9bc7e4;
  box-shadow: 0 0 10px rgba(120, 180, 220, .18);
  background: #151d22;
}

button {
  width: 100%;
  margin-top: 6px;
  padding: 13px;
  border: 1px solid #a9c8da;
  border-radius: 2px;
  background: linear-gradient(#6f9bb7, #4d7188);
  color: #fff;
  font-size: 15px;
  font-weight: 400;
  letter-spacing: .5px;
  text-shadow: 0 1px 2px #26343d;
  cursor: pointer;
  box-shadow:
    inset 0 1px rgba(255, 255, 255, .25),
    0 4px 12px rgba(0, 0, 0, .3);
  transition: .2s;
}

button:hover {
  background: linear-gradient(#83aec7, #5c8198);
  box-shadow:
    inset 0 1px rgba(255, 255, 255, .3),
    0 5px 16px rgba(100, 160, 200, .2);
}

button:active {
  transform: translateY(1px);
}

button:disabled {
  opacity: .6;
  cursor: not-allowed;
}

#message {
  min-height: 18px;
  margin: 12px 0 0;
  text-align: center;
  font-size: 13px;
}

#message.success {
  color: #9de0b1;
}

#message.error {
  color: #ff8d8d;
}

.warning {
  margin-top: 22px;
  padding: 11px 13px;
  border-top: 1px solid #3c454b;
  color: #929da5;
  font-size: 11px;
  line-height: 1.5;
  text-align: center;
}

@media (max-width: 480px) {
  body {
    padding: 15px;
  }

  .register-card {
    padding: 30px 24px 26px;
  }
}
</style>
</head>

<body>

<main class="register-card">
  <h1>Create User</h1>
  <p class="subtitle"></p>

  <form id="createForm">

    <div class="form-group">
      <label for="username">Username</label>
      <input
        type="text"
        id="username"
        placeholder="Enter your username"
        autocomplete="username"
        required
      >
    </div>

    <div class="form-group">
      <label for="password">4-Digit Password</label>
      <input
        type="text"
        id="password"
        placeholder="Enter 4 digits"
        maxlength="4"
        inputmode="numeric"
        autocomplete="off"
        required
      >
    </div>

    <div class="form-group">
      <label for="confirmPassword">Confirm Password</label>
      <input
        type="text"
        id="confirmPassword"
        placeholder="Enter the 4 digits again"
        maxlength="4"
        inputmode="numeric"
        autocomplete="off"
        required
      >
    </div>

    <button type="submit" id="createButton">Begin Adventure</button>

  </form>

  <p id="message"></p>

  <div class="warning">
    Your account cannot be deleted once created. Please remember your Username and Password.
  </div>
</main>

<script>
const form=document.getElementById("createForm");
const username=document.getElementById("username");
const password=document.getElementById("password");
const confirmPassword=document.getElementById("confirmPassword");
const button=document.getElementById("createButton");
const message=document.getElementById("message");

form.addEventListener("submit",async e=>{
  e.preventDefault();

  message.textContent="";
  message.className="";
  button.disabled=true;
  button.textContent="Creating...";

  if(password.value!==confirmPassword.value){
    message.textContent="Passwords do not match.";
    message.className="error";
    button.disabled=false;
    button.textContent="Begin Adventure";
    return;
  }

  try{
    const response=await fetch("/api/create-user",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        username:username.value.trim(),
        password:password.value.trim()
      })
    });

    const text=await response.text();
    let result;

    try{
      result=JSON.parse(text);
    }catch{
      throw new Error("Server returned an invalid response.");
    }

    if(response.ok){
      message.textContent="Your adventure begins!";
      message.className="success";
      form.reset();

      setTimeout(()=>{
        window.location.href="/";
      },1000);
    }else{
      message.textContent=result.error||"Unable to create user.";
      message.className="error";
      button.disabled=false;
      button.textContent="Begin Adventure";
    }
  }catch(error){
    console.error(error);
    message.textContent="Something went wrong. Please try again.";
    message.className="error";
    button.disabled=false;
    button.textContent="Begin Adventure";
  }
});
</script>

</body>
</html>
