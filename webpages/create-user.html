<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="apple-touch-icon" type="image/png" sizes="152x152" href="/images/website/icons/torch-apple-152.png">
  <link rel="apple-touch-icon" type="image/png" sizes="167x167" href="/images/website/icons/torch-apple-167.png">
  <link rel="apple-touch-icon" type="image/png" sizes="180x180" href="/images/website/icons/torch-apple-180.png">
  <link rel="icon" type="image/png" sizes="256x256" href="/images/website/favicon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Create User</title>

<style>
*{box-sizing:border-box}

:root{
  --red:#741b22;
  --red-dark:#471116;
  --red-light:#922630;
  --gold:#d6aa45;
  --gold-dark:#8f6a2a;
  --gold-light:#f0ca69;
  --gold-pale:#fff0c6;
  --dark:#151416;
  --dark2:#0c0b0c;
  --panel:#211c1d;
  --panel2:#2b2526;
  --text:#f5ead2;
  --muted:#aa9e8e;
  --border:rgba(214,170,69,.3);
  --error:#ff8d8d;
  --success:#9de0b1;
}

html {
  background: #000;
}

body{
  margin:0;
  min-height:100%;
  background:
    radial-gradient(circle at 50% -10%,#562027 0,#28191b 30%,#111112 75%,#09090a 100%);
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:30px 20px;
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at 50% 25%,rgba(116,27,34,.28),transparent 28%),
    radial-gradient(circle at 18% 70%,rgba(214,170,69,.035),transparent 25%),
    radial-gradient(circle at 82% 35%,rgba(116,27,34,.12),transparent 26%),
    linear-gradient(180deg,#171315 0,#0e0d0e 55%,#09090a 100%);
  overflow-x:hidden;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.16;
  background:
    linear-gradient(45deg,transparent 48%,rgba(255,255,255,.015) 49%,transparent 50%),
    linear-gradient(-45deg,transparent 48%,rgba(214,170,69,.01) 49%,transparent 50%);
  background-size:50px 50px;
}

body::after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(circle at center,transparent 40%,rgba(0,0,0,.48) 100%);
}


/* ================================
   Registration Card
================================ */

.register-card{
  position:relative;
  z-index:1;
  width:100%;
  max-width:430px;
  padding:42px 36px 34px;
  background:
    radial-gradient(circle at 50% 0,rgba(214,170,69,.055),transparent 36%),
    linear-gradient(180deg,rgba(42,34,36,.97),rgba(24,20,21,.985));
  border:1px solid var(--border);
  border-radius:8px;
  box-shadow:
    0 24px 65px rgba(0,0,0,.7),
    0 0 35px rgba(116,27,34,.12),
    inset 0 1px 0 rgba(255,255,255,.025);
}

/* Top decorative line */
.register-card::before{
  content:"";
  position:absolute;
  top:-1px;
  left:8%;
  right:8%;
  height:1px;
  background:
    linear-gradient(
      to right,
      transparent,
      var(--gold-dark),
      var(--gold-light),
      var(--gold-dark),
      transparent
    );
  opacity:.9;
}

/* Inner border */
.register-card::after{
  content:"";
  position:absolute;
  inset:6px;
  border:1px solid rgba(214,170,69,.07);
  border-radius:5px;
  pointer-events:none;
}


/* ================================
   Heading
================================ */

.register-title-wrap{
  position:relative;
  margin-bottom:30px;
  text-align:center;
}

.register-title-wrap::before,
.register-title-wrap::after{
  content:"";
  position:absolute;
  top:19px;
  width:48px;
  height:1px;
  background:linear-gradient(to right,transparent,var(--gold-dark));
  opacity:.7;
}

.register-title-wrap::before{
  right:calc(50% + 105px);
}

.register-title-wrap::after{
  left:calc(50% + 105px);
  transform:scaleX(-1);
}

h1{
  margin:0;
  color:var(--gold-light);
  font-family:Georgia,"Times New Roman",serif;
  font-size:31px;
  font-weight:600;
  letter-spacing:1.5px;
  text-shadow:
    0 3px 10px #000,
    0 0 16px rgba(214,170,69,.12);
}

.subtitle{
  margin:8px 0 0;
  color:var(--muted);
  font-size:12px;
  letter-spacing:.08em;
  text-transform:uppercase;
}


/* ================================
   Form
================================ */

.form-group{
  margin-bottom:18px;
}

label{
  display:block;
  margin:0 0 7px;
  color:#d7c8ad;
  font-size:12px;
  font-weight:600;
  letter-spacing:.05em;
}

input{
  width:100%;
  height:46px;
  padding:0 14px;
  border:1px solid rgba(214,170,69,.2);
  border-radius:4px;
  outline:0;
  color:var(--text);
  background:
    linear-gradient(180deg,#161314,#100e0f);
  font:14px Arial,Helvetica,sans-serif;
  box-shadow:
    inset 0 2px 8px rgba(0,0,0,.38),
    0 1px 0 rgba(255,255,255,.015);
  transition:
    border-color .2s ease,
    background .2s ease,
    box-shadow .2s ease;
}

input::placeholder{
  color:#746b61;
}

input:hover{
  border-color:rgba(214,170,69,.32);
}

input:focus{
  border-color:var(--gold-dark);
  background:#181415;
  box-shadow:
    inset 0 2px 8px rgba(0,0,0,.35),
    0 0 0 1px rgba(214,170,69,.08),
    0 0 14px rgba(214,170,69,.08);
}


/* ================================
   Button
================================ */

#createButton{
  position:relative;
  width:100%;
  min-height:46px;
  margin-top:7px;
  padding:12px 20px;
  border:1px solid rgba(214,170,69,.6);
  border-radius:4px;
  overflow:hidden;
  color:var(--gold-pale);
  background:
    linear-gradient(180deg,#81232b,#54151a);
  font:700 13px Arial,Helvetica,sans-serif;
  letter-spacing:.09em;
  text-transform:uppercase;
  text-shadow:0 2px 4px #000;
  cursor:pointer;
  box-shadow:
    0 8px 20px rgba(0,0,0,.38),
    inset 0 1px 0 rgba(255,255,255,.06);
  transition:
    transform .18s ease,
    background .2s ease,
    border-color .2s ease,
    box-shadow .2s ease;
}

#createButton::before{
  content:"";
  position:absolute;
  top:0;
  left:-120%;
  width:70%;
  height:100%;
  transform:skewX(-25deg);
  background:linear-gradient(
    to right,
    transparent,
    rgba(255,236,184,.11),
    transparent
  );
  transition:left .5s ease;
}

#createButton:hover{
  background:linear-gradient(180deg,#9b2b35,#65191f);
  border-color:var(--gold-light);
  box-shadow:
    0 10px 25px rgba(0,0,0,.48),
    0 0 18px rgba(214,170,69,.1),
    inset 0 1px 0 rgba(255,255,255,.08);
  transform:translateY(-2px);
}

#createButton:hover::before{
  left:150%;
}

#createButton:active{
  transform:translateY(0) scale(.99);
}

#createButton:focus-visible{
  outline:2px solid var(--gold-light);
  outline-offset:3px;
}

#createButton:disabled{
  opacity:.55;
  cursor:not-allowed;
  transform:none;
}


/* ================================
   Message
================================ */

#message{
  min-height:18px;
  margin:13px 0 0;
  text-align:center;
  font-size:12px;
  line-height:1.4;
}

#message.success{
  color:var(--success);
  text-shadow:0 0 8px rgba(157,224,177,.12);
}

#message.error{
  color:var(--error);
  text-shadow:0 0 8px rgba(255,141,141,.1);
}


/* ================================
   Warning
================================ */

.warning{
  position:relative;
  margin-top:25px;
  padding:18px 8px 0;
  color:#887d70;
  font-size:11px;
  line-height:1.6;
  text-align:center;
}

.warning::before{
  content:"";
  position:absolute;
  top:0;
  left:8%;
  right:8%;
  height:1px;
  background:
    linear-gradient(
      to right,
      transparent,
      rgba(214,170,69,.22),
      transparent
    );
}


/* ================================
   Mobile
================================ */

@media(max-width:480px){
  body{
    padding:18px 14px;
  }

  .register-card{
    padding:35px 22px 28px;
  }

  h1{
    font-size:27px;
  }

  .register-title-wrap::before,
  .register-title-wrap::after{
    width:28px;
  }

  .register-title-wrap::before{
    right:calc(50% + 92px);
  }

  .register-title-wrap::after{
    left:calc(50% + 92px);
  }

  input{
    height:44px;
    font-size:14px;
  }

  #createButton{
    min-height:45px;
  }
}
</style>
</head>

<body>

<main class="register-card">

  <div class="register-title-wrap">
    <h1>Create User</h1>
    <p class="subtitle">Begin Your Mystical Journey</p>
  </div>

  <form id="createForm">

    <div class="form-group">
      <label for="username">Username</label>
      <input
        type="text"
        id="username"
        placeholder="Enter your username"
        autocomplete="username"
        required
      >
    </div>

    <div class="form-group">
      <label for="password">4-Digit Password</label>
      <input
        type="text"
        id="password"
        placeholder="Enter 4 digits"
        maxlength="4"
        inputmode="numeric"
        autocomplete="off"
        required
      >
    </div>

    <div class="form-group">
      <label for="confirmPassword">Confirm Password</label>
      <input
        type="text"
        id="confirmPassword"
        placeholder="Enter the 4 digits again"
        maxlength="4"
        inputmode="numeric"
        autocomplete="off"
        required
      >
    </div>

    <button type="submit" id="createButton">Begin Adventure</button>

  </form>

  <p id="message"></p>

  <div class="warning">
    Your account cannot be deleted once created. Please remember your Username and Password.
  </div>

</main>

<script>
const form=document.getElementById("createForm"),
username=document.getElementById("username"),
password=document.getElementById("password"),
confirmPassword=document.getElementById("confirmPassword"),
button=document.getElementById("createButton"),
message=document.getElementById("message");

function setMessage(text,type=""){
  message.textContent=text;
  message.className=type;
}

function setLoading(loading){
  button.disabled=loading;
  button.textContent=loading?"Creating...":"Begin Adventure";
}

password.addEventListener("input",()=>{
  password.value=password.value.replace(/\D/g,"").slice(0,4);
});

confirmPassword.addEventListener("input",()=>{
  confirmPassword.value=confirmPassword.value.replace(/\D/g,"").slice(0,4);
});

form.addEventListener("submit",async e=>{
  e.preventDefault();

  const user=username.value.trim(),
  pass=password.value.trim(),
  confirm=confirmPassword.value.trim();

  setMessage("");

  if(!user){
    setMessage("Please enter a username.","error");
    username.focus();
    return;
  }

  if(!/^\d{4}$/.test(pass)){
    setMessage("Password must contain exactly 4 digits.","error");
    password.focus();
    return;
  }

  if(pass!==confirm){
    setMessage("Passwords do not match.","error");
    confirmPassword.focus();
    return;
  }

  setLoading(true);

  try{
    const response=await fetch("/api/create-user",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        username:user,
        password:pass
      })
    });

    const text=await response.text();
    let result={};

    try{
      result=text?JSON.parse(text):{};
    }catch{
      throw new Error("Server returned an invalid response.");
    }

    if(!response.ok){
      setMessage(result.error||"Unable to create user.","error");
      setLoading(false);
      return;
    }

    setMessage("Your adventure begins!","success");
    form.reset();

    setTimeout(()=>{
      window.location.href="/";
    },1000);

  }catch(error){
    console.error(error);
    setMessage("Something went wrong. Please try again.","error");
    setLoading(false);
  }
});
</script>

</body>
</html>
