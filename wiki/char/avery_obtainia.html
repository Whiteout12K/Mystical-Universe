Avery Obtainia is the main protagonist in the series Mystical Legends. He is an [[fandom:Angelor|Angelor]], a unique species of [[fandom:Mystical Being|Mystical Beings]] with enormous power. Not knowing his parents, he originally lived a life of poverty and foster care until he encountered the Mystical at New York's academy. Making friends and stumbling into a dire incident, he and his friends are sent to the Mystical Island where he learns more about magic and his past. With skills of a former street thief and of a magic [[fandom:elementalist|elementalist]], he possesses an unparalleled agility in battle.

|tab=Overview
== Overview ==

Avery is a rather short, but a nimble boy. He has shoulder length hair that he parts in the middle. He has bright sapphire pink eyes. Avery also has a built stature (which was due to his many years of survival in the streets of New York). He typically wears a white plain polo with a loose collar. He also wears a dark red jacket over his pollo for extra warmth, style, and protection. He also wears a dark gray loose leggings. Shortly after arriving on the Mystical Island, Avery wears a backpack which holds all his school supplies and his most prized possessions.

At Regnum Academy, Avery would wear the typical school attire of a maroon sweater shirt and gray pants.

== Personality ==

With about 15 years of living in New York doing his own things, Avery mostly has a defensive nature such as the ability to avoid incoming attacks and pursuits. Being a street beggar and thief, he also has tremendous speed and agility, which was proven to be effective in fights even against other Mystical Beings, a particular feat is being about to maintain distance between Billy Bones, one of the famed strongest Mystical Being.<br>

Avery is level headed and is able to think through a situation and plan accordingly. His intelligence, given most circumstances, could rival those in high nobility and social standings. With a life of minimal possessions, Avery has a tendency to take only an amount suitable for him and for survival, such as taking a reasonable helping of food. He also shares too easily, often being cheated of rewards. After meeting a [[fandom:Oceanus Atlas|man]] when he was 12 years old, Avery devoted the three years in foster care to continue developing his physical prowess and mental aptitude. 

Originally just learning about the Mystical Beings for the first time, he wasn't too surprised or doubtful; he took in the information given rather casually, a trait common for him since he lived in New York where change happened every moment without warning. But his desire of learning piques above most normal Mystical Beings as he would question anyone he encountered and asked various levels of technical questions.<br>

== Mystical Rank & Heritage ==

Not knowing of his Mystical characteristics at first, Avery's only indication of the Mystical was his identity as an [[fandom:Angelor|Angelor]], a unique species of light affinity said to be rare. With the addition of his commoner status plus the reveal of his demihuman characteristics, he was then regarded as low by most of the nobility who discounted his true capabilities.<br>

== Tools and Equipment ==

Avery also takes advantage of tools to help him in battle and other situations.<br>

=== [[fandom:The Rune of the Spellcaster|Rune of the Spellcaster]] ===

This artifact was discovered in the Sky House in Weeping Woods, Central Park in New York. A special rune that lets Avery channel and release more of his power. He can telepathically control it, such as twirling it, launching it as a weapon, and making it float passively. It floats without the act of gravity, thus allowing Avery to also stand upon it and fly about. Because it can absorb and properly release Avery's magic, it is often used for specific spells and precise attacks. This rune is also only capable of being controlled and activated by Avery at will.<br>

== Powers & Abilities ==

Avery combines his inherited Angelor and Water Spirit abilities with Mage magic, Regnum Spei, ki, and the Rune of the Spellcaster. Many of his techniques emphasize protection, healing, and control, though he can also fight powerful opponents directly.

== Light Discharge ==

Light is among the first affinities Avery learns to use. His Angelor inheritance allows him to create, bend, and direct light that can blind, stun, and burn opponents. Compression makes his light denser and strengthens its defensive and offensive applications.

* '''Light Magic:''' Avery releases light at range or uses it to support another fighter. Its effect is stronger against dark powers, while the reflective nature of Icelorian ultimate ice reduces its effectiveness. At ordinary intensity it causes little environmental damage, but can disrupt sight and physical sensation. Gathering the light takes time, making it less suited to immediate close combat.
* '''Light Fist:''' Avery surrounds his fist with a magical aura to increase the force and speed of a punch. Although simple, it remains useful against opponents with comparable or greater magical power.

=== Holy Magic / Purification ===

A powerful variant of Light Magic, Holy Magic produces fused, plasma-like energy capable of breaking material structures down at a molecular level. It can deliver precise attacks over long distances, but loses intensity as it passes through matter. Sufficient magical barriers can withstand it.

Its high mana cost and physical toll limit Avery's use. Greater mana capacity lets him employ it more often, though he still uses it sparingly. This Regnum Spei also encompasses Purification.

=== Mythical Healing Magic ===

Mythical Healing Magic evolves from '''Ceresara's Blessing'''. Avery emits golden light that heals minor to moderately severe wounds and empowers those within its aura. By adjusting the light's frequency, he stimulates cellular repair without damaging the body; the magic can also support nerves and mental recovery.

* '''Healing Light:''' Avery lights his hand and touches an injury to gradually mend damaged tissue and broken bones.

== Water Discharge ==

During Aqua Revolution, Avery discovers his Water Spirit origins and water affinity. He can generate water from mana, manipulate nearby water, and combine it with Compression to increase its density and striking or restraining power.

* '''Water Magic:''' Avery creates water or directs existing water, using Compression to make it more solid and forceful.
* '''Water Wall:''' Avery raises water around himself or chosen allies. The surrounding flow disturbs opponents and supports protection.

== Mage Magic ==

Avery's anchored connection with [[fandom:Lynnhera|Lynnhera]] can temporarily grant him access to her visions and mastery of Mage magic when she chooses to share them. This connection does not mean that Avery continuously possesses unrestricted access to every Mage ability.

== Regnum Spei ==

Avery's Regnum Spei includes Compression, Holy Magic, Transformation, Mythical Healing Magic, Omnifusion, Defense, and Thought Acceleration. Several develop through divine blessings or evolve into more advanced abilities.

=== Compression ===

After touching Pyrus Bourn's orb of destruction, Avery experiences a powerful magical influence that changes his developing spiritual potential. He initially uses Compression to increase the density of his light, then extends it to water and localized gravitational effects.

* '''Light Compression:''' Avery forms dense, bright light projectiles, weapons, and spheres with greater weight and physical toughness.
* '''Water Compression:''' Avery makes water dense enough to behave like steel, supporting solid restraints and stronger impacts.
* '''Gravity:''' Avery manipulates a finite area around himself to create gravitational pulls, redirect forces, levitate objects, or make himself float.
* '''Telekinesis:''' A basic application of his gravitational control lets Avery lift or direct objects after locating and mentally tracking them. Its range can extend several hundred feet. Opponents can resist or break his control by releasing their own magic.

=== Transformation ===

Avery can turn parts of his body, or his entire body, into water. This improves fluid movement and allows some penetrating attacks to pass through him. He can compress transformed limbs to make them tougher and combine the transformed state with light magic.

Ice and temperature-related magic can interfere with returning to human form. During complete water transformation, Avery cannot rely on ordinary sight or hearing; he senses through his dispersed water and magical pulses instead. Transformation later evolves into True Transformation.

=== True Transformation ===

{{Spoiler|After fully merging with Lynnhera, Avery's body becomes fused with his magical essence and spirit. He can manifest as mana and compressed magical matter, recover naturally from cuts, and reshape parts of himself into forms he understands, such as hard material or cushioning fluid. His previous water transformation remains available.
The state reduces ordinary physical strain, but still depends on Avery's mana capacity. Extreme heat, Icelorian ultimate ice, degenerative magic, and mana-draining shadow magic remain threats. Skillful evasion and control help him reduce their effects.}}
=== Omnifusion — Antifusion / Fusion ===

Omnifusion is '''Ceresara's Second Blessing''' and includes Antifusion and Fusion. It later evolves into '''Time Manipulation'''.

=== Defense ===

Avery's Defense Regnum Spei is associated with '''Artiana's Blessing'''.

=== Thought Acceleration ===

Thought Acceleration is associated with '''Catathena's Blessing'''.

== Angelor Characteristics ==

Avery's Angelor nature supports his light affinity, wings, and specialized perception. These characteristics complement his defensive fighting style and control of magic.

* '''Luxengan:''' By imbuing his eyes with mana, Avery perceives exterior magical fluctuations and traces left by used magic. He can assess potency, refine his magical flow, and help others improve theirs. Nearby pressure changes assist anticipation in close combat. Luxengon does not directly reveal magic's color or affinity; its light-pulse-like perception also lets him see in darkness.
* '''Enlightened Mode:''' An advanced state listed among Avery's Angelor-related abilities.
* '''Flight:''' Avery's white wings let him fly or hover through natural movement, rather than relying solely on gravitational magic. He can remain airborne without continuously spending mana on magical levitation.

== Rune of the Spellcaster ==

The [[fandom:The Rune of the Spellcaster|Rune of the Spellcaster]], discovered in the Sky House in Weeping Woods, helps Avery channel and release his power. He can move it telepathically, spin or launch it as a weapon, and keep it floating beside him. Standing on the floating rune provides another means of flight.

The artifact supports specialized spells and precise magical attacks by absorbing and releasing Avery's magic in a controlled way. Only Avery can activate and direct it at will.

== Physical and Mental Abilities ==
* '''Enhanced Reflexes:''' Years of survival, parkour, and evasion give Avery strong agility and stamina. He can run, jump, slide, and climb in quick succession. Magical enhancement further improves his speed, jumping, soft landings, and resistance to blows.
* '''Durability:''' Avery's ordinary physical durability is comparatively limited and does not inherently protect him from high-level magical attacks. His mental resilience can nevertheless help him continue moving while badly injured.
* '''Keen Perception:''' His former life as a thief developed awareness of his surroundings, detection of attention, and quick reactions. He now applies those skills to studying attacks and identifying counterattacks.
* '''Intelligence:''' Avery combines deductive reasoning, perception, and social awareness with knowledge of physics, other sciences, and computer programming. He has experience with website development and some game development, though he is not described as a prodigy.
