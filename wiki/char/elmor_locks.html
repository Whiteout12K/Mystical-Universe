Elmor Locks, known as the Wind Master, is a Wentor and the centurion of Mystic. His Wind magic is represented by a Defense role in Mystical Legends: Game.

|tab=Overview

== Background ==
Elmor leads Mystic as its centurion. [[char/river_grantia|River Grant]] is also a member of this cohort. His Fandom profile records a hammer among his equipment.
