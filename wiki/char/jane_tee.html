== Overview ==
Jane is a Regnum Academy freshman and a member of the group living in Quad 44. Raised within Mystical society, she supplies cultural and academic context that the three mainland transfers lack. Her plant affinity and practical judgment become important in both Charlotte's rescue and the semester's flag competition.

== Personality ==
Jane is outgoing, opinionated, and quick to challenge a weak explanation. She welcomes the new roommates but readily criticizes Ted's boasting and Kaden's theatrical behavior. Her knowledge of artifacts and institutions gives her confidence, although that confidence can become impatience with others.

Her approach to teamwork favors results and careful preparation. She does not merely give advice from a safe distance: she joins the unauthorized rescue and later enters a confined confrontation with Elegro to create an opening for River. Her success shows an ability to use an opponent's assumptions against him, combining social observation with magical control.

== Mystical Rank & Heritage ==
At Book 2's cohort challenge, Jane declares '''Tier 3, Altus, Level 1'''. Her noble background gives her familiarity with the island's customs, but she explicitly distinguishes her standing from that of the higher-ranking Aquia family. The existing notes identify her as a Herbovir; her demonstrated plant control in the novels is the basis of the abilities described below.

== Tools and Equipment ==
Jane receives the '''Mistywood Armor''', a Tier 5 artifact, after Team 44's flag-game victory. Its plant resonance suits her mana. The bark-like torso piece extends over her limbs and becomes a full protective suit, with a central green crystal. It stores supplied mana and can retract again. The competition identifies its durability and fire resistance; Jane's possession of it does not mean the team individually acquired separate copies.

== Synopsis ==

=== The Rune of the Spellcaster ===

==== Quad 44 and the Rescue Party ====

Jane introduces herself when Avery, Ted, and River arrive at their dormitory. She lends practical help with island life and school supplies, and her reaction to River's fox features is welcoming rather than contemptuous. Her sharp exchanges with Ted establish a recurring part of the group's everyday life.

She joins Kaden's District 3 rescue operation and accompanies Avery and River in the infiltration team. After the cell is unlocked and the party retreats, she helps Ted attack Tom. Her Concealing Tree surrounds his tornado and continually regrows its branches while Ted approaches from above with a steel hammer. Tom's escape reveals their opponents' experience without making their coordinated effort irrelevant.

=== I.T.E.R. Chronicles — Initialization ===

==== Black Rampart and the Flag Victory ====

Carla recruits Jane into Black Rampart after the freshmen's cohort challenge. Jane finds its discussions and members congenial, while continuing to study and live with the Quad 44 group.

In the flag competition, she uses growing roots, vines, restraints, and tactical movement to assist Team 44. Against the stronger third-year team, she draws Elegro into a cage of vines and occupies his attention. River uses that opening to seize the flag, and the duo repeats the distraction strategy against the remaining second-year defenders. Their success ends the contest while Avery and Ted keep Kaden occupied.

At the ceremony, the team agrees the Mistywood Armor best suits Jane. She accepts the artifact and relinquishes most of her share of the money so the others can obtain equipment. Her explanation of stored mana, affinity resonance, and cumulative artifacts gives the prize a practical meaning beyond its rarity.

|tab=Powers & Abilities

== Powers & Abilities ==

== Established Abilities ==

=== Plant Control ===

Jane grows vines, roots, and tree structures for trapping, covering space, and redirecting a fight. Concealing Tree, Underground Vine Extension, and Vine Twister demonstrate different applications of the same affinity. Maintaining or regrowing a restraint can keep an opponent occupied even when a direct blow would fail.

=== Tactical Use of Terrain ===

She forms a vine raft for River to propel and uses barriers to obstruct an opponent's view during the flag game. Her decisive contribution is creating the moment in which River can act, rather than overpowering every defender herself.

=== Artifact Knowledge ===

Jane explains that an artifact's performance depends on mana input and affinity compatibility. Her plant magic resonates with Mistywood Armor, allowing it to conform to her body; she also warns that inappropriate mana can reduce or damage an artifact's usefulness.

|tab=Relationships

== Relationships ==

=== Quad 44 ===

[[char/avery_obtainia|Avery]], [[char/teddric_tech|Ted]], and [[char/river_grantia|River]] are Jane's roommates and principal teammates. Her arguments with Ted do not prevent cooperation. River trusts her tactical direction during the flag contest, and Avery supports giving her the armor.

=== Carla Storm ===

[[char/carla_storm|Carla]] recruits Jane to Black Rampart, giving her an additional circle of peers and responsibilities beyond the dormitory. The two novels establish this membership without detailing every later cohort relationship.
