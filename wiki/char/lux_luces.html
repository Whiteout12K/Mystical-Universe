'''Lux Luces''' is an [[fandom:Angelor]] princess of [[fandom:District 12|District 12]], the daughter of [[fandom:Lumen Luces|Lumen Luces]], and a descendant of [[fandom:Zenith Luces|Zenith Luces]]. She is one of the four members of the [[fandom:Nuntios|Nuntios]], alongside [[fandom:Josh Picard|Josh Picard]], [[fandom:Jay Neomo|Jay Neomo]], and [[fandom:Marin Kne|Marin Kne]]. A skilled [[fandom:Elementalist]] with Light and Wind affinities, she specializes in precise magical control, healing, and protection.

Lux returns to [[fandom:Regnum Academy|Regnum Academy]] as a substitute Magic 101 teacher. There, she challenges the prejudice directed at demihumans and takes an interest in [[char/avery_obtainia|Avery Obtainia]], whose unusual magic and Angelor heritage connect to her own investigations into their species' history.

|tab=Overview

== Appearance ==

Lux is a tall, slender young woman with fair skin, waist-length golden hair, and golden eyes. She has large white wings, which she can conceal with the sapphire amulet she wears around her neck. Her concealed wings allow her to move through ordinary social settings without immediately revealing her demihuman traits.

She commonly wears white dresses, sometimes accompanied by a coat, with gold bracelets, bird-shaped earrings, and white sandals. For the Winter's Dance, she wears a floor-length white dress and ties her hair back. Her formal appearance contrasts with the more relaxed clothes she wears around the other Nuntios, including a pink apron while preparing breakfast.

Her '''IT Medic Avatar''' surrounds her body with green holographic armor. When inactive, the equipment remains sealed in a wristband.

== Personality ==

Lux is confident, outspoken, and conscious of the authority her royal position carries. As a teacher, she demands discipline and is willing to embarrass students who substitute inherited status for actual skill. Her lessons emphasize control, efficiency, and an understanding of magical fundamentals rather than the strength of a person's family name.

Despite the respect she receives as a princess, Lux rejects the idea that social rank or physical appearance determines a person's worth. She openly identifies herself as a demihuman in front of her class, criticizes the favoritism shown to wealthy families, and refuses to let her attendants decide whom she may associate with. Her own privilege does not prevent her from recognizing the discrimination experienced by less influential demihumans.

Among friends, Lux is considerably more playful. She trades insults with Jay, reacts sharply to his teasing, and occasionally becomes competitive over the attention given to other Nuntios members. Her composure can give way to embarrassment, impatience, or excitement, especially when Avery is involved. She enjoys cooking for the group, though she readily threatens to withhold her food when Jay annoys her.

Lux is also curious and scholarly. She researches Angelor ancestry, recognizes the significance of ancient artifacts, and is eager to understand Avery's unusual mana. Her interest in him develops alongside genuine concern for his safety: after rescuing him from the lake, she treats his injuries, visits him in the infirmary, and warns him against flying before his wings have recovered.

== Royal Heritage and Rank ==

Lux belongs to the Luces royal family of District 12, a district associated with demihumans, winged species, and extensive trade. Her ancestor Zenith Luces established the district after leaving the Mystical Island. Lux's father, Lumen, rules as its Magni Luminis.

By the time she returns to Regnum Academy, Lux is '''Tier 7: Altier Dominus, Level 1'''. She can demonstrate advanced mana shaping with little apparent effort and is capable of distinguishing a stable magical construct from an uncontrolled imitation. Her status as a Nuntios member gives her considerable prestige beyond her royal upbringing.

== Tools and Equipment ==

=== Angelor's Amulet ===

Lux wears a sapphire pendant that assists her magical control. The artifact manages a small space in which she can conceal her wings; touching the pendant allows her to reveal or hide them. It also supports the precise use of her magic, including purification and the treatment of serious wounds.

During her discussion with Avery, Lux identifies her necklace as an ancient artifact and compares it with the artifact worn by [[char/kiara_katzol|Kiara Katzol]].

=== IT Medic Avatar ===

Lux's IT wristband deploys green holographic armor designed to enhance her healing, defense, and physical abilities. Rather than relying on a separate holographic weapon, she channels her own magic through the armor for healing and reflection. The armor withdraws into its bracelet form when deactivated.

== Trivia ==

* Lux is both a royal and a demihuman. She uses this contrast to challenge her students' assumptions about social standing.
* She is an accomplished cook and prepares meals for the other Nuntios.
* Her interest in Angelor history is one of the reasons she offers Avery personal guidance.
* Although Lux can fly, she becomes lost in Regnum Academy's hallways after midnight during the Nuntios' return.

|tab=Synopsis

== Synopsis ==

=== Early Life and the Nuntios ===

Raised as the daughter of District 12's ruler, Lux grows up among other demihumans while holding a position of considerable influence. As a young princess, she also spends time in District 10 and is associated with the Demoness Trio.

Lux is recruited alongside Josh Picard, Jay Neomo, and Marin Kne. The four assemble at an estate in New York after each receives an invitation from a white-haired boy offering them a greater purpose in exchange for their services. At their first meeting, Lux introduces herself as the daughter of District 12's Magni Luminis and describes her role as that of a negotiator. The group becomes the Nuntios.

=== Return to Regnum Academy ===

Lux and the other Nuntios return to Regnum Academy, where Professor Taskah assigns them teaching duties. Lux is placed in charge of Magic 101 as a temporary replacement for the regular teacher. She stays in the faculty accommodations with Marin, across from Josh and Jay.

While wandering the academy after midnight, Lux follows a light and encounters Avery near the kitchen. His appearance and the unusual magical energy within his body attract her attention. After learning more about the academy's young Angelor, she resolves to investigate him herself.

=== Magic 101 ===

Lux begins her teaching assignment with a lesson on social rank. She asks the class to separate into royals, nobles, commoners, and demihumans, then reveals her own wings to question the assumptions behind those divisions. She argues that a person's contribution and abilities matter more than inherited status.

To test the students' actual skill, Lux instructs them to form a stable sphere of affinity-less mana. When a noble student's attempt fails to meet her expectations, she demonstrates the exercise herself, turning a flawless white sphere into Wind magic and then shaping it into a spear without losing control. Avery's multicolored mana draws her particular interest.

After class, Lux questions Avery about his background and explains why his rainbow-colored mana is unusual. She agrees to tutor him and examines the Rune of the Spellcaster. Although the artifact does not respond to her own magic, she recognizes its historical connection to Caela Obtainia. Their conversation also reveals their shared interest in Angelor ancestry and the history of the Luces family.

=== Rescue at the Lake ===

During a fishing outing with the Nuntios, an accident involving Jay sends Avery into the lake. Lux forms a Light barrier to protect herself from the spray, then recognizes the injured Angelor as he surfaces unconscious. She unfolds her wings, flies over the water, and carries him back to the dock.

Lux examines the damage to Avery's wings and uses golden magic to separate blood and foreign material from the wound. After stabilizing him, she calls for him to be moved to the infirmary. She later visits him and is relieved by his rapid recovery, though she advises him to avoid flying for a week.

The incident also brings Lux into closer contact with Kiara. She notices the ominous aura of Kiara's bracelet, shows her own amulet, and encourages her to learn from strong companions. The two begin to form a friendship.

=== Winter's Dance ===

When Lux encounters Avery with Ken and Kirk Masumi, she invites him to attend the Winter's Dance with her and pairs her attendants, Anna and Alice, with his friends. Her decision surprises both Avery and the attendants, but she insists that her choice of company is her own.

At the dance, Lux takes Avery's hand and guides him through the steps. They discuss his arrival from New York, his recent battles, and their shared desire to understand their ancestry. Lux expresses confidence in his potential and offers further guidance. She declines Jay's request for a dance and returns to Avery, preferring to spend the evening with him.

Avery begins to notice the closeness of her gestures, but remains cautious about interpreting her intentions. Lux, meanwhile, grows increasingly interested in both his abilities and the person behind them.

=== Shadow Dwelling ===

{{Spoiler|Lumen approves an alliance through Lux's marriage to Prince Aether. Believing that Avery may not return her feelings, Lux considers accepting the arrangement and initially finds Aether respectable. Unknown to her, Aether intends to use the marriage to secure political legitimacy, assassinate Lumen, and seize District 12.}}

{{Spoiler|At the wedding, Aether's attack intended for Lumen instead kills Lux's mother. Avery, Kiara, and Raymond Valoris intervene and expose the attempted coup. Lux's remaining trust in Aether collapses, and she joins them in pursuing him. The four struggle against his overwhelming strength until Lumen arrives and defeats him. Aether is captured.}}

{{Spoiler|In the aftermath, Lux and Avery recognize the depth of their feelings for one another, though neither immediately makes a direct confession. Lumen acknowledges Avery's efforts and accepts him as worthy of Lux. Once the other Nuntios arrive and the immediate crisis has passed, Lux and Avery withdraw from the crowd to take a quiet walk together.}}

=== Familiar Bond ===

{{Spoiler|After earlier difficulties with a spiritual-beast ritual, Lux succeeds during a moment of danger. Rather than summoning an ordinary beast, she summons Avery, unexpectedly forming a familiar bond with him through his pure magical body.}}

|tab=Powers & Abilities

== Powers & Abilities ==

Lux combines Light and Wind magic with advanced mana control, healing, flight, and specialized equipment. Her control is sufficiently refined for her to demonstrate techniques normally expected of graduating third-year students while explaining their underlying principles.

== Mana Control ==

Lux can produce a stable sphere of affinity-less mana in seconds, without the fluctuations present in less controlled constructs. She can apply an affinity to the sphere and reshape it into a weapon while preserving its density and stability.

She demonstrates this by turning white mana into a green Wind sphere and extending it into a spear. The resulting magic stirs the air around the classroom strongly enough to scatter paper and shake weaker fixtures. She teaches that a fully controlled construct can remain conjured without continuously drawing additional mana, provided its user maintains control.

== Light Magic ==

Lux uses Light magic for protection and precise manipulation. She creates a barrier quickly enough to shield herself from the water thrown up during the fishing accident. Her golden magic can also isolate material around an injury, allowing her to remove blood and contaminants without handling them directly.

=== Healing and Purification ===

Lux can assess injuries and use carefully controlled magic to stabilize a patient. When Avery injures his wings, she identifies the severity of the wound, separates the blood into a suspended sphere, and removes substances interfering with the damaged area. Her response combines magical precision with practical judgment: after treating the immediate injury, she directs that he be taken to the infirmary and later restricts his flight during recovery.

Her Holy Magic and Purification complement her healing, with her pendant and IT Medic Avatar supporting their use.

== Wind Magic ==

Wind is Lux's second primary affinity. She can give shaped mana a Wind affinity and wield it as a spear without destabilizing the construct. This control allows her to combine a defined weapon shape with the movement of air around it.

== Angelor Characteristics ==

* '''Flight:''' Lux has large white wings and can deploy them to move rapidly through the air. She uses them to retrieve Avery from the lake and carry him to safety.
* '''Concealed Wings:''' Her amulet stores her wings in a small space, allowing her to hide or reveal them with a touch.
* '''Magical Perception:''' Lux can sense the unusual energy within Avery and recognize the ominous aura surrounding Kiara's artifact.

== Knowledge and Analysis ==

Lux is knowledgeable about magical history, Angelor ancestry, and ancient artifacts. She recognizes Avery's rainbow-colored mana as an exceptional phenomenon and distinguishes it from ordinary affinity-less magic. She also identifies the Rune of the Spellcaster as a Seal Ring, explains the importance of resonance in selecting an artifact's user, and connects Avery's ability to wield it with Caela Obtainia.

Her scholarly knowledge does not give her control over every artifact she recognizes. The Rune of the Spellcaster does not respond when she tests it with her own magic.

== Regnum Spei ==

Lux's Regnum Spei includes [[fandom:Holy Magic|Holy Magic]], [[fandom:8 Forces|Purification]], and [[fandom:Luxengan|Luxengan]]. Her precision in healing and purification works alongside her broader command of Light magic.

== Physical and Practical Skills ==

Lux is an experienced dancer and can lead Avery through a formal dance while he learns the movements. She is also a capable cook, preparing meals for the Nuntios from limited supplies. Her royal upbringing and work as a negotiator give her experience directing conversations and managing difficult social situations.

|tab=Relationships

== Relationships ==

=== Avery Obtainia ===

Lux first becomes interested in Avery through his Angelor heritage and unusual magic. She questions him about his background, examines his rune, and offers to tutor him. Avery's willingness to approach her directly distinguishes him from the admirers and deferential acquaintances she is accustomed to.

Her concern becomes more personal after the lake accident. She rescues him, tends to his injured wings, and visits him during his recovery. At the Winter's Dance, she chooses him as her partner, takes the lead, and seeks time away from the other Nuntios to speak with him. Avery admires her and values her guidance, though he initially interprets her closeness cautiously.

{{Spoiler|The attempted coup in District 12 strengthens their mutual feelings. Lux later forms an unexpected familiar bond with Avery, and she stands beside him when he becomes the Magni Mage.}}

=== Lumen Luces ===

Lumen is Lux's father and the ruler of District 12. Her position as his daughter gives her authority, but she remains determined to make her own choices rather than allow her royal status to dictate every relationship.

{{Spoiler|Lumen's approval of the alliance with Aether places Lux at the center of the prince's attempt to seize the district. After the attack kills Lux's mother, Lumen intervenes in the battle and defeats Aether. He subsequently acknowledges Avery's actions and accepts his suitability as Lux's partner.}}

=== Luces Family ===

Lux is a descendant of Zenith Luces and the younger sister of Adominus and Prance Luces. Her family's history is a subject of personal interest, particularly its connection to the Angelors and the establishment of District 12. She offers to guide Avery through the district so that he can learn more about that history.

=== Josh Picard ===

Josh is one of Lux's fellow Nuntios members. They share teaching duties at Regnum and spend their free time with the rest of the group. He questions her interest in Avery and occasionally becomes the target of her competitive reactions to the attention the Nuntios receive.

=== Jay Neomo ===

Lux and Jay frequently argue. His remarks about her cooking, marriage, and popularity provoke sharp replies, and she refuses his advances. Nevertheless, they remain companions within the Nuntios. Following the lake accident, she joins the others in considering punishments for his reckless behavior.

=== Marin Kne ===

Marin is Lux's fellow Nuntios member and roommate during their return to Regnum Academy. The two often share their frustration with Jay's manners, particularly when he interferes with the group's meals. Their familiarity allows Lux to be less formal than she is with her students or attendants.

=== Kiara Katzol ===

Lux takes an interest in Kiara's adjustment to Regnum and asks whether she is being bullied. Recognizing the aura of her bracelet, she discusses ancient artifacts with her and encourages her to associate with people who can help her grow stronger. Their shared experiences help them become friends.

{{Spoiler|Their friendship deepens around the proposed wedding to Aether. Lux helps Kiara understand her feelings for Raymond, while Kiara later joins Avery and Raymond in exposing Aether's plot and fighting alongside Lux.}}

=== Kaden Icelander ===

Lux knows Kaden through the Nuntios' early history and recognizes him when the group meets him again at the dance. She identifies him as the person who conducted their first mission, linking their present encounter to the cohort's origins.

=== Anna and Alice ===

Anna and Alice are Lux's attendants. They are protective of her and wary of Avery's growing closeness to her. Lux insists that they respect her judgment and her right to choose her companions, including her decision to attend the dance with Avery.
