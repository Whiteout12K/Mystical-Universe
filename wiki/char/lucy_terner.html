|tab=Overview

== Overview ==
Lucy is Kaden's secretary and an IT Agency operative whose administrative work and assassin training both matter to the early story. Her blond hair, sharp blue eyes, and formal suit accompany a meticulous public role. During combat testing, she exchanges the business exterior for a black jumpsuit and equipment belt suited to close-range action.

== Personality ==
Lucy is demanding, observant, and willing to criticize Kaden even while carrying out his instructions. Their banter reflects an established friendship, but she also cares about authority, recognition, and efficiency. Her irritation at Avery's rapid recruitment initially makes her an unhelpful guide.

She eventually recognizes Avery's judgment during the Intelligence recruitment examination and becomes more accepting of him. Her defeat by I.T.E.R. and later questions about its autonomy show that she is more than a secretary who merely applauds Kaden's inventions: she supplies skepticism about both personal safety and technological control.

== Mystical Rank & Heritage ==
The novels identify Lucy as an Elf and show her snow affinity during the I.T.E.R. test. These appearances do not provide a precise personal tier. Her older rank label in the existing profile belongs to a separate source and should not be presented as a new Book 2 assessment.

== Tools and Equipment ==
Lucy uses an ITA-Pad for schedules, records, and company work. Her combat belt holds devices and weapons. The robot trial specifically shows holographic batons formed and solidified through runecrafting technology; she replenishes them with mana and uses their energy against the machine's joints.

== Trivia ==
* Her inspirations include Odette and Frey.
* Her animal motif is a cheetah; her fruit motif is a banana.

|tab=Synopsis

== Synopsis ==

=== The Rune of the Spellcaster ===

Lucy works with Kaden behind the mainland investigation. She reviews boat departures and provides a detailed schedule, which Kaden uses to reason about suspicious travel. Their exchanges show that she already knows him well enough to challenge his selective explanations. Her absence on missions also makes clear that her work extends beyond the tower desk.

=== I.T.E.R. Chronicles — Initialization ===

==== Secretary and Intelligence Leader ====

Lucy appears with Amos at the IT Christmas event, then becomes Avery's first contact at the company after his interview. She objects to his hiring without consultation and leaves some onboarding duties undone, which Amos and Kaden subsequently identify.

Her continuing management work includes schedules, coordination, supplies, and records for the robot project. Following Kaden's Acting CEO appointment, she remains his personal secretary and is named head of the Intelligence Force. This is the explicit Book 2 designation, distinct from older references to an Assassin-unit leadership role.

==== Robot Trial and Recruitment ====

Lucy tests I.T.E.R. through close combat, holographic batons, and snow techniques. The machine learns her patterns and resists a strike directed through its joints. It catches her and knocks her unconscious before Kaden stops the fight. She recovers, but the staff's concern and her disappointment reveal the test's human cost.

She later supervises the recruitment event with Avery and James. Avery's response to an arrogant applicant changes her assessment of him, and they begin to find common ground. At the end of the book she questions I.T.E.R.'s decision-making and apparent free will, remaining skeptical even as its responses impress her.

=== Sources ===
Book 1: Chapters 5, 7. Book 2: Chapters 4, 6, 11–13, 15–16.

|tab=Powers & Abilities

== Powers & Abilities ==

== Established Abilities ==

=== Assassin Training ===

Kaden describes Lucy as having undergone harsh training. The robot trial shows practiced footwork, rapid defense, recovery from a fall, and attacks aimed at weak points in plating. Her adaptability still has limits against the machine's speed and learning.

=== Snow Magic ===

Blizzard of All and Thrusting Shurikens disrupt the space around I.T.E.R. and pressure its movement. Snow complements her weapons; the scene does not suggest that she overcomes its durability through snow alone.

=== Intelligence Work ===

Her transport reports, scheduling, and recruitment oversight show the noncombat competence supporting IT's operations. These duties are essential to her character's role rather than secondary flavor beside the fighting.

|tab=Relationships

== Relationships ==

=== Kaden Icelander ===

[[char/kaden_icelander|Kaden]] is Lucy's employer and longstanding friend. She challenges his habits and expects him to recognize her contribution. Amos's girlfriend joke is denied by Kaden; the books do not establish the joke as a formal relationship.

=== Avery Obtainia ===

Lucy initially resents [[char/avery_obtainia|Avery]]'s recruitment but later respects his reasoning and shares his annoyance at entitled applicants. Their friendship develops through work instead of immediate approval.

=== Amos and James ===

[[char/amos_black|Amos]] helps cover onboarding and engineering work. [[char/james_shera|James]] checks her after the robot trial and handles Task Force testing during recruitment.
