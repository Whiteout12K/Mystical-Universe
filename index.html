<script>
// Carousel Code Functionality
document.addEventListener('DOMContentLoaded', () => {
  const charList = document.getElementById('char-list');
  const charThumbs = Array.from(document.querySelectorAll('.char-thumb'));
  const charImg = document.getElementById('char-img');
  const charName = document.getElementById('char-name');
  const charDesc = document.getElementById('char-desc');

  if (!charThumbs.length) return;

  let currentIndex = charThumbs.findIndex(t => t.classList.contains('active'));
  if (currentIndex === -1) currentIndex = 0;

  // Fade helpers (same classes used earlier)
  const fadeIn = () => {
    charImg.classList.add('show');
    charName.classList.add('show');
    charDesc.classList.add('show');
  };
  const fadeOut = (cb) => {
    charImg.classList.remove('show');
    charName.classList.remove('show');
    charDesc.classList.remove('show');
    setTimeout(cb, 600);
  };

  const centerThumb = (thumb) => {
    const offset = thumb.offsetLeft - (charList.offsetWidth / 2) + (thumb.offsetWidth / 2);
    charList.scrollTo({ left: offset, behavior: 'smooth' });
  };

  const updateActive = (index) => {
    fadeOut(() => {
      const thumb = charThumbs[index];
      charThumbs.forEach(t => t.classList.remove('active'));
      thumb.classList.add('active');

      // Use getAttribute to preserve raw HTML (dataset may normalize)
      const name = thumb.getAttribute('data-name') || '';
      const img = thumb.getAttribute('data-img') || '';
      const descHtml = thumb.getAttribute('data-desc') || '';

      charName.textContent = name;
      charImg.src = img;
      charDesc.innerHTML = descHtml; // <--- allows HTML inside the description

      // Give browser a small pause before fading back in
      requestAnimationFrame(() => {
        setTimeout(() => fadeIn(), 10);
      });
    });
  };

  // click handler
  charThumbs.forEach((thumb, i) => {
    thumb.addEventListener('click', () => {
      currentIndex = i;
      updateActive(i);
    });
  });

  // wheel scroll for horizontal track
  charList.addEventListener('wheel', (e) => {
    e.preventDefault();
    // On many trackpads, deltaY works nicely for horizontal scrolling
    charList.scrollLeft += e.deltaY;
  }, { passive: false });

  // init
  updateActive(currentIndex);
});
</script>
