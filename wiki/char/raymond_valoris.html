Raymond Valoris is an Elf in Regnum Academy’s 1A homeroom and a member of Black Rampart. He is associated with District 10 and appears as a Water-affinity Defense unit in Mystical Legends: Game.

|tab=Overview

== Background ==
Raymond attends Regnum Academy’s 1A homeroom alongside Avery, Teddric, River, and Jane. Within Black Rampart, he is a cohort member under [[char/carla_storm|Carla Storm]].
